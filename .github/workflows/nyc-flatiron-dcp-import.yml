name: NYC Flatiron official 2014 model import

on:
  push:
    branches:
      - feat/nyc-flatiron-dcp-2014-model-import-20261122
    paths:
      - .github/workflows/nyc-flatiron-dcp-import.yml
      - tools/nyc/import_dcp_flatiron.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-flatiron:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout isolated child branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install open-source 3DM and GLB conversion tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            rhino3dm==8.17.0 \
            shapely==2.1.2 \
            trimesh==4.6.12 \
            numpy==2.2.6 \
            scipy==1.15.3 \
            fast-simplification==0.1.12

      - name: Download official Manhattan CD05 model and current OTI footprint
        env:
          DCP_URL: https://www1.nyc.gov/assets/planning/download/zip/data-maps/open-data/nyc-3d-model/nyc_3dmodel_mn05.zip
          OTI_URL: https://services6.arcgis.com/yG5s3afENB5iO9fj/ArcGIS/rest/services/BUILDING_view/FeatureServer/0/query?where=BIN%3D1016278&outFields=BIN%2CBASE_BBL%2CDOITT_ID%2CHEIGHT_ROOF%2CGROUND_ELEVATION%2CLAST_EDITED_DATE%2CLAST_STATUS_TYPE&outSR=2263&returnGeometry=true&f=pjson
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flatiron-source" artifacts/flatiron-import
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 1800 \
            "$DCP_URL" -o "$RUNNER_TEMP/nyc_3dmodel_mn05.zip"
          unzip -q "$RUNNER_TEMP/nyc_3dmodel_mn05.zip" \
            -d "$RUNNER_TEMP/flatiron-source"
          source_3dm="$(find "$RUNNER_TEMP/flatiron-source" -type f -iname '*.3dm' -print -quit)"
          if [ -z "$source_3dm" ]; then
            echo "The official MN CD05 archive contains no Rhino 3DM file."
            find "$RUNNER_TEMP/flatiron-source" -maxdepth 3 -type f -print
            exit 1
          fi
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 120 \
            "$OTI_URL" -o "$RUNNER_TEMP/flatiron-oti.json"
          echo "SOURCE_3DM=$source_3dm" >> "$GITHUB_ENV"
          echo "OTI_FOOTPRINT=$RUNNER_TEMP/flatiron-oti.json" >> "$GITHUB_ENV"
          ls -lh "$source_3dm" "$RUNNER_TEMP/flatiron-oti.json"

      - name: Match and import the surveyed Flatiron model
        run: |
          set -euo pipefail
          python tools/nyc/import_dcp_flatiron.py \
            --source "$SOURCE_3DM" \
            --footprint "$OTI_FOOTPRINT" \
            --output assets/nyc/scenario/flatiron.glb \
            --manifest assets/nyc/scenario-manifest.json \
            --report artifacts/flatiron-import/flatiron-import-report.json \
            --provenance assets/nyc/scenario/flatiron-provenance.json \
            --snapshot-date "$(date -u +%F)"

      - name: Upload source-match and model-budget evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-flatiron-dcp-import-evidence
          path: |
            artifacts/flatiron-import/
            assets/nyc/scenario/flatiron.glb
            assets/nyc/scenario/flatiron-provenance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit only the verified GLB import
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/nyc/scenario/flatiron.glb \
            assets/nyc/scenario/flatiron-provenance.json \
            assets/nyc/scenario-manifest.json \
            assets/nyc/THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
            exit 0
          fi
          git commit -m "Import official NYC 2014 Flatiron model"
          git push origin "HEAD:$GITHUB_REF_NAME"
