name: Alaska DEM ridge normal fixed-view QA

on:
  pull_request:
    branches: [codex/patrol-integration-20261121, codex/alaska-dem-slope-footprint-20261121, qa/alaska-dem-normal-frozen-time-20261121-chat]
    paths:
      - index.html
      - tools/alaska/compare_dem_normals.mjs
      - tests/alaska-dem-ridge-angles.test.mjs
      - .github/workflows/alaska-ridge-normal-qa.yml

permissions:
  contents: read

jobs:
  alaska-ridge-normals:
    if: github.head_ref == 'codex/alaska-dem-slope-footprint-20261121' || github.head_ref == 'qa/alaska-dem-normal-frozen-time-20261121-chat' || github.head_ref == 'qa/alaska-dem-ridge-angles-20261122-chat'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start game server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/patrol-alaska-dem-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Same-camera source-exact DEM west/east ridge A-B and RAF pacing
        run: |
          git show 38a9be192ca14cf5d47f6991d050b4093357f044:index.html > alaska-dem-normal-base.html
          node tools/alaska/compare_dem_normals.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alaska-dem-ridge-ab
          path: artifacts/alaska-dem-normal-*
          retention-days: 7
          if-no-files-found: ignore
