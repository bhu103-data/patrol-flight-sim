name: Alaska DEM optional relief source-exact browser QA

on:
  pull_request:
    branches: [codex/patrol-integration-20261121]
    paths:
      - index.html
      - tests/alaska-dem-relief-preview.test.mjs
      - tools/alaska/compare_dem_relief.mjs
      - .github/workflows/alaska-relief-preview-qa.yml

permissions:
  contents: read

jobs:
  alaska-relief-webgl:
    if: github.head_ref == 'feat/alaska-dem-relief-preview-20261122-chat'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium WebGL QA
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static game server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/patrol-alaska-relief.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Source-exact noon west/east 75-vs-95 relief, collision and RAF pacing
        run: |
          git show 38a9be192ca14cf5d47f6991d050b4093357f044:index.html > alaska-relief-base.html
          node tools/alaska/compare_dem_relief.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alaska-relief-source-exact-ab
          path: artifacts/alaska-relief-*
          retention-days: 7
          if-no-files-found: ignore
