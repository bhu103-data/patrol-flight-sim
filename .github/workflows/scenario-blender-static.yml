name: Scenario Blender authoring static checks

on:
  push:
    paths:
      - 'tools/blender/**'
      - 'assets/chongqing/**'
      - 'tests/chongqing-scenario.test.mjs'
      - 'tests/chongqing-detail.test.mjs'
      - 'tests/chongqing-visual.test.mjs'
      - 'tests/chongqing-cinematic-v3.test.mjs'
      - 'assets/chongqing/riverlife.js'
      - 'chongqing.html'
      - '.agents/skills/scenario-blender/**'
      - '.agents/skills/patrol-scenario-chongqing/**'
      - '.github/workflows/scenario-blender-static.yml'
      - 'assets/nyc/nyc-realism.js'
      - 'assets/nyc/scenario-textures.js'
      - 'assets/nyc/scenario-manifest.json'
      - 'tools/scenario_blender_export.py'
      - 'tools/scenario_glb_selftest.html'
      - 'tests/scenario-glb.test.mjs'
      - 'tests/scenario-trade-asset.test.mjs'
      - 'assets/nyc/scenario/trade.glb'
      - 'tools/scenario_model_preview.html'
      - 'tests/scenario-model-preview.test.mjs'
  pull_request:
    paths:
      - 'tools/blender/**'
      - '.agents/skills/scenario-blender/**'
      - '.agents/skills/patrol-scenario-chongqing/**'
      - '.github/workflows/scenario-blender-static.yml'
      - 'assets/nyc/nyc-realism.js'
      - 'assets/nyc/scenario-textures.js'
      - 'assets/nyc/scenario-manifest.json'
      - 'tools/scenario_blender_export.py'
      - 'tools/scenario_glb_selftest.html'
      - 'tests/scenario-glb.test.mjs'
      - 'tests/scenario-trade-asset.test.mjs'
      - 'assets/nyc/scenario/trade.glb'
      - 'tools/scenario_model_preview.html'
      - 'tests/scenario-model-preview.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse Blender authoring scripts without cloud credentials
        run: |
          python3 -m py_compile tools/blender/nyc_scenario_author.py
          python3 -m py_compile tools/blender/chongqing_scenario_author.py
          python3 -m py_compile tools/scenario_blender_export.py
      - name: Check existing Chongqing landmarks and visual interfaces
        run: |
          node --test tests/chongqing-landmarks.test.mjs tests/chongqing-detail.test.mjs tests/chongqing-visual.test.mjs tests/chongqing-scenario.test.mjs
      - name: Test Scenario glTF importer with embedded atlas and hostile URLs
        run: |
          node --test tests/scenario-glb.test.mjs
      - name: Audit local Blender GLB preview UI
        run: |
          node --test tests/scenario-model-preview.test.mjs
      - name: Load actual generated One WTC binary through PATROL WebGL decoder
        run: node --test tests/scenario-trade-asset.test.mjs
      - name: No Blender render or Scenario API call
        run: |
          echo "Static checks only; visual Blender render, paid Scenario generation and live GPU FPS are NOT verified."
