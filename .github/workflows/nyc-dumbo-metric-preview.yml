name: NYC DUMBO OTI true metric WebGL2 preview QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/nyc/dumbo-oti-metric.mjs'
      - 'assets/nyc/dumbo-front-dock-roadbed-2022.json'
      - 'assets/nyc/dumbo-roadbed-metric.mjs'
      - 'assets/nyc/dumbo-cscl-official-snapshot.json'
      - 'assets/nyc/dumbo-cscl-true-metre.js'
      - 'assets/nyc/dumbo-cscl-metric-reconcile.mjs'
      - 'assets/nyc/dumbo-metric-fly-safety.mjs'
      - 'assets/nyc/dumbo-bk02-glb-loader.mjs'
      - 'assets/nyc/dumbo-bk02-2014-source.glb'
      - 'assets/nyc/dumbo-bk02-2014-source-provenance.json'
      - 'tests/nyc-dumbo-2014-glb.test.mjs'
      - 'tests/nyc-dumbo-metric-lowflight-collision.test.mjs'
      - 'tests/nyc-dumbo-metric-cscl-reconcile.test.mjs'
      - 'tests/nyc-dumbo-metric-roadbed.test.mjs'
      - 'assets/nyc/dumbo-oti-metric-48.json'
      - 'tools/nyc/dumbo-metric-preview.html'
      - 'tools/nyc/dumbo-metric-browser-smoke.mjs'
      - 'tests/nyc-dumbo-metric-preview.test.mjs'
      - '.github/workflows/nyc-dumbo-metric-preview.yml'
permissions:
  contents: read
jobs:
  metric-dumbo:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate projection, roof triangulation and fallback isolation
        run: node --test tests/nyc-dumbo-2014-glb.test.mjs tests/nyc-dumbo-metric-preview.test.mjs tests/nyc-dumbo-metric-roadbed.test.mjs tests/nyc-dumbo-metric-cscl-reconcile.test.mjs tests/nyc-dumbo-metric-lowflight-collision.test.mjs
      - name: Install pinned Chromium browser harness
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Serve actual georeferenced preview files
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/patrol-nyc-oti-metric.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8765/tools/nyc/dumbo-metric-preview.html >/dev/null
      - name: Render exact-source DUMBO oblique and overhead WebGL2
        env:
          PATROL_BASE_URL: http://127.0.0.1:8765
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/nyc/dumbo-metric-browser-smoke.mjs
      - name: Preserve browser screenshot and report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-dumbo-oti-metric-webgl
          path: artifacts/nyc-dumbo-metric/
          retention-days: 7
          if-no-files-found: ignore
