name: Chongqing WebGL visual regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "chongqing.html"
      - "assets/chongqing/**"
      - "tests/chongqing-*.test.mjs"
      - "scripts/chongqing-browser-smoke.mjs"
      - ".github/workflows/chongqing-visual.yml"
  push:
    branches: [main]
    paths:
      - "chongqing.html"
      - "assets/chongqing/**"
      - "tests/chongqing-*.test.mjs"
      - "scripts/chongqing-browser-smoke.mjs"
      - ".github/workflows/chongqing-visual.yml"

# PATROL_CQ_VISUAL_STABILITY_V5: NYC is updated frequently. Never cancel
# a running Chromium screenshot just because a new commit arrived; without
# this guard, the expensive browser install repeatedly stops mid-flight.
concurrency:
  group: chongqing-visual-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Run Chongqing unit tests before expensive headless Chromium.
      # dependencies; do not let a concurrent NYC geometry regression prevent
      # the Chongqing screenshots and flight evidence from being captured.
      - name: Validate Chongqing road/building occupancy
        run: node --test tests/chongqing-*.test.mjs
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start isolated static test server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/patrol-chongqing-http.log 2>&1 &
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:8765/chongqing.html >/dev/null
      - name: Chongqing screenshot and high-rise climb checks
        env:
          CHONGQING_BASE_URL: http://127.0.0.1:8765
        run: node scripts/chongqing-browser-smoke.mjs
      # NYC has its own WebGL browser workflow and global Node regression.
      # Keeping Chongqing's screenshots independent avoids double Chromium
      # runs and hundreds of canceled pending jobs on unrelated NYC edits.
      - name: Upload Chongqing screenshots, WebGL report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chongqing-webgl-screenshots
          path: artifacts/chongqing/
          retention-days: 7
          if-no-files-found: ignore
