name: Chongqing WebGL visual regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "chongqing.html"
      - "index.html"
      - "assets/nyc/nyc-street-network.js"
      - "assets/nyc/nyc-led.js"
      - "tests/nyc-road-clearance.test.mjs"
      - "tests/nyc-led-creative.test.mjs"
      - "assets/chongqing/**"
      - "tests/chongqing-*.test.mjs"
      - "scripts/chongqing-browser-smoke.mjs"
      - "scripts/nyc-road-browser-smoke.mjs"
      - ".github/workflows/chongqing-visual.yml"

# PATROL_CQ_VISUAL_STABILITY_V5: NYC is updated frequently. Never cancel
# a running Chromium screenshot just because a new commit arrived; without
# this guard, the expensive browser install repeatedly stops mid-flight.
concurrency:
  group: chongqing-visual-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # PATROL_CQ_BROWSER_ISOLATION_V8: test Chongqing before installing GPU
      # dependencies; do not let a concurrent NYC geometry regression prevent
      # the Chongqing screenshots and flight evidence from being captured.
      - name: Validate Chongqing road/building occupancy
        run: node --test tests/chongqing-*.test.mjs
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Start isolated static test server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/patrol-chongqing-http.log 2>&1 &
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:8765/chongqing.html >/dev/null
      - name: Chongqing screenshot and high-rise climb checks
        env:
          CHONGQING_BASE_URL: http://127.0.0.1:8765
        run: node scripts/chongqing-browser-smoke.mjs
      # NYC still fails the overall job if its road rules regress, but
      # Chongqing has already rendered and uploaded evidence by that point.
      - name: Validate NYC LED creative diversity and canvas atlas
        run: node --test tests/nyc-led-creative.test.mjs
      - name: Validate NYC road/building occupancy
        run: node --test tests/nyc-road-clearance.test.mjs
      - name: New York real-browser skyline and road check
        env:
          PATROL_BASE_URL: http://127.0.0.1:8765
        run: node scripts/nyc-road-browser-smoke.mjs
      - name: Upload screenshots, WebGL report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chongqing-webgl-screenshots
          path: |
            artifacts/chongqing/
            artifacts/nyc/
          retention-days: 7
          if-no-files-found: ignore
