name: NYC TUM CityGML street-space source QA

on:
  pull_request:
    paths:
      - ".github/workflows/nyc-tum-citygml-streetspace-source-qa.yml"
      - "tools/nyc/tum_citygml_streetspace_qa.py"
      - "tests/test_nyc_tum_citygml_streetspace_qa.py"
      - "docs/NYC_TUM_CITYGML_STREETSPACE_SOURCE_QA_20261122.md"

permissions:
  contents: read

jobs:
  inspect-citygml:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GDAL command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdal-bin

      - name: Test the source inspection helpers
        run: python -m unittest discover -s tests -p "test_nyc_tum_citygml_streetspace_qa.py" -v

      - name: Download bounded TUM / NYC street-space source archives
        run: |
          mkdir -p /tmp/nyc-tum-source
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 1800 \
            "https://www.3dcitydb.net/3dcitydb/fileadmin/public/datasets/NYC/NYC_street_space_CityGML_LoD2/NYC_CityGML_LoD2_Roadbed.zip" \
            --output /tmp/nyc-tum-source/NYC_CityGML_LoD2_Roadbed.zip
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 1800 \
            "https://www.3dcitydb.net/3dcitydb/fileadmin/public/datasets/NYC/NYC_street_space_CityGML_LoD2/NYC_CityGML_LoD2_Intersection.zip" \
            --output /tmp/nyc-tum-source/NYC_CityGML_LoD2_Intersection.zip
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 1800 \
            "https://www.3dcitydb.net/3dcitydb/fileadmin/public/datasets/NYC/NYC_street_space_CityGML_LoD2/NYC_CityGML_LoD2_Median_Painted.zip" \
            --output /tmp/nyc-tum-source/NYC_CityGML_LoD2_Median_Painted.zip
          sha256sum /tmp/nyc-tum-source/*.zip

      - name: Inspect CRS, layers, features and clip Times Square ROI
        run: |
          python tools/nyc/tum_citygml_streetspace_qa.py \
            --input-dir /tmp/nyc-tum-source \
            --output-dir artifacts/nyc-tum-streetspace \
            --bbox -73.991040 40.753539 -73.981483 40.761460

      - name: Upload source QA report and clipped GeoJSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-tum-citygml-streetspace-times-square-qa
          path: artifacts/nyc-tum-streetspace/
          if-no-files-found: warn
          retention-days: 7
