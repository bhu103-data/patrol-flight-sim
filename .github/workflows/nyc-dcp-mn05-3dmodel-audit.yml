name: NYC DCP Manhattan CD5 2014 3D model source audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/nyc-oti-surfaces-full-runtime-20261122-chat
      - research/nyc-dcp-mn05-3dmodel-source-audit-20261122-chat
    paths:
      - "scripts/nyc-dcp-mn05-3dmodel-audit.py"
      - "scripts/nyc-dcp-mn05-extract-times-square-glb.py"
      - "docs/NYC_DCP_3D_MODEL_SOURCE_AUDIT_20261122.md"
      - "docs/NYC_DCP_MN05_GLB_PREVIEW_20261122.md"
      - ".github/workflows/nyc-dcp-mn05-3dmodel-audit.yml"

permissions:
  contents: read

jobs:
  inspect-official-mn05-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install open Rhino3dm reader and CRS transform
        run: python -m pip install --disable-pip-version-check rhino3dm==8.32.0 pyproj==3.7.0
      - name: Download official NYC DCP Manhattan Community District 5 3D model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nyc-dcp-mn05-3dmodel-audit /tmp/nyc-mn05
          URL="https://www1.nyc.gov/assets/planning/download/zip/data-maps/open-data/nyc-3d-model/nyc_3dmodel_mn05.zip"
          echo "Upstream HEAD may be blocked; validate the official archive using the following GET and ZIP integrity checks." | tee artifacts/nyc-dcp-mn05-3dmodel-audit/download-note.txt
          curl --location --fail --retry 3 --retry-all-errors --connect-timeout 30 --max-time 2400 \
            -H "User-Agent: PATROL-NYC-DCP-3D-Model-Source-Audit/1.0" \
            --output /tmp/nyc-mn05/nyc_3dmodel_mn05.zip "$URL"
          sha256sum /tmp/nyc-mn05/nyc_3dmodel_mn05.zip | tee artifacts/nyc-dcp-mn05-3dmodel-audit/archive.sha256
          du -h /tmp/nyc-mn05/nyc_3dmodel_mn05.zip | tee artifacts/nyc-dcp-mn05-3dmodel-audit/archive-size.txt
          unzip -Z1 /tmp/nyc-mn05/nyc_3dmodel_mn05.zip | tee artifacts/nyc-dcp-mn05-3dmodel-audit/archive-contents.txt
          unzip -q /tmp/nyc-mn05/nyc_3dmodel_mn05.zip -d /tmp/nyc-mn05/unpacked
          MODEL="$(find /tmp/nyc-mn05/unpacked -type f -iname '*.3dm' -print -quit)"
          test -n "$MODEL"
          printf '%s\n' "$MODEL" | tee artifacts/nyc-dcp-mn05-3dmodel-audit/model-path.txt
          python scripts/nyc-dcp-mn05-3dmodel-audit.py \
            --model "$MODEL" \
            --report artifacts/nyc-dcp-mn05-3dmodel-audit/report.json
      - name: Upload source manifest and model-layer audit only (not the raw 3D source archive)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-dcp-mn05-2014-3dmodel-source-audit
          path: artifacts/nyc-dcp-mn05-3dmodel-audit/
          retention-days: 14
          if-no-files-found: ignore

  extract-bounded-times-square-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install open source 3DM, CRS, geometry and GLB tools
        run: python -m pip install --disable-pip-version-check rhino3dm==8.32.0 pyproj==3.7.0 shapely==2.0.6 trimesh==4.5.3 matplotlib==3.9.2
      - name: Download and validate official NYC DCP Manhattan CD5 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nyc-dcp-mn05-glb-preview /tmp/nyc-mn05-glb
          URL="https://www1.nyc.gov/assets/planning/download/zip/data-maps/open-data/nyc-3d-model/nyc_3dmodel_mn05.zip"
          curl --location --fail --retry 3 --retry-all-errors --connect-timeout 30 --max-time 2400 \
            -H "User-Agent: PATROL-NYC-DCP-2014-GLB-Preview/1.0" \
            --output /tmp/nyc-mn05-glb/nyc_3dmodel_mn05.zip "$URL"
          sha256sum /tmp/nyc-mn05-glb/nyc_3dmodel_mn05.zip | tee artifacts/nyc-dcp-mn05-glb-preview/archive.sha256
          du -h /tmp/nyc-mn05-glb/nyc_3dmodel_mn05.zip | tee artifacts/nyc-dcp-mn05-glb-preview/archive-size.txt
          unzip -tq /tmp/nyc-mn05-glb/nyc_3dmodel_mn05.zip
          unzip -q /tmp/nyc-mn05-glb/nyc_3dmodel_mn05.zip -d /tmp/nyc-mn05-glb/unpacked
          MODEL="$(find /tmp/nyc-mn05-glb/unpacked -type f -iname '*.3dm' -print -quit)"
          test -n "$MODEL"
          printf '%s\n' "$MODEL" | tee artifacts/nyc-dcp-mn05-glb-preview/model-path.txt
          python scripts/nyc-dcp-mn05-extract-times-square-glb.py \
            --model "$MODEL" \
            --footprints assets/nyc/times-square-footprints.json \
            --report artifacts/nyc-dcp-mn05-glb-preview/report.json \
            --glb artifacts/nyc-dcp-mn05-glb-preview/nyc-dcp-times-square-2014-preview.glb \
            --preview artifacts/nyc-dcp-mn05-glb-preview/preview-isometric.png
      - name: Upload extracted preview, image and source-match report (not raw district model)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-dcp-mn05-times-square-glb-preview
          path: artifacts/nyc-dcp-mn05-glb-preview/
          retention-days: 14
          if-no-files-found: ignore

