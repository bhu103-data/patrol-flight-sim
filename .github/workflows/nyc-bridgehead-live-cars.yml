name: NYC bridgehead live car route WebGL2 QA

on:
  push:
    branches:
      - qa/nyc-bridgehead-live-cars-20261121
    paths:
      - scripts/nyc-bridgehead-cars-browser-qa.mjs
      - .github/workflows/nyc-bridgehead-live-cars.yml
  pull_request:
    paths:
      - scripts/nyc-bridgehead-cars-browser-qa.mjs
      - .github/workflows/nyc-bridgehead-live-cars.yml
      - index.html
      - tests/nyc-bridgehead-vehicle-connector.test.mjs

concurrency:
  group: nyc-bridgehead-live-cars-qa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-traffic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bridgehead QA syntax and targeted connector tests
        run: |
          node --check scripts/nyc-bridgehead-cars-browser-qa.mjs
          node --test tests/nyc-bridgehead-vehicle-connector.test.mjs
      - name: Install free headless WebGL2 Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Serve original PATROL game
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/patrol-bridgehead-traffic-http.log 2>&1 &
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:8765/index.html >/dev/null
      - name: Inspect generated route, water and building clearance, capture two cameras
        env:
          PATROL_BASE_URL: http://127.0.0.1:8765
        run: node scripts/nyc-bridgehead-cars-browser-qa.mjs
      - name: Upload real browser traffic report and fixed camera PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-bridgehead-live-car-qa
          path: artifacts/nyc-bridgehead-traffic/
          retention-days: 7
          if-no-files-found: ignore
