name: NYC 2014 MN05 authentic roof + facade cached-mesh pilot
on:
  push:
    branches: [qa/nyc-mn05-roof-match-uniqueness-20261122-chat]
  pull_request:
    branches: [qa/nyc-mn05-roof-surface-true-metre-bounds-20261122-chat]
    paths:
      - 'tools/nyc/mn05_facade_source_support.py'
      - 'tools/nyc/extract-mn05-facade-roof-preview.py'
      - 'tools/nyc/mn05-roof-facade-source-preview.html'
      - 'scripts/nyc-mn05-roof-facade-browser-smoke.mjs'
      - 'tests/nyc-mn05-facade-source.test.py'
      - '.github/workflows/nyc-mn05-facade-roof-source.yml'
      - 'tools/nyc/probe-official-mn05-rhino.py'
      - 'tools/nyc/inspect-mn05-roof-source-roi.py'
      - 'tools/nyc/official_mn05_projection.py'
      - 'assets/nyc/times-square-footprints.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-mn05-roof-facade-roi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned free readers and geometry libraries
        run: |
          python -m pip install --disable-pip-version-check rhino3dm==8.35.0 pyproj==3.7.2 shapely==2.1.2
      - name: Compile and unit-test fail-closed roof/facade geometry matching
        run: |
          python -m py_compile tools/nyc/mn05_facade_source_support.py
          python -m py_compile tools/nyc/extract-mn05-facade-roof-preview.py
          python tests/nyc-mn05-facade-source.test.py
          python tests/nyc-official-mn05-coordinate-frame.test.py
      - name: Obtain exact official NYC DCP 2014 MN05 source, keep only in this CI job
        run: |
          PATROL_KEEP_MN05=1 python tools/nyc/probe-official-mn05-rhino.py
          test -s artifacts/nyc-official-mn05/mn05-source.3dm
      - name: Extract bounded original cached roof Brep faces and source topology
        run: |
          python tools/nyc/inspect-mn05-roof-source-roi.py
          test -s artifacts/nyc-official-mn05/times-square-original-roof-mesh.json
      - name: Reopen pinned source for facade extraction after roof inspector cleanup
        run: |
          PATROL_KEEP_MN05=1 python tools/nyc/probe-official-mn05-rhino.py
          test -s artifacts/nyc-official-mn05/mn05-source.3dm
      - name: Match source roof and facade meshes to unique official current building FIDs
        run: |
          python tools/nyc/extract-mn05-facade-roof-preview.py
          test -s artifacts/nyc-official-mn05/mn05-roof-facade-metric-preview.json
          python - <<'PY'
          import json
          p='artifacts/nyc-official-mn05/mn05-roof-facade-metric-preview.json'
          d=json.load(open(p))
          assert d['meshAccepted'] and not d['errors'], d.get('errors')
          assert d['counts']['matchedBuildingFids'] >= 5
          assert d['counts']['roofTriangles'] >= 100
          assert d['counts']['facadeTriangles'] >= 100
          assert d['sourceVerticalDatumVerified'] is False
          assert d['sourceAbsoluteZUsed'] is False
          PY
          test ! -e artifacts/nyc-official-mn05/mn05-source.3dm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free Chromium and pixel comparator
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Serve bounded source-only WebGL preview
        run: |
          cp tools/nyc/mn05-roof-facade-source-preview.html artifacts/nyc-official-mn05/preview.html
          python3 -m http.server 8766 --bind 127.0.0.1 --directory artifacts/nyc-official-mn05 > /tmp/nyc-mn05-roof-facade-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8766/preview.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Capture actual roof/facade ON-OFF WebGL2 screenshots
        run: |
          node scripts/nyc-mn05-roof-facade-browser-smoke.mjs
          test -s artifacts/nyc-official-mn05/roof-facade-browser-report.json
          test -s artifacts/nyc-official-mn05/roof-facade-on.png
          test -s artifacts/nyc-official-mn05/roof-facade-off.png
      - name: Publish bounded mesh evidence only, never the 627MB Rhino model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-official-mn05-roof-facade-source-pilot
          path: |
            artifacts/nyc-official-mn05/mn05-probe.json
            artifacts/nyc-official-mn05/times-square-roof-source-roi.json
            artifacts/nyc-official-mn05/times-square-original-roof-mesh.json
            artifacts/nyc-official-mn05/mn05-roof-facade-metric-preview.json
            artifacts/nyc-official-mn05/roof-facade-browser-report.json
            artifacts/nyc-official-mn05/roof-facade-on.png
            artifacts/nyc-official-mn05/roof-facade-off.png
            artifacts/nyc-official-mn05/roof-only.png
            artifacts/nyc-official-mn05/facade-only.png
            artifacts/nyc-official-mn05/preview.html
          retention-days: 7
          if-no-files-found: warn
