name: NYC official 2014 MN05 cached rooftop mesh topology QA
on:
  pull_request:
    paths:
      - 'tools/nyc/inspect-mn05-cached-roof-mesh.py'
      - 'tools/nyc/mn05_mesh_topology.py'
      - 'tools/nyc/probe-official-mn05-rhino.py'
      - 'tools/nyc/official_mn05_projection.py'
      - 'tests/nyc-mn05-mesh-topology.test.py'
      - 'tests/nyc-official-mn05-coordinate-frame.test.py'
      - '.github/workflows/nyc-mn05-roof-source-roi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cached-roof-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded Rhino mesh inspector and pure topology tests
        run: |
          python -m py_compile tools/nyc/probe-official-mn05-rhino.py
          python -m py_compile tools/nyc/official_mn05_projection.py
          python -m py_compile tools/nyc/mn05_mesh_topology.py
          python -m py_compile tools/nyc/inspect-mn05-cached-roof-mesh.py
          python -m pip install --no-cache-dir --disable-pip-version-check rhino3dm==8.35.0 pyproj==3.7.2
          python tests/nyc-official-mn05-coordinate-frame.test.py
          python tests/nyc-mn05-mesh-topology.test.py
      - name: Obtain ORIGINAL official NYC DCP MN05 3DM in bounded single-job temporary area
        run: |
          PATROL_KEEP_MN05=1 python tools/nyc/probe-official-mn05-rhino.py
          test -s artifacts/nyc-official-mn05/mn05-source.3dm
      - name: Audit cached source roof meshes, triangle topology and source Brep bounds
        run: |
          python tools/nyc/inspect-mn05-cached-roof-mesh.py
          test -s artifacts/nyc-official-mn05/times-square-cached-roof-mesh.json
      - name: Delete original municipal model bytes from the temporary runner
        if: always()
        run: |
          rm -f artifacts/nyc-official-mn05/mn05-source.3dm
          rm -f artifacts/nyc-official-mn05/mn05-source.zip
      - name: Upload bounded source-mesh evidence only, never the original 627MB model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-2014-mn05-cached-roof-mesh-topology-QA
          path: |
            artifacts/nyc-official-mn05/mn05-probe.json
            artifacts/nyc-official-mn05/times-square-cached-roof-mesh.json
          retention-days: 7
          if-no-files-found: warn
