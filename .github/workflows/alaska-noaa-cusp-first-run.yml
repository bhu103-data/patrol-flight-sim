name: Alaska NOAA CUSP indexed vector shoreline initial QA

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - codex/alaska-official-gis-aoi-fetch-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-noaa-index:
    if: github.repository == 'bhu103-data/patrol-flight-sim'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official NOAA index MVT decoder
        run: python -m pip install --only-binary=:all: mapbox-vector-tile==2.2.0
      - name: Locate NOAA CUSP Tracy Arm indexed source tiles and download bounded ZIPs
        run: python tools/alaska/fetch_noaa_cusp_index.py
      - name: Preserve QA and download evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noaa-cusp-tracy-arm-index-evidence
          path: alaska-official-aoi-results/noaa-cusp-index/
          if-no-files-found: warn
          retention-days: 7
