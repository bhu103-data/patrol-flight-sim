name: NYC verified Times Square building swaps
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/nyc/times-square-footprints.json'
      - 'assets/nyc/nyc-gis-infill.js'
      - 'tests/nyc-times-verified.test.mjs'
      - '.github/workflows/nyc-verified-buildings.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  city-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 13 city survey building shells and LED/collision continuity
        run: node --test tests/nyc-times-verified.test.mjs tests/nyc-gis-pbr.test.mjs tests/nyc-oti-footprints.test.mjs
