name: PATROL regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all browser-free regression tests
        run: node --test tests/*.test.mjs
      # QA only: run on the isolated stacked NOAA CUSP PR, never on main or other PRs.
      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 201
        with:
          python-version: '3.11'
      - name: Download bounded NOAA Tracy Arm CUSP index candidates (PR 201 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 201
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: mapbox-vector-tile==2.2.0 fiona==1.10.1 shapely pyproj numpy tifffile rasterio
          python tools/alaska/fetch_noaa_cusp_index.py
          python tools/alaska/clip_noaa_cusp_tracy_arm.py
          python tools/alaska/audit_usgs_3dep_live.py
      - name: Upload NOAA CUSP index QA result (PR 201 only)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 201
        uses: actions/upload-artifact@v4
        with:
          name: noaa-cusp-tracy-arm-pr201-results
          path: |
            alaska-official-aoi-results/noaa-cusp-index/
            alaska-official-aoi-results/noaa-cusp-tracy-arm-qa/
            alaska-official-aoi-results/3dep-live-qa/
          if-no-files-found: warn
          retention-days: 7
