name: PATROL regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all browser-free regression tests
        run: node --test tests/*.test.mjs
      - name: Audit official CC0 ferry GLBs, LODs and source permission (NYC ferry PR only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/nyc-harbor-ferry-cc0-lod-20261122'
        run: python3 tools/nyc/audit_cc0_ferry_lods.py
      - name: Decode and validate WebGL2-ready CC0 ferry near/mid/far GLBs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/nyc-harbor-ferry-cc0-lod-20261122'
        run: |
          npm install --global @gltf-transform/cli
          python3 -m pip install --disable-pip-version-check pillow
          # KhronosGroup official pinned KTX-Software release. Required for
          # KTX2 -> PNG; do not use a third-party codec binary.
          curl --fail --location --retry 2 --max-time 100 \
            'https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.tar.bz2' \
            -o /tmp/ktx-4.4.2-linux.tar.bz2
          sha256sum /tmp/ktx-4.4.2-linux.tar.bz2
          mkdir -p /tmp/ktx-tools
          tar -xjf /tmp/ktx-4.4.2-linux.tar.bz2 -C /tmp/ktx-tools
          KTX_BIN="$(find /tmp/ktx-tools -type f -name ktx | head -n 1)"
          test -n "$KTX_BIN"
          chmod +x "$KTX_BIN"
          export PATH="$(dirname "$KTX_BIN"):$PATH"
          export LD_LIBRARY_PATH="$(find /tmp/ktx-tools -type f -name 'libktx.so*' -printf '%h\n' | head -n 1):${LD_LIBRARY_PATH:-}"
          ktx --version
          bash tools/nyc/build_cc0_ferry_lods.sh
      - name: Preserve CC0 publisher source and model metrics (NYC ferry PR only)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/nyc-harbor-ferry-cc0-lod-20261122'
        uses: actions/upload-artifact@v4
        with:
          name: patrol-nyc-ferry-cc0-source-qa
          path: nyc-harbor-audit/
          if-no-files-found: warn
          retention-days: 7
