name: PATROL regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all browser-free regression tests
        run: node --test tests/*.test.mjs
      - name: Audit official Kenney CC0 NYC 3D assets (isolated draft only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/nyc-cc0-asset-audit-20261122'
        run: python3 tools/nyc/audit_kenney_cc0_sources.py
      - name: Preserve original ZIPs and provenance records (isolated draft only)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/nyc-cc0-asset-audit-20261122'
        uses: actions/upload-artifact@v4
        with:
          name: patrol-nyc-kenney-official-cc0-preflight
          path: nyc-asset-audit/
          if-no-files-found: warn
          retention-days: 7
