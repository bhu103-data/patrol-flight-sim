name: Build original NYC Chrysler Building GLB

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_chrysler_original.py'
      - '.github/workflows/build-chrysler-original.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bake-original-chrysler-landmark
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install fixed offline asset toolchain
        run: python -m pip install numpy==2.2.6 pillow==11.3.0 trimesh==4.11.1
      - name: Bake original high-density Chrysler building
        run: python tools/build_chrysler_original.py
      - name: Validate generated geometry and embedded atlas
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,struct,numpy as np,trimesh
          p=Path('assets/nyc/scenario/chrysler.glb')
          data=p.read_bytes()
          assert 20000<len(data)<8388608
          assert data[:4]==b'glTF' and struct.unpack_from('<I',data,4)[0]==2
          assert struct.unpack_from('<I',data,8)[0]==len(data)
          length=struct.unpack_from('<I',data,12)[0]
          obj=json.loads(data[20:20+length],
            parse_constant=lambda s: (_ for _ in ()).throw(ValueError(s)))
          count=sum(obj['accessors'][p.get('indices',p['attributes']['POSITION'])]['count']//3
            for mesh in obj['meshes'] for p in mesh['primitives'])
          assert 600<=count<=25000,count
          assert len(obj.get('textures',[]))==1 and len(obj.get('images',[]))==1
          assert 'bufferView' in obj['images'][0]
          scene=trimesh.load(p,force='scene')
          assert abs(scene.bounds[1,1]-319)<.2
          for mesh in scene.geometry.values():
            assert np.isfinite(mesh.vertices).all()
            assert np.isfinite(mesh.vertex_normals).all()
          meta=json.loads(Path('assets/nyc/scenario/chrysler-provenance.json').read_text())
          assert meta['triangles']==count and meta['bytes']==len(data)
          print('Valid original Chrysler GLB',count,'triangles',len(data),'bytes')
          PY
      - name: Commit only audited Chrysler GLB and provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/nyc/scenario/chrysler.glb assets/nyc/scenario/chrysler-provenance.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets(nyc): bake original detailed Chrysler State Building GLB'
          for attempt in {1..12}; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo 'Unable to publish Chrysler model safely' >&2
          exit 1
