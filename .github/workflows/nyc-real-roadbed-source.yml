name: NYC real 2022 roadbed polygon source QA

on:
  pull_request:
    branches: [feat/nyc-tsq-meter-crs-road-source-20261122-chat]
    paths:
      - 'scripts/nyc-times-roadbed-polygon-source.mjs'
      - 'tests/nyc-times-roadbed-polygon-source.test.mjs'
      - '.github/workflows/nyc-real-roadbed-source.yml'
      - 'scripts/nyc-times-true-scale-pilot.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measured-roadbed-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original DCM source plus OTI roadbed polygon safety
        run: |
          node --check scripts/nyc-times-roadbed-polygon-source.mjs
          node --test tests/nyc-times-true-scale-pilot.test.mjs tests/nyc-times-roadbed-polygon-source.test.mjs
      - name: Acquire original NYC DCP centreline and OTI polygons without fabricated fallback
        run: |
          node scripts/nyc-times-true-scale-pilot.mjs
          node scripts/nyc-times-roadbed-polygon-source.mjs
          test -s artifacts/nyc-roadbed-source/roadbed.json
          test -s artifacts/nyc-roadbed-source/overlay.svg
      - name: Upload 1:1 source reference only (not flight map)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-roadbed-polygon-source-QA
          path: artifacts/nyc-roadbed-source/
          retention-days: 7
          if-no-files-found: ignore
