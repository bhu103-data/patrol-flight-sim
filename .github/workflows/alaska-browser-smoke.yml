name: Alaska browser WebGL scene smoke

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/alaska/**'
      - 'tools/alaska/smoke_browser.mjs'
      - '.github/workflows/alaska-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alaska-webgl-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local flight game
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/patrol-alaska-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Launch Alaska and test photographic materials
        run: node tools/alaska/smoke_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alaska-live-webgl-capture
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
