name: Alaska browser WebGL scene smoke

on:
  push:
    branches: [main]
    paths:
      - 'tools/alaska/smoke_browser.mjs'
      - 'tests/alaska-village-realism.test.mjs'
      - '.github/workflows/alaska-browser-smoke.yml'
      - 'assets/alaska/**'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/alaska/**'
      - 'tools/alaska/smoke_browser.mjs'
      - 'tools/alaska/compare_harbor_baseline.mjs'
      - 'tests/alaska-near-pier-cabin-detail.test.mjs'
      - '.github/workflows/alaska-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alaska-webgl-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local flight game
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/patrol-alaska-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Launch Alaska and test photographic materials
        run: node tools/alaska/smoke_browser.mjs
      - name: Compare pinned main before port with candidate at matched WebGL camera
        run: |
          git show bc155141742811bca3c4b1988672b238bd50a98b:index.html > alaska-baseline.html
          git show bc155141742811bca3c4b1988672b238bd50a98b:assets/alaska/alaska-fjord-detail.js > assets/alaska/alaska-fjord-detail-baseline-qa.js
          node tools/alaska/compare_harbor_baseline.mjs
      - name: Exercise C185 floats on NYC and Alaska water in WebGL2
        run: node tools/aircraft/floatplane-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alaska-live-webgl-capture
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
