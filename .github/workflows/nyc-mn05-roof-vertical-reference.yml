# Re-run source/coordinate audit after the local-metre scale regression fix.
name: NYC MN05 roof vertical reference audit
on:
  pull_request:
    paths:
      - 'assets/nyc/times-square-footprints.json'
      - 'tools/nyc/audit-mn05-roof-vertical-reference.py'
      - 'tools/nyc/extract-mn05-current-facade-pilot.py'
      - 'tests/nyc-mn05-current-facade-pilot.test.py'
      - 'tools/nyc/probe-official-mn05-rhino.py'
      - 'tools/nyc/inspect-mn05-roof-source-roi.py'
      - 'tools/nyc/official_mn05_projection.py'
      - 'tests/nyc-mn05-roof-vertical-reference.test.py'
      - '.github/workflows/nyc-mn05-roof-vertical-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-vertical-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source readers and run isolated unit tests
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check rhino3dm==8.35.0 pyproj==3.7.2
          python -m py_compile tools/nyc/probe-official-mn05-rhino.py
          python -m py_compile tools/nyc/inspect-mn05-roof-source-roi.py
          python -m py_compile tools/nyc/audit-mn05-roof-vertical-reference.py
          python tests/nyc-mn05-roof-vertical-reference.test.py
          python tests/nyc-official-mn05-coordinate-frame.test.py
      - name: Obtain exact hash-pinned original NYC DCP MN05 source in this job only
        run: |
          PATROL_KEEP_MN05=1 python tools/nyc/probe-official-mn05-rhino.py
          test -s artifacts/nyc-official-mn05/mn05-source.3dm
      - name: Extract original cached 2014 roof mesh and validate source topology
        run: |
          PATROL_KEEP_MN05=1 python tools/nyc/inspect-mn05-roof-source-roi.py
          python tests/nyc-official-2014-roof-mesh-source.test.py
      - name: Match 2014 roof patches to current and historic official OTI footprints
        run: |
          python tools/nyc/audit-mn05-roof-vertical-reference.py
          python tests/nyc-mn05-roof-vertical-reference.test.py
          test -s artifacts/nyc-official-mn05/roof-vertical-reference-audit.json
      - name: Extract authentic 2014 FootPrint Surface and facade meshes for high-confidence current buildings
        run: |
          python -m py_compile tools/nyc/extract-mn05-current-facade-pilot.py
          python tests/nyc-mn05-current-facade-pilot.test.py
          python tools/nyc/extract-mn05-current-facade-pilot.py
          python tests/nyc-mn05-current-facade-pilot.test.py
          test -s artifacts/nyc-official-mn05/current-building-facade-pilot.json
          test -s artifacts/nyc-official-mn05/current-building-relative-height-audit.json
      - name: Delete temporary 627 MB source model before evidence upload
        if: always()
        run: rm -f artifacts/nyc-official-mn05/mn05-source.3dm artifacts/nyc-official-mn05/mn05-source.zip
      - name: Upload bounded source and vertical-reference evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-mn05-roof-vertical-reference-audit
          path: |
            artifacts/nyc-official-mn05/mn05-probe.json
            artifacts/nyc-official-mn05/times-square-roof-source-roi.json
            artifacts/nyc-official-mn05/times-square-original-roof-mesh.json
            artifacts/nyc-official-mn05/roof-vertical-reference-audit.json
            artifacts/nyc-official-mn05/current-building-facade-pilot.json
            artifacts/nyc-official-mn05/current-building-relative-height-audit.json
          retention-days: 7
          if-no-files-found: warn
