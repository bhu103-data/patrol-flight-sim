name: NYC Times Square true-metre street/building source pilot

on:
  pull_request:
    branches: [qa/nyc-main-merged-candidate-20261122-chat, feat/nyc-tsq-meter-crs-road-source-20261122-chat, qa/nyc-pedestrian-topology-audit-current-20261122-chat]
    paths:
      - 'scripts/nyc-times-true-scale-pilot.mjs'
      - 'tests/nyc-times-true-scale-pilot.test.mjs'
      - 'tools/nyc/true-scale-preview.html'
      - 'tools/nyc/true-scale-browser-smoke.mjs'
      - 'tools/nyc/derive_sidewalk_display_mask.py'
      - 'tools/nyc/official-street-topology-audit.py'
      - 'tests/nyc-sidewalk-display-mask.test.py'
      - '.github/workflows/nyc-times-true-scale-source.yml'
      - 'assets/nyc/times-square-footprints.json'
      - 'scripts/nyc-times-roadbed-polygon-source.mjs'
      - 'scripts/nyc-metre-lowflight-roadbed-build.mjs'
      - 'scripts/nyc-times-pedestrian-plaza-source.mjs'
      - 'scripts/nyc-times-pedestrian-topology-audit.mjs'
      - 'scripts/nyc-times-sidewalk-curb-source.mjs'
      - 'scripts/nyc-metre-pedestrian-lowflight-build.mjs'
      - 'tests/nyc-times-source-workflow-completeness.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unit consistency, municipal source FIDs and roads
        run: |
          node --check scripts/nyc-times-true-scale-pilot.mjs
          node --test tests/nyc-times-true-scale-pilot.test.mjs tests/nyc-times-source-workflow-completeness.test.mjs
      - name: Install official 2022 polygon triangulator (build-time only)
        run: npm install --no-save --no-audit --no-fund earcut@3.0.2
      - name: Acquire all municipal geometry required by current source-preview WebGL2
        run: |
          node scripts/nyc-times-true-scale-pilot.mjs
          node scripts/nyc-times-roadbed-polygon-source.mjs
          node scripts/nyc-metre-lowflight-roadbed-build.mjs
          node scripts/nyc-times-pedestrian-plaza-source.mjs
          node scripts/nyc-times-pedestrian-topology-audit.mjs
          node scripts/nyc-times-sidewalk-curb-source.mjs
          test -s artifacts/nyc-true-scale/source.json
          test -s artifacts/nyc-true-scale/plan.svg
          test -s artifacts/nyc-true-scale/roadbed-mesh.json
          test -s artifacts/nyc-oti-pedestrian-source/centreline-surface-topology.json
          cp tools/nyc/true-scale-preview.html artifacts/nyc-true-scale/preview.html
          cp tools/nyc/true-scale-flight.mjs artifacts/nyc-true-scale/flight.mjs
          cp tools/nyc/true-scale-street-envelope.mjs artifacts/nyc-true-scale/street-envelope.mjs
      - name: Derive source-preserving sidewalk display mask and audit exact metre topology
        run: |
          python3 -m pip install --disable-pip-version-check shapely==2.1.2
          python3 -m py_compile tools/nyc/official-street-topology-audit.py tools/nyc/derive_sidewalk_display_mask.py
          python3 tests/nyc-sidewalk-display-mask.test.py
          python3 tools/nyc/derive_sidewalk_display_mask.py
          python3 tools/nyc/official-street-topology-audit.py
          test -s artifacts/nyc-curb-sidewalk-source/sidewalk-display.json
          test -s artifacts/nyc-curb-sidewalk-source/sidewalk-occlusion-report.json
          test -s artifacts/nyc-curb-sidewalk-source/topology-audit.json
          test -s artifacts/nyc-curb-sidewalk-source/topology-conflicts.geojson
          node scripts/nyc-metre-pedestrian-lowflight-build.mjs
          test -s artifacts/nyc-true-scale/pedestrian-mesh.json
      - name: Install browser for real measured-source WebGL2 acceptance
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve source snapshot in the separate 1:1 scene
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory artifacts/nyc-true-scale > /tmp/nyc-source-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/preview.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify actual WebGL2 metre-scene and capture screenshot
        run: |
          node tools/nyc/true-scale-browser-smoke.mjs
      - name: Upload measured-source pilot (NOT production game scene)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-true-scale-source-pilot
          path: |
            artifacts/nyc-true-scale/
            artifacts/nyc-curb-sidewalk-source/topology-audit.json
            artifacts/nyc-curb-sidewalk-source/topology-conflicts.geojson
            artifacts/nyc-curb-sidewalk-source/sidewalk-display.json
            artifacts/nyc-curb-sidewalk-source/sidewalk-occlusion-report.json
            artifacts/nyc-curb-sidewalk-source/sidewalk-occlusion-plan.svg
          retention-days: 7
          if-no-files-found: ignore
