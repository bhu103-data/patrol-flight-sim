name: NYC OTI 2022 full roadbed plaza sidewalk runtime QA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/nyc-true-scale-runtime-port-20261122-chat
    paths:
      - "assets/nyc/earcut.mjs"
      - "assets/nyc/EARCUT-LICENSE.txt"
      - "assets/nyc/nyc-oti-surface-runtime.mjs"
      - "assets/nyc/nyc-true-scale-neighborhood.mjs"
      - "assets/nyc/nyc-true-scale-flight.html"
      - "tests/nyc-oti-surface-runtime.test.mjs"
      - "tests/nyc-true-scale-flythrough.test.mjs"
      - "scripts/nyc-oti-surfaces-browser-smoke.mjs"
      - "docs/NYC_TRUE_SCALE_FLYTHROUGH_20261122.md"
      - ".github/workflows/nyc-oti-surfaces-runtime.yml"

permissions:
  contents: read

jobs:
  nyc-oti-full-surfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax, CRS, official source parsing and hole-aware mesh regression
        run: |
          node --check assets/nyc/earcut.mjs
          node --check assets/nyc/nyc-oti-surface-runtime.mjs
          node --check assets/nyc/nyc-true-scale-neighborhood.mjs
          node --check scripts/nyc-oti-surfaces-browser-smoke.mjs
          node --check tests/nyc-oti-surface-runtime.test.mjs
          node -e "const fs=require('node:fs');const h=fs.readFileSync('assets/nyc/nyc-true-scale-flight.html','utf8');const m=h.match(/<script type=\"module\">([\\s\\S]*?)<\\/script>/);if(!m)throw Error('NYC inline module not found');fs.writeFileSync('/tmp/nyc-oti-inline.mjs',m[1]);"
          node --check /tmp/nyc-oti-inline.mjs
          node --test tests/*.test.mjs
      - name: Install Chromium WebGL2 and PNG inspection dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Serve the experimental 1:1 scene
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/patrol-nyc-oti-http.log 2>&1 &
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/nyc/nyc-true-scale-flight.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/nyc/nyc-oti-roadbed-core-2022.json >/dev/null
      - name: Fetch official OTI layers in Chromium and render same-camera A/B
        env:
          PATROL_BASE_URL: http://127.0.0.1:8765
        run: node scripts/nyc-oti-surfaces-browser-smoke.mjs
      - name: Upload exact OTI source counts, triangulation report and WebGL screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-oti-full-surfaces-runtime-qa
          path: artifacts/nyc-oti-surfaces-runtime/
          retention-days: 7
          if-no-files-found: ignore
