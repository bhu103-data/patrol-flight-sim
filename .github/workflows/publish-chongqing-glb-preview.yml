name: Publish reviewed Hongyadong GLB preview (disabled by default)

on:
  push:
    paths:
      - '.github/workflows/publish-chongqing-glb-preview.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-reviewed-asset:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Download exact verified Blender CI model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/patrol-pbr-review assets/chongqing/generated
          gh run download 44855993580 -R bhu103-data/patrol-flight-sim \
            --name hongyadong-blender-pbr-review \
            --dir /tmp/patrol-pbr-review
          echo "f370dec62721dff86df8ee5123fd84c97b69e9cfa78be55df36a821830613c42  /tmp/patrol-pbr-review/hongyadong-study.glb" | sha256sum -c -
          cp /tmp/patrol-pbr-review/hongyadong-study.glb assets/chongqing/generated/hongyadong-study.glb
      - name: Recheck using the production WebGL gate
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const src=readFileSync('assets/chongqing/scenario-assets.js','utf8');
          const {validateScenarioGLB}=await import('data:text/javascript;base64,'+Buffer.from(src).toString('base64'));
          const b=readFileSync('assets/chongqing/generated/hongyadong-study.glb');
          console.log(validateScenarioGLB(b.buffer.slice(b.byteOffset,b.byteOffset+b.byteLength)));
          NODE
      - name: Commit preview-only model without activating game
        shell: bash
        run: |
          set -euo pipefail
          cp assets/chongqing/generated/hongyadong-study.glb /tmp/hongyadong-study.glb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in {1..15}; do
            # Another PATROL workflow may commit while this model is validated.
            # Apply only the approved GLB to the latest main, never force push.
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p assets/chongqing/generated
            cp /tmp/hongyadong-study.glb assets/chongqing/generated/hongyadong-study.glb
            git add assets/chongqing/generated/hongyadong-study.glb
            if git diff --cached --quiet; then
              echo "The verified GLB is already present."
              exit 0
            fi
            git commit -m "Publish staggered three-wing Hongyadong Bayu architectural GLB preview"
            if git push origin HEAD:main; then
              echo "Published reviewed GLB on attempt $attempt."
              exit 0
            fi
            sleep 2
          done
          echo "Cannot publish without force after 15 non-destructive retries." >&2
          exit 1

  inspect-flatiron-multipatch:
    if: github.repository == 'bhu103-data/patrol-flight-sim' && github.ref == 'refs/heads/feat/nyc-flatiron-dcp-2014-model-import-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Download official NYC OTI multipatch source
        run: |
          set -euo pipefail
          mkdir -p /tmp/flatiron-oti
          curl -fL --retry 2 --retry-all-errors --connect-timeout 30 --max-time 600 \
            -o /tmp/flatiron-oti/DA_WISE_Multipatch.zip \
            https://s-media.nyc.gov/agencies/oti/DA_WISE_Multipatch.zip
          unzip -l /tmp/flatiron-oti/DA_WISE_Multipatch.zip | tee /tmp/flatiron-oti/zip-list.txt
          unzip -q /tmp/flatiron-oti/DA_WISE_Multipatch.zip -d /tmp/flatiron-oti/unpacked
          find /tmp/flatiron-oti/unpacked -maxdepth 5 -print | tee /tmp/flatiron-oti/file-tree.txt

      - name: Inspect multipatch driver, layers, and BIN attributes
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin
          ogrinfo --formats | grep -Ei 'OpenFileGDB|FileGDB'
          GDB="$(find /tmp/flatiron-oti/unpacked -iname '*.gdb' -print -quit)"
          SHP="$(find /tmp/flatiron-oti/unpacked -iname '*.shp' -print -quit)"
          if [ -n "$GDB" ]; then
            ogrinfo -ro -so -al "$GDB" | tee /tmp/flatiron-oti/layer-info.txt
          elif [ -n "$SHP" ]; then
            ogrinfo -ro -so "$SHP" | tee /tmp/flatiron-oti/layer-info.txt
          else
            echo "No FileGDB or Shapefile found; archive inventory follows." | tee /tmp/flatiron-oti/layer-info.txt
            find /tmp/flatiron-oti/unpacked -maxdepth 5 -type f -printf '%p %s bytes\n' | tee -a /tmp/flatiron-oti/layer-info.txt
            exit 1
          fi
          grep -Ei 'BIN|geometry|feature count|layer name|EPSG|2263|MultiPatch|PolyhedralSurface|TIN' /tmp/flatiron-oti/layer-info.txt || true

      - name: Upload official multipatch inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatiron-oti-multipatch-inspection
          path: /tmp/flatiron-oti/
          if-no-files-found: warn
