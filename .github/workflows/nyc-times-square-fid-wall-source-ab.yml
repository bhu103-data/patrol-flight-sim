name: NYC 44th Street exact-main GIS source FID wall PNG A-B
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "assets/nyc/nyc-gis-infill.js"
      - "assets/nyc/times-square-footprints.json"
      - "scripts/nyc-times-square-fid-wall-source-ab.mjs"
      - "tests/nyc-times-square-fid-wall-probe.test.mjs"
      - ".github/workflows/nyc-times-square-fid-wall-source-ab.yml"

permissions:
  contents: read

jobs:
  exact-main-source-fid-png-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate exact source FID inventory and reversible diagnostic gate
        run: |
          node --check scripts/nyc-times-square-fid-wall-source-ab.mjs
          node --test tests/nyc-times-square-fid-wall-probe.test.mjs
      - name: Install free Chromium and PNG decoder
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Serve exact candidate checkout
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/patrol-nyc-fid-http.log 2>&1 &
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:8765/index.html >/dev/null
      - name: Scan every emitted NYC GIS FID using stable same-camera PNG A-B
        env:
          PATROL_BASE_URL: http://127.0.0.1:8765
        run: node scripts/nyc-times-square-fid-wall-source-ab.mjs
      - name: Preserve top-FID A/B screenshots and full source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-44th-street-main-exact-fid-wall-png-ab
          path: artifacts/nyc-fid-wall-source-ab/
          retention-days: 14
          if-no-files-found: warn
