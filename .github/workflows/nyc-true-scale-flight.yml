name: NYC 1:1 official-source free-flight WebGL QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "assets/nyc/nyc-dcm-centerlines-sample.json"
      - "assets/nyc/nyc-oti-roadbed-core-2022.json"
      - "assets/nyc/nyc-c185-metre-airborne.mjs"
      - "tests/nyc-metric-c185-airborne.test.mjs"
      - "assets/nyc/nyc-true-scale-*.mjs"
      - "assets/nyc/nyc-true-scale-flight.html"
      - "assets/nyc/times-square-metered-massing.mjs"
      - "assets/nyc/times-square-footprints.json"
      - "tests/nyc-true-scale-flythrough.test.mjs"
      - "scripts/nyc-true-scale-flight-browser-smoke.mjs"
      - "index.html"
      - ".github/workflows/nyc-true-scale-flight.yml"

permissions:
  contents: read

jobs:
  nyc-metre-flythrough:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and source-coordinate/geometry QA
        run: |
          node --check assets/nyc/nyc-true-scale-neighborhood.mjs
          node --check assets/nyc/nyc-c185-metre-airborne.mjs
          node -e "const fs=require('node:fs');const h=fs.readFileSync('assets/nyc/nyc-true-scale-flight.html','utf8');const m=h.match(/<script type=\"module\">([\\s\\S]*?)<\\/script>/);if(!m)throw Error('NYC inline module not found');fs.writeFileSync('/tmp/nyc-true-scale-inline.mjs',m[1]);"
          node --check /tmp/nyc-true-scale-inline.mjs
          node --check scripts/nyc-true-scale-flight-browser-smoke.mjs
          node --check tests/nyc-true-scale-flythrough.test.mjs
          node --test tests/nyc-times-square-metered-massing.test.mjs tests/nyc-true-scale-flythrough.test.mjs tests/nyc-metric-c185-airborne.test.mjs
      - name: Install free WebGL test browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Serve source-aligned pilot locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/patrol-nyc-source-http.log 2>&1 &
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/nyc/nyc-true-scale-flight.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/assets/nyc/nyc-dcm-centerlines-sample.json >/dev/null
      - name: Open PATROL launcher and test free-flight movement + source alignment
        env:
          PATROL_BASE_URL: http://127.0.0.1:8765
        run: node scripts/nyc-true-scale-flight-browser-smoke.mjs
      - name: Upload actual WebGL2 screenshots, source counts, camera movement and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-true-scale-flythrough-qa
          path: artifacts/nyc-true-scale-flight/
          retention-days: 7
          if-no-files-found: ignore
