name: NYC Lake east-shore CC0 park bench source audit (review only)
on:
  push:
    branches:
      - review/nyc-park-east-lake-bench-asset-20261121
    paths:
      - 'tools/nyc/audit-east-lake-park-bench.mjs'
      - '.github/workflows/nyc-east-lake-bench-review.yml'
      - 'docs/NYC_EAST_LAKE_BENCH_ASSET_REVIEW.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nyc-east-lake-bench-source-exclusive
  cancel-in-progress: true
jobs:
  inspect-pinned-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check standalone audit syntax
        run: node --check tools/nyc/audit-east-lake-park-bench.mjs
      - name: Fetch author license pages and immutable tevy publisher metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nyc-park-bench-review
          curl -fL --retry 2 --connect-timeout 15 --max-time 90 \
            --proto '=https' https://tevy.dev/models.json \
            -o /tmp/tevy-models.json
          curl -fL --retry 2 --connect-timeout 15 --max-time 50 \
            --proto '=https' https://tevy.dev/models/park-bench \
            -o /tmp/tevy-park-bench.html
          curl -fL --retry 2 --connect-timeout 15 --max-time 50 \
            --proto '=https' \
            https://www.innerscene.com/tools/library/3d-parts/park-bench-timber-slats-on-cast-legs-e4bff625 \
            -o /tmp/innerscene-bench.html
      - name: Download all three pinned source LODs + one alternative from original producers
        shell: bash
        run: |
          set -euo pipefail
          for level in 0 1 2; do
            curl -fL --retry 2 --connect-timeout 15 --max-time 90 \
              --proto '=https' "https://tevy.dev/models/park-bench/v1/lod$level.glb" \
              -o "/tmp/tevy-park-bench-lod$level.glb"
            test -s "/tmp/tevy-park-bench-lod$level.glb"
            test "$(stat -c%s "/tmp/tevy-park-bench-lod$level.glb")" -lt 2500000
          done
          curl -fL --retry 2 --connect-timeout 15 --max-time 90 \
            --proto '=https' \
            https://www.innerscene.com/api/library/park-bench-timber-slats-on-cast-legs-e4bff625/download \
            -o /tmp/innerscene-bench.glb
          test -s /tmp/innerscene-bench.glb
          test "$(stat -c%s /tmp/innerscene-bench.glb)" -lt 2500000
      - name: Cross-check cryptographic hashes, actual GLB triangles and material texture budgets
        run: node tools/nyc/audit-east-lake-park-bench.mjs
      - name: Save original license-cleared reversible sample as CI artifact only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nyc-park-bench-review/source
          cp /tmp/tevy-park-bench-lod1.glb artifacts/nyc-park-bench-review/source/tevy-park-bench-v1-lod1.glb
          cp /tmp/tevy-park-bench-lod2.glb artifacts/nyc-park-bench-review/source/tevy-park-bench-v1-lod2.glb
          cp /tmp/innerscene-bench.glb artifacts/nyc-park-bench-review/source/innerscene-bench.glb
          cat > artifacts/nyc-park-bench-review/source/CC0_SOURCE_NOTICE.txt <<'EOF'
          tevy Park Bench version 1, official https://tevy.dev/models/park-bench
          Innerscene bench official https://www.innerscene.com/tools/library/3d-parts/park-bench-timber-slats-on-cast-legs-e4bff625
          Both creators/publishers publicly declare CC0 1.0, modification and redistribution permitted.
          These original GLBs are research-only in PATROL. No runtime scene or physics includes them.
          Read actual-source-geometry-and-licensing.json for verified SHA256, texture, size and triangles.
          EOF
      - name: Publish audited original GLBs and report for centralized QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-central-park-east-lake-bench-source-LOD-A-B
          path: artifacts/nyc-park-bench-review/
          retention-days: 14
          if-no-files-found: ignore
