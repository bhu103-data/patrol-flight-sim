<!doctype html>
<html lang="zh"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PATROL · NYC official 2014 roof/facade source preview</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1420;color:#eef3f7;font:13px system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
aside{position:absolute;left:14px;top:14px;max-width:440px;padding:15px 18px;border:1px solid #516779;border-radius:10px;background:#0c1b2aeb}
h1{font-size:17px;margin:0 0 8px}p{margin:6px 0;line-height:1.48}
label{display:block;margin-top:7px;color:#f0d3a5}#status{color:#9bd8cf;font-variant-numeric:tabular-nums}
small{color:#c1ccd5}
</style></head><body>
<canvas id="viewer"></canvas><aside>
<h1>时代广场 · NYC DCP 2014 官方屋顶与立面网格</h1>
<p><strong>不是 2026 实景扫描，也不是 PATROL 正式地图。</strong></p>
<p>灰色：2026-11-20 官方建筑足迹/HEIGHTROOF 简化体块；橙色：2014 Rhino 缓存屋顶网格；蓝色：2014 Rhino 缓存立面网格。</p>
<p>Rhino 模型单位已验证为 Feet；但原始 Z 垂直基准未确认。仅按每栋楼的相对 Z 范围归一化到现代 HEIGHTROOF，不使用绝对历史海拔。</p>
<label><input id="roof" type="checkbox" checked/> 显示 2014 原始屋顶三角面</label>
<label><input id="facade" type="checkbox" checked/> 显示 2014 原始立面三角面</label>
<p id="status">正在载入原始市政网格…</p>
<small>鼠标拖动旋转，滚轮缩放。X=东米，Z=北米。此页面只用于源数据/实时 WebGL2 QA；尚未接入游戏，不是完整写实建筑。</small>
</aside>
<script>
(async()=>{
const canvas=document.getElementById('viewer'),status=document.getElementById('status');
const roofToggle=document.getElementById('roof'),facadeToggle=document.getElementById('facade');
const gl=canvas.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true});
if(!gl)throw Error('WebGL2 unavailable');
const vs='#version 300 es\nprecision highp float;layout(location=0)in vec3 p;layout(location=1)in vec3 c;layout(location=2)in vec3 n;uniform mat4 m;out vec3 col;out vec3 nor;void main(){gl_Position=m*vec4(p,1.);col=c;nor=n;}';
const fs='#version 300 es\nprecision highp float;in vec3 col;in vec3 nor;out vec4 rgba;void main(){float d=.43+.57*abs(dot(normalize(nor),normalize(vec3(.38,.82,.31))));rgba=vec4(pow(col*d,vec3(.9)),1.);}';
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
const uniform=gl.getUniformLocation(prog,'m');
const data=[{p:[],c:[],n:[]},{p:[],c:[],n:[]},{p:[],c:[],n:[]},{p:[],c:[],n:[]}];
function sub(a,b){return a.map((x,i)=>x-b[i]);}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function norm(a){const l=Math.hypot(...a)||1;return a.map(x=>x/l);}
function add(kind,a,b,c,color,normal=null){const d=data[kind],n=normal||norm(cross(sub(b,a),sub(c,a)));for(const p of [a,b,c]){d.p.push(...p);d.c.push(...color);d.n.push(...n);}}
function line(a,b,color){const d=data[3];for(const p of [a,b]){d.p.push(...p);d.c.push(...color);d.n.push(0,1,0);}}
function area(loop){return loop.reduce((s,a,i)=>{const b=loop[(i+1)%loop.length];return s+a[0]*b[1]-a[1]*b[0];},0);}
function inside(p,a,b,c,sign){const cr=(u,v,w)=>(v[0]-u[0])*(w[1]-u[1])-(v[1]-u[1])*(w[0]-u[0]);return sign*cr(a,b,p)>=-1e-7&&sign*cr(b,c,p)>=-1e-7&&sign*cr(c,a,p)>=-1e-7;}
function roofPoly(loop,h,color){const ids=loop.map((_,i)=>i),sign=Math.sign(area(loop))||1;let guard=ids.length*ids.length;while(ids.length>3&&guard-->0){let cut=false;for(let i=0;i<ids.length;i++){const ia=ids[(i+ids.length-1)%ids.length],ib=ids[i],ic=ids[(i+1)%ids.length],a=loop[ia],b=loop[ib],c=loop[ic];const turn=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);if(sign*turn<=1e-6)continue;if(ids.some(j=>j!==ia&&j!==ib&&j!==ic&&inside(loop[j],a,b,c,sign)))continue;add(0,[a[0],h,a[1]],[b[0],h,b[1]],[c[0],h,c[1]],color,[0,1,0]);ids.splice(i,1);cut=true;break;}if(!cut)break;}if(ids.length!==3)throw Error('Official footprint triangulation failed closed');const [a,b,c]=ids.map(i=>loop[i]);add(0,[a[0],h,a[1]],[b[0],h,b[1]],[c[0],h,c[1]],color,[0,1,0]);}
function makeMesh(kind){const d=data[kind],vao=gl.createVertexArray();gl.bindVertexArray(vao);for(const [slot,arr] of [[0,d.p],[1,d.c],[2,d.n]]){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.STATIC_DRAW);gl.enableVertexAttribArray(slot);gl.vertexAttribPointer(slot,3,gl.FLOAT,false,0,0);}gl.bindVertexArray(null);return{vao,count:d.p.length/3};}
const response=await fetch('./mn05-roof-facade-metric-preview.json');if(!response.ok)throw Error('Source mesh preview JSON unavailable');const src=await response.json();
if(src.schema!=='patrol-mn05-2014-roof-facade-relative-height-v1'||src.source3dmSha256!=='b41afdad1243d12858f7f446325af30667175b1eb36e9689304a4299f1c0df57'||src.sourceVerticalDatumVerified!==false||src.sourceAbsoluteZUsed!==false||src.assetRole!=='RESEARCH_PREVIEW_ONLY_NOT_PATROL_RUNTIME_OR_COLLISION')throw Error('Unverified official source provenance/height mode');
if(src.counts.matchedBuildingFids<5||src.counts.roofTriangles<100||src.counts.facadeTriangles<100)throw Error('Insufficient source roof/facade geometry');
const bounds=[Infinity,Infinity,-Infinity,-Infinity];
for(const b of src.buildings){const loop=b.outline.slice(0,-1);if(loop.length<3)throw Error('Invalid footprint');for(const p of loop){bounds[0]=Math.min(bounds[0],p[0]);bounds[1]=Math.min(bounds[1],p[1]);bounds[2]=Math.max(bounds[2],p[0]);bounds[3]=Math.max(bounds[3],p[1]);}const h=b.heightMetres,color=[.40+.06*(b.fid%7)/7,.47,.53];for(let i=0;i<loop.length;i++){const a=loop[i],q=loop[(i+1)%loop.length],lo=[a[0],0,a[1]],lo2=[q[0],0,q[1]],hi=[a[0],h,a[1]],hi2=[q[0],h,q[1]];add(0,lo,lo2,hi2,color);add(0,lo,hi2,hi,color);}roofPoly(loop,h,[.62,.68,.72]);}
for(const tri of src.roofTriangles){const v=tri.vertices;add(1,v[0],v[1],v[2],[.96,.48,.18]);}
for(const tri of src.facadeTriangles){const v=tri.vertices;add(2,v[0],v[1],v[2],[.20,.63,.77]);}
const west=Math.floor(bounds[0]/50)*50,east=Math.ceil(bounds[2]/50)*50,south=Math.floor(bounds[1]/50)*50,north=Math.ceil(bounds[3]/50)*50;
for(let x=west;x<=east;x+=50)line([x,-.5,south],[x,-.5,north],[.27,.36,.43]);for(let z=south;z<=north;z+=50)line([west,-.5,z],[east,-.5,z],[.27,.36,.43]);
const base=makeMesh(0),roof=makeMesh(1),facade=makeMesh(2),grid=makeMesh(3);
const mid=[(bounds[0]+bounds[2])/2,(bounds[1]+bounds[3])/2],span=Math.max(bounds[2]-bounds[0],bounds[3]-bounds[1]);
let yaw=-.68,pitch=.72,distance=Math.max(220,span*1.45),target=[mid[0],55,mid[1]],drag=false,last=[0,0];
function dot(a,b){return a.reduce((s,x,i)=>s+x*b[i],0);}
function look(eye,at){const z=norm(sub(eye,at)),x=norm(cross([0,1,0],z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);}
function perspective(aspect){const f=1/Math.tan(Math.PI/5.5),n=1,far=4000;return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+n)/(n-far),-1,0,0,2*far*n/(n-far),0]);}
function mul(a,b){const o=new Float32Array(16);for(let j=0;j<4;j++)for(let i=0;i<4;i++)for(let k=0;k<4;k++)o[j*4+i]+=a[k*4+i]*b[j*4+k];return o;}
canvas.addEventListener('pointerdown',e=>{drag=true;last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-last[0])*.004;pitch=Math.max(.16,Math.min(1.48,pitch+(e.clientY-last[1])*.004));last=[e.clientX,e.clientY];});
canvas.addEventListener('wheel',e=>{distance=Math.max(70,Math.min(2400,distance*Math.exp(e.deltaY*.001)));e.preventDefault();},{passive:false});
gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.clearColor(.035,.064,.093,1);
function draw(){const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.max(1,Math.floor(canvas.clientWidth*dpr)),h=Math.max(1,Math.floor(canvas.clientHeight*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const eye=[target[0]+distance*Math.cos(pitch)*Math.sin(yaw),target[1]+distance*Math.sin(pitch),target[2]+distance*Math.cos(pitch)*Math.cos(yaw)];gl.uniformMatrix4fv(uniform,false,mul(perspective(w/h),look(eye,target)));gl.bindVertexArray(grid.vao);gl.drawArrays(gl.LINES,0,grid.count);gl.bindVertexArray(base.vao);gl.drawArrays(gl.TRIANGLES,0,base.count);gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(-1,-1);if(roofToggle.checked){gl.bindVertexArray(roof.vao);gl.drawArrays(gl.TRIANGLES,0,roof.count);}if(facadeToggle.checked){gl.bindVertexArray(facade.vao);gl.drawArrays(gl.TRIANGLES,0,facade.count);}gl.disable(gl.POLYGON_OFFSET_FILL);gl.bindVertexArray(null);requestAnimationFrame(draw);}
window.mn05RoofFacadeQA={ready:true,sourceYear:2014,matchedFids:src.counts.matchedBuildingFids,roofTriangles:src.counts.roofTriangles,facadeTriangles:src.counts.facadeTriangles,sourceVerticalDatumVerified:false,sourceVerticalUnitVerified:src.sourceVerticalUnitVerified===true,sourceModelUnitSystem:src.sourceModelUnitSystem,relativeHeightAnchor:true,roofVisible:()=>roofToggle.checked,facadeVisible:()=>facadeToggle.checked,roofDrawn:()=>roofToggle.checked?roof.count/3:0,facadeDrawn:()=>facadeToggle.checked?facade.count/3:0};
status.textContent='2014 原始屋顶 '+src.counts.roofTriangles+' 三角面 · 原始立面 '+src.counts.facadeTriangles+' 三角面 · 匹配建筑 '+src.counts.matchedBuildingFids+' 栋';
draw();
})().catch(e=>{window.mn05RoofFacadeQA={ready:false,error:String(e)};document.getElementById('status').textContent='QA 失败：'+e.message;console.error(e);});
</script></body></html>
