  const GEAR_CLEARANCE = 0.96;
  const ROTATE_SPEED = 23;
  // Pure twin-float landing gear, modeled with pontoon keels 1.48m below
  // the aircraft origin (no wheels on this configuration).
  const FLOAT_CLEARANCE=1.50,FLOAT_ROTATE_SPEED=17.5;
  let waterborne=false;
  // Keep wing tips and pontoons out of authored Liberty Island ferry docks.
  // These piers are actual geometry over water, so sampling ground height
  // alone misses them. Use the same exclusion for taxi, start and touchdown.
  function clearOfNycHeroDocks(x,z){
    if(!selectedMap.city)return true;
    const [lx,lz]=NYC_HERO_ROUTE.liberty;
    const [sx,sz]=NYC_HERO_ROUTE.spawn;
    // Fort Wood star fort + visitor paths occupy a radius near 25 world units.
    if(Math.hypot(x-lx,z-lz)<32)return false;
    const dx=sx-lx,dz=sz-lz,len=Math.hypot(dx,dz)||1;
    const along=((x-lx)*dx+(z-lz)*dz)/len;
    const across=((x-lx)*-dz+(z-lz)*dx)/len;
    // Spawn-facing dock follows the island-spawn line along u=18..38.
    // Expand for the 10.922 m high wing plus mooring railing clearance.
    if(along>9.5 && along<45 && Math.abs(across)<9.5)return false;
    // West dock extends x0-19.6 to x0-50.92, centered at z0+4.6.
    if(x<lx-12 && x>lx-58 &&
       Math.abs(z-(lz+4.6))<10.5)return false;
    return true;
  }
  function usableFloatWater(x,z,yaw=plane.yaw){
    // Water taxi and touchdown share the moving-vessel clearance gate.
    // Keep this check inside the exported game function: collision tests
    // also execute the same function independently of the scene closure.
    if(typeof boats!=='undefined'&&typeof sceneryPose==='function'&&
       typeof sceneryTime!=='undefined'){
      for(const ship of boats){
        if(!ship||!Number.isFinite(ship.halfLength)||
           !Number.isFinite(ship.halfWidth))continue;
        const [bx,bz,heading]=sceneryPose(ship,sceneryTime);
        if(![bx,bz,heading].every(Number.isFinite))continue;
        const dx=x-bx,dz=z-bz;
        // Use the dimensioned C185's 7.8105 m length and 10.922 m span.
        // The wing-and-float envelope rotates relative to the vessel.
        const halfLength=3.90525,halfSpan=5.461,buffer=.60;
        const maxReach=Math.hypot(ship.halfLength,ship.halfWidth)+
          Math.hypot(halfLength,halfSpan)+buffer;
        if(Math.hypot(dx,dz)>maxReach)continue;
        const fx=Math.sin(heading),fz=Math.cos(heading);
        const along=dx*fx+dz*fz,across=dx*fz-dz*fx;
        const parallel=Math.abs(Math.cos(yaw-heading));
        const perpendicular=Math.abs(Math.sin(yaw-heading));
        const marginAlong=halfLength*parallel+halfSpan*perpendicular+buffer;
        const marginAcross=halfLength*perpendicular+halfSpan*parallel+buffer;
        // Four-axis separation (both hull axes and both aircraft axes).
        // Two-axis AABB rejection alone blocks safe diagonal taxi gaps.
        if(Math.abs(along)>=ship.halfLength+marginAlong ||
           Math.abs(across)>=ship.halfWidth+marginAcross)continue;
        const alongPlane=dx*Math.sin(yaw)+dz*Math.cos(yaw);
        const acrossPlane=dx*Math.cos(yaw)-dz*Math.sin(yaw);
        const shipAlong=ship.halfLength*parallel+ship.halfWidth*perpendicular;
        const shipAcross=ship.halfLength*perpendicular+ship.halfWidth*parallel;
        if(Math.abs(alongPlane)<halfLength+shipAlong+buffer &&
           Math.abs(acrossPlane)<halfSpan+shipAcross+buffer)return false;
      }
    }
    // Audit the entire twin-pontoon water contact envelope, not just its
    // center and four corners. Thin shore fingers can hide between the old
    // nine test points, leading to stranded or partly beached floatplanes.
    const fx=Math.sin(yaw),fz=Math.cos(yaw),sx=fz,sz=-fx;
    for(const along of [-3.05,-1.525,0,1.525,3.05])
      for(const across of [-1.85,-.925,0,.925,1.85]){
        const px=x+fx*along+sx*across,pz=z+fz*along+sz*across;
        // Check wing/pontoon clearance against actual authored harbor docks
        // at every sampled contact point; center-only checks miss dock edges.
        if(selectedMap.city && !clearOfNycHeroDocks(px,pz))return false;
        if(sampleTerrainHeight(px,pz)>WATER_H+.06 ||
           cityLotAt(px,pz)||sceneryObstacle(px,pz))return false;
        if(selectedMap.alaska && alaskaObstacles.some(o=>
          Math.abs(px-o.x)<o.halfX+.25&&Math.abs(pz-o.z)<o.halfZ+.25))return false;
      }
    return true;
  }
  function findFloatWaterStart(){
    // Deterministic, bounded search over measured shorelines / actual city lots.
    // The dense pontoon footprint gate is shared with landing checks.
    // Keep clear of moving ships at the moment the plane is placed.
    const start=selectedMap.spawn||[0,40,0];
    const limit=(selectedMap.city?NYC_FLIGHT_RADIUS:FLIGHT_RADIUS)-18;
    const safe=(x,z,yaw)=>{
      if(Math.hypot(x,z)>limit || !usableFloatWater(x,z,yaw))return false;
      for(const ship of boats){
        const [bx,bz]=sceneryPose(ship,sceneryTime);
        if(Math.hypot(x-bx,z-bz)<ship.halfLength+9)return false;
      }
      return true;
    };
    // A valid starting point is not enough: the C185 needs a full clear
    // water runway to accelerate, rotate and climb away from shore.
    // The original Alaska spawn faces dry USGS land just ~40 units ahead;
    // try perpendicular headings before relocating the aircraft.
    const runwayClear=(x,z,yaw)=>{
      const fx=Math.sin(yaw),fz=Math.cos(yaw);
      for(const advance of [0,18,36,54,76,94]){
        const px=x+fx*advance,pz=z+fz*advance;
        if(!safe(px,pz,yaw))return false;
      }
      return true;
    };
    const headings=primary=>[primary,primary+Math.PI/2,
      primary-Math.PI/2,primary+Math.PI];
    // Test the actual published spawn first; outward rings avoid random respawn.
    for(const yaw of headings(0)){
      if(runwayClear(start[0],start[2],yaw))
        return [start[0],start[2],yaw];
    }
    for(const radius of [24,48,80,120,180,250,350,470,600]){
      for(let i=0;i<24;i++){
        const angle=i*Math.PI/12+radius*.001;
        const x=start[0]+radius*Math.cos(angle);
        const z=start[2]+radius*Math.sin(angle);
        const preferred=Math.atan2(-x,-z);
        for(const yaw of headings(preferred)){
          if(runwayClear(x,z,yaw))return [x,z,yaw];
        }
      }
    }
    return null;
  }
  let gearDown = false;
  let armorLandingMode = false;
  let grounded = false;
  let brakes = false;

  function toggleGear() {
    if (!flying || crash || grounded ||
      !['fighter','jetpack','seaplane'].includes(selectedAircraft)) return;
    if(selectedAircraft==='seaplane'){
      if(waterborne)brakes=!brakes; // G toggles the floatplane's docking brake.
      renderGearStatus();return;
    }
    if(selectedAircraft==='jetpack'){
      armorLandingMode=!armorLandingMode;
      renderGearStatus();
      return;
    }
    gearDown = !gearDown;
    renderGearStatus();
  }

  function renderGearStatus() {
    gearStatus.hidden = !['fighter','jetpack','seaplane'].includes(selectedAircraft);
    if(selectedAircraft==='seaplane'){
      const state=waterborne
        ?brakes?'FLOATS · DOCKING BRAKE':plane.speed<FLOAT_ROTATE_SPEED
          ?'FLOATS · WATER TAXI '+Math.round(plane.speed)
          :'FLOATS · ON STEP · HOLD BOOST + PULL UP'
        :'FLOATS · WATER LANDING · APPROACH LEVEL';
      if(gearStatus.textContent!==state)gearStatus.textContent=state;
      return;
    }
    if(selectedAircraft==='jetpack'){
      let text=grounded?'ARMOR GROUNDED � HOLD BOOST TO LAUNCH':
        armorLandingMode?'LANDING ASSIST � DESCENDING':'REPULSOR FLIGHT � G TO LAND';
      if(grounded && brakes)text='ARMOR HOLD � '+Math.round(plane.speed);
      if(gearStatus.textContent!==text)gearStatus.textContent=text;
      return;
    }
    let text = gearDown ? 'GEAR DOWN' : 'GEAR UP';
    if (grounded) {
      const speed = Math.round(plane.speed);
      const action = speed >= ROTATE_SPEED ? 'PULL UP' : plane.afterburner ? 'ACCELERATING' : 'HOLD BOOST';
      text = (speed ? action + ' · ' + speed + ' / ' + ROTATE_SPEED : 'STOPPED · HOLD BOOST');
      if (brakes) text = 'BRAKES · ' + speed;
    }
    if (gearStatus.textContent !== text) gearStatus.textContent = text;
  }

  function usableLandingSurface(x,z) {
    const level = sampleTerrainHeight(x,z);
    if (level <= WATER_H+0.10 || cityLotAt(x,z) || sceneryObstacle(x,z)) return null;
    for (const [dx,dz] of [[3,0],[-3,0],[0,3],[0,-3]]) {
      const nearby = sampleTerrainHeight(x+dx,z+dz);
      if (nearby <= WATER_H+0.10 || Math.abs(nearby-level)>0.70 || cityLotAt(x+dx,z+dz)) return null;
    }
    return level;
  }

  function buildLandingGear() {
    const {addQuad,upload}=createTriangleMesh();
    for (const [x,z] of [[0,1.15],[-0.52,-0.64],[0.52,-0.64]]) {
      addModelBox(addQuad,x,-0.46,z,0.11,0.57,0.13,[0.65,0.70,0.72]);
      const tire=[0.13,0.15,0.15], hub=[0.52,0.56,0.57];
      for(let i=0;i<12;i++){
        const edge=(side,j)=>[x+side*0.085,-0.74+Math.cos(j*Math.PI/6)*0.21,z+Math.sin(j*Math.PI/6)*0.21];
        addQuad(edge(-1,i),edge(1,i),edge(1,i+1),edge(-1,i+1),tire);
        for (const side of [-1,1]) {
          const a=[x+side*0.085,-0.74,z];
          addQuad(a,edge(side,i),edge(side,i+1),a,hub);
        }
      }
    }
    return upload();
  }

  const gearMesh=buildLandingGear();

  function advanceFlight(dt) {
    const prevPos = [...plane.pos];
    const craft = AIRCRAFT[selectedAircraft];
    const armor=selectedAircraft==='jetpack';
    const floatplane=selectedAircraft==='seaplane';
    const targetSpeed = armorLandingMode ? 5 : plane.afterburner ? craft.boost : brakes ? 16 : craft.cruise;
    if(waterborne){
      // Pontoon drag: coast to rest at idle, plane on-step only under power.
      const acceleration=brakes?-9.5:plane.afterburner?5.8:-2.4;
      plane.speed=clamp(plane.speed+acceleration*dt,0,craft.boost);
    }else if (grounded) {
      const accel = brakes ? -19 : plane.afterburner ? (armor?15:6.5) : armor?-10:-2.4;
      plane.speed = clamp(plane.speed+accel*dt,0,craft.boost);
    } else {
      plane.speed = lerp(plane.speed,targetSpeed,dt*2.8);
    }

    if (audioEnabled && engineGain && abGain && engineFilter) {
      engineGain.gain.setTargetAtTime(plane.afterburner ? 0.14 : 0.075, audioCtx.currentTime, 0.08);
      engineFilter.frequency.setTargetAtTime(plane.afterburner ? 420 : 190, audioCtx.currentTime, 0.08);
      abGain.gain.setTargetAtTime(plane.afterburner ? 0.11 : 0.0, audioCtx.currentTime, 0.06);
    }

    let turnInput = 0;
    let pitchInput = 0;

    if (steeringKeys.size) {
      turnInput = Number(steeringKeys.has('KeyD') || steeringKeys.has('ArrowRight'))
        - Number(steeringKeys.has('KeyA') || steeringKeys.has('ArrowLeft'));
      pitchInput = Number(steeringKeys.has('KeyW') || steeringKeys.has('ArrowUp'))
        - Number(steeringKeys.has('KeyS') || steeringKeys.has('ArrowDown'));
    } else if (viewIdx === 2) {
      // Top-down: steer aircraft toward cursor
      const nx = mouseNorm.x * window.innerWidth / Math.max(1, window.innerHeight);
      const ny = -mouseNorm.y;
      if (Math.hypot(nx, ny) > 0.06) {
        const desiredYaw = Math.atan2(nx, ny);
        let diff = desiredYaw - plane.yaw;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        turnInput = clamp(diff * 1.8, -1, 1);
      }
      pitchInput = 0.0;
    } else {
      // Chase & Cockpit: cursor offset from center sets turn & climb/dive
      turnInput = mouseNorm.x;
      pitchInput = -mouseNorm.y;
    }

    const activeRadius=selectedMap.city?NYC_FLIGHT_RADIUS:FLIGHT_RADIUS;
    const edgeDistance = activeRadius - Math.hypot(plane.pos[0], plane.pos[2]);
    let boundaryAssist = false;
    if (edgeDistance < WARNING_DISTANCE) {
      const inwardYaw = Math.atan2(-plane.pos[0], -plane.pos[2]);
      const headingError = Math.atan2(Math.sin(inwardYaw - plane.yaw), Math.cos(inwardYaw - plane.yaw));
      const assist = clamp(1 - edgeDistance / WARNING_DISTANCE, 0, 1);
      boundaryAssist = Math.abs(headingError) > Math.PI * 0.40;
      if (boundaryAssist) {
        turnInput = lerp(turnInput, Math.sign(headingError), assist);
      }
    }

    const prevYaw = plane.yaw;
    const prevPitch = plane.pitch;
    const taxiTurn=(grounded||waterborne) ?
      clamp(plane.speed/11,.08,.62) : 1;
    plane.yaw += turnInput * craft.turn * dt * taxiTurn;
    const rotate=grounded && plane.afterburner && !brakes &&
      (armor || (plane.speed>=ROTATE_SPEED && pitchInput>0.20));
    const floatRotate=waterborne && plane.afterburner && !brakes &&
      plane.speed>=FLOAT_ROTATE_SPEED && pitchInput>0.20;
    if(rotate || floatRotate) {
      grounded=false;
      waterborne=false;
      armorLandingMode=false;
      plane.pitch=armor?0.48:floatRotate?0.17:0.20;
      plane.pos[1]+=armor?0.16:floatRotate?0.20:0.04;
    }
    const targetPitch = grounded ? 0 : waterborne ? 0 :
      floatRotate?.21 : armorLandingMode ? -0.34 :
      clamp(pitchInput,-0.96,1)*craft.maxPitch;
    plane.pitch = lerp(plane.pitch,targetPitch,dt*craft.pitchResponse);
    plane.bank = lerp(plane.bank,(grounded||waterborne)?0:-turnInput*0.92,dt*4.5);

    if (plane.rollAnim > 0) {
      plane.rollAnim += dt * 1.45;
      if (plane.rollAnim >= 1.0) plane.rollAnim = 0.0;
    }

    const basis = getPlaneBasis();
    plane.pos[0] += basis.fwd[0] * plane.speed * dt;
    plane.pos[1] += basis.fwd[1] * plane.speed * dt;
    if(floatplane&&!waterborne)
      plane.pos[1]-=dt*(plane.afterburner?.25:1.25);
    plane.pos[2] += basis.fwd[2] * plane.speed * dt;

    const radius = Math.hypot(plane.pos[0], plane.pos[2]);
    if (radius > activeRadius) {
      const limit = activeRadius / radius;
      plane.pos[0] *= limit;
      plane.pos[2] *= limit;
    }

    const [x,y,z]=plane.pos;
    const floor=sampleGroundHeight(x,z);
    if(floatplane && !crash){
      if(waterborne){
        if(!usableFloatWater(x,z,plane.yaw)){
          waterborne=false;
          finishFlight([x,WATER_H+.20,z],'Float hit shoreline',false);
        }else{
          // Simulated pontoon buoyancy: stable center height and small heave.
          plane.pos[1]=WATER_H+FLOAT_CLEARANCE+
            .024*Math.sin(sceneryTime*2.3+plane.speed*.28);
          plane.pitch=plane.bank=plane.rollAnim=0;
        }
      }else if(!floatRotate && y<=WATER_H+FLOAT_CLEARANCE &&
                floor<=WATER_H+.06){
        const sink=(y-prevPos[1])/Math.max(dt,1e-4);
        const smooth=usableFloatWater(x,z,plane.yaw) &&
          sink>=-7.8 && plane.speed<=24.5 &&
          plane.pitch>=-.18 && plane.pitch<=.23 && Math.abs(plane.bank)<.18;
        if(smooth){
          waterborne=true;
          plane.pos[1]=WATER_H+FLOAT_CLEARANCE;
          plane.pitch=plane.bank=plane.rollAnim=0;
        }else{
          finishFlight([x,WATER_H+.2,z],'Hard water landing',true);
        }
      }
    }
    const armorCanLand=armor && armorLandingMode && !rotate && y<=floor+1.15 &&
      plane.pitch>=-0.48 && plane.pitch<0.15 && Math.abs(plane.bank)<0.30 && plane.speed<=10;
    if (grounded || armorCanLand || (gearDown && !rotate && y<=floor+GEAR_CLEARANCE &&
        plane.pitch>=-0.21 && plane.pitch<0.20 && Math.abs(plane.bank)<0.22 && plane.speed<=29)) {
      const surface=usableLandingSurface(x,z);
      const clearance=armor?1.18:GEAR_CLEARANCE;
      if (surface!==null && (!grounded || Math.abs(surface+clearance-prevPos[1])<1.4)) {
        grounded=true;
        armorLandingMode=false;
        plane.pos[1]=surface+clearance;
        plane.pitch=plane.bank=plane.rollAnim=0;
      } else if (grounded) {
        finishFlight([x,y,z],'Runway overrun',floor<=WATER_H+0.04);
      }
    }
    plane.pos[1] = Math.min(plane.pos[1],selectedMap===FLIGHT_MAPS.manhattan?NYC_ORBIT_CEILING:CEILING);
    if (!crash) checkFlightCollision((grounded||waterborne)?plane.pos:prevPos,plane.pos);
    renderGearStatus();
    if (!crash) updateMission(dt);

    const look = 14;
    const ahead = navigationSurface(plane.pos[0] + basis.fwd[0] * look, plane.pos[2] + basis.fwd[2] * look);
    groundWarning.hidden = Boolean(crash) || grounded || waterborne || Math.min(plane.pos[1] - floor, plane.pos[1] + basis.fwd[1]*look - ahead) > 5;
    plane.radarAlt = Math.max(0.2, plane.pos[1] - floor);
    plane.vsi = (plane.pos[1] - prevPos[1]) / Math.max(dt, 1e-4);
    const yawRate = (plane.yaw - prevYaw) / Math.max(dt, 1e-4);
    const pitchRate = (plane.pitch - prevPitch) / Math.max(dt, 1e-4);
    plane.gForce = clamp(1.0 + (pitchRate * plane.speed) / 14.0 + Math.abs(yawRate) * 0.9, 0.3, 7.5);

    return { basis, boundaryAssist };
  }

  function checkFlightCollision(previous, next) {
    // Substeps keep a fast-moving aircraft from crossing a narrow collision volume in one frame.
    const steps = Math.max(1, Math.ceil(Math.hypot(...next.map((value, i) => value - previous[i])) / 0.65));
    for (let i = 1; i <= steps; i++) {
      const pos = previous.map((value, j) => lerp(value, next[j], i / steps));
      const [x,y,z] = pos;
      const surface = sampleGroundHeight(x,z);
      if (y <= surface + 0.58) {
        const water = surface <= WATER_H + 0.04;
        finishFlight([x,surface+0.1,z], water ? 'Water impact' : 'Terrain collision', water);
        return;
      }
      const vehicle=vehicleAt(x,y,z,0.48);
      if(vehicle){
        damageVehicle(vehicle,pos,3);
        finishFlight(pos,vehicle.kind==='ship'?'Collision with '+vehicle.actor.name:'Collision with taxi',false);
        return;
      }
      const scenery=sceneryObstacle(x,z,y);
      if(scenery){
        finishFlight(pos,'Collision with '+scenery.name,false);
        return;
      }
      if (selectedMap.alaska) {
        const object=alaskaObstacles.find(o=>Math.abs(x-o.x)<=o.halfX+0.42 &&
          Math.abs(z-o.z)<=o.halfZ+0.42 && y>=o.y-0.45 && y<=o.top+0.45);
        if(object) {
          finishFlight(pos,'Collision with '+object.name,false);
          return;
        }
      }
      if (!selectedMap.city) continue;
      const halfSpan=selectedAircraft==='saucer'?2.35:selectedAircraft==='fighter'?2.15:0.65;
      if (breakBridgeRail(x,y,z,halfSpan) || isBridgeCollision(x,y,z,halfSpan)) {
        finishFlight(pos,'Collision with Brooklyn Bridge',false);
        return;
      }
      for (const mark of NEW_YORK_LANDMARKS) {
        const level = y - sampleGroundHeight(mark.x, mark.z);
        if (level < 0 || level > mark.top + 0.58) continue;
        const dx=Math.abs(x-mark.x),dz=z-mark.z;
        let width=mark.w,depth=mark.d;
        if(mark.kind==='flatiron'){
          width=dz<6.6?lerp(6.65,1.07,clamp((dz+7.95)/14.55,0,1)):0.72;
        }else if(mark.kind==='times'){
          [width,depth]=level<4.35?[5.48,7.02]:level<27.35?[4.52,6.12]:level<31?[3.58,4.62]:[0.82,0.82];
        }else{
          const scale=mark.kind==='liberty'?(level<13?0.94:0.4):level>mark.top-13?0.16:level>43?0.65:1;
          width*=scale;
          depth*=scale;
        }
        if(dx<=width+0.55&&Math.abs(dz)<=depth+0.55){
          finishFlight(pos, 'Collision with ' + mark.name, false);
          return;
        }
      }
    }
  }

  function finishFlight(position, reason, isWater) {
    if(selectedAircraft==='jetpack'){
      // The armor is a playable hero suit rather than a destructible vehicle.
      // Collisions trigger a short repulsor recovery instead of a crash state.
      const [x,,z]=position;
      const safeY=Math.min(CEILING,Math.max(sampleGroundHeight(x,z),navigationSurface(x,z))+2.6);
      plane.pos=[x,safeY,z];
      plane.speed=0;
      plane.pitch=plane.bank=plane.rollAnim=0;
      plane.afterburner=false;
      armorLandingMode=false;
      grounded=false;
      brakes=false;
      steeringKeys.clear();
      groundWarning.hidden=true;
      camInitialized=false;
      explosions.push({pos:[x,safeY-1.2,z],age:0,maxAge:0.48,isWater:false});
      return;
    }
    crash = { startedAt: null, age: 0, reason };
    plane.pos = position;
    plane.speed = 0;
    plane.afterburner = false;
    grounded=false;
    waterborne=false;
    brakes=false;
    steeringKeys.clear();
    groundWarning.hidden = true;
    camInitialized = false;
    explosions.push({ pos: position, age: 0, maxAge: 1.4, isWater, crash: true });
    playExplosionSound(isWater);
    if (audioCtx && engineGain && abGain) {
      engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.08);
      abGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.08);
    }
  }

  function drawCrashBurst(x, y, t, water) {
    const radius = 16 + 70*t;
    const glow = hudCtx.createRadialGradient(x,y,1,x,y,radius);
    glow.addColorStop(0, water ? 'rgba(229,252,255,0.92)' : 'rgba(255,242,176,0.98)');
    glow.addColorStop(0.38, water ? 'rgba(113,194,234,0.52)' : 'rgba(255,137,49,0.72)');
    glow.addColorStop(1,'rgba(108,89,95,0)');
    hudCtx.save();
    hudCtx.globalAlpha = Math.max(0,1-t*1.17);
    hudCtx.fillStyle = glow;
    hudCtx.fillRect(x-radius,y-radius,radius*2,radius*2);
    for (let i=0;i<22;i++) {
      const angle = i*2.39996;
      const r = (18 + (i%6)*13)*t;
      const px = x+Math.cos(angle)*r;
      const py = y+Math.sin(angle)*r-45*t+10*t*t;
      hudCtx.fillStyle = water ? '#e3f9ff' : i%3 ? '#feb56b' : '#49373d';
      hudCtx.beginPath();
      hudCtx.arc(px,py,1.4+(i%3)*(1+t),0,2*Math.PI);
      hudCtx.fill();
    }
    hudCtx.restore();
  }

  function checkRenderedFrame(){
    let dark=true,white=true;
    for(const [x,y] of [[.20,.24],[.78,.24],[.50,.49],[.21,.76],[.80,.76]]){
      gl.readPixels(Math.floor(x*fboW),Math.floor(y*fboH),1,1,gl.RGBA,gl.UNSIGNED_BYTE,frameSample);
      const [red,green,blue]=frameSample;
      dark &&= Math.max(red,green,blue)<=4;
      white &&= Math.min(red,green,blue)>=249;
    }
    return !gl.isContextLost()&&gl.getError()===gl.NO_ERROR&&!dark&&!white;
  }

  function loop(now) {
    if (!flying) return;
    if(selectedMap===FLIGHT_MAPS.manhattan && window.PatrolNYCosmos?.isActive?.()){
      lastTime=now;
      flightFrame=requestAnimationFrame(loop);
      return;
    }
    if (gl.isContextLost())return;
    // Start the clock on the first animation frame. Its timestamp may predate terrain setup.
    const rawDt = lastTime === null ? 0 : Math.max(0, (now - lastTime) * 0.001);
    lastTime = now;
    const dt = Math.min(rawDt, 0.05);
    const time = now * 0.001;

    // Keep all scene effects and raise resolution only after stable frames.
    if (rawDt > 0 && !document.hidden && !frameCheckPending) {
      const limit = Math.min(scaleCeiling, directRendering ? 0.60 : 1);
      fastFrames = rawDt < 0.023 ? fastFrames + 1 : 0;
      slowFrames = rawDt > 0.040 ? slowFrames + 1 : 0;
      if (now - lastScaleAdjustment >= 1100 && slowFrames >= 6 && resScale > sceneScaleFloor()) {
        // A transient slow frame must not permanently lower the maximum graphics quality.
        // Let the fast-frame branch recover image resolution after conditions improve.
        resScale = Math.max(sceneScaleFloor(), resScale - 0.10);
        fastFrames = slowFrames = 0;
        lastScaleAdjustment = now;
        resizeTargets();
      } else if (now - lastScaleAdjustment >= 1100 && fastFrames >= 40 && resScale < limit) {
        resScale = Math.min(limit, resScale + 0.10);
        fastFrames = slowFrames = 0;
        lastScaleAdjustment = now;
        resizeTargets();
      }
    }

    sceneryTime += Math.min(rawDt, 0.12);
    if(scenicViewActive&&sceneryTime>=nextDcView){
      hotelTarget.selectedIndex=(hotelTarget.selectedIndex+1)%DC_SCENIC_VIEWS.length;
      nextDcView=sceneryTime+8;
      camInitialized=false;
      updateScenicView();
    }
    const environment=sampleFlightEnvironment(Math.min(rawDt,0.12));
    // Wet pavement dries gradually after rain ends.
    if(selectedMap.city){
      const targetWet=Math.min(1,Math.max(0,environment.precipitation[0]*0.94+
        environment.atmosphere[2]*0.08));
      const rate=targetWet>nyStreetWetness?0.8:0.035;
      nyStreetWetness+=(targetWet-nyStreetWetness)*(1-Math.exp(-rawDt*rate));
    }
    updateSphereStatus();
    refreshVehicleTargets();
    advanceWreckFragments(dt);
    // Low-FPS software / integrated GPUs must not make water taxi and
    // takeoff physics run many times slower than the clock. Keep each C185
    // collision step short, but catch up with bounded fixed substeps.
    // Other aircraft retain their original timing and handling unchanged.
    let flightStep;
    if(crash || scenicViewActive){
      flightStep={basis:getPlaneBasis(),boundaryAssist:false};
    }else if(selectedAircraft==='seaplane'){
      const physicalTime=Math.min(rawDt,.35);
      const steps=Math.max(1,Math.ceil(physicalTime/.045));
      for(let step=0;step<steps && !crash;step++)
        flightStep=advanceFlight(physicalTime/steps);
      flightStep ||= {basis:getPlaneBasis(),boundaryAssist:false};
    }else{
      flightStep=advanceFlight(dt);
    }
    const {basis,boundaryAssist}=flightStep;
    const orbitalCap=selectedMap===FLIGHT_MAPS.manhattan?NYC_ORBIT_CEILING:CEILING;
    if (!crash && !scenicViewActive && plane.pos[1]>=orbitalCap-0.15 && plane.vsi>0.5) {
      window.dispatchEvent(new Event('patrol:orbitLaunch'));
    }
    if (crash) {
      crash.startedAt ??= now;
      crash.age = (now-crash.startedAt)*0.001;
    }

    if(!scenicViewActive){
      // 2. Missiles, Reloading & Trails
      for (let i = 0; i < 4; i++) {
        if (hardpointTimers[i] > 0) {
          hardpointTimers[i] = Math.max(0, hardpointTimers[i] - dt);
          if (hardpointTimers[i] === 0) updateMissilePips();
        }
      }

      for (let i = activeMissiles.length - 1; i >= 0; i--) {
        const m = activeMissiles[i];
        m.life -= dt;
        if (m.cannon && m.life<=0) {
          activeMissiles.splice(i,1);
          continue;
        }
        const distance=m.speed*dt;
        const steps=Math.max(1,Math.ceil(distance/(m.cannon?0.38:0.7)));
        let bridgeHit=false;
        let structureHit=false;
        for(let step=0;step<steps;step++){
          for(let axis=0;axis<3;axis++)m.pos[axis]+=m.dir[axis]*distance/steps;
          const [x,y,z]=m.pos;
          if(selectedMap.city && (breakBridgeRail(x,y,z,0.34)||isBridgeCollision(x,y,z,0.30))){
            bridgeHit=true;
            break;
          }
          const vehicle=vehicleAt(x,y,z,0.18);
          if(vehicle && !vehicle.actor.wreck){
            damageVehicle(vehicle,m.pos,m.cannon?1:3);
            structureHit=true;
            break;
          }
          if(sphereTakesHit(x,y,z)){
            structureHit=true;
            break;
          }
          const lot=cityLotAt(x,z);
          if (lot && !lot[6] && y<=WATER_H+2.38+lot[4] && y>=WATER_H+2.38) {
            structureHit=true;
            damageCityBuilding(lot,m.pos,m.cannon);
            break;
          }
          if(y<=sampleGroundHeight(x,z))break;
        }

        trails.push({
          pos: [m.pos[0], m.pos[1], m.pos[2]],
          type: 'smoke',
          ember: true,
          alpha: 0.95,
          vy: 0.4
        });

        const [x,y,z]=m.pos;
        const gh = sampleGroundHeight(x,z);
        if (bridgeHit || structureHit || y <= gh || m.life <= 0) {
          const isWater = !bridgeHit && !structureHit && gh <= WATER_H + 0.05 ? 1 : 0;
          const hitPos = [x,bridgeHit||structureHit?y:gh,z];
          explosions.push({ pos: hitPos, age: 0, maxAge: 1.5, isWater: isWater > 0, structure: structureHit });
          playExplosionSound(isWater > 0);

          impacts[impactCursor] = { x: hitPos[0], y: hitPos[1], z: hitPos[2], age: 0, isWater };
          impactCursor = (impactCursor + 1) % 8;

          for (let s = 0; s < 10; s++) {
            trails.push({
              pos: [
                hitPos[0] + (Math.random() - 0.5) * 2.2,
                hitPos[1] + Math.random() * 1.4,
                hitPos[2] + (Math.random() - 0.5) * 2.2
              ],
              type: 'smoke',
              ember: !isWater && s < 4,
              alpha: 0.92,
              vy: 1.6 + Math.random() * 1.5
            });
          }
          activeMissiles.splice(i, 1);
        }
      }

      for (let i = 0; i < 8; i++) {
        if (impacts[i].age >= 0) {
          impacts[i].age += dt;
          if (impacts[i].age > 24.0) impacts[i].age = -1;
        }
      }

      for (let i = explosions.length - 1; i >= 0; i--) {
        explosions[i].age = explosions[i].crash ? crash.age : explosions[i].age + dt;
        if (explosions[i].age >= explosions[i].maxAge) explosions.splice(i, 1);
      }

      // Wingtip vapor trails
      trailAccum += dt;
      if (!crash && selectedAircraft!=='seaplane' && trailAccum >= 0.024) {
        trailAccum = 0;
        for (const side of [-1, 1]) {
          trails.push({
            pos: [
              plane.pos[0] + basis.right[0] * (side * 2.12) - basis.fwd[0] * 1.15,
              plane.pos[1] + basis.right[1] * (side * 2.12) - basis.fwd[1] * 1.15,
              plane.pos[2] + basis.right[2] * (side * 2.12) - basis.fwd[2] * 1.15
            ],
            type: 'vapor',
            ember: false,
            alpha: plane.afterburner ? 0.85 : 0.55,
            vy: 0
          });
        }
      }

      for (let i = trails.length - 1; i >= 0; i--) {
        const tr = trails[i];
        tr.alpha -= dt * (tr.type === 'vapor' ? 0.85 : 0.42);
        tr.pos[0] += (tr.vx || 0)*dt;
        tr.pos[1] += tr.vy * dt;
        tr.pos[2] += (tr.vz || 0)*dt;
        if (tr.alpha <= 0) trails.splice(i, 1);
      }
    }

    // 3. Smooth ~1.0s Camera Interpolation
    const targetCam = scenicViewActive ? getScenicCamera() : crash ? {
      eye: [plane.pos[0]-basis.fwd[0]*16,plane.pos[1]+7,plane.pos[2]-basis.fwd[2]*16],
      look: plane.pos, up:[0,1,0], fov:58
    } : computeTargetCamera(basis);
    if (!camInitialized || targetCam.attached) {
      camPos = [...targetCam.eye];
      camLook = [...targetCam.look];
      camUp = [...targetCam.up];
      camInitialized = true;
    } else {
      const camLerp = 1.0 - Math.exp(-dt * 4.2);
      for (let k = 0; k < 3; k++) {
        camPos[k] = lerp(camPos[k], targetCam.eye[k], camLerp);
        camLook[k] = lerp(camLook[k], targetCam.look[k], camLerp);
        camUp[k] = lerp(camUp[k], targetCam.up[k], camLerp);
      }
      camUp = v3Norm(camUp);
    }

    const aspect = fboW / fboH;
    const fovRad = targetCam.fov * Math.PI / 180;
    const camFwd = v3Norm([camLook[0] - camPos[0], camLook[1] - camPos[1], camLook[2] - camPos[2]]);
    const camRight = v3Norm(v3Cross(camUp, camFwd));
    const camTrueUp = v3Cross(camFwd, camRight);

    const viewMat = mat4LookAt(camPos, camLook, camUp);
    const projMat = mat4Perspective(fovRad, aspect, 0.25, 880);
    const viewProj = mat4Mul(projMat, viewMat);

    // 4. Render World + 3D Aircraft into Low-Res FBO
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
    gl.viewport(0, 0, fboW, fboH);
    gl.clearColor(0,0,0,1);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);

    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.ALWAYS);
    gl.useProgram(worldProg);
    gl.uniform3fv(uWorld.sun,environment.sun);
    gl.uniform3fv(uWorld.moon,environment.moon);
    gl.uniform4fv(uWorld.atmosphere,environment.atmosphere);
    gl.uniform4fv(uWorld.climate,environment.climate);
    gl.uniformMatrix4fv(uWorld.viewProj, false, viewProj);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, terrainTex);
    gl.uniform1i(uWorld.terrain, 0);
    gl.uniform1f(uWorld.terrainScale,terrainScaleFor(selectedMap));
    const alaskaPhotoReady=Boolean(selectedMap.alaska&&alaskaPhotoTextures&&
      smoothScenery()&&!graphicsCompat&&!directRendering);
    gl.uniform1i(uWorld.alaskaPhotoReady,alaskaPhotoReady?1:0);
    if(alaskaPhotoReady){
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D,alaskaPhotoTextures.albedo);
      gl.uniform1i(uWorld.alaskaPhotoAlbedo,1);
      gl.activeTexture(gl.TEXTURE3);
      gl.bindTexture(gl.TEXTURE_2D,alaskaPhotoTextures.normalRough);
      gl.uniform1i(uWorld.alaskaPhotoNormalRough,3);
      gl.activeTexture(gl.TEXTURE0);
    }
    gl.uniform3fv(uWorld.camPos, camPos);
    gl.uniform3fv(uWorld.camFwd, camFwd);
    gl.uniform3fv(uWorld.camRight, camRight);
    gl.uniform3fv(uWorld.camUp, camTrueUp);
    gl.uniform1f(uWorld.fovTan, Math.tan(fovRad * 0.5));
    gl.uniform1f(uWorld.aspect, aspect);
    gl.uniform1f(uWorld.time, time);
    gl.uniform3fv(uWorld.planePos, plane.pos);
    gl.uniform1f(uWorld.planeAlt, plane.radarAlt);

    for (let i = 0; i < 8; i++) {
      impactUniforms[i * 4 + 0] = impacts[i].x;
      impactUniforms[i * 4 + 1] = impacts[i].y;
      impactUniforms[i * 4 + 2] = impacts[i].z;
      impactUniforms[i * 4 + 3] = impacts[i].age;
      impactTypeUniforms[i * 4 + 0] = impacts[i].isWater;
    }
    updateBoatWakes();
    gl.uniform4fv(uWorld.boatWakes, boatWakes);
    gl.uniform4fv(uWorld.boatLength,boatLengths);
    gl.uniform4fv(uWorld.impacts, impactUniforms);
    gl.uniform4fv(uWorld.impactType, impactTypeUniforms);

    gl.bindVertexArray(quadVao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // Render 3D Aircraft & Missiles (in Chase & Top-Down views)
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LESS);
    gl.useProgram(meshProg);
    gl.uniform1i(uMesh.scenarioDiffuse,10);
    gl.uniform1i(uMesh.dcMaps,2);
    gl.uniform1i(uMesh.dcSurface,-1);
    gl.uniform1i(uMesh.alaskaMesh,Boolean(selectedMap.alaska));
    gl.uniform1i(uMesh.alaskaPhotoReady,alaskaPhotoReady?1:0);
    if(alaskaPhotoReady){
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D,alaskaPhotoTextures.albedo);
      gl.uniform1i(uMesh.alaskaPhotoAlbedo,1);
      gl.activeTexture(gl.TEXTURE3);
      gl.bindTexture(gl.TEXTURE_2D,alaskaPhotoTextures.normalRough);
      gl.uniform1i(uMesh.alaskaPhotoNormalRough,3);
      gl.activeTexture(gl.TEXTURE0);
    }
    gl.uniform2f(uMesh.surfaceWeather,environment.climate[2],environment.climate[3]);
    gl.uniform3fv(uMesh.sun,environment.sun);
    gl.uniform4fv(uMesh.atmosphere,environment.atmosphere);
    // The east-right flight projection reverses screen-space triangle winding.
    gl.frontFace(gl.CW);
    gl.uniformMatrix4fv(uMesh.viewProj, false, viewProj);
    gl.uniform1i(uMesh.smooth, smoothScenery());
    gl.uniform3fv(uMesh.eye, camPos);
    gl.uniform1i(uMesh.waterfall,0);
    gl.uniform1i(uMesh.twilight,Boolean(selectedMap.vegas));
    gl.uniform1i(uMesh.manhattan,Boolean(selectedMap.city));
    gl.uniform1f(uMesh.sceneTime,sceneryTime);
    gl.uniform1f(uMesh.nyStreetWetness, selectedMap.city ? nyStreetWetness : 0);
    gl.uniform1f(uMesh.nyStreetQuality,
      selectedMap.city && !graphicsCompat ? Number(nyStreetQuality.value) : 0);
    const nycPhotos=nycRealismAssets?.photos;
    const usePhoto=Boolean(selectedMap.city && smoothScenery() && !graphicsCompat &&
      !directRendering && nycPhotos && Number(nyStreetQuality.value)>0);
    gl.uniform1f(uMesh.nyPhotoReady,usePhoto?1:0);
    gl.uniform1i(uMesh.nySurfaceClass,0);
    gl.uniform1f(uMesh.nyLedReady,0);
    if(usePhoto){
      gl.activeTexture(gl.TEXTURE3);
      gl.bindTexture(gl.TEXTURE_2D,nycPhotos.asphalt);
      gl.uniform1i(uMesh.nyAsphaltPhoto,3);
      gl.activeTexture(gl.TEXTURE4);
      gl.bindTexture(gl.TEXTURE_2D,nycPhotos.concrete);
      gl.uniform1i(uMesh.nyConcretePhoto,4);
      // Real CC0 stone wall, asphalt bump and roughness maps, only in NYC.
      for(const [unit,tex,location] of [
        [5,nycPhotos.wallDiffuse,uMesh.nyWallDiffuse],
        [6,nycPhotos.wallNormal,uMesh.nyWallNormal],
        [7,nycPhotos.wallARM,uMesh.nyWallARM],
        [8,nycPhotos.asphaltNormal,uMesh.nyAsphaltNormal],
        [9,nycPhotos.asphaltARM,uMesh.nyAsphaltARM]
      ]){
        gl.activeTexture(gl.TEXTURE0+unit);
        gl.bindTexture(gl.TEXTURE_2D,tex);
        gl.uniform1i(location,unit);
      }
      gl.activeTexture(gl.TEXTURE0);
    }

    function drawMeshWithOutline(mesh,modelMat,emissive=false,cityFacade=false,outlined=true) {
      const hasBlenderDiffuse=Boolean(selectedMap.city && mesh.texture);
      gl.uniform1f(uMesh.scenarioDiffuseReady,hasBlenderDiffuse?1:0);
      if(hasBlenderDiffuse){
        gl.activeTexture(gl.TEXTURE10);
        gl.bindTexture(gl.TEXTURE_2D,mesh.texture);
        gl.activeTexture(gl.TEXTURE0);
      }
      gl.uniform1i(uMesh.cityFacade, cityFacade);
      gl.bindVertexArray(mesh.vao);
      gl.uniformMatrix4fv(uMesh.model, false, modelMat);
      if (outlined && !emissive && !smoothScenery()) {
        // Inverted-hull 1px dark outline
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.FRONT);
        gl.uniform1f(uMesh.outline, 0.045);
        gl.uniform1f(uMesh.isOutline, 1.0);
        gl.uniform1f(uMesh.emissive, 0.0);
        gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
        gl.cullFace(gl.BACK);
      }
      gl.disable(gl.CULL_FACE);
      gl.uniform1f(uMesh.outline, 0.0);
      gl.uniform1f(uMesh.isOutline, 0.0);
      gl.uniform1f(uMesh.emissive, emissive ? 1.0 : 0.0);
      gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
    }

    refreshDestroyedCity();
    if (backgroundBuildings || landscapeDetails) {
      const identity = mat4FromBasis([0,0,0],[1,0,0],[0,1,0],[0,0,1],1);
      if (backgroundBuildings) drawMeshWithOutline(backgroundBuildings,identity,false,true);
      if (landscapeDetails) drawMeshWithOutline(landscapeDetails,identity);

        plane.pos[0],plane.pos[2],basis.fwd,basis.right);

    drawSkylineRescue(drawMeshWithOutline);
    drawSeagulls(drawMeshWithOutline);
    drawCityTraffic(drawMeshWithOutline);
    drawWreckFragments(drawMeshWithOutline);

    if (!scenicViewActive && !crash && viewIdx !== 1 &&
        !(harborArtInspection&&selectedMap.alaska)) {
      const planeScale = viewIdx === 2 ? 1.45 : 1.0;
      const planeModel = mat4FromBasis(plane.pos, basis.right, basis.up, basis.fwd, planeScale);
      drawMeshWithOutline(aircraftMeshes[selectedAircraft], planeModel, false);

      if (selectedAircraft === "fighter") {

})();
