  function prepareSphereShow() {
    disposeSceneMesh(sphereMesh);
    sphereMesh=null;
    sphereCenter=null;
    sphereImpact=null;
    sphereShowControl.hidden=!selectedMap.vegas;
    if(!selectedMap.vegas)return;
    const {x,z}=VEGAS_SITES.sphere;
    const y=sampleTerrainHeight(x,z)+sphereRadius+0.5;
    sphereCenter=[x,y,z];
    const {addQuad,upload}=createTriangleMesh();
    const vertex=(row,side)=>{
      const lon=side*2*Math.PI/80, lat=-Math.PI/2+row*Math.PI/40;
      return [x+Math.sin(lon)*Math.cos(lat)*sphereRadius,y+Math.sin(lat)*sphereRadius,
        z+Math.cos(lon)*Math.cos(lat)*sphereRadius];
    };
    for(let row=0;row<40;row++)for(let side=0;side<80;side++){
      addQuad(vertex(row,side),vertex(row,side+1),vertex(row+1,side+1),
        vertex(row+1,side),[0.25,0.46,0.67]);
    }
    sphereMesh=upload();
    if(!earthPhoto){
      earthPhoto=gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,earthPhoto);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([31,65,113,255]));
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      loadEarthImage(offlineEarthPhoto).then(img=>{
        if(earthPhotoState!=='live')uploadEarthImage(img);
      }).catch(()=>{});
    }
    refreshSpherePhoto();
  }

  function loadEarthImage(url) {
    return new Promise((resolve,reject)=>{
      const image=new Image();
      if(!url.startsWith('data:'))image.crossOrigin='anonymous';
      image.onload=()=>resolve(image);
      image.onerror=()=>reject(new Error('Sphere image unavailable'));
      image.src=url;
    });
  }

  function uploadEarthImage(image) {
    const scaled=document.createElement('canvas');
    scaled.width=scaled.height=512;
    scaled.getContext('2d').drawImage(image,0,0,512,512);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,earthPhoto);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    try {
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,scaled);
    } finally {
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    }
  }

  async function refreshSpherePhoto() {
    if(!selectedMap.vegas || earthRefreshPending || Date.now()<nextEarthRefresh)return;
    earthRefreshPending=true;
    nextEarthRefresh=Date.now()+180000;
    try {
      const response=await fetch('https://epic.gsfc.nasa.gov/api/natural',{signal:AbortSignal.timeout(8000)});
      if(!response.ok)throw new Error('EPIC request failed');
      const photos=await response.json();
      const latest=Array.isArray(photos)?photos.reduce((newest,photo)=>
        typeof photo?.date==='string' && (!newest || photo.date>newest.date)?photo:newest,null):null;
      if(!latest || !/^epic_[a-z0-9]+_\d{8,18}$/i.test(latest.image) ||
        !/^\d{4}-\d{2}-\d{2} /.test(latest.date))throw new Error('Invalid EPIC metadata');
      const date=latest.date.slice(0,10).replaceAll('-','/');
      const url='https://api.nasa.gov/EPIC/archive/natural/'+date+'/jpg/'+latest.image+'.jpg?api_key=DEMO_KEY';
      const imageResponse=await fetch(url,{signal:AbortSignal.timeout(10000)});
      if(!imageResponse.ok)throw new Error('EPIC image request failed');
      const blob=await imageResponse.blob();
      if(!blob.type.startsWith('image/') || blob.size>5000000)throw new Error('Invalid EPIC image');
      const bitmap=await createImageBitmap(blob);
      try {
        uploadEarthImage(bitmap);
      } finally {
        bitmap.close();
      }
      earthPhotoState='live';
      nextEarthRefresh=Date.now()+900000;
    } catch {
      // The packaged EPIC image and original animations remain available offline.
    } finally {
      earthRefreshPending=false;
    }
  }

  function updateSphereStatus() {
    if(!selectedMap.vegas)return;

    if(sphereStatus.textContent!==text)sphereStatus.textContent=text;

  function sphereTakesHit(x,y,z) {
    if(!sphereCenter)return false;

    if(Math.hypot(...delta)>sphereRadius+0.22)return false;

  const missileMesh = buildConeMesh(0.65, 0.065, [0.88, 0.24, 0.24], [0.85, 0.85, 0.88]);
  const plumeOuterMesh = buildConeMesh(1.3, 0.14, [0.98, 0.58, 0.18], [0.95, 0.35, 0.15]);

  // Dynamically scaled scene framebuffer. The HUD has a separate logical size.
  let resScale = 1.0;
  let fboW, fboH, hudW, hudH;
  let sceneFbo = null, sceneTex = null, sceneDepth = null;

  const smoothScenery = () => Boolean(selectedMap.city || selectedMap.alaska || selectedMap.vegas);

  function resizeTargets() {
    const viewWidth = Math.max(1, window.innerWidth);
    const viewHeight = Math.max(1, window.innerHeight);
    const aspect = viewWidth / viewHeight;
    const density = Math.min(window.devicePixelRatio || 1, 1.5);
    const targetHeight = smoothScenery()
      ? Math.min(viewHeight * density, 1080, 1920 / aspect)
      : Math.min(Math.max(viewHeight, 320), 540, 1200 / aspect);
    fboH = Math.max(1, Math.round(targetHeight * resScale));
    fboW = Math.max(1, Math.round(targetHeight * resScale * aspect));

    glCanvas.width = fboW;
    glCanvas.height = fboH;
    hudCanvas.width = Math.round(viewWidth * density);
    hudCanvas.height = Math.round(viewHeight * density);
    hudH = smoothScenery() ? Math.min(viewHeight, 720) : 340;
    hudW = Math.max(1, hudH * aspect);
    hudCtx.setTransform(hudCanvas.width/hudW,0,0,hudCanvas.height/hudH,0,0);

    if (sceneTex) gl.deleteTexture(sceneTex);
    if (sceneDepth) gl.deleteRenderbuffer(sceneDepth);
    if (sceneFbo) gl.deleteFramebuffer(sceneFbo);

    sceneTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, fboW, fboH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const filter = smoothScenery() ? gl.LINEAR : gl.NEAREST;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    sceneDepth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, sceneDepth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, fboW, fboH);

    sceneFbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, sceneDepth);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  resizeTargets();
  window.addEventListener('resize', resizeTargets);

  // Math Helpers
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function v3Cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }
  function v3Norm(a) {
    const l = Math.hypot(a[0], a[1], a[2]) || 1;
    return [a[0] / l, a[1] / l, a[2] / l];
  }
  function mat4Perspective(fovRad, aspect, near, far) {
    const f = 1.0 / Math.tan(fovRad * 0.5);
    const nf = 1.0 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, 2 * far * near * nf, 0
    ]);
  }
  function mat4LookAt(eye, center, up) {
    const f = v3Norm([center[0] - eye[0], center[1] - eye[1], center[2] - eye[2]]);
    // The flight map is east-right (+X), north-up (+Z), and +Y is altitude.
    const r = v3Norm(v3Cross(up, f));
    const u = v3Cross(f, r);
    return new Float32Array([
      r[0], u[0], -f[0], 0,
      r[1], u[1], -f[1], 0,
      r[2], u[2], -f[2], 0,
      -(r[0] * eye[0] + r[1] * eye[1] + r[2] * eye[2]),
      -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]),
      (f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2]),
      1
    ]);
  }
  function mat4Mul(a, b) {
    const out = new Float32Array(16);
    for (let c = 0; c < 4; c++) {
      for (let r = 0; r < 4; r++) {
        out[c * 4 + r] =
          a[0 * 4 + r] * b[c * 4 + 0] +
          a[1 * 4 + r] * b[c * 4 + 1] +
          a[2 * 4 + r] * b[c * 4 + 2] +
          a[3 * 4 + r] * b[c * 4 + 3];
      }
    }
    return out;
  }
  function mat4FromBasis(pos, right, up, fwd, scale = 1) {
    return new Float32Array([
      right[0] * scale, right[1] * scale, right[2] * scale, 0,
      up[0] * scale,    up[1] * scale,    up[2] * scale,    0,
      fwd[0] * scale,   fwd[1] * scale,   fwd[2] * scale,   0,
      pos[0],           pos[1],           pos[2],           1
    ]);
  }

  // Terrain Height Query on CPU (matches shader exactly)
  const WATER_H = 12.2;
  const TERRAIN_SCALE = 54.0;
  const terrainScaleFor = map => map.alaska ? 75 : map.vegas ? 68 : TERRAIN_SCALE;

  function sampleTerrainHeight(x,z) {
    const field=cityGroundField || heightField;
    if (!field) return WATER_H;
    const last = MAP_SIZE - 1;
    const fx = clamp((x / MAP_SPAN + 0.5) * MAP_SIZE - 0.5, 0, last);
    const fy = clamp((z / MAP_SPAN + 0.5) * MAP_SIZE - 0.5, 0, last);
    const ix = Math.floor(fx);
    const iy = Math.floor(fy);
    const tx = fx - ix;
    const ty = fy - iy;
    const ix1 = Math.min(ix + 1, last);
    const iy1 = Math.min(iy + 1, last);
    const h00 = field[iy * MAP_SIZE + ix];
    const h10 = field[iy * MAP_SIZE + ix1];
    const h01 = field[iy1 * MAP_SIZE + ix];
    const h11 = field[iy1 * MAP_SIZE + ix1];
    const h = lerp(lerp(h00, h10, tx), lerp(h01, h11, tx), ty) * terrainScaleFor(selectedMap);
    return Math.max(h, WATER_H);
  }

  function sampleGroundHeight(x,z) {
    const terrain=sampleTerrainHeight(x,z);
    const lot=cityLotAt(x,z);
    return lot ? Math.max(terrain,WATER_H+2.38+(lot[6]?1.75:lot[4])) : terrain;
  }

  function navigationSurface(x, z) {
    const ground = sampleGroundHeight(x, z);
    const scenery=sceneryObstacle(x,z);
    if(scenery)return Math.max(ground,scenery.top);
    if (selectedMap.alaska) {
      const object=alaskaObstacles.find(o=>Math.abs(x-o.x)<o.halfX && Math.abs(z-o.z)<o.halfZ);
      return object ? Math.max(ground,object.top) : ground;
    }
    if (!selectedMap.city) return ground;
    for (const mark of NEW_YORK_LANDMARKS) {
      if (Math.abs(x - mark.x) <= mark.w && Math.abs(z - mark.z) <= mark.d) {
        return Math.max(ground, sampleGroundHeight(mark.x, mark.z) + mark.top);
      }
    }
    return ground;
  }

  // Web Audio Synthesizer (Muted by default)
  let audioCtx = null;
  let audioEnabled = false;
  let engineGain = null, abGain = null, engineFilter = null;

  function initAudio() {
    if (audioCtx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = new Ctx();

    // Brown/Pink noise buffer for jet engine & afterburner roar
    const bufLen = audioCtx.sampleRate * 2;
    const noiseBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    let lastOut = 0;
    for (let i = 0; i < bufLen; i++) {
      const white = Math.random() * 2 - 1;
      data[i] = (lastOut + 0.04 * white) / 1.04;
      lastOut = data[i];
      data[i] *= 2.5;
    }

    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;

    engineFilter = audioCtx.createBiquadFilter();
    engineFilter.type = 'lowpass';
    engineFilter.frequency.value = 180;

    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0.0;

    src.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    src.start();

    // Afterburner rumble oscillator
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = 54;
    const abFilt = audioCtx.createBiquadFilter();
    abFilt.type = 'lowpass';
    abFilt.frequency.value = 140;
    abGain = audioCtx.createGain();
    abGain.gain.value = 0.0;
    osc.connect(abFilt);
    abFilt.connect(abGain);
    abGain.connect(audioCtx.destination);
    osc.start();
  }

  function playMissileSound() {
    if (!audioEnabled || !audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(620, now);
    osc.frequency.exponentialRampToValueAtTime(110, now + 0.35);
    g.gain.setValueAtTime(0.18, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.4);
  }

  function playExplosionSound(isWater) {
    if (!audioEnabled || !audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = isWater ? 'sine' : 'sawtooth';
    osc.frequency.setValueAtTime(isWater ? 150 : 95, now);
    osc.frequency.exponentialRampToValueAtTime(28, now + 0.65);
    g.gain.setValueAtTime(0.28, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.72);
  }

  audioBtn.addEventListener('click', (e) => {
    e.stopPropagation();

  // Aircraft & Game State
  const VIEWS = ['CHASE', 'COCKPIT', 'TOP-DOWN'];

  function openFlightMenu() {

    if (!flying || crash || selectedAircraft !== 'fighter' || sceneryTime<cannonReadyAt) return;

    const {fwd}=getPlaneBasis();

  function fireMissile() {
    if (!flying || crash || selectedAircraft !== "fighter") return;
    // Pick next loaded hardpoint
    let slot = -1;
    for (let i = 0; i < 4; i++) {
      if (hardpointTimers[i] <= 0) { slot = i; break; }

    if (slot === -1) return;

    const basis = getPlaneBasis();
    const hp = HARDPOINTS[slot];
    const startPos = [
      plane.pos[0] + basis.right[0] * hp[0] + basis.up[0] * hp[1] + basis.fwd[0] * hp[2],

  // Input Handling (Mouse + Keyboard + Touch; Left & Right buttons work independently)
  const mouseNorm = { x: 0, y: 0 };

    if (!flying || crash || mapPanel.contains(e.target) || e.target.closest("#statusBar, #touchControls")) return;

  window.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Escape' && (flying || crash)) {

    if (!flying || crash || e.target===spherePattern) return;
    if (steeringCodes.has(e.code)) {
      e.preventDefault();

      cycleSpherePattern();
    } else if (e.code === 'Space' && e.target !== mapToggle) {
      e.preventDefault();

    } else if (e.code === 'KeyG' && !e.repeat) {
      toggleGear();

      brakes=true;
    } else if (e.code === 'KeyC') {
      fireCannon();
    } else if ((e.code === 'KeyF' || e.code === 'KeyM') && !e.repeat) {
      fireMissile();
    } else if (e.code === 'KeyR') {
      triggerRoll();
    } else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
      plane.afterburner = true;
    }
  });

  window.addEventListener('keyup', (e) => {
    if(e.code==='KeyB') {

      if (flying) renderGearStatus();

    steeringKeys.delete(e.code);
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
      if (!leftDown) plane.afterburner = false;

  window.addEventListener('blur', () => {
    brakes=false;
    steeringKeys.clear();
    leftDown = false;

  // Touch Controls
  const joyZone = document.getElementById('joyZone');
  const joyKnob = document.getElementById('joyKnob');
  let joyTouchId = null;

  joyZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (!flying) return;
    const t = e.changedTouches[0];
    joyTouchId = t.identifier;
    updateJoy(t);
  }, { passive: false });

  joyZone.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === joyTouchId) updateJoy(t);
    }
  }, { passive: false });

  joyZone.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyTouchId) {
        joyTouchId = null;
        mouseNorm.x = 0;
        mouseNorm.y = 0;
        joyKnob.style.transform = 'translate(0px, 0px)';
      }
    }
  });

  function updateJoy(t) {
    const rect = joyZone.getBoundingClientRect();
    const cx = rect.left + rect.width * 0.5;
    const cy = rect.top + rect.height * 0.5;
    const maxR = rect.width * 0.42;
    const dx = clamp((t.clientX - cx) / maxR, -1, 1);
    const dy = clamp((t.clientY - cy) / maxR, -1, 1);
    mouseNorm.x = dx;
    mouseNorm.y = dy;
    joyKnob.style.transform = `translate(${dx * maxR * 0.7}px, ${dy * maxR * 0.7}px)`;
  }

  document.getElementById('btnCam').addEventListener('touchstart', (e) => { e.preventDefault(); cycleView(); }, { passive: false });
  document.getElementById('btnGear').addEventListener('click',toggleGear);
  const btnBrake=document.getElementById('btnBrake');
  btnBrake.addEventListener('pointerdown',event=>{
    if(!flying || crash || selectedAircraft!=='fighter')return;
    btnBrake.setPointerCapture(event.pointerId);
    brakes=true;
  });
  for(const event of ['pointerup','pointercancel','lostpointercapture']){
    btnBrake.addEventListener(event,()=>{brakes=false;});
  }
  document.getElementById('btnCannon').addEventListener('touchstart', (e)=>{e.preventDefault();fireCannon();},{passive:false});
  document.getElementById('btnFire').addEventListener('touchstart', (e) => { e.preventDefault(); fireMissile(); }, { passive: false });
  document.getElementById('btnRoll').addEventListener('touchstart', (e) => { e.preventDefault(); triggerRoll(); }, { passive: false });
  const btnBoost = document.getElementById('btnBoost');
  btnBoost.addEventListener('touchstart', (e) => { e.preventDefault(); if (!flying) return; plane.afterburner = true; btnBoost.classList.add('active'); }, { passive: false });
  btnBoost.addEventListener('touchend', (e) => { e.preventDefault(); plane.afterburner = false; btnBoost.classList.remove('active'); }, { passive: false });

  function getPlaneBasis() {
    const cy = Math.cos(plane.yaw), sy = Math.sin(plane.yaw);
    const cp = Math.cos(plane.pitch), sp = Math.sin(plane.pitch);
    const fwd = [sy * cp, sp, cy * cp];
    const worldUp = [0, 1, 0];
    let right = v3Norm(v3Cross(worldUp, fwd));
    let up = v3Cross(fwd, right);

    const totalRoll = plane.bank + (plane.rollAnim > 0 ? plane.rollAnim * Math.PI * 2 * plane.rollDir : 0);
    const cr = Math.cos(totalRoll), sr = Math.sin(totalRoll);
    const rRolled = [
      right[0] * cr + up[0] * sr,
      right[1] * cr + up[1] * sr,
      right[2] * cr + up[2] * sr
    ];
    const uRolled = [
      up[0] * cr - right[0] * sr,
      up[1] * cr - right[1] * sr,
      up[2] * cr - right[2] * sr
    ];
    return { fwd, right: rRolled, up: uRolled };
  }

  // Camera State for Smooth ~1.0s Transitions
  let camPos = [210, 36, 198];
  let camLook = [210, 34, 220];
  let camUp = [0, 1, 0];
  let camInitialized = false;

  function computeTargetCamera(basis) {
    const p = plane.pos;
    if (viewIdx === 0) {
      // CHASE
      const eye = [
        p[0] - basis.fwd[0] * 8.2 + basis.up[0] * 1.95,
        p[1] - basis.fwd[1] * 8.2 + basis.up[1] * 1.95 + 0.55,
        p[2] - basis.fwd[2] * 8.2 + basis.up[2] * 1.95
      ];
      const look = [
        p[0] + basis.fwd[0] * 18.0,
        p[1] + basis.fwd[1] * 18.0 + 0.4,
        p[2] + basis.fwd[2] * 18.0
      ];
      const up = v3Norm([basis.up[0] * 0.35, 1.0, basis.up[2] * 0.35]);
      return { eye, look, up, fov: 58 };
    } else if (viewIdx === 1) {
      // COCKPIT
      const eye = [
        p[0] + basis.fwd[0] * 0.72 + basis.up[0] * 0.42,
        p[1] + basis.fwd[1] * 0.72 + basis.up[1] * 0.42,
        p[2] + basis.fwd[2] * 0.72 + basis.up[2] * 0.42
      ];
      const look = [
        eye[0] + basis.fwd[0] * 30.0,
        eye[1] + basis.fwd[1] * 30.0,
        eye[2] + basis.fwd[2] * 30.0
      ];
      return { eye, look, up: basis.up, fov: 64 };
    } else {
      // TOP-DOWN (North-Up)
      const eye = [p[0], p[1] + 54.0, p[2]];
      const look = [p[0], p[1], p[2]];
      return { eye, look, up: [0, 0, 1], fov: 55 };
    }
  }

  // Canvas 2D Cockpit & HUD Renderer
  function drawHudAndCockpit(time, basis, viewProj) {
    const w = hudW;
    const h = hudH;
    hudCtx.clearRect(0, 0, w, h);

    // Project 3D world point to 2D pixel coords
    function project3D(pt) {
      const cx = viewProj[0] * pt[0] + viewProj[4] * pt[1] + viewProj[8] * pt[2] + viewProj[12];
      const cy = viewProj[1] * pt[0] + viewProj[5] * pt[1] + viewProj[9] * pt[2] + viewProj[13];
      const cw = viewProj[3] * pt[0] + viewProj[7] * pt[1] + viewProj[11] * pt[2] + viewProj[15];
      if (cw <= 0.05) return null;
      return [(cx / cw * 0.5 + 0.5) * w, (1.0 - (cy / cw * 0.5 + 0.5)) * h];
    }

    const beacon = route[gateIndex];
    const projected = beacon && project3D(beacon);
    if (projected) {
      const [x, y] = projected;
      const radius = clamp(1300 / Math.max(1, Math.hypot(...beacon.map((v, i) => v - plane.pos[i]))), 8, 53);
      hudCtx.save();
      hudCtx.strokeStyle = '#ffdfa3';
      hudCtx.lineWidth = 2;
      hudCtx.setLineDash([4, 3]);
      hudCtx.beginPath();
      hudCtx.arc(x, y, radius, 0, 2 * Math.PI);
      hudCtx.stroke();
      if(tourStops.length && x>=35 && x<=w-35 && y>=24 && y<=h-25){
        hudCtx.setLineDash([]);
        hudCtx.textAlign='center';
        hudCtx.font='bold 12px system-ui,sans-serif';
        hudCtx.strokeStyle='#172b38';
        hudCtx.lineWidth=3;
        hudCtx.fillStyle='#fff0ce';
        const label=tourStops[gateIndex].name;
        hudCtx.strokeText(label,x,y-radius-6);
        hudCtx.fillText(label,x,y-radius-6);
      }
      hudCtx.restore();
    }

    // Draw Wingtip Vapor Trails
    hudCtx.fillStyle = 'rgba(247, 239, 242, 0.78)';
    for (const tr of trails) {
      const s = project3D(tr.pos);
      if (!s) continue;
      if (tr.type === 'vapor') {
        hudCtx.fillStyle = `rgba(247, 239, 242, ${tr.alpha.toFixed(2)})`;
        hudCtx.fillRect(Math.round(s[0]), Math.round(s[1]), 2, 2);
      } else if (tr.dust) {
        const size = 2.5 + (1-tr.alpha)*10;
        const cloud = hudCtx.createRadialGradient(s[0],s[1],0,s[0],s[1],size);
        cloud.addColorStop(0,'rgba(132,116,96,'+(tr.alpha*0.57)+')');
        cloud.addColorStop(1,'rgba(132,116,96,0)');
        hudCtx.fillStyle=cloud;
        hudCtx.fillRect(s[0]-size,s[1]-size,size*2,size*2);
      } else if (tr.type === 'smoke') {
        const sz = Math.max(2, Math.round((1.0 - tr.alpha) * 5 + 2));
        hudCtx.fillStyle = tr.ember
          ? `rgba(252, 196, 93, ${tr.alpha.toFixed(2)})`
          : `rgba(218, 200, 212, ${(tr.alpha * 0.75).toFixed(2)})`;
        hudCtx.fillRect(Math.round(s[0] - sz * 0.5), Math.round(s[1] - sz * 0.5), sz, sz);
      }
    }

    // Draw Explosions (Flash, Fireball, Expanding Shock Ring, Water Plume)
    for (const ex of explosions) {
      const s = project3D(ex.pos);
      if (!s) continue;
      const t = ex.age / ex.maxAge;
      const sx = Math.round(s[0]);
      const sy = Math.round(s[1]);

      if (ex.crash || ex.structure) {
        drawCrashBurst(sx, sy, t, ex.isWater);
        continue;
      }

      // Expanding shock ring
      if (t < 0.55) {
        const rad = Math.round(4 + t * 56);
        hudCtx.strokeStyle = ex.isWater ? 'rgba(247, 239, 242, 0.8)' : 'rgba(255, 220, 145, 0.85)';
        hudCtx.lineWidth = 1;
        hudCtx.beginPath();
        hudCtx.arc(sx, sy, rad, 0, Math.PI * 2);
        hudCtx.stroke();
      }

      if (ex.isWater) {
        // Water spray column
        const colH = Math.round(Math.sin(Math.min(1, t * 1.4) * Math.PI) * 28);
        const colW = Math.round(6 + t * 14);
        hudCtx.fillStyle = '#f7eff2';
        hudCtx.fillRect(sx - 3, sy - colH, 6, colH);
        hudCtx.fillStyle = '#94c9be';
        hudCtx.fillRect(sx - Math.floor(colW / 2), sy - Math.floor(colH * 0.55), colW, Math.floor(colH * 0.55));
      } else {
        // Flash & Fireball
        if (t < 0.14) {
          hudCtx.fillStyle = '#fff0d6';
          hudCtx.fillRect(sx - 12, sy - 12, 24, 24);
        }
        if (t < 0.75) {
          const r = Math.round((1.0 - t * 0.7) * 14);
          hudCtx.fillStyle = '#b84b2c';
          hudCtx.fillRect(sx - r, sy - r, r * 2, r * 2);
          hudCtx.fillStyle = '#f5983b';
          const r2 = Math.max(2, Math.floor(r * 0.65));
          hudCtx.fillRect(sx - r2, sy - r2, r2 * 2, r2 * 2);
        }
      }
    }

    if (crash) return;

    // Top-Down target reticle when steering
    if (viewIdx === 2) {
      const mx = Math.round(mouseClient.x * (w / window.innerWidth));
      const my = Math.round(mouseClient.y * (h / window.innerHeight));
      hudCtx.strokeStyle = 'rgba(255, 214, 153, 0.75)';
      hudCtx.strokeRect(mx - 5, my - 5, 10, 10);
    }

    // COCKPIT & HUD OVERLAY (Fades in cleanly in Cockpit view)
    if (viewIdx !== 1) return;

    const cx = Math.floor(w * 0.5);
    const cy = Math.floor(h * 0.44);

    // 1. HEAD-UP DISPLAY (HUD) — Pitch ladder aligned to true exterior horizon
    const hudCol = '#72ff9f';
    const hudDim = 'rgba(114, 255, 159, 0.42)';
    hudCtx.strokeStyle = hudCol;
    hudCtx.fillStyle = hudCol;
    hudCtx.font = '8px "Share Tech Mono", monospace';
    hudCtx.lineWidth = 1;

    // Velocity vector / gun cross
    hudCtx.strokeRect(cx - 2, cy - 2, 4, 4);
    hudCtx.beginPath();
    hudCtx.moveTo(cx - 10, cy); hudCtx.lineTo(cx - 4, cy);
    hudCtx.moveTo(cx + 4, cy); hudCtx.lineTo(cx + 10, cy);
    hudCtx.moveTo(cx, cy - 8); hudCtx.lineTo(cx, cy - 4);
    hudCtx.stroke();

    // True horizon + pitch ladder
    const totalRoll = plane.bank + (plane.rollAnim > 0 ? plane.rollAnim * Math.PI * 2 * plane.rollDir : 0);
    const fovRad = 64 * Math.PI / 180;
    const pxPerRad = (h * 0.5) / Math.tan(fovRad * 0.5);

    hudCtx.save();
    hudCtx.translate(cx, cy);
    hudCtx.rotate(-totalRoll);
    for (let deg = -30; deg <= 30; deg += 10) {
      const rad = deg * Math.PI / 180;
      const dy = (plane.pitch - rad) * pxPerRad;
      if (Math.abs(dy) > h * 0.34) continue;
      const halfW = deg === 0 ? 54 : 26;
      hudCtx.strokeStyle = deg === 0 ? hudCol : hudDim;
      hudCtx.beginPath();
      hudCtx.moveTo(-halfW, dy); hudCtx.lineTo(-12, dy);
      hudCtx.moveTo(12, dy); hudCtx.lineTo(halfW, dy);
      hudCtx.stroke();
      if (deg !== 0) {
        hudCtx.fillText(String(Math.abs(deg)), halfW + 3, dy + 3);
      }
    }
    hudCtx.restore();

    // Heading tape at top
    const hdgDeg = Math.round(((plane.yaw * 180 / Math.PI) % 360 + 360) % 360);
    hudCtx.strokeStyle = hudCol;
    hudCtx.beginPath();
    hudCtx.moveTo(cx - 55, 22); hudCtx.lineTo(cx + 55, 22);
    hudCtx.moveTo(cx, 22); hudCtx.lineTo(cx, 26);
    hudCtx.stroke();
    hudCtx.fillText(String(hdgDeg).padStart(3, '0') + '°', cx - 10, 18);

    // Left tape: Airspeed (KTS) & G-load
    const kts = Math.round(plane.speed * 18.5);
    hudCtx.strokeRect(cx - 115, cy - 10, 32, 13);
    hudCtx.fillText(String(kts), cx - 111, cy - 1);
    hudCtx.fillText('G ' + plane.gForce.toFixed(1), cx - 115, cy + 16);

    // Right tape: Altitude (FT) & Radar Altitude
    const altFt = Math.round(plane.pos[1] * 85);
    const radFt = Math.round(plane.radarAlt * 85);
    hudCtx.strokeRect(cx + 83, cy - 10, 36, 13);
    hudCtx.fillText(String(altFt), cx + 86, cy - 1);
    hudCtx.fillText('R ' + radFt, cx + 83, cy + 16);

    // Missile count & low-altitude pull-up warning on HUD
    const readyCount = hardpointTimers.filter(t => t <= 0).length;
    hudCtx.fillText('MSL ' + readyCount + '/4', cx - 115, cy + 28);
    if (plane.radarAlt < 4.5 && Math.floor(time * 8) % 2 === 0) {
      hudCtx.fillStyle = '#ff9838';
      hudCtx.fillText('PULL UP', cx - 18, cy + 26);
      hudCtx.fillStyle = hudCol;
    }

    // 2. HAND-DRAWN PIXEL COCKPIT INSTRUMENT DASHBOARD
    const dashTop = Math.floor(h * 0.66);
    const dashH = h - dashTop;

    // Canopy bow struts
    hudCtx.strokeStyle = '#141022';
    hudCtx.lineWidth = 4;
    hudCtx.beginPath();
    hudCtx.moveTo(0, Math.floor(h * 0.25));
    hudCtx.lineTo(Math.floor(w * 0.14), dashTop + 8);
    hudCtx.moveTo(w, Math.floor(h * 0.25));
    hudCtx.lineTo(Math.floor(w * 0.86), dashTop + 8);
    hudCtx.stroke();

    // Glare shield & main panel housing
    hudCtx.fillStyle = '#181426';
    hudCtx.fillRect(0, dashTop, w, dashH);
    hudCtx.fillStyle = '#262138';
    hudCtx.fillRect(10, dashTop + 3, w - 20, 4);
    hudCtx.fillStyle = '#100d1a';
    hudCtx.fillRect(14, dashTop + 8, w - 28, dashH - 8);

    // Helper for circular dial
    function drawDial(dx, dy, r, label, angleRad, valText) {
      hudCtx.fillStyle = '#0b0912';
      hudCtx.beginPath();
      hudCtx.arc(dx, dy, r, 0, Math.PI * 2);
      hudCtx.fill();
      hudCtx.strokeStyle = '#4c4466';
      hudCtx.lineWidth = 1;
      hudCtx.stroke();

      for (let t = 0; t < 12; t++) {
        const a = (t / 12) * Math.PI * 2;
        hudCtx.beginPath();
        hudCtx.moveTo(dx + Math.cos(a) * (r - 3), dy + Math.sin(a) * (r - 3));
        hudCtx.lineTo(dx + Math.cos(a) * (r - 1), dy + Math.sin(a) * (r - 1));
        hudCtx.stroke();
      }
      // Needle
      hudCtx.strokeStyle = '#ffd699';
      hudCtx.beginPath();
      hudCtx.moveTo(dx, dy);
      hudCtx.lineTo(dx + Math.cos(angleRad) * (r - 3), dy + Math.sin(angleRad) * (r - 3));
      hudCtx.stroke();

      hudCtx.fillStyle = '#9e8b99';
      hudCtx.fillText(label, dx - 9, dy - r + 8);
      if (valText) {
        hudCtx.fillStyle = '#f5983b';
        hudCtx.fillText(valText, dx - 11, dy + r - 3);
      }
    }

    const row1Y = dashTop + 26;
    const row2Y = dashTop + 62;

    // Airspeed Indicator (ASI)
    drawDial(cx - 118, row1Y, 17, 'ASI', (kts / 800) * Math.PI * 1.7 - Math.PI * 0.85, String(kts));

    // Artificial Horizon (ADI)
    const adiX = cx - 72, adiY = row1Y, adiR = 19;
    hudCtx.save();
    hudCtx.beginPath();
    hudCtx.arc(adiX, adiY, adiR, 0, Math.PI * 2);
    hudCtx.clip();
    hudCtx.translate(adiX, adiY);
    hudCtx.rotate(-totalRoll);
    const pShift = clamp(plane.pitch * 24, -14, 14);
    hudCtx.fillStyle = '#3d788f';
    hudCtx.fillRect(-24, -24, 48, 24 + pShift);
    hudCtx.fillStyle = '#70442c';
    hudCtx.fillRect(-24, pShift, 48, 24 - pShift);
    hudCtx.strokeStyle = '#fff0d6';
    hudCtx.beginPath();
    hudCtx.moveTo(-22, pShift); hudCtx.lineTo(22, pShift);
    hudCtx.stroke();
    hudCtx.restore();
    hudCtx.strokeStyle = '#f5983b';
    hudCtx.strokeRect(adiX - 5, adiY - 1, 10, 2);

    // Altimeter with numeric readout
    drawDial(cx - 26, row1Y, 17, 'ALT', (altFt / 4000) * Math.PI * 2 - Math.PI * 0.5, String(altFt));

    // Turn & Slip Coordinator
    const tsX = cx - 118, tsY = row2Y;
    drawDial(tsX, tsY, 15, 'TRN', clamp(mouseNorm.x * 0.9, -1, 1) - Math.PI * 0.5, '');
    hudCtx.fillStyle = '#262138';
    hudCtx.fillRect(tsX - 11, tsY + 6, 22, 4);
    hudCtx.fillStyle = '#fff0d6';
    hudCtx.fillRect(tsX - 2 + Math.round(clamp(mouseNorm.x * 6, -7, 7)), tsY + 6, 4, 4);

    // Heading Compass Rose
    drawDial(cx - 72, tsY, 16, 'HDG', plane.yaw - Math.PI * 0.5, String(hdgDeg).padStart(3, '0'));

    // Vertical Speed Indicator (VSI)
    drawDial(cx - 26, tsY, 15, 'VSI', clamp(plane.vsi * 0.14, -1.3, 1.3) + Math.PI, '');

    // Center Amber Ground-Mapping Terrain Radar Strip Sweep
    const radX = cx + 6, radY = dashTop + 11, radW = 68, radH = 62;
    hudCtx.fillStyle = '#120a04';
    hudCtx.fillRect(radX, radY, radW, radH);
    hudCtx.strokeStyle = '#8a4b14';
    hudCtx.strokeRect(radX, radY, radW, radH);

    // Sample live forward terrain elevation onto radar strip
    const sweepCol = Math.floor((time * 42) % radW);
    for (let rx = 0; rx < radW; rx += 2) {
      const scanDist = 8 + (rx / radW) * 140;
      const sx = plane.pos[0] + Math.sin(plane.yaw) * scanDist;
      const sz = plane.pos[2] + Math.cos(plane.yaw) * scanDist;
      const gh = sampleGroundHeight(sx, sz);
      const normH = clamp((gh - WATER_H) / 20.0, 0.0, 1.0);
      const barH = Math.max(2, Math.round(normH * (radH - 10)));
      const isSweep = Math.abs(rx - sweepCol) <= 2;
      hudCtx.fillStyle = isSweep ? '#ffd699' : (gh <= WATER_H + 0.05 ? '#3b1e08' : '#d9781e');
      hudCtx.fillRect(radX + rx, radY + radH - 2 - barH, 2, barH);
    }
    hudCtx.fillStyle = '#f5983b';
    hudCtx.fillText('GND RDR', radX + 4, radY + 9);

    // Engine Gauges (RPM / EGT vertical bars)
    const engX = cx + 82, engY = dashTop + 12;
    hudCtx.fillStyle = '#0d0a16';
    hudCtx.fillRect(engX, engY, 34, 42);
    hudCtx.strokeStyle = '#4c4466';
    hudCtx.strokeRect(engX, engY, 34, 42);
    const rpmFrac = plane.afterburner ? 1.0 : 0.72;
    const egtFrac = plane.afterburner ? 0.94 : 0.62;
    hudCtx.fillStyle = plane.afterburner ? '#ff6a33' : '#f5983b';
    hudCtx.fillRect(engX + 5, engY + 38 - Math.round(rpmFrac * 26), 8, Math.round(rpmFrac * 26));
    hudCtx.fillRect(engX + 20, engY + 38 - Math.round(egtFrac * 26), 8, Math.round(egtFrac * 26));
    hudCtx.fillStyle = '#9e8b99';
    hudCtx.fillText('RPM EGT', engX + 2, engY + 9);

    // Local Time Clock
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    hudCtx.fillStyle = '#0b0912';
    hudCtx.fillRect(engX, engY + 46, 34, 15);
    hudCtx.strokeStyle = '#4c4466';
    hudCtx.strokeRect(engX, engY + 46, 34, 15);
    hudCtx.fillStyle = '#ffd699';
    hudCtx.fillText(hh + ':' + mm, engX + 4, engY + 56);

    // Warning Annunciator Lights
    const warnX = cx + 122, warnY = dashTop + 12;
    const warns = [
      { txt: 'AB', active: plane.afterburner, col: '#ff8c38' },
      { txt: 'LOW', active: plane.radarAlt < 4.5, col: '#ff3b3b' },
      { txt: 'MSL', active: readyCount === 0, col: '#f5b83b' }
    ];
    warns.forEach((wn, idx) => {
      const wy = warnY + idx * 14;
      hudCtx.fillStyle = wn.active ? wn.col : '#1c172b';
      hudCtx.fillRect(warnX, wy, 24, 11);
      hudCtx.fillStyle = wn.active ? '#120a14' : '#574e6e';
      hudCtx.fillText(wn.txt, warnX + 3, wy + 8);
    });

    // Moving Throttle Lever on left console
    const thrX = 22, thrY = dashTop + 14, thrH = 54;
    hudCtx.fillStyle = '#0b0912';
    hudCtx.fillRect(thrX, thrY, 10, thrH);
    hudCtx.strokeStyle = '#4c4466';
    hudCtx.strokeRect(thrX, thrY, 10, thrH);
    const knobY = thrY + thrH - 8 - Math.round((plane.afterburner ? 1.0 : 0.52) * (thrH - 12));
    hudCtx.fillStyle = plane.afterburner ? '#f5983b' : '#a8b5c7';

  function paintTerrainMap(raster, map, getHeight, preview = false) {
    const mapWidth = raster.width;
    const mapScale = mapWidth / MAP_SPAN;
    const ctx = raster.getContext('2d');
    const pixels = ctx.createImageData(mapWidth, mapWidth);
    const { airfield, city, alaska, vegas } = map;
    for (let y = 0; y < mapWidth; y++) {
      for (let x = 0; x < mapWidth; x++) {
        const east = (x + 0.5 - mapWidth / 2) / mapScale;
        const north = (mapWidth / 2 - y - 0.5) / mapScale;
        const h = getHeight(east, north);
        const offset = (y * mapWidth + x) * 4;
        const band = Math.floor((h - WATER_H) / 4);
        const water = h <= WATER_H;
        if (vegas) {
          const ridge=clamp((h-19.2)/35,0,1);
          pixels.data[offset]=158+48*ridge;
          pixels.data[offset+1]=104+28*ridge;
          pixels.data[offset+2]=69+22*ridge;
        } else if (alaska && !water) {
          const snow = Math.min(1, Math.max(0,(h-WATER_H-12)/16));
          pixels.data[offset] = 66 + 154*snow;
          pixels.data[offset+1] = 101 + 128*snow;
          pixels.data[offset+2] = 86 + 153*snow;
        } else if (city && !water) {
          const localX = east - (city.tilt * north + city.offset);
          const park = Math.abs(localX) < city.parkHalfWidth && Math.abs(north - city.parkCenter) < city.parkHalfLength;
          pixels.data[offset] = park ? 74 : 99 + band * 12;
          pixels.data[offset + 1] = park ? 121 : 106 + band * 12;
          pixels.data[offset + 2] = park ? 69 : 116 + band * 11;
        } else if (airfield && !water) {
          pixels.data[offset] = 70 + band * 13;
          pixels.data[offset + 1] = 104 + band * 8;
          pixels.data[offset + 2] = 64 + band * 12;
        } else {
          pixels.data[offset] = water ? 31 : band < 1 ? 117 : 104 + band * 12;
          pixels.data[offset + 1] = water ? 53 : band < 1 ? 106 : 72 + band * 10;
          pixels.data[offset + 2] = water ? 80 : band < 1 ? 66 : 48 + band * 11;
        }
        pixels.data[offset + 3] = 255;
      }
    }
    ctx.putImageData(pixels, 0, 0);
    if (airfield) {
      const center = mapWidth / 2;
      ctx.fillStyle = '#e4ddcb';
      ctx.fillRect(center + (airfield.x - airfield.halfWidth) * mapScale,
        center - (airfield.z + airfield.halfLength) * mapScale,
        airfield.halfWidth * 2 * mapScale, airfield.halfLength * 2 * mapScale);
    }
    if (city) {
      const strip=city.runway;
      ctx.fillStyle='#e4ddcb';
      ctx.fillRect(mapWidth/2+(strip.x-strip.halfLength)*mapScale,
        mapWidth/2-(strip.z+strip.halfWidth)*mapScale,
        strip.halfLength*2*mapScale,strip.halfWidth*2*mapScale);
    }
    if(vegas){
      const center=mapWidth/2;
      ctx.fillStyle='#3c3b47';
      ctx.fillRect(center+(VEGAS_BOULEVARD-8)*mapScale,center-409*mapScale,16*mapScale,831*mapScale);
      ctx.fillRect(center+(VEGAS_PARADISE-6)*mapScale,center-348*mapScale,12*mapScale,716*mapScale);
      for(const {z} of VEGAS_CROSS_STREETS){
        ctx.fillRect(center-158*mapScale,center-(z+5)*mapScale,327*mapScale,10*mapScale);
      }
      const strip=vegas.airport;
      ctx.fillRect(center+(strip.x-strip.halfWidth)*mapScale,center-(strip.z+strip.halfLength)*mapScale,
        strip.halfWidth*2*mapScale,strip.halfLength*2*mapScale);
    }
    if (preview) return;
    ctx.fillStyle = '#0b1024a6';
    ctx.beginPath();
    ctx.rect(0, 0, mapWidth, mapWidth);
    ctx.arc(mapWidth / 2, mapWidth / 2, FLIGHT_RADIUS * mapScale, 0, 2 * Math.PI);
    ctx.fill('evenodd');
  }

  function loadMapPreviews() {
    const url = URL.createObjectURL(new Blob([workerSrc], { type: 'application/javascript' }));
    let worker;
    try {
      worker = new Worker(url);
    } catch {
      URL.revokeObjectURL(url);
      return;
    }
    const size = 160;
    const cards = Array.from(flightSetup.querySelectorAll('canvas[data-map]'));
    function stop() {
      worker.terminate();
      URL.revokeObjectURL(url);
    }
    worker.onerror = stop;
    worker.onmessageerror = stop;
    worker.onmessage = ({ data }) => {
      if (data.type !== 'preview') return;
      const card = cards.find(item => item.dataset.map === data.key);
      const toIndex = value => clamp(Math.floor((value / MAP_SPAN + 0.5) * size), 0, size-1);
      paintTerrainMap(card, FLIGHT_MAPS[data.key], (x,z) =>
        Math.max(WATER_H, data.height[toIndex(z)*size+toIndex(x)] * terrainScaleFor(FLIGHT_MAPS[data.key])), true);
      card.dataset.ready = 'true';
      if (cards.every(item => item.dataset.ready)) stop();
    };
    for (const { dataset: { map: key } } of cards) {
      worker.postMessage({ ...FLIGHT_MAPS[key], key, size, preview: true,
        span: MAP_SPAN, scale: terrainScaleFor(FLIGHT_MAPS[key]), water: WATER_H });
    }
  }

  function drawFlightMap(now, assisted) {
    if (now - lastMapFrame < 100) return;
    lastMapFrame = now;
    const center = mapWidth / 2;
    const edge = FLIGHT_RADIUS - Math.hypot(plane.pos[0], plane.pos[2]);
    const warning = edge < WARNING_DISTANCE;
    const status = assisted ? 'AUTO TURN' : warning ? 'EDGE AHEAD' : 'EDGE';
    const text = status + ' · ' + Math.max(0, Math.ceil(edge)) + ' u';
    if (boundaryStatus.textContent !== text) boundaryStatus.textContent = text;
    mapPanel.classList.toggle('warning', warning);
    mapPanel.classList.toggle('guarding', assisted);

    mapCtx.drawImage(mapRaster, 0, 0);
    mapCtx.strokeStyle = assisted ? '#ff795e' : '#ffd699';
    mapCtx.lineWidth = 4;
    mapCtx.setLineDash([10, 7]);
    mapCtx.beginPath();
    mapCtx.arc(center, center, FLIGHT_RADIUS * mapScale, 0, 2 * Math.PI);
    mapCtx.stroke();
    mapCtx.setLineDash([]);

    mapCtx.fillStyle = '#fff0d6';
    mapCtx.font = 'bold 26px monospace';
    mapCtx.textAlign = 'center';
    mapCtx.fillText('N', center, 29);

    if (mapPanel.classList.contains('expanded')) {
      mapCtx.font = 'bold 16px monospace';
      mapCtx.strokeStyle = '#211827';
      mapCtx.lineWidth = 4;
      for (const mark of [...selectedMap.landmarks,...(selectedMap.places||[]),...sceneryPlaces]) {
        const x = center + mark.x * mapScale;
        const y = center - mark.z * mapScale;
        const isPlace=selectedMap.places?.includes(mark)||sceneryPlaces.includes(mark);
        const labelY=y-(isPlace?12:0);
        if(isPlace){
          mapCtx.beginPath();mapCtx.arc(x,y,3.2,0,Math.PI*2);mapCtx.fill();
        }
        mapCtx.strokeText(mark.name,x,labelY);
        mapCtx.fillText(mark.name,x,labelY);
      }
    }

    const showTourRoute=tourStops.length && mapPanel.classList.contains('expanded');
    if (showTourRoute && gateIndex<route.length){
      mapCtx.strokeStyle='#f1ca83';
      mapCtx.lineWidth=2;
      mapCtx.setLineDash([5,5]);
      mapCtx.beginPath();
      mapCtx.moveTo(center+plane.pos[0]*mapScale,center-plane.pos[2]*mapScale);
      for(let i=gateIndex;i<route.length;i++){
        const [x,,z]=route[i];
        mapCtx.lineTo(center+x*mapScale,center-z*mapScale);
      }
      mapCtx.stroke();
      mapCtx.setLineDash([]);
    }

    for (let i = gateIndex; i < route.length; i++) {
      const [x, , z] = route[i];
      mapCtx.fillStyle = i === gateIndex ? '#fff0ae' : '#cfad79';
      mapCtx.beginPath();
      const dotX=center+x*mapScale,dotY=center-z*mapScale;
      mapCtx.arc(dotX,dotY,i===gateIndex?9:showTourRoute?7:5,0,2*Math.PI);
      mapCtx.fill();
      if(showTourRoute) {
        mapCtx.fillStyle='#211827';
        mapCtx.font='bold 10px system-ui,sans-serif';
        mapCtx.fillText(String(i+1),dotX,dotY+3.4);
      }
    }
    if (mapPanel.classList.contains('expanded')) {
      for (const boat of boats) {
        if (boat.wreck) continue;
        const [x,z] = sceneryPose(boat,sceneryTime);
        mapCtx.fillStyle = '#8de1f5';
        mapCtx.fillRect(center + x*mapScale-2,center - z*mapScale-3,4,6);
      }
      for (const animal of moose) {
        const [x,z] = sceneryPose(animal,sceneryTime);
        mapCtx.fillStyle = '#f4be78';
        mapCtx.fillRect(center+x*mapScale-1,center-z*mapScale-1,3,3);
      }
    }
    mapCtx.fillStyle = '#fff0d6';
    mapCtx.save();
    mapCtx.translate(center + plane.pos[0] * mapScale, center - plane.pos[2] * mapScale);
    mapCtx.rotate(plane.yaw);
    mapCtx.beginPath();
    mapCtx.moveTo(0, -17);
    mapCtx.lineTo(11, 12);
    mapCtx.lineTo(0, 7);
    mapCtx.lineTo(-11, 12);
    mapCtx.closePath();
    mapCtx.strokeStyle = '#171421';
    mapCtx.lineWidth = 4;
    mapCtx.fill();
    mapCtx.stroke();
    mapCtx.restore();
  }

  function tourGuidance(target) {
    const dx=target[0]-plane.pos[0],dy=target[1]-plane.pos[1],dz=target[2]-plane.pos[2];
    const heading=Math.atan2(dx,dz);
    const difference=Math.atan2(Math.sin(heading-plane.yaw),Math.cos(heading-plane.yaw));
    const turn=Math.round(Math.abs(difference)*180/Math.PI);
    const turnText=turn<=8?'STRAIGHT':(difference<0?'TURN LEFT ':'TURN RIGHT ')+turn+'°';
    const altitude=Math.round(Math.abs(dy));
    const altitudeText=altitude<=5?'HOLD ALT':(dy>0?'CLIMB ':'DESCEND ')+altitude+' u';
    return turnText+' · '+altitudeText;
  }

  function updateMission(dt) {
    const next=route[gateIndex];
    if (!next) return;
    flightSeconds+=dt;
    const distance=Math.hypot(next[0]-plane.pos[0],next[1]-plane.pos[1],next[2]-plane.pos[2]);
    if (dt>0 && distance<=(tourStops.length?24:15)) gateIndex++;
    const target=route[gateIndex];
    let status;
    if(tourStops.length){
      status=target
        ? (gateIndex+1)+' / '+route.length+' · '+tourStops[gateIndex].name+'\n'+
          Math.round(Math.hypot(target[0]-plane.pos[0],target[2]-plane.pos[2]))+' u · '+tourGuidance(target)
        : 'Scenic Tour complete · '+route.length+' / '+route.length;
    }else{
      status=target
        ? 'Checkpoint '+gateIndex+' / '+route.length+(dt>0?' · '+Math.round(Math.hypot(
          target[0]-plane.pos[0],target[1]-plane.pos[1],target[2]-plane.pos[2]))+' u':'')
        : 'Course complete · '+flightSeconds.toFixed(1)+' s';
    }
    if (missionStatus.textContent!==status) missionStatus.textContent=status;

  // Main Simulation & Render Loop
  let lastTime = performance.now();

  function routePose(route, phase) {
    return [
      route.x + Math.cos(phase)*route.rx,
      route.z + Math.sin(phase)*route.rz,
      Math.atan2(-Math.sin(phase)*route.rx, Math.cos(phase)*route.rz)
    ];
  }

  function setBoatPace(boat, phase, speed) {
    const lengths = [0];
    let prev = routePose(boat,0);
    const divisions = 96;
    for (let i=1;i<=divisions;i++) {
      const next = routePose(boat,i * Math.PI * 2 / divisions);
      lengths.push(lengths[i-1]+Math.hypot(next[0]-prev[0],next[1]-prev[1]));
      prev = next;
    }
    return { lengths, speed, start: lengths[Math.round(phase*divisions)] };
  }

  function prepareCoastalTraffic() {
    boats = [];
    moose = [];
    gulls = [];
    boatWakes.fill(0);
    sceneryTime = 0;
    const anchor=selectedMap.shipAnchor;
    if(!anchor)return;
    for (const [index, kind] of ['cruise','ferry','cargo','ferry'].entries()) {
      const size = SHIP_TYPES[kind];
      const preferred = { x: anchor[0] + (index%2)*185, z: anchor[1] + Math.floor(index/2)*225 };
      let best = null;
      let distance = Infinity;
      for (let z=-710;z<=710;z+=28) for (let x=-710;x<=710;x+=28) {
        const baseScore = Math.hypot(x-preferred.x,z-preferred.z);
        if (baseScore >= distance || boats.some(b=>Math.hypot(x-b.x,z-b.z)<148)) continue;
        const route = { x, z, rx: kind === 'cruise' ? 23 : 24, rz: 48+index*3 };
        const clearance = size.halfLength + 3;
        const safe = (px,pz) => {
          if (Math.hypot(px,pz)>=FLIGHT_RADIUS-12 || sampleGroundHeight(px,pz)>WATER_H) return false;
          if (selectedMap.alaska && Math.abs(pz-ALASKA_PLACES.harbor.z)<19 && px>43 && px<142) return false;
          if (!selectedMap.city) return true;
          const bridge=EAST_RIVER_BRIDGE;
          return Math.abs(pz-bridge.z)>bridge.halfWidth+4 ||
            (Math.abs(Math.abs(px-bridge.x)-52)>5 && WATER_H+size.top<bridge.deck-0.6);
        };
        const reaches = kind === 'cruise' ? [108,80,48] : [63+index*3,route.rz];
        for (const reach of reaches) {
          const score = baseScore + (reaches[0] - reach)*0.92;
          if (score >= distance) break;
          route.rz = reach;
          let clear = true;
          for (let step=0; step<36 && clear;step++) {
            const [px,pz,yaw] = routePose(route, step*Math.PI/18);
            const sx = Math.sin(yaw), sz = Math.cos(yaw);
            for (const along of [-clearance,0,clearance]) for (const across of [-size.halfWidth,0,size.halfWidth]) {
              if (!safe(px+sx*along+sz*across,pz+sz*along-sx*across)) clear = false;
            }
          }
          if (clear) {
            distance = score;
            best = { ...route };
            break;
          }
        }
      }
      if (best) {
        boats.push({ ...best, ...size, kind, phase: index*1.1,
          pace: setBoatPace(best,index*0.17,[5.4,7.0,4.5,6.3][index]) });
      }
    }

    // Keep flocks close to the arrival route and above nearby terrain.
    const spawn = selectedMap.spawn || [30,40,-185];
    const visibleBoats = [...boats].sort((a,b)=>
      Math.hypot(a.x-spawn[0],a.z-spawn[2])-Math.hypot(b.x-spawn[0],b.z-spawn[2]));
    for (const [flock, center] of visibleBoats.slice(0,2).entries()) {
      const radius = 32+flock*9;
      for (let i=0;i<5;i++) {
        const route = { x: center.x, z: center.z, rx: radius+i*2.1, rz: radius*0.69+i };
        let ground = WATER_H;
        for (let step=0;step<24;step++) {
          const [x,z] = routePose(route,step*Math.PI/12);
          ground = Math.max(ground,navigationSurface(x,z));
        }
        gulls.push({ ...route, phase: i*0.66+flock*0.51, rate: 0.40+flock*0.045,
          altitude: ground+13+i*1.65, stagger: i*1.41+flock*0.65 });
      }
    }

    if (!selectedMap.alaska) return;
    for (const [index,[x,z]] of [[52,-492],[-121,-388],[47,132]].entries()) {
      const route={x,z,rx:51,rz:33};
      let ceiling=28;
      for(let i=0;i<30;i++){
        const [east,north]=routePose(route,i*Math.PI/15);
        ceiling=Math.max(ceiling,navigationSurface(east,north));
      }
      gulls.push({...route,eagle:true,rate:0.26,phase:0.82+index*1.74,
        altitude:ceiling+10+index*2.5,stagger:1.33+index*0.97});
    }
    const meadows = [[-126,-465],[128,-370],[-155,-215],[154,-55],[125,135]];
    for (const [index,[east,north]] of meadows.entries()) {
      for (let i=0;i<3;i++) {
        const x = east + (i-1)*8;
        const z = north + (i%2)*12;
        if (![[-7,0],[7,0],[0,-7],[0,7],[0,0]].every(([dx,dz])=>{
          const y=sampleGroundHeight(x+dx,z+dz);
          return y>WATER_H+1.4 && y<34;
        })) continue;
        moose.push({x,z,rx:6,rz:6,phase:index+i*2,rate:0.19+i*0.025});
      }
    }
  }

  function sceneryPose(actor, time) {
    if (!actor.pace) return routePose(actor, actor.phase+actor.rate*time);
    const { lengths, start, speed } = actor.pace;
    const last = lengths.length - 1;
    const distance = (start+time*speed) % lengths[last];
    let lo = 0, hi = last;
    while (hi-lo > 1) {
      const mid = (lo+hi) >> 1;
      if (lengths[mid] <= distance) lo = mid;
      else hi = mid;
    }
    const fraction = (distance-lengths[lo])/(lengths[hi]-lengths[lo]);
    return routePose(actor,(lo+fraction)*Math.PI*2/last);
  }

  function updateBoatWakes() {
    boatWakes.fill(0);
    for (const [i,boat] of boats.entries()) {
      if(boat.wreck)continue;
      const [x,z,yaw] = sceneryPose(boat,sceneryTime);
      const length = boat.halfLength*0.96;
      boatWakes.set([x-Math.sin(yaw)*length,z-Math.cos(yaw)*length,yaw,boat.halfWidth],i*4);
    }
  }

  function gullPose(gull, time) {
    const [x,z,yaw] = sceneryPose(gull,time);
    const phase = time*1.33+gull.stagger;
    const flap = gull.eagle
      ? 0.12+Math.sin(time*10.3+gull.stagger)*0.44*Math.max(0,Math.sin(phase))
      : Math.sin(time*15.4+gull.stagger)*0.57*(0.20+0.80*Math.max(0,Math.sin(phase)));
    const altitude = gull.altitude + 1.9*Math.sin(time*0.92+gull.stagger);
    return { pos: [x,altitude,z], yaw, flap };
  }

  function drawSeagulls(drawMesh) {
    for (const gull of gulls) {
      const { pos, yaw, flap } = gullPose(gull,sceneryTime);
      if (Math.hypot(pos[0]-camPos[0],pos[2]-camPos[2]) > 390) continue;
      const front = [Math.sin(yaw),0,Math.cos(yaw)];
      const right = [front[2],0,-front[0]];
      const bird=gull.eagle?eagleModels:gullModels;
      const size=gull.eagle?1.48:1;
      drawMesh(bird.body,mat4FromBasis(pos,right,worldUp,front,size));
      for (const [index,wing] of bird.wings.entries()) {
        const angle = (index === 0 ? -1 : 1)*flap;
        const across = right.map((v,i)=>v*Math.cos(angle)+worldUp[i]*Math.sin(angle));
        const wingUp = worldUp.map((v,i)=>v*Math.cos(angle)-right[i]*Math.sin(angle));
        drawMesh(wing,mat4FromBasis(pos,across,wingUp,front,size));
      }
    }
  }

  function drawCoastalTraffic(drawMesh) {
    for (const boat of boats) {
      if (boat.wreck) {
        drawSplitShip(boat,drawMesh);
        continue;
      }
      const [x,z,yaw] = sceneryPose(boat,sceneryTime);
      const front = [Math.sin(yaw),0,Math.cos(yaw)];
      const right = [front[2],0,-front[0]];
      const bob = 0.16*Math.sin(1.75*sceneryTime+boat.phase);
      drawMesh(shipMeshes[boat.kind],mat4FromBasis([x,WATER_H+bob,z],right,worldUp,front,1));
    }
    for (const animal of moose) {
      const [x,z,yaw] = sceneryPose(animal,sceneryTime);
      const y = sampleGroundHeight(x,z);
      const front = [Math.sin(yaw),0,Math.cos(yaw)];
      drawMesh(mooseMesh,mat4FromBasis([x,y,z],[front[2],0,-front[0]],worldUp,front,1));
    }
  }

  const GEAR_CLEARANCE = 0.96;
  const ROTATE_SPEED = 23;
  let gearDown = false;
  let grounded = false;
  let brakes = false;

  function toggleGear() {
    if (!flying || crash || selectedAircraft !== 'fighter' || grounded) return;
    gearDown = !gearDown;
    renderGearStatus();
  }

  function renderGearStatus() {
    gearStatus.hidden = selectedAircraft !== 'fighter';
    let text = gearDown ? 'GEAR DOWN' : 'GEAR UP';
    if (grounded) {
      const speed = Math.round(plane.speed);
      const action = speed >= ROTATE_SPEED ? 'PULL UP' : plane.afterburner ? 'ACCELERATING' : 'HOLD BOOST';
      text = (speed ? action + ' · ' + speed + ' / ' + ROTATE_SPEED : 'STOPPED · HOLD BOOST');
      if (brakes) text = 'BRAKES · ' + speed;
    }
    if (gearStatus.textContent !== text) gearStatus.textContent = text;
  }

  function usableLandingSurface(x,z) {
    const level = sampleTerrainHeight(x,z);
    if (level <= WATER_H+0.10 || cityLotAt(x,z) || sceneryObstacle(x,z)) return null;
    for (const [dx,dz] of [[3,0],[-3,0],[0,3],[0,-3]]) {
      const nearby = sampleTerrainHeight(x+dx,z+dz);
      if (nearby <= WATER_H+0.10 || Math.abs(nearby-level)>0.70 || cityLotAt(x+dx,z+dz)) return null;
    }
    return level;
  }

  function buildLandingGear() {
    const {addQuad,upload}=createTriangleMesh();
    for (const [x,z] of [[0,1.15],[-0.52,-0.64],[0.52,-0.64]]) {
      addModelBox(addQuad,x,-0.46,z,0.11,0.57,0.13,[0.65,0.70,0.72]);
      const tire=[0.13,0.15,0.15], hub=[0.52,0.56,0.57];
      for(let i=0;i<12;i++){
        const edge=(side,j)=>[x+side*0.085,-0.74+Math.cos(j*Math.PI/6)*0.21,z+Math.sin(j*Math.PI/6)*0.21];
        addQuad(edge(-1,i),edge(1,i),edge(1,i+1),edge(-1,i+1),tire);
        for (const side of [-1,1]) {
          const a=[x+side*0.085,-0.74,z];
          addQuad(a,edge(side,i),edge(side,i+1),a,hub);
        }
      }
    }
    return upload();
  }

  const gearMesh=buildLandingGear();

  function advanceFlight(dt) {
    const prevPos = [...plane.pos];
    const craft = AIRCRAFT[selectedAircraft];
    const targetSpeed = plane.afterburner ? craft.boost : brakes ? 16 : craft.cruise;
    if (grounded) {
      const accel = brakes ? -19 : plane.afterburner ? 6.5 : -2.4;
      plane.speed = clamp(plane.speed+accel*dt,0,craft.boost);
    } else {
      plane.speed = lerp(plane.speed,targetSpeed,dt*2.8);
    }

    if (audioEnabled && engineGain && abGain && engineFilter) {
      engineGain.gain.setTargetAtTime(plane.afterburner ? 0.14 : 0.075, audioCtx.currentTime, 0.08);
      engineFilter.frequency.setTargetAtTime(plane.afterburner ? 420 : 190, audioCtx.currentTime, 0.08);
      abGain.gain.setTargetAtTime(plane.afterburner ? 0.11 : 0.0, audioCtx.currentTime, 0.06);
    }

    let turnInput = 0;
    let pitchInput = 0;

    if (steeringKeys.size) {
      turnInput = Number(steeringKeys.has('KeyD') || steeringKeys.has('ArrowRight'))
        - Number(steeringKeys.has('KeyA') || steeringKeys.has('ArrowLeft'));
      pitchInput = Number(steeringKeys.has('KeyW') || steeringKeys.has('ArrowUp'))
        - Number(steeringKeys.has('KeyS') || steeringKeys.has('ArrowDown'));
    } else if (viewIdx === 2) {
      // Top-down: steer aircraft toward cursor
      const nx = mouseNorm.x * window.innerWidth / Math.max(1, window.innerHeight);
      const ny = -mouseNorm.y;
      if (Math.hypot(nx, ny) > 0.06) {
        const desiredYaw = Math.atan2(nx, ny);
        let diff = desiredYaw - plane.yaw;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        turnInput = clamp(diff * 1.8, -1, 1);
      }
      pitchInput = 0.0;
    } else {
      // Chase & Cockpit: cursor offset from center sets turn & climb/dive
      turnInput = mouseNorm.x;
      pitchInput = -mouseNorm.y;
    }

    const edgeDistance = FLIGHT_RADIUS - Math.hypot(plane.pos[0], plane.pos[2]);
    let boundaryAssist = false;
    if (edgeDistance < WARNING_DISTANCE) {
      const inwardYaw = Math.atan2(-plane.pos[0], -plane.pos[2]);
      const headingError = Math.atan2(Math.sin(inwardYaw - plane.yaw), Math.cos(inwardYaw - plane.yaw));
      const assist = clamp(1 - edgeDistance / WARNING_DISTANCE, 0, 1);
      boundaryAssist = Math.abs(headingError) > Math.PI * 0.40;
      if (boundaryAssist) {
        turnInput = lerp(turnInput, Math.sign(headingError), assist);
      }
    }

    const prevYaw = plane.yaw;
    const prevPitch = plane.pitch;
    const taxiTurn=grounded ? clamp(plane.speed/7,0,0.62) : 1;
    plane.yaw += turnInput * craft.turn * dt * taxiTurn;
    const rotate=grounded && plane.afterburner && !brakes && plane.speed>=ROTATE_SPEED && pitchInput>0.20;
    if (rotate) {
      grounded=false;
      plane.pitch=0.20;
      plane.pos[1]+=0.04;
    }
    const targetPitch = grounded ? 0 : clamp(pitchInput,-0.96,1)*craft.maxPitch;
    plane.pitch = lerp(plane.pitch,targetPitch,dt*craft.pitchResponse);
    plane.bank = lerp(plane.bank,grounded?0:-turnInput*0.92,dt*4.5);

    if (plane.rollAnim > 0) {
      plane.rollAnim += dt * 1.45;
      if (plane.rollAnim >= 1.0) plane.rollAnim = 0.0;
    }

    const basis = getPlaneBasis();
    plane.pos[0] += basis.fwd[0] * plane.speed * dt;
    plane.pos[1] += basis.fwd[1] * plane.speed * dt;
    plane.pos[2] += basis.fwd[2] * plane.speed * dt;

    const radius = Math.hypot(plane.pos[0], plane.pos[2]);
    if (radius > FLIGHT_RADIUS) {
      const limit = FLIGHT_RADIUS / radius;
      plane.pos[0] *= limit;
      plane.pos[2] *= limit;
    }

    const [x,y,z]=plane.pos;
    const floor=sampleGroundHeight(x,z);
    if (grounded || (gearDown && !rotate && y<=floor+GEAR_CLEARANCE &&
        plane.pitch>=-0.21 && plane.pitch<0.20 && Math.abs(plane.bank)<0.22 && plane.speed<=29)) {
      const surface=usableLandingSurface(x,z);
      if (surface!==null && (!grounded || Math.abs(surface+GEAR_CLEARANCE-prevPos[1])<1.4)) {
        grounded=true;
        plane.pos[1]=surface+GEAR_CLEARANCE;
        plane.pitch=plane.bank=plane.rollAnim=0;
      } else if (grounded) {
        finishFlight([x,y,z],'Runway overrun',floor<=WATER_H+0.04);
      }
    }
    plane.pos[1] = Math.min(plane.pos[1], CEILING);
    if (!crash) checkFlightCollision(grounded ? plane.pos : prevPos,plane.pos);
    renderGearStatus();
    if (!crash) updateMission(dt);

    const look = 14;
    const ahead = navigationSurface(plane.pos[0] + basis.fwd[0] * look, plane.pos[2] + basis.fwd[2] * look);
    groundWarning.hidden = Boolean(crash) || grounded || Math.min(plane.pos[1] - floor, plane.pos[1] + basis.fwd[1]*look - ahead) > 5;
    plane.radarAlt = Math.max(0.2, plane.pos[1] - floor);
    plane.vsi = (plane.pos[1] - prevPos[1]) / Math.max(dt, 1e-4);
    const yawRate = (plane.yaw - prevYaw) / Math.max(dt, 1e-4);
    const pitchRate = (plane.pitch - prevPitch) / Math.max(dt, 1e-4);
    plane.gForce = clamp(1.0 + (pitchRate * plane.speed) / 14.0 + Math.abs(yawRate) * 0.9, 0.3, 7.5);

    return { basis, boundaryAssist };
  }

  function checkFlightCollision(previous, next) {
    // Substeps keep a fast-moving aircraft from crossing a narrow collision volume in one frame.
    const steps = Math.max(1, Math.ceil(Math.hypot(...next.map((value, i) => value - previous[i])) / 0.65));
    for (let i = 1; i <= steps; i++) {
      const pos = previous.map((value, j) => lerp(value, next[j], i / steps));
      const [x,y,z] = pos;
      const surface = sampleGroundHeight(x,z);
      if (y <= surface + 0.58) {
        const water = surface <= WATER_H + 0.04;
        finishFlight([x,surface+0.1,z], water ? 'Water impact' : 'Terrain collision', water);
        return;
      }
      const vehicle=vehicleAt(x,y,z,0.48);
      if(vehicle){
        damageVehicle(vehicle,pos,3);
        finishFlight(pos,vehicle.kind==='ship'?'Collision with '+vehicle.actor.name:'Collision with taxi',false);
        return;
      }
      const scenery=sceneryObstacle(x,z);
      if(scenery && y>=scenery.y-0.42 && y<=scenery.top+0.42){
        finishFlight(pos,'Collision with '+scenery.name,false);
        return;
      }
      if (selectedMap.alaska) {
        const object=alaskaObstacles.find(o=>Math.abs(x-o.x)<=o.halfX+0.42 &&
          Math.abs(z-o.z)<=o.halfZ+0.42 && y>=o.y-0.45 && y<=o.top+0.45);
        if(object) {
          finishFlight(pos,'Collision with '+object.name,false);
          return;
        }
      }
      if (!selectedMap.city) continue;
      const halfSpan=selectedAircraft==='saucer'?2.35:selectedAircraft==='fighter'?2.15:0.65;
      if (breakBridgeRail(x,y,z,halfSpan) || isBridgeCollision(x,y,z,halfSpan)) {
        finishFlight(pos,'Collision with Brooklyn Bridge',false);
        return;
      }
      for (const mark of NEW_YORK_LANDMARKS) {
        const level = y - sampleGroundHeight(mark.x, mark.z);
        if (level < 0 || level > mark.top + 0.58) continue;
        const scale = mark.kind === 'liberty' ? (level < 13 ? 0.94 : 0.40)
          : level > mark.top-13 ? 0.16 : level > 43 ? 0.65 : 1;
        if (Math.abs(x-mark.x) <= mark.w*scale+0.55 && Math.abs(z-mark.z) <= mark.d*scale+0.55) {
          finishFlight(pos, 'Collision with ' + mark.name, false);
          return;
        }
      }
    }
  }

  function finishFlight(position, reason, isWater) {
    crash = { startedAt: null, age: 0, reason };
    plane.pos = position;
    plane.speed = 0;
    plane.afterburner = false;
    grounded=false;
    brakes=false;
    steeringKeys.clear();
    groundWarning.hidden = true;
    camInitialized = false;
    explosions.push({ pos: position, age: 0, maxAge: 1.4, isWater, crash: true });
    playExplosionSound(isWater);
    if (audioCtx && engineGain && abGain) {
      engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.08);
      abGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.08);
    }
  }

  function drawCrashBurst(x, y, t, water) {
    const radius = 16 + 70*t;
    const glow = hudCtx.createRadialGradient(x,y,1,x,y,radius);
    glow.addColorStop(0, water ? 'rgba(229,252,255,0.92)' : 'rgba(255,242,176,0.98)');
    glow.addColorStop(0.38, water ? 'rgba(113,194,234,0.52)' : 'rgba(255,137,49,0.72)');
    glow.addColorStop(1,'rgba(108,89,95,0)');
    hudCtx.save();
    hudCtx.globalAlpha = Math.max(0,1-t*1.17);
    hudCtx.fillStyle = glow;
    hudCtx.fillRect(x-radius,y-radius,radius*2,radius*2);
    for (let i=0;i<22;i++) {
      const angle = i*2.39996;
      const r = (18 + (i%6)*13)*t;
      const px = x+Math.cos(angle)*r;
      const py = y+Math.sin(angle)*r-45*t+10*t*t;
      hudCtx.fillStyle = water ? '#e3f9ff' : i%3 ? '#feb56b' : '#49373d';
      hudCtx.beginPath();
      hudCtx.arc(px,py,1.4+(i%3)*(1+t),0,2*Math.PI);
      hudCtx.fill();
    }
    hudCtx.restore();
  }

  function loop(now) {
    if (!flying) return;
    const rawDt = (now - lastTime) * 0.001;
    lastTime = now;
    const dt = Math.min(rawDt, 0.05);
    const time = now * 0.001;

    // Auto-lower internal resolution if integrated GPU slows down
    if (rawDt > 0.036 && resScale > 0.55) {
      slowFrames++;
      if (slowFrames > 18) {
        resScale = Math.max(0.55, resScale * 0.82);
        resizeTargets();
        slowFrames = 0;
      }
    } else {
      slowFrames = Math.max(0, slowFrames - 1);
    }

    sceneryTime += Math.min(rawDt, 0.12);
    updateSphereStatus();
    refreshVehicleTargets();
    advanceWreckFragments(dt);
    const { basis, boundaryAssist } = crash
      ? { basis: getPlaneBasis(), boundaryAssist: false }
      : advanceFlight(dt);
    if (crash) {
      crash.startedAt ??= now;
      crash.age = (now-crash.startedAt)*0.001;
    }

    // 2. Missiles, Reloading & Trails
    for (let i = 0; i < 4; i++) {
      if (hardpointTimers[i] > 0) {
        hardpointTimers[i] = Math.max(0, hardpointTimers[i] - dt);
        if (hardpointTimers[i] === 0) updateMissilePips();
      }
    }

    for (let i = activeMissiles.length - 1; i >= 0; i--) {
      const m = activeMissiles[i];
      m.life -= dt;
      if (m.cannon && m.life<=0) {
        activeMissiles.splice(i,1);
        continue;
      }
      const distance=m.speed*dt;
      const steps=Math.max(1,Math.ceil(distance/(m.cannon?0.38:0.7)));
      let bridgeHit=false;
      let structureHit=false;
      for(let step=0;step<steps;step++){
        for(let axis=0;axis<3;axis++)m.pos[axis]+=m.dir[axis]*distance/steps;
        const [x,y,z]=m.pos;
        if(selectedMap.city && (breakBridgeRail(x,y,z,0.34)||isBridgeCollision(x,y,z,0.30))){
          bridgeHit=true;
          break;
        }
        const vehicle=vehicleAt(x,y,z,0.18);
        if(vehicle && !vehicle.actor.wreck){
          damageVehicle(vehicle,m.pos,m.cannon?1:3);
          structureHit=true;
          break;
        }
        if(sphereTakesHit(x,y,z)){
          structureHit=true;
          break;
        }
        const lot=cityLotAt(x,z);
        if (lot && !lot[6] && y<=WATER_H+2.38+lot[4] && y>=WATER_H+2.38) {
          structureHit=true;
          if (!m.cannon) collapseBuilding(lot,m.pos);
          break;
        }
        if(y<=sampleGroundHeight(x,z))break;
      }

      trails.push({
        pos: [m.pos[0], m.pos[1], m.pos[2]],
        type: 'smoke',
        ember: true,
        alpha: 0.95,
        vy: 0.4
      });

      const [x,y,z]=m.pos;
      const gh = sampleGroundHeight(x,z);
      if (bridgeHit || structureHit || y <= gh || m.life <= 0) {
        const isWater = !bridgeHit && !structureHit && gh <= WATER_H + 0.05 ? 1 : 0;
        const hitPos = [x,bridgeHit||structureHit?y:gh,z];
        explosions.push({ pos: hitPos, age: 0, maxAge: 1.5, isWater: isWater > 0, structure: structureHit });
        playExplosionSound(isWater > 0);

        impacts[impactCursor] = { x: hitPos[0], y: hitPos[1], z: hitPos[2], age: 0, isWater };
        impactCursor = (impactCursor + 1) % 8;

        for (let s = 0; s < 10; s++) {
          trails.push({
            pos: [
              hitPos[0] + (Math.random() - 0.5) * 2.2,
              hitPos[1] + Math.random() * 1.4,
              hitPos[2] + (Math.random() - 0.5) * 2.2
            ],
            type: 'smoke',
            ember: !isWater && s < 4,
            alpha: 0.92,
            vy: 1.6 + Math.random() * 1.5
          });
        }
        activeMissiles.splice(i, 1);
      }
    }

    for (let i = 0; i < 8; i++) {
      if (impacts[i].age >= 0) {
        impacts[i].age += dt;
        if (impacts[i].age > 24.0) impacts[i].age = -1;
      }
    }

    for (let i = explosions.length - 1; i >= 0; i--) {
      explosions[i].age = explosions[i].crash ? crash.age : explosions[i].age + dt;
      if (explosions[i].age >= explosions[i].maxAge) explosions.splice(i, 1);
    }

    // Wingtip vapor trails
    trailAccum += dt;
    if (!crash && trailAccum >= 0.024) {
      trailAccum = 0;
      for (const side of [-1, 1]) {
        trails.push({
          pos: [
            plane.pos[0] + basis.right[0] * (side * 2.12) - basis.fwd[0] * 1.15,
            plane.pos[1] + basis.right[1] * (side * 2.12) - basis.fwd[1] * 1.15,
            plane.pos[2] + basis.right[2] * (side * 2.12) - basis.fwd[2] * 1.15
          ],
          type: 'vapor',
          ember: false,
          alpha: plane.afterburner ? 0.85 : 0.55,
          vy: 0
        });
      }
    }

    for (let i = trails.length - 1; i >= 0; i--) {
      const tr = trails[i];
      tr.alpha -= dt * (tr.type === 'vapor' ? 0.85 : 0.42);
      tr.pos[0] += (tr.vx || 0)*dt;
      tr.pos[1] += tr.vy * dt;
      tr.pos[2] += (tr.vz || 0)*dt;
      if (tr.alpha <= 0) trails.splice(i, 1);
    }

    // 3. Smooth ~1.0s Camera Interpolation
    const targetCam = crash ? {
      eye: [plane.pos[0]-basis.fwd[0]*16,plane.pos[1]+7,plane.pos[2]-basis.fwd[2]*16],
      look: plane.pos, up:[0,1,0], fov:58
    } : computeTargetCamera(basis);
    if (!camInitialized) {
      camPos = [...targetCam.eye];
      camLook = [...targetCam.look];
      camUp = [...targetCam.up];
      camInitialized = true;
    } else {
      const camLerp = 1.0 - Math.exp(-dt * 4.2);
      for (let k = 0; k < 3; k++) {
        camPos[k] = lerp(camPos[k], targetCam.eye[k], camLerp);
        camLook[k] = lerp(camLook[k], targetCam.look[k], camLerp);
        camUp[k] = lerp(camUp[k], targetCam.up[k], camLerp);
      }
      camUp = v3Norm(camUp);
    }

    const aspect = fboW / fboH;
    const fovRad = targetCam.fov * Math.PI / 180;
    const camFwd = v3Norm([camLook[0] - camPos[0], camLook[1] - camPos[1], camLook[2] - camPos[2]]);
    const camRight = v3Norm(v3Cross(camUp, camFwd));
    const camTrueUp = v3Cross(camFwd, camRight);

    const viewMat = mat4LookAt(camPos, camLook, camUp);
    const projMat = mat4Perspective(fovRad, aspect, 0.25, 880);
    const viewProj = mat4Mul(projMat, viewMat);

    // 4. Render World + 3D Aircraft into Low-Res FBO
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
    gl.viewport(0, 0, fboW, fboH);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);

    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.ALWAYS);
    gl.useProgram(worldProg);
    gl.uniformMatrix4fv(uWorld.viewProj, false, viewProj);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, terrainTex);
    gl.uniform1i(uWorld.terrain, 0);
    gl.uniform1f(uWorld.terrainScale,terrainScaleFor(selectedMap));
    gl.uniform1i(uWorld.alderValley, Boolean(selectedMap.airfield));
    gl.uniform1i(uWorld.manhattan, Boolean(selectedMap.city));
    gl.uniform1i(uWorld.alaska, Boolean(selectedMap.alaska));
    gl.uniform1i(uWorld.vegas, Boolean(selectedMap.vegas));
    gl.uniform3fv(uWorld.camPos, camPos);
    gl.uniform3fv(uWorld.camFwd, camFwd);
    gl.uniform3fv(uWorld.camRight, camRight);
    gl.uniform3fv(uWorld.camUp, camTrueUp);
    gl.uniform1f(uWorld.fovTan, Math.tan(fovRad * 0.5));
    gl.uniform1f(uWorld.aspect, aspect);
    gl.uniform1f(uWorld.time, time);
    gl.uniform3fv(uWorld.planePos, plane.pos);
    gl.uniform1f(uWorld.planeAlt, plane.radarAlt);

    const impArr = new Float32Array(32);
    const impTypeArr = new Float32Array(32);
    for (let i = 0; i < 8; i++) {
      impArr[i * 4 + 0] = impacts[i].x;
      impArr[i * 4 + 1] = impacts[i].y;
      impArr[i * 4 + 2] = impacts[i].z;
      impArr[i * 4 + 3] = impacts[i].age;
      impTypeArr[i * 4 + 0] = impacts[i].isWater;
    }
    updateBoatWakes();
    gl.uniform4fv(uWorld.boatWakes, boatWakes);
    gl.uniform4fv(uWorld.impacts, impArr);
    gl.uniform4fv(uWorld.impactType, impTypeArr);

    gl.bindVertexArray(quadVao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // Render 3D Aircraft & Missiles (in Chase & Top-Down views)
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LESS);
    gl.useProgram(meshProg);
    // The east-right flight projection reverses screen-space triangle winding.
    gl.frontFace(gl.CW);
    gl.uniformMatrix4fv(uMesh.viewProj, false, viewProj);
    gl.uniform1i(uMesh.smooth, smoothScenery());
    gl.uniform3fv(uMesh.eye, camPos);
    gl.uniform1i(uMesh.waterfall,0);
    gl.uniform1i(uMesh.twilight,Boolean(selectedMap.vegas));
    gl.uniform1f(uMesh.sceneTime,sceneryTime);

    function drawMeshWithOutline(mesh,modelMat,emissive=false,cityFacade=false,outlined=true) {
      gl.uniform1i(uMesh.cityFacade, cityFacade);
      gl.bindVertexArray(mesh.vao);
      gl.uniformMatrix4fv(uMesh.model, false, modelMat);
      if (outlined && !emissive && !smoothScenery()) {
        // Inverted-hull 1px dark outline
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.FRONT);
        gl.uniform1f(uMesh.outline, 0.045);
        gl.uniform1f(uMesh.isOutline, 1.0);
        gl.uniform1f(uMesh.emissive, 0.0);
        gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
        gl.cullFace(gl.BACK);
      }
      gl.disable(gl.CULL_FACE);
      gl.uniform1f(uMesh.outline, 0.0);
      gl.uniform1f(uMesh.isOutline, 0.0);
      gl.uniform1f(uMesh.emissive, emissive ? 1.0 : 0.0);
      gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
    }

    refreshDestroyedCity();
    if (backgroundBuildings || landscapeDetails) {
      const identity = mat4FromBasis([0,0,0],[1,0,0],[0,1,0],[0,0,1],1);
      if (backgroundBuildings) drawMeshWithOutline(backgroundBuildings,identity,false,true);
      if (landscapeDetails) drawMeshWithOutline(landscapeDetails,identity);
      for(const falling of fallingBuildings) {
        const t=clamp((sceneryTime-falling.started)/1.22,0,1);
        const transform=mat4FromBasis([0,-falling.height*t*t,0],[1,0,0],[0,1,0],[0,0,1],1);
        // Move the damaged structure downward into its rubble footprint.
        drawMeshWithOutline(falling.mesh,transform,false,true);
      }
    }

    if (selectedMap.city) {
      for (const mark of NEW_YORK_LANDMARKS) {
        const origin = [mark.x, sampleGroundHeight(mark.x, mark.z) - 0.03, mark.z];
        const model = mat4FromBasis(origin, [1,0,0], [0,1,0], [0,0,1], 1);
        drawMeshWithOutline(newYorkMeshes[mark.kind], model);
      }
    }

    if(alaskaHarbor && alaskaFalls) {
      const identity=mat4FromBasis([0,0,0],[1,0,0],[0,1,0],[0,0,1],1);
      drawMeshWithOutline(alaskaHarbor,identity);
      gl.uniform1i(uMesh.waterfall,1);
      drawMeshWithOutline(alaskaFalls,identity);
      gl.uniform1i(uMesh.waterfall,0);
    }
    drawMapScenery(drawMeshWithOutline);
    drawSphereShow(drawMeshWithOutline);
    drawCoastalTraffic(drawMeshWithOutline);
    drawSeagulls(drawMeshWithOutline);
    drawCityTraffic(drawMeshWithOutline);
    drawWreckFragments(drawMeshWithOutline);

    if (!crash && viewIdx !== 1) {
      const planeScale = viewIdx === 2 ? 1.45 : 1.0;
      const planeModel = mat4FromBasis(plane.pos, basis.right, basis.up, basis.fwd, planeScale);
      drawMeshWithOutline(aircraftMeshes[selectedAircraft], planeModel, false);

      if (selectedAircraft === "fighter") {
        if(gearDown) drawMeshWithOutline(gearMesh,planeModel);
        // Wing-mounted missiles still on pylons
        for (let i = 0; i < 4; i++) {
          if (hardpointTimers[i] <= 0) {
            const hp = HARDPOINTS[i];
            const mPos = [
              plane.pos[0] + (basis.right[0] * hp[0] + basis.up[0] * hp[1] + basis.fwd[0] * hp[2]) * planeScale,
              plane.pos[1] + (basis.right[1] * hp[0] + basis.up[1] * hp[1] + basis.fwd[1] * hp[2]) * planeScale,
              plane.pos[2] + (basis.right[2] * hp[0] + basis.up[2] * hp[1] + basis.fwd[2] * hp[2]) * planeScale
            ];
            drawMeshWithOutline(missileMesh, mat4FromBasis(mPos, basis.right, basis.up, basis.fwd, planeScale), false);
          }
        }

        // Twin afterburner plumes with white core
        const flicker = 0.85 + 0.3 * Math.sin(time * 55.0);
        const abLen = (plane.afterburner ? 1.45 : 0.45) * flicker * planeScale;
        for (const side of [-1, 1]) {
          const pPos = [
            plane.pos[0] + (basis.right[0] * (side * 0.22) - basis.fwd[0] * 1.95) * planeScale,
            plane.pos[1] + (basis.right[1] * (side * 0.22) - basis.fwd[1] * 1.95) * planeScale,
            plane.pos[2] + (basis.right[2] * (side * 0.22) - basis.fwd[2] * 1.95) * planeScale
          ];
          const backDir = [-basis.fwd[0], -basis.fwd[1], -basis.fwd[2]];
          drawMeshWithOutline(plumeOuterMesh, mat4FromBasis(pPos, basis.right, basis.up, backDir, abLen), true);
          drawMeshWithOutline(plumeCoreMesh, mat4FromBasis(pPos, basis.right, basis.up, backDir, abLen * 0.85), true);
        }
      } else if (selectedAircraft === 'jetpack') {
        const exhaust = basis.up.map(value => -value);
        const thrust = plane.afterburner ? 1.12 : 0.55;
        const flicker = 0.92 + 0.14 * Math.sin(time * 64);
        for (const side of [-1, 1]) {
          const nozzle = plane.pos.map((value, i) => value + planeScale *
            (basis.right[i] * side * 0.53 - basis.up[i] * 0.62 - basis.fwd[i] * 0.5));
          const model = mat4FromBasis(nozzle, basis.right, basis.fwd, exhaust, thrust * flicker * planeScale);
          drawMeshWithOutline(plumeOuterMesh, model, true);
        }
      }
    }

    // Active launched missiles in flight
    for (const m of activeMissiles) {
      const mRight = v3Norm(v3Cross([0, 1, 0], m.dir));
      const mUp = v3Cross(m.dir, mRight);
      drawMeshWithOutline(m.cannon?plumeCoreMesh:missileMesh,
        mat4FromBasis(m.pos,mRight,mUp,m.dir,m.cannon?0.74:1.15),Boolean(m.cannon));
    }

    // 5. Post-Process 4x4 Bayer Ordered Dither Pass to Screen
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, fboW, fboH);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);

    gl.useProgram(ditherProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.uniform1i(uDither.scene, 0);
    gl.uniform1i(uDither.smooth, smoothScenery());
    gl.uniform3fv(uDither.palette, paletteFlat);
    gl.uniform2f(uDither.res, fboW, fboH);

    gl.bindVertexArray(quadVao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // 6. Canvas 2D Cockpit & HUD
    drawHudAndCockpit(time, basis, viewProj);
    drawFlightMap(now, boundaryAssist);

    if (crash && crash.age >= 1.15) {
      flying = false;
      crashDetail.textContent = crash.reason;
      crashOverlay.hidden = false;
      retryFlight.focus();
      return;
    }
    flightFrame = requestAnimationFrame(loop);
  }
  loadMapPreviews();
})();
</script>
</body>
</html>
