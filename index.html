<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PATROL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0e0b16;font-family:'Share Tech Mono',monospace;color:#f5d5b8;}
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0b0912;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #glCanvas{image-rendering:pixelated;image-rendering:crisp-edges;}
  #hudCanvas{pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges;}
  #titleOverlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 42%, rgba(28,18,38,0.45) 0%, rgba(10,7,18,0.82) 100%);
    z-index:20;transition:opacity 0.55s ease;pointer-events:auto;cursor:pointer;
  }
  #titleOverlay.hidden{opacity:0;pointer-events:none;}
  .title-badge{
    border:2px solid #e88d4f;background:rgba(16,11,26,0.86);padding:26px 38px;
    box-shadow:0 0 0 2px #140e22, 0 14px 40px rgba(0,0,0,0.75);text-align:center;max-width:92vw;
  }
  .title-sub-top{font-size:11px;letter-spacing:4px;color:#d6896b;margin-bottom:12px;text-transform:uppercase;}
  h1.game-title{
    font-family:'Press Start 2P',monospace;font-size:clamp(28px,6vw,54px);letter-spacing:6px;
    color:#ffd699;text-shadow:3px 3px 0 #8a2c38, -1px -1px 0 #fff1d6;margin-bottom:14px;
  }
  .title-desc{font-size:13px;color:#e6bca0;letter-spacing:1.5px;margin-bottom:20px;}
  .start-prompt{
    display:inline-block;font-family:'Press Start 2P',monospace;font-size:12px;
    color:#140e22;background:#f4a259;padding:10px 18px;letter-spacing:2px;
    animation:blink 1.1s steps(2,end) infinite;
  }
  @keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0.45;}}
  #statusBar{
    position:absolute;left:12px;right:12px;bottom:10px;z-index:15;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(14,10,24,0.74);border:1px solid rgba(232,141,79,0.38);
    padding:6px 12px;font-size:12px;color:#f3cfa8;backdrop-filter:blur(2px);
  }
  .bar-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .bar-right{display:flex;align-items:center;gap:12px;}
  .key-pill{
    display:inline-block;padding:1px 5px;border:1px solid rgba(244,162,89,0.55);
    color:#ffd699;font-size:11px;margin-right:3px;background:rgba(42,26,56,0.65);
  }
  .missile-pips{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;margin-left:4px;}
  .pip{width:7px;height:12px;background:#f4a259;border:1px solid #ffd699;display:inline-block;}
  .pip.empty{background:rgba(255,255,255,0.08);border-color:rgba(244,162,89,0.3);}
  #audioBtn{
    background:rgba(36,22,48,0.9);border:1px solid #e88d4f;color:#ffd699;
    font-family:'Share Tech Mono',monospace;font-size:12px;padding:4px 10px;cursor:pointer;
    letter-spacing:1px;
  }
  #audioBtn:hover{background:#e88d4f;color:#140e22;}
  #loadOverlay{
    position:absolute;inset:0;z-index:30;background:#110c1d;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  }
  #loadOverlay.done{display:none;}
  .load-label{font-family:'Press Start 2P',monospace;font-size:12px;color:#f4a259;letter-spacing:2px;}
  .load-bar-outer{width:280px;max-width:80vw;height:16px;border:2px solid #e88d4f;padding:2px;background:#1b132b;}
  .load-bar-inner{height:100%;width:0%;background:#f4a259;transition:width 0.08s linear;}
  #touchControls{
    position:absolute;inset:0;pointer-events:none;z-index:14;display:none;
  }
  @media (pointer:coarse),(max-width:820px){
    #touchControls{display:block;}
    .desktop-only{display:none;}
  }
  .touch-btn{
    position:absolute;pointer-events:auto;background:rgba(20,14,34,0.65);
    border:2px solid rgba(244,162,89,0.6);color:#ffd699;font-family:'Press Start 2P',monospace;
    font-size:10px;display:flex;align-items:center;justify-content:center;border-radius:6px;
    touch-action:none;
  }
  .touch-btn:active,.touch-btn.active{background:rgba(244,162,89,0.45);color:#fff;}
  #btnCam{top:14px;right:14px;width:76px;height:38px;}
  #btnRoll{bottom:54px;right:16px;width:68px;height:44px;}
  #btnBoost{bottom:54px;right:92px;width:74px;height:44px;}
  #btnFire{bottom:106px;right:16px;width:74px;height:44px;}
  #joyZone{
    position:absolute;left:16px;bottom:54px;width:112px;height:112px;border-radius:50%;
    border:2px dashed rgba(244,162,89,0.45);background:rgba(20,14,34,0.35);pointer-events:auto;touch-action:none;
  }
  #joyKnob{
    position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;
    border-radius:50%;background:rgba(244,162,89,0.55);border:2px solid #ffd699;pointer-events:none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="glCanvas"></canvas>
  <canvas id="hudCanvas"></canvas>

  <div id="loadOverlay">
    <div class="load-label">GENERATING AUTUMN LAKE DISTRICT</div>
    <div class="load-bar-outer"><div class="load-bar-inner" id="loadBar"></div></div>
    <div id="loadStep" style="font-size:12px;color:#c98a70;">SEEDING HEIGHTFIELD...</div>
  </div>

  <div id="titleOverlay" class="hidden">
    <div class="title-badge">
      <div class="title-sub-top">AUTUMN LAKE DISTRICT // 17:42 SUNSET</div>
      <h1 class="game-title">PATROL</h1>
      <div class="title-desc">LOW-ALTITUDE INTERCEPTOR &amp; RECONNAISSANCE TOY</div>
      <div class="start-prompt">MOVE MOUSE OR CLICK TO FLY</div>
    </div>
  </div>

  <div id="touchControls">
    <div id="joyZone"><div id="joyKnob"></div></div>
    <div class="touch-btn" id="btnCam">VIEW</div>
    <div class="touch-btn" id="btnFire">MSL</div>
    <div class="touch-btn" id="btnBoost">AB</div>
    <div class="touch-btn" id="btnRoll">ROLL</div>
  </div>

  <div id="statusBar">
    <div class="bar-left">
      <span><span class="key-pill">MOUSE</span>STEER</span>
      <span class="desktop-only"><span class="key-pill">CLICK</span>ROLL</span>
      <span class="desktop-only"><span class="key-pill">HOLD</span>AFTERBURNER</span>
      <span class="desktop-only"><span class="key-pill">RMB/F</span>MISSILE</span>
      <span class="desktop-only"><span class="key-pill">SPACE</span>VIEW (<b id="viewName">CHASE</b>)</span>
      <span>MSL <span class="missile-pips" id="missilePips">
        <i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i>
      </span></span>
    </div>
    <div class="bar-right">
      <button id="audioBtn" type="button">SOUND: OFF</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const glCanvas = document.getElementById('glCanvas');
  const hudCanvas = document.getElementById('hudCanvas');
  const hudCtx = hudCanvas.getContext('2d');
  const loadOverlay = document.getElementById('loadOverlay');
  const loadBar = document.getElementById('loadBar');
  const loadStep = document.getElementById('loadStep');
  const titleOverlay = document.getElementById('titleOverlay');
  const audioBtn = document.getElementById('audioBtn');
  const viewNameEl = document.getElementById('viewName');
  const pipEls = Array.from(document.querySelectorAll('#missilePips .pip'));

  // Curated 36-color autumn sunset palette
  const PALETTE_HEX = [
    '#0d0a18', '#18142b', '#262140', '#383059', '#4c4170', '#635387',
    '#15273d', '#1e3c58', '#2a5775', '#3d788f', '#5ea1a6', '#94c9be',
    '#212b24', '#33422b', '#4d5c32', '#70783b', '#999447', '#c2b05e',
    '#5e2129', '#8a322d', '#b84b2c', '#de6e2c', '#f5983b', '#fcc45d',
    '#d99b66', '#e8ba89', '#f5d7b0', '#fff0d6', '#7d6b7d', '#9e8b99',
    '#bfacb5', '#e3d5dc', '#f7eff2', '#4a5363', '#758296', '#a8b5c7'
  ];

  function hexToRgb(hex) {
    const v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }
  const PALETTE_RGB = PALETTE_HEX.map(hexToRgb);

  // Seamless terrain generator via inline Web Worker
  const workerSrc = `
    self.onmessage = function(e) {
      const N = e.data.size || 512;
      const mask = N - 1;
      function hash(ix, iy, seed) {
        let n = (ix * 374761393 + iy * 668265263 + seed * 1442695041) | 0;
        n = (n ^ (n >>> 13)) * 1274126177;
        return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
      }
      function valueNoise(x, y, period, seed) {
        const ix = Math.floor(x), iy = Math.floor(y);
        const fx = x - ix, fy = y - iy;
        const ux = fx * fx * (3 - 2 * fx);
        const uy = fy * fy * (3 - 2 * fy);
        const x0 = ((ix % period) + period) % period;
        const x1 = (x0 + 1) % period;
        const y0 = ((iy % period) + period) % period;
        const y1 = (y0 + 1) % period;
        const a = hash(x0, y0, seed);
        const b = hash(x1, y0, seed);
        const c = hash(x0, y1, seed);
        const d = hash(x1, y1, seed);
        return (a * (1 - ux) + b * ux) * (1 - uy) + (c * (1 - ux) + d * ux) * uy;
      }
      function fbm(u, v, baseFreq, octaves, seed) {
        let sum = 0, amp = 0.5, freq = baseFreq, norm = 0;
        for (let o = 0; o < octaves; o++) {
          sum += amp * valueNoise(u * freq, v * freq, freq, seed + o * 31);
          norm += amp;
          amp *= 0.5;
          freq *= 2;
        }
        return sum / norm;
      }
      function ridged(u, v, baseFreq, octaves, seed) {
        let sum = 0, amp = 0.5, freq = baseFreq, norm = 0;
        for (let o = 0; o < octaves; o++) {
          let n = valueNoise(u * freq, v * freq, freq, seed + o * 53);
          n = 1.0 - Math.abs(n * 2.0 - 1.0);
          n = n * n;
          sum += amp * n;
          norm += amp;
          amp *= 0.52;
          freq *= 2;
        }
        return sum / norm;
      }

      const height = new Float32Array(N * N);
      const biome = new Float32Array(N * N);
      const conifer = new Float32Array(N * N);
      const shade = new Float32Array(N * N);

      self.postMessage({ type: 'progress', pct: 18, label: 'CARVING GLACIAL BASINS...' });

      for (let y = 0; y < N; y++) {
        const v = y / N;
        for (let x = 0; x < N; x++) {
          const u = x / N;
          const idx = y * N + x;
          const basin = fbm(u, v, 4, 4, 101);
          const ridge = ridged(u, v, 6, 5, 202);
          const detail = fbm(u, v, 32, 3, 303);
          let h = basin * 0.68 + ridge * 0.44 + (detail - 0.5) * 0.08;
          // Carve interconnected autumn lakes
          const lakeMask = fbm(u + 0.31, v + 0.17, 4, 3, 404);
          h -= Math.max(0, 0.54 - lakeMask) * 0.72;
          h = Math.max(0.02, Math.min(0.98, h));
          height[idx] = h;

          const bPatch = fbm(u, v, 8, 3, 505);
          const bFine = valueNoise(u * 64, v * 64, 64, 606);
          biome[idx] = Math.max(0, Math.min(1, bPatch * 0.82 + bFine * 0.18));

          const cPatch = fbm(u, v, 16, 3, 707);
          const cDot = valueNoise(u * 128, v * 128, 128, 808);
          conifer[idx] = (cPatch > 0.54 && cDot > 0.58) ? 1.0 : 0.0;
        }
      }

      self.postMessage({ type: 'progress', pct: 64, label: 'BAKING SUNSET SHADOWS...' });

      // Long sunset shadow raycast toward sun direction (+X, -Z)
      const waterLevel = 0.34;
      const sunStepX = 1.0;
      const sunStepY = -0.36;
      const sunSlope = 0.0115;

      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          const idx = y * N + x;
          const h0 = Math.max(height[idx], waterLevel);
          let shadow = 1.0;
          let rx = x + 0.5, ry = y + 0.5;
          for (let s = 1; s <= 76; s++) {
            rx += sunStepX;
            ry += sunStepY;
            const sx = (Math.floor(rx) & mask);
            const sy = (Math.floor(ry) & mask);
            const sh = height[sy * N + sx];
            const rayH = h0 + s * sunSlope;
            if (sh > rayH) {
              shadow = 0.0;
              break;
            }
          }
          // Subtle cavity ambient occlusion
          const hl = height[y * N + ((x - 1) & mask)];
          const hr = height[y * N + ((x + 1) & mask)];
          const hu = height[((y - 1) & mask) * N + x];
          const hd = height[((y + 1) & mask) * N + x];
          const avg = (hl + hr + hu + hd) * 0.25;
          const ao = Math.max(0.65, Math.min(1.08, 1.0 + (height[idx] - avg) * 6.0));
          shade[idx] = shadow * ao;
        }
      }

      self.postMessage({ type: 'progress', pct: 95, label: 'PACKING TEXTURE ATLAS...' });
      const packed = new Uint8Array(N * N * 4);
      for (let i = 0; i < N * N; i++) {
        packed[i * 4 + 0] = Math.round(height[i] * 255);
        packed[i * 4 + 1] = Math.round(biome[i] * 255);
        packed[i * 4 + 2] = Math.round(conifer[i] * 255);
        packed[i * 4 + 3] = Math.round(Math.max(0, Math.min(1, shade[i] * 0.85)) * 255);
      }
      self.postMessage({ type: 'done', packed, height }, [packed.buffer, height.buffer]);
    };
  `;

  const MAP_SIZE = 512;
  let heightField = null;
  let terrainTex = null;

  // WebGL2 Setup
  const gl = glCanvas.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true });
  if (!gl) {
    loadStep.textContent = 'WEBGL2 NOT SUPPORTED';
    return;
  }

  function compileShader(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(sh));
      throw new Error('Shader compile failed');
    }
    return sh;
  }

  function createProgram(vsSrc, fsSrc) {
    const p = gl.createProgram();
    gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      console.error(gl.getProgramInfoLog(p));
      throw new Error('Program link failed');
    }
    return p;
  }

  const QUAD_VS = `#version 300 es
    layout(location=0) in vec2 aPos;
    out vec2 vUv;
    void main() {
      vUv = aPos * 0.5 + 0.5;
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
  `;

  // World Raymarching + Clouds + Water + Impact Scorch/Ripples Fragment Shader
  const WORLD_FS = `#version 300 es
    precision highp float;
    in vec2 vUv;
    out vec4 fragColor;

    uniform sampler2D uTerrain;
    uniform vec3 uCamPos;
    uniform vec3 uCamFwd;
    uniform vec3 uCamRight;
    uniform vec3 uCamUp;
    uniform float uFovTan;
    uniform float uAspect;
    uniform float uTime;
    uniform vec3 uPlanePos;
    uniform float uPlaneAlt;
    uniform vec4 uImpacts[8]; // xyz = world pos, w = age (or -1)
    uniform vec4 uImpactType[8]; // x = 1 water / 0 land

    const vec3 SUN_DIR = normalize(vec3(0.84, 0.165, -0.30));
    const float WATER_H = 12.2;
    const float TERRAIN_SCALE = 36.0;
    const float WORLD_TILE = 420.0;
    const float CLOUD_BASE = 24.5;
    const float CLOUD_TOP = 28.2;

    float hash12(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x),
        mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x),
        u.y
      );
    }

    float cloudDensity(vec2 xz) {
      vec2 p = xz * 0.013 + vec2(uTime * 0.0045, uTime * 0.0018);
      float n = vnoise(p) * 0.55 + vnoise(p * 2.13 + 7.1) * 0.30 + vnoise(p * 4.4 - 3.4) * 0.15;
      return smoothstep(0.54, 0.78, n);
    }

    vec4 sampleMap(vec2 xz) {
      vec2 uv = xz / WORLD_TILE;
      return texture(uTerrain, uv);
    }

    float terrainHeight(vec2 xz) {
      return sampleMap(xz).r * TERRAIN_SCALE;
    }

    vec3 getSky(vec3 rd) {
      float up = clamp(rd.y, 0.0, 1.0);
      float sunAmt = max(dot(rd, SUN_DIR), 0.0);
      vec3 zenith = vec3(0.15, 0.13, 0.28);
      vec3 midSky = vec3(0.46, 0.25, 0.42);
      vec3 horCool = vec3(0.75, 0.56, 0.72);
      vec3 horWarm = vec3(0.98, 0.62, 0.32);

      float towardSun = smoothstep(-0.3, 0.95, dot(normalize(vec3(rd.x, 0.0, rd.z) + 1e-5), normalize(vec3(SUN_DIR.x, 0.0, SUN_DIR.z))));
      vec3 horizon = mix(horCool, horWarm, towardSun);
      vec3 sky = mix(horizon, midSky, pow(up, 0.48));
      sky = mix(sky, zenith, pow(up, 1.15));

      // Cirrus streaks
      if (rd.y > 0.03) {
        vec2 cuv = rd.xz / (rd.y + 0.18) * 1.4 + vec2(uTime * 0.008, 0.0);
        float streak = vnoise(vec2(cuv.x * 1.2, cuv.y * 5.5));
        streak *= vnoise(vec2(cuv.x * 0.6 + 4.0, cuv.y * 3.2));
        float wisps = smoothstep(0.36, 0.68, streak) * smoothstep(0.03, 0.25, rd.y) * (1.0 - smoothstep(0.45, 0.9, rd.y));
        vec3 wispCol = mix(vec3(0.88, 0.64, 0.72), vec3(1.0, 0.80, 0.52), towardSun);
        sky = mix(sky, wispCol, wisps * 0.55);
      }

      // Sunset glow & large sun disc
      sky += vec3(1.0, 0.55, 0.22) * pow(sunAmt, 7.0) * 0.55;
      sky += vec3(1.0, 0.82, 0.48) * pow(sunAmt, 42.0) * 0.7;
      float disc = smoothstep(0.9985, 0.9992, sunAmt);
      sky = mix(sky, vec3(1.0, 0.94, 0.78), disc);
      return sky;
    }

    vec3 applyFog(vec3 col, vec3 rd, float dist) {
      float fogAmt = 1.0 - exp(-dist * 0.0023);
      float towardSun = smoothstep(-0.35, 0.95, dot(normalize(vec3(rd.x, 0.0, rd.z) + 1e-5), normalize(vec3(SUN_DIR.x, 0.0, SUN_DIR.z))));
      vec3 fogCol = mix(vec3(0.74, 0.58, 0.75), vec3(0.98, 0.68, 0.38), towardSun);
      return mix(col, fogCol, clamp(fogAmt, 0.0, 0.96));
    }

    void main() {
      vec2 ndc = vUv * 2.0 - 1.0;
      vec3 rd = normalize(uCamFwd + ndc.x * uAspect * uFovTan * uCamRight + ndc.y * uFovTan * uCamUp);
      vec3 ro = uCamPos;

      vec3 col = getSky(rd);
      float hitDist = 520.0;
      bool hitSurface = false;

      // Raymarch terrain & water
      if (rd.y < 0.18) {
        float t = 1.0;
        float maxT = 480.0;
        if (ro.y > TERRAIN_SCALE + 2.0 && rd.y < -0.005) {
          t = max(1.0, (ro.y - (TERRAIN_SCALE + 1.5)) / (-rd.y));
        }
        float prevT = t;
        for (int i = 0; i < 118; i++) {
          vec3 p = ro + rd * t;
          float th = terrainHeight(p.xz);
          float surfH = max(th, WATER_H);
          if (p.y <= surfH) {
            // Binary refinement
            float a = prevT, b = t;
            for (int j = 0; j < 5; j++) {
              float m = 0.5 * (a + b);
              vec3 mp = ro + rd * m;
              float mh = max(terrainHeight(mp.xz), WATER_H);
              if (mp.y <= mh) b = m; else a = m;
            }
            hitDist = 0.5 * (a + b);
            hitSurface = true;
            break;
          }
          prevT = t;
          float hDiff = p.y - surfH;
          t += max(0.65, hDiff * 0.42 + t * 0.011);
          if (t > maxT) break;
        }
      }

      if (hitSurface) {
        vec3 p = ro + rd * hitDist;
        vec4 mData = sampleMap(p.xz);
        float th = mData.r * TERRAIN_SCALE;
        float biome = mData.g;
        float conifer = mData.b;
        float bakedShade = mData.a / 0.85;

        // Cloud shadow on ground/water
        vec2 cloudProj = p.xz + SUN_DIR.xz * ((CLOUD_BASE - p.y) / max(SUN_DIR.y, 0.1));
        float cShad = 1.0 - cloudDensity(cloudProj) * 0.52;

        // Plane shadow on ground/water
        vec2 planeProj = uPlanePos.xz - SUN_DIR.xz * ((uPlanePos.y - p.y) / max(SUN_DIR.y, 0.1));
        float pDist = length(p.xz - planeProj);
        float pShad = smoothstep(1.3, 3.0, pDist);

        float litFactor = clamp(bakedShade * cShad * (0.45 + 0.55 * pShad), 0.0, 1.15);

        if (th <= WATER_H + 0.04) {
          // WATER RENDERING
          float depth = clamp((WATER_H - th) / 7.5, 0.0, 1.0);
          vec3 shallowCol = vec3(0.24, 0.63, 0.65);
          vec3 midCol = vec3(0.12, 0.34, 0.46);
          vec3 deepCol = vec3(0.08, 0.15, 0.24);
          vec3 waterCol = depth < 0.38
            ? mix(shallowCol, midCol, depth / 0.38)
            : mix(midCol, deepCol, (depth - 0.38) / 0.62);

          // Low-angle sky reflection
          vec3 reflDir = reflect(rd, vec3(0.0, 1.0, 0.0));
          vec3 skyRefl = getSky(reflDir);
          float fresnel = pow(1.0 - max(dot(-rd, vec3(0.0, 1.0, 0.0)), 0.0), 3.2);
          waterCol = mix(waterCol, skyRefl, clamp(0.18 + fresnel * 0.62, 0.0, 0.82));

          // Water wave normal for sun glitter path & transient glints
          float w1 = vnoise(p.xz * 1.9 + vec2(uTime * 1.3, -uTime * 0.8));
          float w2 = vnoise(p.xz * 4.3 - vec2(uTime * 1.7, uTime * 1.1));
          vec3 wn = normalize(vec3((w1 - 0.5) * 0.16, 1.0, (w2 - 0.5) * 0.16));
          vec3 hVec = normalize(SUN_DIR - rd);
          float spec = pow(max(dot(wn, hVec), 0.0), 95.0);
          float glint = step(0.84, fract(sin(dot(floor(p.xz * 2.5), vec2(12.9898, 78.233)) + floor(uTime * 5.0)) * 43758.5453));
          waterCol += vec3(1.0, 0.86, 0.56) * (spec * 1.35 + glint * spec * 0.9) * litFactor;

          // Animated shoreline foam
          float shoreDist = WATER_H - th;
          if (shoreDist < 0.55) {
            float wave = sin(shoreDist * 26.0 - uTime * 3.4 + w1 * 4.0);
            float foam = smoothstep(0.45, 0.88, wave) * (1.0 - shoreDist / 0.55);
            waterCol = mix(waterCol, vec3(0.95, 0.88, 0.86), foam * 0.72);
          }

          // Low-altitude jet wake & spray
          if (uPlaneAlt < 5.5) {
            float wakeStrength = 1.0 - uPlaneAlt / 5.5;
            vec2 rel = p.xz - uPlanePos.xz;
            float dWake = length(rel);
            float ring = sin(dWake * 3.2 - uTime * 9.0) * exp(-dWake * 0.22);
            float wakeFoam = smoothstep(0.25, 0.75, ring) * wakeStrength;
            waterCol = mix(waterCol, vec3(0.98, 0.94, 0.90), wakeFoam * 0.75);
          }

          // Missile water impact ripples & foam
          for (int k = 0; k < 8; k++) {
            float age = uImpacts[k].w;
            if (age >= 0.0 && uImpactType[k].x > 0.5) {
              float d = length(p.xz - uImpacts[k].xz);
              float rad = age * 9.5;
              float ring = exp(-abs(d - rad) * 1.4) * exp(-age * 0.45);
              float centerFoam = exp(-d * 0.65) * exp(-age * 0.22);
              waterCol = mix(waterCol, vec3(0.98, 0.93, 0.88), clamp(ring * 0.85 + centerFoam * 0.75, 0.0, 0.9));
            }
          }

          // Apply shadow tint (violet shadows)
          vec3 shadowTint = mix(vec3(0.28, 0.22, 0.42), vec3(1.04, 0.96, 0.88), clamp(litFactor, 0.0, 1.0));
          col = waterCol * shadowTint;
        } else {
          // LAND RENDERING
          float eps = 0.85;
          float hL = terrainHeight(p.xz - vec2(eps, 0.0));
          float hR = terrainHeight(p.xz + vec2(eps, 0.0));
          float hD = terrainHeight(p.xz - vec2(0.0, eps));
          float hU = terrainHeight(p.xz + vec2(0.0, eps));
          vec3 n = normalize(vec3(hL - hR, 2.0 * eps, hD - hU));

          float alt = th - WATER_H;
          float slope = 1.0 - n.y;

          // Base terrain palette bands
          vec3 sandCol = vec3(0.85, 0.73, 0.54);
          vec3 grassCol = vec3(0.60, 0.66, 0.30);
          vec3 goldTree = vec3(0.93, 0.66, 0.24);
          vec3 orangeTree = vec3(0.87, 0.43, 0.18);
          vec3 crimsonTree = vec3(0.68, 0.20, 0.22);
          vec3 coniferCol = vec3(0.14, 0.23, 0.17);
          vec3 rockCol = vec3(0.42, 0.36, 0.48);
          vec3 snowCol = vec3(0.97, 0.93, 0.95);

          vec3 forestCol = biome < 0.42
            ? mix(goldTree, orangeTree, biome / 0.42)
            : mix(orangeTree, crimsonTree, (biome - 0.42) / 0.58);
          if (conifer > 0.5 && alt > 1.8 && alt < 13.5) {
            forestCol = coniferCol;
          }

          vec3 albedo = grassCol;
          albedo = mix(sandCol, grassCol, smoothstep(0.25, 1.15, alt));
          albedo = mix(albedo, forestCol, smoothstep(1.3, 3.0, alt) * (1.0 - smoothstep(11.5, 14.5, alt)));
          // Steep crags & high elevation rock
          float rockMask = clamp(smoothstep(0.24, 0.44, slope) + smoothstep(12.5, 15.5, alt), 0.0, 1.0);
          albedo = mix(albedo, rockCol, rockMask);
          // Snow on highest peaks
          float snowMask = smoothstep(16.8, 19.2, alt) * (1.0 - smoothstep(0.36, 0.55, slope));
          albedo = mix(albedo, snowCol, snowMask);

          // Scorch marks & glowing embers from land missile impacts
          for (int k = 0; k < 8; k++) {
            float age = uImpacts[k].w;
            if (age >= 0.0 && uImpactType[k].x < 0.5) {
              float d = length(p.xz - uImpacts[k].xz);
              float scorch = exp(-d * 0.55) * exp(-age * 0.04);
              albedo = mix(albedo, vec3(0.10, 0.07, 0.11), clamp(scorch * 0.92, 0.0, 0.92));
              float ember = exp(-d * 1.1) * exp(-age * 0.25) * (0.6 + 0.4 * sin(uTime * 11.0 + d * 5.0));
              albedo += vec3(1.0, 0.42, 0.12) * ember * 1.4;
            }
          }

          // Stepped sunset lighting + violet shadows
          float ndotl = max(dot(n, SUN_DIR), 0.0);
          float steppedLight = floor(ndotl * 3.2 + 0.35) / 3.0;
          float direct = steppedLight * litFactor;

          vec3 warmSun = vec3(1.08, 0.84, 0.62);
          vec3 violetAmbient = vec3(0.34, 0.26, 0.48);
          col = albedo * (violetAmbient + warmSun * direct * 0.92);
        }

        col = applyFog(col, rd, hitDist);
      }

      // Cumulus cloud layer below cruise altitude
      if (abs(rd.y) > 0.002) {
        float t0 = (CLOUD_BASE - ro.y) / rd.y;
        float t1 = (CLOUD_TOP - ro.y) / rd.y;
        float tEnter = min(t0, t1);
        float tExit = max(t0, t1);
        if (tExit > 0.0 && tEnter < hitDist) {
          tEnter = max(0.5, tEnter);
          tExit = min(hitDist, min(tExit, 440.0));
          if (tExit > tEnter) {
            float steps = 7.0;
            float dt = (tExit - tEnter) / steps;
            float accum = 0.0;
            vec3 cloudColAccum = vec3(0.0);
            for (int c = 0; c < 7; c++) {
              float tc = tEnter + (float(c) + 0.5) * dt;
              vec3 cp = ro + rd * tc;
              float d = cloudDensity(cp.xz);
              if (d > 0.01) {
                float hFrac = clamp((cp.y - CLOUD_BASE) / (CLOUD_TOP - CLOUD_BASE), 0.0, 1.0);
                // Stepped peach/violet cloud shading
                float shadeBand = floor((hFrac * 0.75 + (1.0 - d) * 0.35) * 3.0) / 2.0;
                vec3 cShadow = vec3(0.52, 0.36, 0.56);
                vec3 cMid = vec3(0.92, 0.58, 0.54);
                vec3 cLight = vec3(1.0, 0.82, 0.66);
                vec3 cCol = shadeBand < 0.5 ? mix(cShadow, cMid, shadeBand * 2.0) : mix(cMid, cLight, (shadeBand - 0.5) * 2.0);

                // Plane shadow cast onto clouds
                vec2 pCloudProj = uPlanePos.xz - SUN_DIR.xz * ((uPlanePos.y - cp.y) / max(SUN_DIR.y, 0.1));
                float pCloudDist = length(cp.xz - pCloudProj);
                if (uPlanePos.y > cp.y && pCloudDist < 2.2) {
                  cCol *= 0.62;
                }

                cCol = applyFog(cCol, rd, tc);
                float alpha = d * 0.42 * (1.0 - accum);
                cloudColAccum += cCol * alpha;
                accum += alpha;
                if (accum > 0.94) break;
              }
            }
            col = col * (1.0 - accum) + cloudColAccum;
          }
        }
      }

      fragColor = vec4(col, 1.0);
    }
  `;

  // 3D Low-Poly Fighter Jet & Missiles Shader (3-tone flat shading + 1px dark outline pass)
  const MESH_VS = `#version 300 es
    layout(location=0) in vec3 aPos;
    layout(location=1) in vec3 aNorm;
    layout(location=2) in vec3 aColor;

    uniform mat4 uViewProj;
    uniform mat4 uModel;
    uniform float uOutline;

    out vec3 vNorm;
    out vec3 vColor;

    void main() {
      vec3 pos = aPos + aNorm * uOutline;
      vec4 worldPos = uModel * vec4(pos, 1.0);
      vNorm = mat3(uModel) * aNorm;
      vColor = aColor;
      gl_Position = uViewProj * worldPos;
    }
  `;

  const MESH_FS = `#version 300 es
    precision mediump float;
    in vec3 vNorm;
    in vec3 vColor;
    out vec4 fragColor;

    uniform float uIsOutline;
    uniform float uEmissive;

    const vec3 SUN_DIR = normalize(vec3(0.84, 0.165, -0.30));

    void main() {
      if (uIsOutline > 0.5) {
        fragColor = vec4(0.07, 0.05, 0.11, 1.0);
        return;
      }
      if (uEmissive > 0.5) {
        fragColor = vec4(vColor, 1.0);
        return;
      }
      vec3 n = normalize(vNorm);
      float ndotl = dot(n, SUN_DIR);
      // 3-tone flat shading
      float tone = ndotl > 0.25 ? 1.15 : (ndotl > -0.25 ? 0.82 : 0.54);
      vec3 tint = ndotl > -0.25 ? vec3(1.04, 0.94, 0.86) : vec3(0.76, 0.68, 0.92);
      fragColor = vec4(vColor * tone * tint, 1.0);
    }
  `;

  // Post-Process Ordered 4x4 Bayer Dithering + Palette Quantization Shader
  const DITHER_FS = `#version 300 es
    precision highp float;
    in vec2 vUv;
    out vec4 fragColor;

    uniform sampler2D uScene;
    uniform vec3 uPalette[36];
    uniform vec2 uRes;

    const float BAYER4[16] = float[16](
       0.0/16.0,  8.0/16.0,  2.0/16.0, 10.0/16.0,
      12.0/16.0,  4.0/16.0, 14.0/16.0,  6.0/16.0,
       3.0/16.0, 11.0/16.0,  1.0/16.0,  9.0/16.0,
      15.0/16.0,  7.0/16.0, 13.0/16.0,  5.0/16.0
    );

    void main() {
      vec3 col = texture(uScene, vUv).rgb;
      ivec2 pix = ivec2(mod(floor(vUv * uRes), 4.0));
      float b = BAYER4[pix.y * 4 + pix.x] - 0.5;
      col = clamp(col + b * 0.095, 0.0, 1.0);

      // Find nearest palette entry
      float bestDist = 1e9;
      vec3 bestCol = uPalette[0];
      for (int i = 0; i < 36; i++) {
        vec3 d = col - uPalette[i];
        float dist = dot(d, d);
        if (dist < bestDist) {
          bestDist = dist;
          bestCol = uPalette[i];
        }
      }
      fragColor = vec4(bestCol, 1.0);
    }
  `;

  const worldProg = createProgram(QUAD_VS, WORLD_FS);
  const meshProg = createProgram(MESH_VS, MESH_FS);
  const ditherProg = createProgram(QUAD_VS, DITHER_FS);

  // Fullscreen quad VAO
  const quadVao = gl.createVertexArray();
  gl.bindVertexArray(quadVao);
  const quadVbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadVbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  // Build Twin-Engine Twin-Tail Low-Poly Fighter Jet Mesh
  function buildFighterMesh() {
    const pos = [], norm = [], col = [];
    function addTri(a, b, c, rgb) {
      const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
      const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
      let nx = uy * vz - uz * vy;
      let ny = uz * vx - ux * vz;
      let nz = ux * vy - uy * vx;
      const len = Math.hypot(nx, ny, nz) || 1;
      nx /= len; ny /= len; nz /= len;
      pos.push(...a, ...b, ...c);
      norm.push(nx, ny, nz, nx, ny, nz, nx, ny, nz);
      col.push(...rgb, ...rgb, ...rgb);
    }
    function addQuad(a, b, c, d, rgb) {
      addTri(a, b, c, rgb);
      addTri(a, c, d, rgb);
    }

    const radome = [0.14, 0.13, 0.22];
    const slate = [0.34, 0.39, 0.48];
    const grey = [0.54, 0.59, 0.67];
    const lightGrey = [0.70, 0.74, 0.80];
    const canopyGold = [0.96, 0.72, 0.26];
    const redCap = [0.85, 0.22, 0.22];
    const nozzleDark = [0.16, 0.14, 0.20];

    // Forward nose cone (+Z is forward)
    const noseTip = [0, 0.0, 2.55];
    const nTop = [0, 0.24, 1.35];
    const nBot = [0, -0.18, 1.35];
    const nLeft = [-0.28, 0.02, 1.35];
    const nRight = [0.28, 0.02, 1.35];
    addTri(noseTip, nRight, nTop, radome);
    addTri(noseTip, nTop, nLeft, radome);
    addTri(noseTip, nLeft, nBot, radome);
    addTri(noseTip, nBot, nRight, radome);

    // Fuselage mid-body (splinter grey/slate)
    const fTopF = [0, 0.30, 0.45], fTopR = [0, 0.28, -1.55];
    const fBotF = [0, -0.22, 0.45], fBotR = [0, -0.20, -1.55];
    const fLF = [-0.46, 0.04, 0.45], fLR = [-0.48, 0.04, -1.55];
    const fRF = [0.46, 0.04, 0.45], fRR = [0.48, 0.04, -1.55];

    addQuad(nTop, nRight, fRF, fTopF, grey);
    addQuad(nLeft, nTop, fTopF, fLF, slate);
    addQuad(nBot, nLeft, fLF, fBotF, grey);
    addQuad(nRight, nBot, fBotF, fRF, slate);

    addQuad(fTopF, fRF, fRR, fTopR, slate);
    addQuad(fLF, fTopF, fTopR, fLR, grey);
    addQuad(fBotF, fLF, fLR, fBotR, slate);
    addQuad(fRF, fBotF, fBotR, fRR, grey);

    // Gold-tinted bubble canopy
    const cFront = [0, 0.27, 1.15];
    const cPeak = [0, 0.56, 0.55];
    const cRear = [0, 0.30, -0.15];
    const cL = [-0.20, 0.28, 0.52];
    const cR = [0.20, 0.28, 0.52];
    addTri(cFront, cR, cPeak, canopyGold);
    addTri(cFront, cPeak, cL, canopyGold);
    addTri(cPeak, cR, cRear, canopyGold);
    addTri(cPeak, cRear, cL, canopyGold);

    // Cropped delta wings (left & right)
    for (const s of [-1, 1]) {
      const rootF = [s * 0.44, 0.05, 0.35];
      const rootR = [s * 0.46, 0.04, -1.35];
      const tipF = [s * 2.15, -0.02, -0.68];
      const tipR = [s * 2.15, -0.02, -1.25];
      const rootFB = [s * 0.44, -0.03, 0.35];
      const rootRB = [s * 0.46, -0.03, -1.35];
      if (s > 0) {
        addQuad(rootF, tipF, tipR, rootR, lightGrey);
        addQuad(rootFB, rootRB, tipR, tipF, slate);
      } else {
        addQuad(rootF, rootR, tipR, tipF, lightGrey);
        addQuad(rootFB, tipF, tipR, rootRB, slate);
      }
      // Horizontal stabilizers
      const hRootF = [s * 0.44, 0.04, -1.45];
      const hRootR = [s * 0.40, 0.04, -2.05];
      const hTipF = [s * 1.15, 0.02, -1.78];
      const hTipR = [s * 1.15, 0.02, -2.05];
      if (s > 0) {
        addQuad(hRootF, hTipF, hTipR, hRootR, grey);
        addQuad(hRootF, hRootR, hTipR, hTipF, slate);
      } else {
        addQuad(hRootF, hRootR, hTipR, hTipF, grey);
        addQuad(hRootF, hTipF, hTipR, hRootR, slate);
      }

      // Canted twin vertical tails with red caps
      const vBaseF = [s * 0.34, 0.22, -1.05];
      const vBaseR = [s * 0.34, 0.20, -1.85];
      const vMidF = [s * 0.56, 0.78, -1.45];
      const vMidR = [s * 0.56, 0.78, -1.88];
      const vTopF = [s * 0.62, 0.94, -1.55];
      const vTopR = [s * 0.62, 0.94, -1.90];
      if (s > 0) {
        addQuad(vBaseF, vMidF, vMidR, vBaseR, grey);
        addQuad(vBaseF, vBaseR, vMidR, vMidF, slate);
        addQuad(vMidF, vTopF, vTopR, vMidR, redCap);
        addQuad(vMidF, vMidR, vTopR, vTopF, redCap);
      } else {
        addQuad(vBaseF, vBaseR, vMidR, vMidF, grey);
        addQuad(vBaseF, vMidF, vMidR, vBaseR, slate);
        addQuad(vMidF, vMidR, vTopR, vTopF, redCap);
        addQuad(vMidF, vTopF, vTopR, vMidR, redCap);
      }

      // Twin engine nozzles
      const nx = s * 0.22;
      const nz0 = -1.55, nz1 = -1.92;
      const r = 0.14;
      const ptsF = [[nx, r, nz0], [nx + r, 0, nz0], [nx, -r, nz0], [nx - r, 0, nz0]];
      const ptsR = [[nx, r * 0.85, nz1], [nx + r * 0.85, 0, nz1], [nx, -r * 0.85, nz1], [nx - r * 0.85, 0, nz1]];
      for (let k = 0; k < 4; k++) {
        const kn = (k + 1) % 4;
        addQuad(ptsF[k], ptsF[kn], ptsR[kn], ptsR[k], nozzleDark);
      }
      addQuad(ptsR[0], ptsR[1], ptsR[2], ptsR[3], [0.98, 0.45, 0.16]);
    }

    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    function makeBuf(arr, loc) {
      const b = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
    }
    makeBuf(pos, 0);
    makeBuf(norm, 1);
    makeBuf(col, 2);
    return { vao, count: pos.length / 3 };
  }

  // Build simple diamond/box mesh for Missiles & Afterburner plumes
  function buildConeMesh(len, rad, tipCol, baseCol) {
    const pos = [], norm = [], col = [];
    function addTri(a, b, c, rgb) {
      const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
      const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const l = Math.hypot(nx, ny, nz) || 1;
      pos.push(...a, ...b, ...c);
      norm.push(nx / l, ny / l, nz / l, nx / l, ny / l, nz / l, nx / l, ny / l, nz / l);
      col.push(...rgb, ...rgb, ...rgb);
    }
    const tip = [0, 0, len];
    const base = [0, 0, -len * 0.3];
    const ring = [[0, rad, 0], [rad, 0, 0], [0, -rad, 0], [-rad, 0, 0]];
    for (let i = 0; i < 4; i++) {
      const j = (i + 1) % 4;
      addTri(tip, ring[j], ring[i], tipCol);
      addTri(base, ring[i], ring[j], baseCol);
    }
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    for (const [arr, loc] of [[pos, 0], [norm, 1], [col, 2]]) {
      const b = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
    }
    return { vao, count: pos.length / 3 };
  }

  const fighterMesh = buildFighterMesh();
  const missileMesh = buildConeMesh(0.65, 0.065, [0.88, 0.24, 0.24], [0.85, 0.85, 0.88]);
  const plumeOuterMesh = buildConeMesh(1.3, 0.14, [0.98, 0.58, 0.18], [0.95, 0.35, 0.15]);
  const plumeCoreMesh = buildConeMesh(0.75, 0.075, [1.0, 0.96, 0.85], [1.0, 0.86, 0.55]);

  // Low-res FBO (~340px high, dynamically scaled)
  let resScale = 1.0;
  let fboW = 604, fboH = 340;
  let sceneFbo = null, sceneTex = null, sceneDepth = null;

  function resizeTargets() {
    const aspect = window.innerWidth / Math.max(1, window.innerHeight);
    fboH = Math.max(180, Math.round(340 * resScale));
    fboW = Math.max(320, Math.round(fboH * aspect));

    glCanvas.width = fboW;
    glCanvas.height = fboH;
    hudCanvas.width = fboW;
    hudCanvas.height = fboH;

    if (sceneTex) gl.deleteTexture(sceneTex);
    if (sceneDepth) gl.deleteRenderbuffer(sceneDepth);
    if (sceneFbo) gl.deleteFramebuffer(sceneFbo);

    sceneTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, fboW, fboH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    sceneDepth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, sceneDepth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, fboW, fboH);

    sceneFbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, sceneDepth);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  resizeTargets();
  window.addEventListener('resize', resizeTargets);

  // Math Helpers
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function v3Cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }
  function v3Norm(a) {
    const l = Math.hypot(a[0], a[1], a[2]) || 1;
    return [a[0] / l, a[1] / l, a[2] / l];
  }
  function mat4Perspective(fovRad, aspect, near, far) {
    const f = 1.0 / Math.tan(fovRad * 0.5);
    const nf = 1.0 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, 2 * far * near * nf, 0
    ]);
  }
  function mat4LookAt(eye, center, up) {
    const f = v3Norm([center[0] - eye[0], center[1] - eye[1], center[2] - eye[2]]);
    const r = v3Norm(v3Cross(f, up));
    const u = v3Cross(r, f);
    return new Float32Array([
      r[0], u[0], -f[0], 0,
      r[1], u[1], -f[1], 0,
      r[2], u[2], -f[2], 0,
      -(r[0] * eye[0] + r[1] * eye[1] + r[2] * eye[2]),
      -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]),
      (f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2]),
      1
    ]);
  }
  function mat4Mul(a, b) {
    const out = new Float32Array(16);
    for (let c = 0; c < 4; c++) {
      for (let r = 0; r < 4; r++) {
        out[c * 4 + r] =
          a[0 * 4 + r] * b[c * 4 + 0] +
          a[1 * 4 + r] * b[c * 4 + 1] +
          a[2 * 4 + r] * b[c * 4 + 2] +
          a[3 * 4 + r] * b[c * 4 + 3];
      }
    }
    return out;
  }
  function mat4FromBasis(pos, right, up, fwd, scale = 1) {
    return new Float32Array([
      right[0] * scale, right[1] * scale, right[2] * scale, 0,
      up[0] * scale,    up[1] * scale,    up[2] * scale,    0,
      fwd[0] * scale,   fwd[1] * scale,   fwd[2] * scale,   0,
      pos[0],           pos[1],           pos[2],           1
    ]);
  }

  // Terrain Height Query on CPU (matches shader exactly)
  const WATER_H = 12.2;
  const TERRAIN_SCALE = 36.0;
  const WORLD_TILE = 420.0;

  function sampleGroundHeight(x, z) {
    if (!heightField) return WATER_H;
    let u = ((x / WORLD_TILE) % 1 + 1) % 1;
    let v = ((z / WORLD_TILE) % 1 + 1) % 1;
    const fx = u * MAP_SIZE;
    const fy = v * MAP_SIZE;
    const ix = Math.floor(fx) & (MAP_SIZE - 1);
    const iy = Math.floor(fy) & (MAP_SIZE - 1);
    const tx = fx - Math.floor(fx);
    const ty = fy - Math.floor(fy);
    const ix1 = (ix + 1) & (MAP_SIZE - 1);
    const iy1 = (iy + 1) & (MAP_SIZE - 1);
    const h00 = heightField[iy * MAP_SIZE + ix];
    const h10 = heightField[iy * MAP_SIZE + ix1];
    const h01 = heightField[iy1 * MAP_SIZE + ix];
    const h11 = heightField[iy1 * MAP_SIZE + ix1];
    const h = lerp(lerp(h00, h10, tx), lerp(h01, h11, tx), ty) * TERRAIN_SCALE;
    return Math.max(h, WATER_H);
  }

  // Web Audio Synthesizer (Muted by default)
  let audioCtx = null;
  let audioEnabled = false;
  let engineGain = null, abGain = null, engineFilter = null;

  function initAudio() {
    if (audioCtx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = new Ctx();

    // Brown/Pink noise buffer for jet engine & afterburner roar
    const bufLen = audioCtx.sampleRate * 2;
    const noiseBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    let lastOut = 0;
    for (let i = 0; i < bufLen; i++) {
      const white = Math.random() * 2 - 1;
      data[i] = (lastOut + 0.04 * white) / 1.04;
      lastOut = data[i];
      data[i] *= 2.5;
    }

    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;

    engineFilter = audioCtx.createBiquadFilter();
    engineFilter.type = 'lowpass';
    engineFilter.frequency.value = 180;

    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0.0;

    src.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    src.start();

    // Afterburner rumble oscillator
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = 54;
    const abFilt = audioCtx.createBiquadFilter();
    abFilt.type = 'lowpass';
    abFilt.frequency.value = 140;
    abGain = audioCtx.createGain();
    abGain.gain.value = 0.0;
    osc.connect(abFilt);
    abFilt.connect(abGain);
    abGain.connect(audioCtx.destination);
    osc.start();
  }

  function playMissileSound() {
    if (!audioEnabled || !audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(620, now);
    osc.frequency.exponentialRampToValueAtTime(110, now + 0.35);
    g.gain.setValueAtTime(0.18, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.4);
  }

  function playExplosionSound(isWater) {
    if (!audioEnabled || !audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = isWater ? 'sine' : 'sawtooth';
    osc.frequency.setValueAtTime(isWater ? 150 : 95, now);
    osc.frequency.exponentialRampToValueAtTime(28, now + 0.65);
    g.gain.setValueAtTime(0.28, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.72);
  }

  audioBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    audioEnabled = !audioEnabled;
    audioBtn.textContent = audioEnabled ? 'SOUND: ON' : 'SOUND: OFF';
  });

  // Aircraft & Game State
  const VIEWS = ['CHASE', 'COCKPIT', 'TOP-DOWN'];
  let viewIdx = 0;
  let camBlend = 0; // 0 = CHASE, 1 = COCKPIT, 2 = TOP-DOWN
  let hasMouseMoved = false;
  let titleDismissed = false;

  const plane = {
    pos: [210, 34.0, 210],
    yaw: 0.45,
    pitch: 0.0,
    bank: 0.0,
    rollAnim: 0.0,
    rollDir: 1,
    speed: 24.0,
    throttle: 0.55,
    afterburner: false,
    gForce: 1.0,
    vsi: 0.0,
    radarAlt: 20.0
  };

  // Hardpoint missiles (4 slots: outer-L, inner-L, inner-R, outer-R)
  const HARDPOINTS = [
    [-1.45, -0.05, -0.45],
    [-0.85, -0.04, -0.25],
    [0.85, -0.04, -0.25],
    [1.45, -0.05, -0.45]
  ];
  const hardpointTimers = [0, 0, 0, 0]; // 0 = ready, >0 = reload countdown
  const activeMissiles = [];
  const trails = []; // wingtip vapor & missile smoke
  const explosions = [];
  const impacts = Array.from({ length: 8 }, () => ({ x: 0, y: 0, z: 0, age: -1, isWater: 0 }));
  let impactCursor = 0;

  function updateMissilePips() {
    for (let i = 0; i < 4; i++) {
      pipEls[i].classList.toggle('empty', hardpointTimers[i] > 0);
    }
  }

  function dismissTitle() {
    if (!titleDismissed) {
      titleDismissed = true;
      titleOverlay.classList.add('hidden');
    }
  }
  titleOverlay.addEventListener('click', dismissTitle);

  function cycleView() {
    dismissTitle();
    viewIdx = (viewIdx + 1) % VIEWS.length;
    viewNameEl.textContent = VIEWS[viewIdx];
  }

  function triggerRoll() {
    dismissTitle();
    if (plane.rollAnim <= 0.001) {
      plane.rollAnim = 0.002;
      plane.rollDir = mouseNorm.x >= 0 ? 1 : -1;
    }
  }

  function fireMissile() {
    dismissTitle();
    // Pick next loaded hardpoint
    let slot = -1;
    for (let i = 0; i < 4; i++) {
      if (hardpointTimers[i] <= 0) { slot = i; break; }
    }
    if (slot === -1) return;

    hardpointTimers[slot] = 4.5;
    updateMissilePips();
    playMissileSound();

    const basis = getPlaneBasis();
    const hp = HARDPOINTS[slot];
    const startPos = [
      plane.pos[0] + basis.right[0] * hp[0] + basis.up[0] * hp[1] + basis.fwd[0] * hp[2],
      plane.pos[1] + basis.right[1] * hp[0] + basis.up[1] * hp[1] + basis.fwd[1] * hp[2],
      plane.pos[2] + basis.right[2] * hp[0] + basis.up[2] * hp[1] + basis.fwd[2] * hp[2]
    ];

    // If level flight, angle slightly downward toward forward ground; otherwise fly along nose
    const aimPitch = plane.pitch > -0.06 ? plane.pitch - 0.14 : plane.pitch;
    const dir = v3Norm([
      Math.sin(plane.yaw) * Math.cos(aimPitch),
      Math.sin(aimPitch),
      Math.cos(plane.yaw) * Math.cos(aimPitch)
    ]);

    activeMissiles.push({
      pos: startPos,
      dir,
      speed: plane.speed + 48.0,
      life: 4.5
    });
  }

  // Input Handling (Mouse + Keyboard + Touch; Left & Right buttons work independently)
  const mouseNorm = { x: 0, y: 0 };
  const mouseClient = { x: window.innerWidth * 0.5, y: window.innerHeight * 0.5 };
  let leftDown = false;
  let leftDownTime = 0;

  window.addEventListener('mousemove', (e) => {
    mouseClient.x = e.clientX;
    mouseClient.y = e.clientY;
    mouseNorm.x = clamp((e.clientX / window.innerWidth) * 2 - 1, -1, 1);
    mouseNorm.y = clamp((e.clientY / window.innerHeight) * 2 - 1, -1, 1);

      hasMouseMoved = true;
      dismissTitle();
    }

  window.addEventListener('mousedown', (e) => {
    if (e.target === audioBtn) return;
    dismissTitle();
    if (e.button === 0) {
      leftDown = true;
      leftDownTime = performance.now();
      plane.afterburner = true;
    } else if (e.button === 2) {
      fireMissile();
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (e.button === 0) {

        triggerRoll();
