      plane.afterburner = false;
    }
  });

  window.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      cycleView();
    } else if (e.code === 'KeyF') {
      fireMissile();
    } else if (e.code === 'KeyR') {
      triggerRoll();
    } else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
      plane.afterburner = true;
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
      if (!leftDown) plane.afterburner = false;
    }
  });

  // Touch Controls
  const joyZone = document.getElementById('joyZone');
  const joyKnob = document.getElementById('joyKnob');
  let joyTouchId = null;

  joyZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    dismissTitle();
    hasMouseMoved = true;
    const t = e.changedTouches[0];
    joyTouchId = t.identifier;
    updateJoy(t);
  }, { passive: false });

  joyZone.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === joyTouchId) updateJoy(t);
    }
  }, { passive: false });

  joyZone.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyTouchId) {
        joyTouchId = null;
        mouseNorm.x = 0;
        mouseNorm.y = 0;
        joyKnob.style.transform = 'translate(0px, 0px)';
      }
    }
  });

  function updateJoy(t) {
    const rect = joyZone.getBoundingClientRect();
    const cx = rect.left + rect.width * 0.5;
    const cy = rect.top + rect.height * 0.5;
    const maxR = rect.width * 0.42;
    const dx = clamp((t.clientX - cx) / maxR, -1, 1);
    const dy = clamp((t.clientY - cy) / maxR, -1, 1);
    mouseNorm.x = dx;
    mouseNorm.y = dy;
    joyKnob.style.transform = `translate(${dx * maxR * 0.7}px, ${dy * maxR * 0.7}px)`;
  }

  document.getElementById('btnCam').addEventListener('touchstart', (e) => { e.preventDefault(); cycleView(); }, { passive: false });
  document.getElementById('btnFire').addEventListener('touchstart', (e) => { e.preventDefault(); fireMissile(); }, { passive: false });
  document.getElementById('btnRoll').addEventListener('touchstart', (e) => { e.preventDefault(); triggerRoll(); }, { passive: false });
  const btnBoost = document.getElementById('btnBoost');
  btnBoost.addEventListener('touchstart', (e) => { e.preventDefault(); dismissTitle(); plane.afterburner = true; btnBoost.classList.add('active'); }, { passive: false });
  btnBoost.addEventListener('touchend', (e) => { e.preventDefault(); plane.afterburner = false; btnBoost.classList.remove('active'); }, { passive: false });

  function getPlaneBasis() {
    const cy = Math.cos(plane.yaw), sy = Math.sin(plane.yaw);
    const cp = Math.cos(plane.pitch), sp = Math.sin(plane.pitch);
    const fwd = [sy * cp, sp, cy * cp];
    const worldUp = [0, 1, 0];
    let right = v3Norm(v3Cross(worldUp, fwd));
    let up = v3Cross(fwd, right);

    const totalRoll = plane.bank + (plane.rollAnim > 0 ? plane.rollAnim * Math.PI * 2 * plane.rollDir : 0);
    const cr = Math.cos(totalRoll), sr = Math.sin(totalRoll);
    const rRolled = [
      right[0] * cr + up[0] * sr,
      right[1] * cr + up[1] * sr,
      right[2] * cr + up[2] * sr
    ];
    const uRolled = [
      up[0] * cr - right[0] * sr,
      up[1] * cr - right[1] * sr,
      up[2] * cr - right[2] * sr
    ];
    return { fwd, right: rRolled, up: uRolled };
  }

  // Camera State for Smooth ~1.0s Transitions
  let camPos = [210, 36, 198];
  let camLook = [210, 34, 220];
  let camUp = [0, 1, 0];
  let camInitialized = false;

  function computeTargetCamera(basis) {
    const p = plane.pos;
    if (viewIdx === 0) {
      // CHASE
      const eye = [
        p[0] - basis.fwd[0] * 8.2 + basis.up[0] * 1.95,
        p[1] - basis.fwd[1] * 8.2 + basis.up[1] * 1.95 + 0.55,
        p[2] - basis.fwd[2] * 8.2 + basis.up[2] * 1.95
      ];
      const look = [
        p[0] + basis.fwd[0] * 18.0,
        p[1] + basis.fwd[1] * 18.0 + 0.4,
        p[2] + basis.fwd[2] * 18.0
      ];
      const up = v3Norm([basis.up[0] * 0.35, 1.0, basis.up[2] * 0.35]);
      return { eye, look, up, fov: 58 };
    } else if (viewIdx === 1) {
      // COCKPIT
      const eye = [
        p[0] + basis.fwd[0] * 0.72 + basis.up[0] * 0.42,
        p[1] + basis.fwd[1] * 0.72 + basis.up[1] * 0.42,
        p[2] + basis.fwd[2] * 0.72 + basis.up[2] * 0.42
      ];
      const look = [
        eye[0] + basis.fwd[0] * 30.0,
        eye[1] + basis.fwd[1] * 30.0,
        eye[2] + basis.fwd[2] * 30.0
      ];
      return { eye, look, up: basis.up, fov: 64 };
    } else {
      // TOP-DOWN (North-Up)
      const eye = [p[0], p[1] + 54.0, p[2] - 2.0];
      const look = [p[0], p[1], p[2]];
      return { eye, look, up: [0, 0, 1], fov: 55 };
    }
  }

  // Canvas 2D Cockpit & HUD Renderer
  function drawHudAndCockpit(time, basis, viewProj) {
    const w = fboW;
    const h = fboH;
    hudCtx.clearRect(0, 0, w, h);

    // Project 3D world point to 2D pixel coords
    function project3D(pt) {
      const cx = viewProj[0] * pt[0] + viewProj[4] * pt[1] + viewProj[8] * pt[2] + viewProj[12];
      const cy = viewProj[1] * pt[0] + viewProj[5] * pt[1] + viewProj[9] * pt[2] + viewProj[13];
      const cw = viewProj[3] * pt[0] + viewProj[7] * pt[1] + viewProj[11] * pt[2] + viewProj[15];
      if (cw <= 0.05) return null;
      return [(cx / cw * 0.5 + 0.5) * w, (1.0 - (cy / cw * 0.5 + 0.5)) * h];
    }

    // Draw Wingtip Vapor Trails
    hudCtx.fillStyle = 'rgba(247, 239, 242, 0.78)';
    for (const tr of trails) {
      const s = project3D(tr.pos);
      if (!s) continue;
      if (tr.type === 'vapor') {
        hudCtx.fillStyle = `rgba(247, 239, 242, ${tr.alpha.toFixed(2)})`;
        hudCtx.fillRect(Math.round(s[0]), Math.round(s[1]), 2, 2);
      } else if (tr.type === 'smoke') {
        const sz = Math.max(2, Math.round((1.0 - tr.alpha) * 5 + 2));
        hudCtx.fillStyle = tr.ember
          ? `rgba(252, 196, 93, ${tr.alpha.toFixed(2)})`
          : `rgba(218, 200, 212, ${(tr.alpha * 0.75).toFixed(2)})`;
        hudCtx.fillRect(Math.round(s[0] - sz * 0.5), Math.round(s[1] - sz * 0.5), sz, sz);
      }
    }

    // Draw Explosions (Flash, Fireball, Expanding Shock Ring, Water Plume)
    for (const ex of explosions) {
      const s = project3D(ex.pos);
      if (!s) continue;
      const t = ex.age / ex.maxAge;
      const sx = Math.round(s[0]);
      const sy = Math.round(s[1]);

      // Expanding shock ring
      if (t < 0.55) {
        const rad = Math.round(4 + t * 56);
        hudCtx.strokeStyle = ex.isWater ? 'rgba(247, 239, 242, 0.8)' : 'rgba(255, 220, 145, 0.85)';
        hudCtx.lineWidth = 1;
        hudCtx.beginPath();
        hudCtx.arc(sx, sy, rad, 0, Math.PI * 2);
        hudCtx.stroke();
      }

      if (ex.isWater) {
        // Water spray column
        const colH = Math.round(Math.sin(Math.min(1, t * 1.4) * Math.PI) * 28);
        const colW = Math.round(6 + t * 14);
        hudCtx.fillStyle = '#f7eff2';
        hudCtx.fillRect(sx - 3, sy - colH, 6, colH);
        hudCtx.fillStyle = '#94c9be';
        hudCtx.fillRect(sx - Math.floor(colW / 2), sy - Math.floor(colH * 0.55), colW, Math.floor(colH * 0.55));
      } else {
        // Flash & Fireball
        if (t < 0.14) {
          hudCtx.fillStyle = '#fff0d6';
          hudCtx.fillRect(sx - 12, sy - 12, 24, 24);
        }
        if (t < 0.75) {
          const r = Math.round((1.0 - t * 0.7) * 14);
          hudCtx.fillStyle = '#b84b2c';
          hudCtx.fillRect(sx - r, sy - r, r * 2, r * 2);
          hudCtx.fillStyle = '#f5983b';
          const r2 = Math.max(2, Math.floor(r * 0.65));
          hudCtx.fillRect(sx - r2, sy - r2, r2 * 2, r2 * 2);
        }
      }
    }

    // Top-Down target reticle when steering
    if (viewIdx === 2 && hasMouseMoved) {
      const mx = Math.round(mouseClient.x * (w / window.innerWidth));
      const my = Math.round(mouseClient.y * (h / window.innerHeight));
      hudCtx.strokeStyle = 'rgba(255, 214, 153, 0.75)';
      hudCtx.strokeRect(mx - 5, my - 5, 10, 10);
    }

    // COCKPIT & HUD OVERLAY (Fades in cleanly in Cockpit view)
    if (viewIdx !== 1) return;

    const cx = Math.floor(w * 0.5);
    const cy = Math.floor(h * 0.44);

    // 1. HEAD-UP DISPLAY (HUD) — Pitch ladder aligned to true exterior horizon
    const hudCol = '#72ff9f';
    const hudDim = 'rgba(114, 255, 159, 0.42)';
    hudCtx.strokeStyle = hudCol;
    hudCtx.fillStyle = hudCol;
    hudCtx.font = '8px "Share Tech Mono", monospace';
    hudCtx.lineWidth = 1;

    // Velocity vector / gun cross
    hudCtx.strokeRect(cx - 2, cy - 2, 4, 4);
    hudCtx.beginPath();
    hudCtx.moveTo(cx - 10, cy); hudCtx.lineTo(cx - 4, cy);
    hudCtx.moveTo(cx + 4, cy); hudCtx.lineTo(cx + 10, cy);
    hudCtx.moveTo(cx, cy - 8); hudCtx.lineTo(cx, cy - 4);
    hudCtx.stroke();

    // True horizon + pitch ladder
    const totalRoll = plane.bank + (plane.rollAnim > 0 ? plane.rollAnim * Math.PI * 2 * plane.rollDir : 0);
    const fovRad = 64 * Math.PI / 180;
    const pxPerRad = (h * 0.5) / Math.tan(fovRad * 0.5);

    hudCtx.save();
    hudCtx.translate(cx, cy);
    hudCtx.rotate(-totalRoll);
    for (let deg = -30; deg <= 30; deg += 10) {
      const rad = deg * Math.PI / 180;
      const dy = (plane.pitch - rad) * pxPerRad;
      if (Math.abs(dy) > h * 0.34) continue;
      const halfW = deg === 0 ? 54 : 26;
      hudCtx.strokeStyle = deg === 0 ? hudCol : hudDim;
      hudCtx.beginPath();
      hudCtx.moveTo(-halfW, dy); hudCtx.lineTo(-12, dy);
      hudCtx.moveTo(12, dy); hudCtx.lineTo(halfW, dy);
      hudCtx.stroke();
      if (deg !== 0) {
        hudCtx.fillText(String(Math.abs(deg)), halfW + 3, dy + 3);
      }
    }
    hudCtx.restore();

    // Heading tape at top
    const hdgDeg = Math.round(((plane.yaw * 180 / Math.PI) % 360 + 360) % 360);
    hudCtx.strokeStyle = hudCol;
    hudCtx.beginPath();
    hudCtx.moveTo(cx - 55, 22); hudCtx.lineTo(cx + 55, 22);
    hudCtx.moveTo(cx, 22); hudCtx.lineTo(cx, 26);
    hudCtx.stroke();
    hudCtx.fillText(String(hdgDeg).padStart(3, '0') + '°', cx - 10, 18);

    // Left tape: Airspeed (KTS) & G-load
    const kts = Math.round(plane.speed * 18.5);
    hudCtx.strokeRect(cx - 115, cy - 10, 32, 13);
    hudCtx.fillText(String(kts), cx - 111, cy - 1);
    hudCtx.fillText('G ' + plane.gForce.toFixed(1), cx - 115, cy + 16);

    // Right tape: Altitude (FT) & Radar Altitude
    const altFt = Math.round(plane.pos[1] * 85);
    const radFt = Math.round(plane.radarAlt * 85);
    hudCtx.strokeRect(cx + 83, cy - 10, 36, 13);
    hudCtx.fillText(String(altFt), cx + 86, cy - 1);
    hudCtx.fillText('R ' + radFt, cx + 83, cy + 16);

    // Missile count & low-altitude pull-up warning on HUD
    const readyCount = hardpointTimers.filter(t => t <= 0).length;
    hudCtx.fillText('MSL ' + readyCount + '/4', cx - 115, cy + 28);
    if (plane.radarAlt < 4.5 && Math.floor(time * 8) % 2 === 0) {
      hudCtx.fillStyle = '#ff9838';
      hudCtx.fillText('PULL UP', cx - 18, cy + 26);
      hudCtx.fillStyle = hudCol;
    }

    // 2. HAND-DRAWN PIXEL COCKPIT INSTRUMENT DASHBOARD
    const dashTop = Math.floor(h * 0.66);
    const dashH = h - dashTop;

    // Canopy bow struts
    hudCtx.strokeStyle = '#141022';
    hudCtx.lineWidth = 4;
    hudCtx.beginPath();
    hudCtx.moveTo(0, Math.floor(h * 0.25));
    hudCtx.lineTo(Math.floor(w * 0.14), dashTop + 8);
    hudCtx.moveTo(w, Math.floor(h * 0.25));
    hudCtx.lineTo(Math.floor(w * 0.86), dashTop + 8);
    hudCtx.stroke();

    // Glare shield & main panel housing
    hudCtx.fillStyle = '#181426';
    hudCtx.fillRect(0, dashTop, w, dashH);
    hudCtx.fillStyle = '#262138';
    hudCtx.fillRect(10, dashTop + 3, w - 20, 4);
    hudCtx.fillStyle = '#100d1a';
    hudCtx.fillRect(14, dashTop + 8, w - 28, dashH - 8);

    // Helper for circular dial
    function drawDial(dx, dy, r, label, angleRad, valText) {
      hudCtx.fillStyle = '#0b0912';
      hudCtx.beginPath();
      hudCtx.arc(dx, dy, r, 0, Math.PI * 2);
      hudCtx.fill();
      hudCtx.strokeStyle = '#4c4466';
      hudCtx.lineWidth = 1;
      hudCtx.stroke();

      for (let t = 0; t < 12; t++) {
        const a = (t / 12) * Math.PI * 2;
        hudCtx.beginPath();
        hudCtx.moveTo(dx + Math.cos(a) * (r - 3), dy + Math.sin(a) * (r - 3));
        hudCtx.lineTo(dx + Math.cos(a) * (r - 1), dy + Math.sin(a) * (r - 1));
        hudCtx.stroke();
      }
      // Needle
      hudCtx.strokeStyle = '#ffd699';
      hudCtx.beginPath();
      hudCtx.moveTo(dx, dy);
      hudCtx.lineTo(dx + Math.cos(angleRad) * (r - 3), dy + Math.sin(angleRad) * (r - 3));
      hudCtx.stroke();

      hudCtx.fillStyle = '#9e8b99';
      hudCtx.fillText(label, dx - 9, dy - r + 8);
      if (valText) {
        hudCtx.fillStyle = '#f5983b';
        hudCtx.fillText(valText, dx - 11, dy + r - 3);
      }
    }

    const row1Y = dashTop + 26;
    const row2Y = dashTop + 62;

    // Airspeed Indicator (ASI)
    drawDial(cx - 118, row1Y, 17, 'ASI', (kts / 800) * Math.PI * 1.7 - Math.PI * 0.85, String(kts));

    // Artificial Horizon (ADI)
    const adiX = cx - 72, adiY = row1Y, adiR = 19;
    hudCtx.save();
    hudCtx.beginPath();
    hudCtx.arc(adiX, adiY, adiR, 0, Math.PI * 2);
    hudCtx.clip();
    hudCtx.translate(adiX, adiY);
    hudCtx.rotate(-totalRoll);
    const pShift = clamp(plane.pitch * 24, -14, 14);
    hudCtx.fillStyle = '#3d788f';
    hudCtx.fillRect(-24, -24, 48, 24 + pShift);
    hudCtx.fillStyle = '#70442c';
    hudCtx.fillRect(-24, pShift, 48, 24 - pShift);
    hudCtx.strokeStyle = '#fff0d6';
    hudCtx.beginPath();
    hudCtx.moveTo(-22, pShift); hudCtx.lineTo(22, pShift);
    hudCtx.stroke();
    hudCtx.restore();
    hudCtx.strokeStyle = '#f5983b';
    hudCtx.strokeRect(adiX - 5, adiY - 1, 10, 2);

    // Altimeter with numeric readout
    drawDial(cx - 26, row1Y, 17, 'ALT', (altFt / 4000) * Math.PI * 2 - Math.PI * 0.5, String(altFt));

    // Turn & Slip Coordinator
    const tsX = cx - 118, tsY = row2Y;
    drawDial(tsX, tsY, 15, 'TRN', clamp(mouseNorm.x * 0.9, -1, 1) - Math.PI * 0.5, '');
    hudCtx.fillStyle = '#262138';
    hudCtx.fillRect(tsX - 11, tsY + 6, 22, 4);
    hudCtx.fillStyle = '#fff0d6';
    hudCtx.fillRect(tsX - 2 + Math.round(clamp(mouseNorm.x * 6, -7, 7)), tsY + 6, 4, 4);

    // Heading Compass Rose
    drawDial(cx - 72, tsY, 16, 'HDG', plane.yaw - Math.PI * 0.5, String(hdgDeg).padStart(3, '0'));

    // Vertical Speed Indicator (VSI)
    drawDial(cx - 26, tsY, 15, 'VSI', clamp(plane.vsi * 0.14, -1.3, 1.3) + Math.PI, '');

    // Center Amber Ground-Mapping Terrain Radar Strip Sweep
    const radX = cx + 6, radY = dashTop + 11, radW = 68, radH = 62;
    hudCtx.fillStyle = '#120a04';
    hudCtx.fillRect(radX, radY, radW, radH);
    hudCtx.strokeStyle = '#8a4b14';
    hudCtx.strokeRect(radX, radY, radW, radH);

    // Sample live forward terrain elevation onto radar strip
    const sweepCol = Math.floor((time * 42) % radW);
    for (let rx = 0; rx < radW; rx += 2) {
      const scanDist = 8 + (rx / radW) * 140;
      const sx = plane.pos[0] + Math.sin(plane.yaw) * scanDist;
      const sz = plane.pos[2] + Math.cos(plane.yaw) * scanDist;
      const gh = sampleGroundHeight(sx, sz);
      const normH = clamp((gh - WATER_H) / 20.0, 0.0, 1.0);
      const barH = Math.max(2, Math.round(normH * (radH - 10)));
      const isSweep = Math.abs(rx - sweepCol) <= 2;
      hudCtx.fillStyle = isSweep ? '#ffd699' : (gh <= WATER_H + 0.05 ? '#3b1e08' : '#d9781e');
      hudCtx.fillRect(radX + rx, radY + radH - 2 - barH, 2, barH);
    }
    hudCtx.fillStyle = '#f5983b';
    hudCtx.fillText('GND RDR', radX + 4, radY + 9);

    // Engine Gauges (RPM / EGT vertical bars)
    const engX = cx + 82, engY = dashTop + 12;
    hudCtx.fillStyle = '#0d0a16';
    hudCtx.fillRect(engX, engY, 34, 42);
    hudCtx.strokeStyle = '#4c4466';
    hudCtx.strokeRect(engX, engY, 34, 42);
    const rpmFrac = plane.afterburner ? 1.0 : 0.72;
    const egtFrac = plane.afterburner ? 0.94 : 0.62;
    hudCtx.fillStyle = plane.afterburner ? '#ff6a33' : '#f5983b';
    hudCtx.fillRect(engX + 5, engY + 38 - Math.round(rpmFrac * 26), 8, Math.round(rpmFrac * 26));
    hudCtx.fillRect(engX + 20, engY + 38 - Math.round(egtFrac * 26), 8, Math.round(egtFrac * 26));
    hudCtx.fillStyle = '#9e8b99';
    hudCtx.fillText('RPM EGT', engX + 2, engY + 9);

    // Local Time Clock
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    hudCtx.fillStyle = '#0b0912';
    hudCtx.fillRect(engX, engY + 46, 34, 15);
    hudCtx.strokeStyle = '#4c4466';
    hudCtx.strokeRect(engX, engY + 46, 34, 15);
    hudCtx.fillStyle = '#ffd699';
    hudCtx.fillText(hh + ':' + mm, engX + 4, engY + 56);

    // Warning Annunciator Lights
    const warnX = cx + 122, warnY = dashTop + 12;
    const warns = [
      { txt: 'AB', active: plane.afterburner, col: '#ff8c38' },
      { txt: 'LOW', active: plane.radarAlt < 4.5, col: '#ff3b3b' },
      { txt: 'MSL', active: readyCount === 0, col: '#f5b83b' }
    ];
    warns.forEach((wn, idx) => {
      const wy = warnY + idx * 14;
      hudCtx.fillStyle = wn.active ? wn.col : '#1c172b';
      hudCtx.fillRect(warnX, wy, 24, 11);
      hudCtx.fillStyle = wn.active ? '#120a14' : '#574e6e';
      hudCtx.fillText(wn.txt, warnX + 3, wy + 8);
    });

    // Moving Throttle Lever on left console
    const thrX = 22, thrY = dashTop + 14, thrH = 54;
    hudCtx.fillStyle = '#0b0912';
    hudCtx.fillRect(thrX, thrY, 10, thrH);
    hudCtx.strokeStyle = '#4c4466';
    hudCtx.strokeRect(thrX, thrY, 10, thrH);
    const knobY = thrY + thrH - 8 - Math.round((plane.afterburner ? 1.0 : 0.52) * (thrH - 12));
    hudCtx.fillStyle = plane.afterburner ? '#f5983b' : '#a8b5c7';
    hudCtx.fillRect(thrX - 3, knobY, 16, 7);
  }

  // Spawn & Start Terrain Worker
  const workerBlob = new Blob([workerSrc], { type: 'application/javascript' });
  const workerUrl = URL.createObjectURL(workerBlob);
  const worker = new Worker(workerUrl);

  worker.onmessage = (e) => {
    const msg = e.data;
    if (msg.type === 'progress') {
      loadBar.style.width = msg.pct + '%';
      loadStep.textContent = msg.label;
    } else if (msg.type === 'done') {
      heightField = msg.height;
      terrainTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, terrainTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, MAP_SIZE, MAP_SIZE, 0, gl.RGBA, gl.UNSIGNED_BYTE, msg.packed);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);

      loadBar.style.width = '100%';
      setTimeout(() => {
        loadOverlay.classList.add('done');
        titleOverlay.classList.remove('hidden');
      }, 150);
      worker.terminate();
      URL.revokeObjectURL(workerUrl);
      requestAnimationFrame(loop);
    }
  };
  worker.postMessage({ size: MAP_SIZE });

  // Uniform Locations
  const uWorld = {
    terrain: gl.getUniformLocation(worldProg, 'uTerrain'),
    camPos: gl.getUniformLocation(worldProg, 'uCamPos'),
    camFwd: gl.getUniformLocation(worldProg, 'uCamFwd'),
    camRight: gl.getUniformLocation(worldProg, 'uCamRight'),
    camUp: gl.getUniformLocation(worldProg, 'uCamUp'),
    fovTan: gl.getUniformLocation(worldProg, 'uFovTan'),
    aspect: gl.getUniformLocation(worldProg, 'uAspect'),
    time: gl.getUniformLocation(worldProg, 'uTime'),
    planePos: gl.getUniformLocation(worldProg, 'uPlanePos'),
    planeAlt: gl.getUniformLocation(worldProg, 'uPlaneAlt'),
    impacts: gl.getUniformLocation(worldProg, 'uImpacts'),
    impactType: gl.getUniformLocation(worldProg, 'uImpactType')
  };

  const uMesh = {
    viewProj: gl.getUniformLocation(meshProg, 'uViewProj'),
    model: gl.getUniformLocation(meshProg, 'uModel'),
    outline: gl.getUniformLocation(meshProg, 'uOutline'),
    isOutline: gl.getUniformLocation(meshProg, 'uIsOutline'),
    emissive: gl.getUniformLocation(meshProg, 'uEmissive')
  };

  const uDither = {
    scene: gl.getUniformLocation(ditherProg, 'uScene'),
    palette: gl.getUniformLocation(ditherProg, 'uPalette'),
    res: gl.getUniformLocation(ditherProg, 'uRes')
  };

  const paletteFlat = new Float32Array(36 * 3);
  for (let i = 0; i < 36; i++) {
    paletteFlat[i * 3 + 0] = PALETTE_RGB[i][0] / 255;
    paletteFlat[i * 3 + 1] = PALETTE_RGB[i][1] / 255;
    paletteFlat[i * 3 + 2] = PALETTE_RGB[i][2] / 255;
  }

  // Main Simulation & Render Loop
  let lastTime = performance.now();
  let slowFrames = 0;
  let trailAccum = 0;

  function loop(now) {
    const rawDt = (now - lastTime) * 0.001;
    lastTime = now;
    const dt = Math.min(rawDt, 0.05);
    const time = now * 0.001;

    // Auto-lower internal resolution if integrated GPU slows down
    if (rawDt > 0.036 && resScale > 0.65) {
      slowFrames++;
      if (slowFrames > 28) {
        resScale = Math.max(0.65, resScale - 0.15);
        resizeTargets();
        slowFrames = 0;
      }
    } else {
      slowFrames = Math.max(0, slowFrames - 1);
    }

    // 1. Flight Physics & Arcade Auto-Pullup
    const prevY = plane.pos[1];
    const targetSpeed = plane.afterburner ? 42.0 : 23.5;
    plane.speed = lerp(plane.speed, targetSpeed, dt * 2.8);

    if (audioEnabled && engineGain && abGain && engineFilter) {
      engineGain.gain.setTargetAtTime(plane.afterburner ? 0.14 : 0.075, audioCtx.currentTime, 0.08);
      engineFilter.frequency.setTargetAtTime(plane.afterburner ? 420 : 190, audioCtx.currentTime, 0.08);
      abGain.gain.setTargetAtTime(plane.afterburner ? 0.11 : 0.0, audioCtx.currentTime, 0.06);
    }

    let turnInput = 0;
    let pitchInput = 0;

    if (!hasMouseMoved) {
      // Lazy S-turns before player moves mouse
      turnInput = Math.sin(time * 0.55) * 0.34;
      pitchInput = Math.cos(time * 0.42) * 0.08;
    } else if (viewIdx === 2) {
      // Top-down: steer aircraft toward cursor
      const nx = mouseNorm.x;
      const ny = -mouseNorm.y;
      if (Math.hypot(nx, ny) > 0.06) {
        const desiredYaw = Math.atan2(nx, ny);
        let diff = desiredYaw - plane.yaw;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        turnInput = clamp(diff * 1.8, -1, 1);
      }
      pitchInput = 0.0;
    } else {
      // Chase & Cockpit: cursor offset from center sets turn & climb/dive
      turnInput = mouseNorm.x;
      pitchInput = -mouseNorm.y;
    }

    const prevYaw = plane.yaw;
    const prevPitch = plane.pitch;
    plane.yaw += turnInput * 1.45 * dt;
    const targetPitch = clamp(pitchInput * 0.78, -0.75, 0.78);
    plane.pitch = lerp(plane.pitch, targetPitch, dt * 3.4);
    plane.bank = lerp(plane.bank, -turnInput * 0.92, dt * 4.5);

    if (plane.rollAnim > 0) {
      plane.rollAnim += dt * 1.45;
      if (plane.rollAnim >= 1.0) plane.rollAnim = 0.0;
    }

    const basis = getPlaneBasis();
    plane.pos[0] += basis.fwd[0] * plane.speed * dt;
    plane.pos[1] += basis.fwd[1] * plane.speed * dt;
    plane.pos[2] += basis.fwd[2] * plane.speed * dt;

    // Terrain avoidance auto-pullup
    const gAhead1 = sampleGroundHeight(plane.pos[0], plane.pos[2]);
    const gAhead2 = sampleGroundHeight(plane.pos[0] + basis.fwd[0] * 14, plane.pos[2] + basis.fwd[2] * 14);
    const minSafeY = Math.max(gAhead1, gAhead2) + 2.4;
    if (plane.pos[1] < minSafeY) {
      plane.pos[1] = lerp(plane.pos[1], minSafeY + 1.2, dt * 7.5);
      plane.pitch = Math.max(plane.pitch, 0.22);
    }
    plane.pos[1] = Math.min(plane.pos[1], 76.0);

    plane.radarAlt = Math.max(0.2, plane.pos[1] - gAhead1);
    plane.vsi = (plane.pos[1] - prevY) / Math.max(dt, 1e-4);
    const yawRate = (plane.yaw - prevYaw) / Math.max(dt, 1e-4);
    const pitchRate = (plane.pitch - prevPitch) / Math.max(dt, 1e-4);
    plane.gForce = clamp(1.0 + (pitchRate * plane.speed) / 14.0 + Math.abs(yawRate) * 0.9, 0.3, 7.5);

    // 2. Missiles, Reloading & Trails
    for (let i = 0; i < 4; i++) {
      if (hardpointTimers[i] > 0) {
        hardpointTimers[i] = Math.max(0, hardpointTimers[i] - dt);
        if (hardpointTimers[i] === 0) updateMissilePips();
      }
    }

    for (let i = activeMissiles.length - 1; i >= 0; i--) {
      const m = activeMissiles[i];
      m.life -= dt;
      m.pos[0] += m.dir[0] * m.speed * dt;
      m.pos[1] += m.dir[1] * m.speed * dt;
      m.pos[2] += m.dir[2] * m.speed * dt;

      trails.push({
        pos: [m.pos[0], m.pos[1], m.pos[2]],
        type: 'smoke',
        ember: true,
        alpha: 0.95,
        vy: 0.4
      });

      const gh = sampleGroundHeight(m.pos[0], m.pos[2]);
      if (m.pos[1] <= gh || m.life <= 0) {
        const isWater = gh <= WATER_H + 0.05 ? 1 : 0;
        const hitPos = [m.pos[0], gh, m.pos[2]];
        explosions.push({ pos: hitPos, age: 0, maxAge: 1.5, isWater: isWater > 0 });
        playExplosionSound(isWater > 0);

        impacts[impactCursor] = { x: hitPos[0], y: hitPos[1], z: hitPos[2], age: 0, isWater };
        impactCursor = (impactCursor + 1) % 8;

        for (let s = 0; s < 10; s++) {
          trails.push({
            pos: [
              hitPos[0] + (Math.random() - 0.5) * 2.2,
              hitPos[1] + Math.random() * 1.4,
              hitPos[2] + (Math.random() - 0.5) * 2.2
            ],
            type: 'smoke',
            ember: !isWater && s < 4,
            alpha: 0.92,
            vy: 1.6 + Math.random() * 1.5
          });
        }
        activeMissiles.splice(i, 1);
      }
    }

    for (let i = 0; i < 8; i++) {
      if (impacts[i].age >= 0) {
        impacts[i].age += dt;
        if (impacts[i].age > 24.0) impacts[i].age = -1;
      }
    }

    for (let i = explosions.length - 1; i >= 0; i--) {
      explosions[i].age += dt;
      if (explosions[i].age >= explosions[i].maxAge) explosions.splice(i, 1);
    }

    // Wingtip vapor trails
    trailAccum += dt;
    if (trailAccum >= 0.024) {
      trailAccum = 0;
      for (const side of [-1, 1]) {
        trails.push({
          pos: [
            plane.pos[0] + basis.right[0] * (side * 2.12) - basis.fwd[0] * 1.15,
            plane.pos[1] + basis.right[1] * (side * 2.12) - basis.fwd[1] * 1.15,
            plane.pos[2] + basis.right[2] * (side * 2.12) - basis.fwd[2] * 1.15
          ],
          type: 'vapor',
          ember: false,
          alpha: plane.afterburner ? 0.85 : 0.55,
          vy: 0
        });
      }
    }

    for (let i = trails.length - 1; i >= 0; i--) {
      const tr = trails[i];
      tr.alpha -= dt * (tr.type === 'vapor' ? 0.85 : 0.42);
      tr.pos[1] += tr.vy * dt;
      if (tr.alpha <= 0) trails.splice(i, 1);
    }

    // 3. Smooth ~1.0s Camera Interpolation
    const targetCam = computeTargetCamera(basis);
    if (!camInitialized) {
      camPos = [...targetCam.eye];
      camLook = [...targetCam.look];
      camUp = [...targetCam.up];
      camInitialized = true;
    } else {
      const camLerp = 1.0 - Math.exp(-dt * 4.2);
      for (let k = 0; k < 3; k++) {
        camPos[k] = lerp(camPos[k], targetCam.eye[k], camLerp);
        camLook[k] = lerp(camLook[k], targetCam.look[k], camLerp);
        camUp[k] = lerp(camUp[k], targetCam.up[k], camLerp);
      }
      camUp = v3Norm(camUp);
    }

    const aspect = fboW / fboH;
    const fovRad = targetCam.fov * Math.PI / 180;
    const camFwd = v3Norm([camLook[0] - camPos[0], camLook[1] - camPos[1], camLook[2] - camPos[2]]);
    const camRight = v3Norm(v3Cross(camFwd, camUp));
    const camTrueUp = v3Cross(camRight, camFwd);

    const viewMat = mat4LookAt(camPos, camLook, camUp);
    const projMat = mat4Perspective(fovRad, aspect, 0.25, 600.0);
    const viewProj = mat4Mul(projMat, viewMat);

    // 4. Render World + 3D Aircraft into Low-Res FBO
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
    gl.viewport(0, 0, fboW, fboH);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);

    gl.useProgram(worldProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, terrainTex);
    gl.uniform1i(uWorld.terrain, 0);
    gl.uniform3fv(uWorld.camPos, camPos);
    gl.uniform3fv(uWorld.camFwd, camFwd);
    gl.uniform3fv(uWorld.camRight, camRight);
    gl.uniform3fv(uWorld.camUp, camTrueUp);
    gl.uniform1f(uWorld.fovTan, Math.tan(fovRad * 0.5));
    gl.uniform1f(uWorld.aspect, aspect);
    gl.uniform1f(uWorld.time, time);
    gl.uniform3fv(uWorld.planePos, plane.pos);
    gl.uniform1f(uWorld.planeAlt, plane.radarAlt);

    const impArr = new Float32Array(32);
    const impTypeArr = new Float32Array(32);
    for (let i = 0; i < 8; i++) {
      impArr[i * 4 + 0] = impacts[i].x;
      impArr[i * 4 + 1] = impacts[i].y;
      impArr[i * 4 + 2] = impacts[i].z;
      impArr[i * 4 + 3] = impacts[i].age;
      impTypeArr[i * 4 + 0] = impacts[i].isWater;
    }
    gl.uniform4fv(uWorld.impacts, impArr);
    gl.uniform4fv(uWorld.impactType, impTypeArr);

    gl.bindVertexArray(quadVao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // Render 3D Aircraft & Missiles (in Chase & Top-Down views)
    gl.enable(gl.DEPTH_TEST);
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.useProgram(meshProg);
    gl.uniformMatrix4fv(uMesh.viewProj, false, viewProj);

    function drawMeshWithOutline(mesh, modelMat, emissive = false) {
      gl.bindVertexArray(mesh.vao);
      gl.uniformMatrix4fv(uMesh.model, false, modelMat);
      if (!emissive) {
        // Inverted-hull 1px dark outline
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.FRONT);
        gl.uniform1f(uMesh.outline, 0.045);
        gl.uniform1f(uMesh.isOutline, 1.0);
        gl.uniform1f(uMesh.emissive, 0.0);
        gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
        gl.cullFace(gl.BACK);
      }
      gl.disable(gl.CULL_FACE);
      gl.uniform1f(uMesh.outline, 0.0);
      gl.uniform1f(uMesh.isOutline, 0.0);
      gl.uniform1f(uMesh.emissive, emissive ? 1.0 : 0.0);
      gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
    }

    if (viewIdx !== 1) {
      const planeScale = viewIdx === 2 ? 1.45 : 1.0;
      const planeModel = mat4FromBasis(plane.pos, basis.right, basis.up, basis.fwd, planeScale);
      drawMeshWithOutline(fighterMesh, planeModel, false);

      // Wing-mounted missiles still on pylons
      for (let i = 0; i < 4; i++) {
        if (hardpointTimers[i] <= 0) {
          const hp = HARDPOINTS[i];
          const mPos = [
            plane.pos[0] + (basis.right[0] * hp[0] + basis.up[0] * hp[1] + basis.fwd[0] * hp[2]) * planeScale,
            plane.pos[1] + (basis.right[1] * hp[0] + basis.up[1] * hp[1] + basis.fwd[1] * hp[2]) * planeScale,
            plane.pos[2] + (basis.right[2] * hp[0] + basis.up[2] * hp[1] + basis.fwd[2] * hp[2]) * planeScale
          ];
          drawMeshWithOutline(missileMesh, mat4FromBasis(mPos, basis.right, basis.up, basis.fwd, planeScale), false);
        }
      }

      // Twin afterburner plumes with white core
      const flicker = 0.85 + 0.3 * Math.sin(time * 55.0);
      const abLen = (plane.afterburner ? 1.45 : 0.45) * flicker * planeScale;
      for (const side of [-1, 1]) {
        const pPos = [
          plane.pos[0] + (basis.right[0] * (side * 0.22) - basis.fwd[0] * 1.95) * planeScale,
          plane.pos[1] + (basis.right[1] * (side * 0.22) - basis.fwd[1] * 1.95) * planeScale,
          plane.pos[2] + (basis.right[2] * (side * 0.22) - basis.fwd[2] * 1.95) * planeScale
        ];
        const backDir = [-basis.fwd[0], -basis.fwd[1], -basis.fwd[2]];
        drawMeshWithOutline(plumeOuterMesh, mat4FromBasis(pPos, basis.right, basis.up, backDir, abLen), true);
        drawMeshWithOutline(plumeCoreMesh, mat4FromBasis(pPos, basis.right, basis.up, backDir, abLen * 0.85), true);
      }
    }

    // Active launched missiles in flight
    for (const m of activeMissiles) {
      const mRight = v3Norm(v3Cross([0, 1, 0], m.dir));
      const mUp = v3Cross(m.dir, mRight);
      drawMeshWithOutline(missileMesh, mat4FromBasis(m.pos, mRight, mUp, m.dir, 1.15), false);
    }

    // 5. Post-Process 4x4 Bayer Ordered Dither Pass to Screen
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, fboW, fboH);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);

    gl.useProgram(ditherProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.uniform1i(uDither.scene, 0);
    gl.uniform3fv(uDither.palette, paletteFlat);
    gl.uniform2f(uDither.res, fboW, fboH);

    gl.bindVertexArray(quadVao);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // 6. Canvas 2D Cockpit & HUD
    drawHudAndCockpit(time, basis, viewProj);

    requestAnimationFrame(loop);
  }
})();
</script>
