          float ripple=0.5+0.5*sin(vWorld.x*1.15+sin(vWorld.z*1.7-uSceneTime*0.71)*1.4);
          float reflection=fresnel*(0.42+0.33*max(n.y,0.0)*ripple);
          vec3 reflected=mix(vec3(0.22,0.24,0.32),vec3(0.55,0.69,0.79),uAtmosphere.x);
          material=mix(material,reflected,reflection);
        }
        if(uTwilight && n.y>0.80 && vWorld.y>19.32 && vWorld.y<19.94 &&
            vWorld.x>-135.0 && vWorld.x<70.0 && abs(vWorld.z)<407.0){
          vec2 groundTile=vWorld.xz*vec2(2.3,2.0);
          vec2 cell=floor(groundTile);
          float fineDetail=1.0-smoothstep(0.20,0.75,max(fwidth(groundTile.x),fwidth(groundTile.y)));
          float grain=fract(sin(dot(cell,vec2(71.6,23.7)))*17751.25)-0.5;
          bool pool=material.b>material.r*1.18 && material.g>material.r*1.14;
          if(pool){
            vec2 p=vWorld.xz;
            float ripple=sin(p.x*2.3+p.y*1.4+uSceneTime*1.9+sin(p.y*1.3-uSceneTime));
            float crossWave=sin(p.x*1.14-p.y*2.9+uSceneTime*2.7);
            material+=vec3(0.11,0.14,0.16)*smoothstep(0.50,0.94,0.5+0.28*ripple+0.22*crossWave)
              *(0.48+fresnel*0.5)*fineDetail;
          }else{
            float joints=1.0-smoothstep(0.012,0.045,min(fract(groundTile.x),fract(groundTile.y)));
            float tile=smoothstep(0.018,0.12,material.r-material.b);
            material*=1.0+fineDetail*(grain*0.14-joints*tile*0.15);
          }
        }
        if(uManhattanView && n.y>0.72 && vWorld.y<15.25 && vWorld.x>-38.0 && vWorld.x<59.0 &&
            vWorld.z>-68.0 && vWorld.z<70.0){
          vec2 streetGrid=vWorld.xz*10.2;
          float fade=1.0-smoothstep(0.26,0.83,max(fwidth(streetGrid.x),fwidth(streetGrid.y)));
          float stone=fract(sin(dot(floor(streetGrid),vec2(67.3,19.9)))*15248.523);
          float pavingTone=0.50+0.50*sin(vWorld.x*0.81+sin(vWorld.z*1.1)*1.5);
          material*=0.93+fade*(stone-0.5)*0.14+pavingTone*0.10;
        }
        vec3 windowLight=vec3(0.0);
        float distanceToEye = length(toEye);
        // Explicit geometric glass should not acquire a second procedural
        // window lattice; it instead gets a restrained Fresnel sky reflection.
        bool realGlass=vColor.r<0.31 && vColor.g>vColor.r*1.21 &&
                       vColor.b>vColor.r*1.43 && vColor.b<0.50;
        if(uManhattanView && realGlass && abs(n.y)<0.2 &&
           uNyStreetQuality>1.5){
          float grazing=pow(1.0-clamp(abs(dot(normalize(toEye),n)),0.0,1.0),3.0);
          vec3 reflectTint=mix(vec3(0.19,0.26,0.32),vec3(0.39,0.52,0.61),
                               uAtmosphere.x);
          material=mix(material,reflectTint,grazing*0.52);
        }
        if (uCityFacade && abs(n.y)<0.15 && !realGlass &&
            !(vHarborSurface>8.5 && vHarborSurface<14.5)) {
          float span=abs(n.x)>0.50?vWorld.z:vWorld.x;
          float facadePlane=abs(n.x)>0.50?vWorld.x:vWorld.z;
          float brick=smoothstep(0.07,0.20,material.r-material.b);
          float storey=mix(2.24,2.83,brick);
          float frontage=1.0-smoothstep(17.18,17.42,vWorld.y);
          vec2 tile=vec2(span/mix(mix(1.63,2.34,brick),3.15,frontage),(vWorld.y-14.37)/storey);
          vec2 cell=floor(tile);
          vec2 panel=abs(fract(tile)-0.5);
          vec2 softness=max(fwidth(tile),vec2(0.004));
          vec2 aperture=mix(vec2(0.37,0.31),vec2(0.30,0.37),brick);
          vec2 frame=1.0-smoothstep(aperture-softness,aperture+softness,panel);
          vec2 pane=1.0-smoothstep(aperture-0.047-softness,aperture-0.047+softness,panel);
          float distanceFade=1.0-smoothstep(190.0,500.0,distanceToEye);
          float glazing=pane.x*pane.y*distanceFade;
          float jamb=frame.x*frame.y*distanceFade-glazing;
          float mullion=1.0-smoothstep(0.018,0.055+softness.x,panel.x);
          float seed=fract(sin(dot(vec3(cell,facadePlane),vec3(39.17,65.21,18.63)))*43758.5453);
          vec3 reflected=mix(vec3(0.19,0.25,0.31),vec3(0.51,0.64,0.73),fresnel+0.26);
          material=mix(material,material*1.24,jamb*0.78);
          material=mix(material,reflected,glazing*(0.87-mullion*0.68));
          windowLight=vec3(0.52,0.35,0.17)*glazing*(1.0-mullion*0.82)*step(0.68-frontage*0.18,seed)*
            (1.0-uAtmosphere.x*0.91);
        }
        if(uCityFacade){
          float flatRoof=smoothstep(0.73,0.99,n.y);
          material=mix(material,vec3(0.81,0.86,0.90),flatRoof*uSurfaceWeather.x*0.62);
        }
        material*=1.0-uSurfaceWeather.y*max(n.y,0.0)*0.18;
        float haze = 1.0-exp(-distanceToEye*(0.00096+0.009*uAtmosphere.w));
        vec3 horizon=mix(vec3(0.084,0.10,0.17),vec3(0.64,0.73,0.79),uAtmosphere.x);
        horizon=mix(horizon,vec3(0.48,0.33,0.35),uAtmosphere.y*0.58);
        vec3 nightFill=uTwilight?vec3(0.57,0.54,0.61):uManhattanView?vec3(0.40,0.43,0.52):vec3(0.25,0.32,0.45);
        vec3 shaded=material*light*mix(nightFill,vec3(1.0),uAtmosphere.x)+windowLight;
        if(uDcSurface>=0 || (vHarborSurface>=3.5 && vHarborSurface<5.5) ||
           (uAlaskaMesh && vHarborSurface>14.5 && vHarborSurface<16.5)){
          vec3 halfRay=normalize(uSun+normalize(toEye));
          float gloss=pow(max(dot(n,halfRay),0.0),mix(86.0,11.0,surfaceRoughness));
          shaded+=vec3(.88,.90,.94)*gloss*(.025+.19*(1.0-surfaceRoughness))*direct*uAtmosphere.x;
        }
        if(uTwilight)shaded+=vegasSpill(vWorld,n)*(0.14+material*0.80)*(1.0-uAtmosphere.x*0.88);
        if(uManhattanView)shaded+=manhattanSpill(vWorld,n)*(0.13+material*0.74)*(1.0-uAtmosphere.x*0.89);
        if(uManhattanView && uNyStreetQuality>0.5){
          // Saltline-inspired soft lamp and billboard streaks, no extra scene render.
          shaded+=nyStreetReflection(vWorld,n,toEye,nyRoad,nyPuddle);
          float glow=nyRoad*uNyStreetWetness*(1.0-uAtmosphere.x)*0.046;
          shaded+=vec3(0.10,0.20,0.35)*glow;
          if(uNyStreetQuality>1.5){
            haze=clamp(haze+0.09*(1.0-haze)*(1.0-uAtmosphere.x)*
              uSurfaceWeather.y*smoothstep(25.0,250.0,distanceToEye),0.0,0.96);
          }
        }
        fragColor=vec4(mix(shaded,horizon,haze),1.0);
        return;
      }
      // 3-tone flat shading
      float tone = ndotl > 0.25 ? 1.15 : (ndotl > -0.25 ? 0.82 : 0.54);
      vec3 tint = ndotl > -0.25 ? vec3(1.04, 0.94, 0.86) : vec3(0.76, 0.68, 0.92);
      vec3 shade=vColor*tone*tint*mix(vec3(0.29,0.38,0.52),vec3(1.0),uAtmosphere.x);
      fragColor=vec4(mix(shade,vec3(0.39,0.45,0.52),uAtmosphere.w*(1.0-exp(-length(uEye-vWorld)*0.006))),1.0);
    }
  `;

  // Post-Process Ordered 4x4 Bayer Dithering + Palette Quantization Shader
  const DITHER_FS = `#version 300 es
    precision highp float;
    in vec2 vUv;
    out vec4 fragColor;

    uniform sampler2D uScene;
    uniform bool uSmooth;
    uniform bool uFastPostFx;
    uniform bool uNeonGlow;
    uniform vec3 uWeatherVisual;
    uniform vec3 uPalette[36];
    uniform vec2 uRes;

    // PATROL_NYC_AAA_LAYERS_V2: film-style color separation, subtle toe
    // compression and vignetting. Scoped to Manhattan, never other maps.
    uniform float uNyCinema;
    vec3 nyGrade(vec3 source,vec2 uv) {
      float lum=dot(source,vec3(0.2126,0.7152,0.0722));
      vec3 blueShadows=source*vec3(0.954,0.982,1.035);
      vec3 warmHighlights=source*vec3(1.045,1.015,0.975);
      vec3 balanced=mix(blueShadows,warmHighlights,
        smoothstep(0.21,0.77,lum));
      float desat=0.05+0.08*uWeatherVisual.x;
      balanced=mix(balanced,vec3(dot(balanced,vec3(0.2126,0.7152,0.0722))),
                   desat);
      vec3 toe=balanced*balanced*(3.0-2.0*balanced);
      balanced=mix(balanced,toe,0.13);
      float edge=dot((uv-0.5)*vec2(1.05,0.91),(uv-0.5)*vec2(1.05,0.91));
      return max(balanced*(1.0-clamp(edge*0.15,0.0,0.13)),vec3(0.0));
    }

    float weatherHash(vec2 cell){
      return fract(sin(dot(cell,vec2(127.1,311.7)))*43758.5453);
    }
    vec3 precipitation(vec3 scene,vec2 uv) {
      vec2 p=vec2(uv.x*uRes.x/uRes.y,uv.y);
      if(uWeatherVisual.x>0.003){
        vec2 q=vec2(p.x+p.y*0.19,p.y)*vec2(194.0,15.0);
        q.y+=uWeatherVisual.z*38.0;
        vec2 cell=floor(q), drop=fract(q);
        float seed=weatherHash(cell);
        float line=(1.0-smoothstep(0.026,0.16,abs(drop.x-seed)))*
          smoothstep(0.10,0.35,drop.y)*(1.0-smoothstep(0.45,0.82,drop.y));
        scene=mix(scene,vec3(0.61,0.76,0.88),line*step(0.35,seed)*uWeatherVisual.x*0.43);
      }
      if(uWeatherVisual.y>0.003){
        for(int i=0;i<2;i++){
          float layer=float(i);
          vec2 q=(p+vec2(sin(p.y*6.0+uWeatherVisual.z+layer)*0.045,uWeatherVisual.z*(0.18+layer*0.09)))*(28.0+layer*19.0);
          vec2 cell=floor(q);
          float seed=weatherHash(cell+13.0*layer);
          vec2 center=vec2(seed,weatherHash(cell+5.0))*0.72+0.14;
          float flake=(1.0-smoothstep(0.032,0.086,length(fract(q)-center)))*step(0.49,seed);
          scene=mix(scene,vec3(0.89,0.94,1.0),flake*uWeatherVisual.y*(0.75-layer*0.17));
        }
      }
      return scene;
    }
    vec3 emissiveAt(vec2 uv) {
      vec3 sampleColor=texture(uScene,uv).rgb;
      float peak=max(sampleColor.r,max(sampleColor.g,sampleColor.b));
      return sampleColor*smoothstep(0.73,1.0,peak);
    }
    // Directional edge AA, integrated into the existing WebGL compositor.
    // Reference: three.js FXAAPass. No extra render target or engine dependency.
    float edgeLuma(vec3 color) {
      return dot(color,vec3(0.2126,0.7152,0.0722));
    }
    vec3 smoothGeometryEdges(vec2 uv, vec2 px, vec3 center) {
      float nw=edgeLuma(texture(uScene,uv+px*vec2(-1.0, 1.0)).rgb);
      float ne=edgeLuma(texture(uScene,uv+px*vec2( 1.0, 1.0)).rgb);
      float sw=edgeLuma(texture(uScene,uv+px*vec2(-1.0,-1.0)).rgb);
      float se=edgeLuma(texture(uScene,uv+px*vec2( 1.0,-1.0)).rgb);
      float lum=edgeLuma(center);
      float low=min(lum,min(min(nw,ne),min(sw,se)));
      float high=max(lum,max(max(nw,ne),max(sw,se)));
      float contrast=high-low;
      float threshold=max(0.045,high*0.14);
      if(contrast<=threshold)return center;

      vec2 span=vec2(sw+se-nw-ne,nw+sw-ne-se);
      float damping=max((nw+ne+sw+se)*0.027,0.019);
      span=clamp(span/(min(abs(span.x),abs(span.y))+damping),-6.0,6.0)*px;
      vec3 inner=(texture(uScene,uv-span/6.0).rgb+texture(uScene,uv+span/6.0).rgb)*0.5;
      vec3 wide=inner*0.5+(texture(uScene,uv-span*0.5).rgb+texture(uScene,uv+span*0.5).rgb)*0.25;
      float filtered=edgeLuma(wide);
      vec3 result=(filtered<low||filtered>high)?inner:wide;
      return mix(center,result,0.85*smoothstep(threshold,threshold+0.045,contrast));
    }
    const float BAYER4[16] = float[16](
       0.0/16.0,  8.0/16.0,  2.0/16.0, 10.0/16.0,
      12.0/16.0,  4.0/16.0, 14.0/16.0,  6.0/16.0,
       3.0/16.0, 11.0/16.0,  1.0/16.0,  9.0/16.0,
      15.0/16.0,  7.0/16.0, 13.0/16.0,  5.0/16.0
    );

    void main() {
      vec3 col = texture(uScene, vUv).rgb;
      if (uSmooth) {
        vec2 texel = 1.0 / uRes;
        vec3 smoothColor = uFastPostFx ? col : smoothGeometryEdges(vUv,texel,col);
        if(uNeonGlow){
          // Lift dark street detail while preserving headroom on signs and the Sphere.
          smoothColor+=0.078*sqrt(max(smoothColor,vec3(0.0)))*(1.0-clamp(smoothColor,0.0,1.0));
          if(!uFastPostFx){
            vec2 stride=2.6*texel;
          vec3 glow=emissiveAt(vUv+vec2(stride.x,0.0))+emissiveAt(vUv-vec2(stride.x,0.0))+
            emissiveAt(vUv+vec2(0.0,stride.y))+emissiveAt(vUv-vec2(0.0,stride.y));
          vec2 diagonal=5.1*texel;
          vec3 outer=emissiveAt(vUv+diagonal)+emissiveAt(vUv-diagonal)+
            emissiveAt(vUv+vec2(diagonal.x,-diagonal.y))+emissiveAt(vUv+vec2(-diagonal.x,diagonal.y));
          smoothColor+=glow*0.062+outer*0.035;
          }
        }
        if(uNyCinema>0.5)smoothColor=mix(smoothColor,
          nyGrade(smoothColor,vUv),min(uNyCinema/3.0,1.0));
        fragColor = vec4(precipitation(smoothColor,vUv), 1.0);
        return;
      }
      ivec2 pix = ivec2(mod(floor(vUv * uRes), 4.0));
      float b = BAYER4[pix.y * 4 + pix.x] - 0.5;
      col = clamp(col + b * 0.095, 0.0, 1.0);

      // Find nearest palette entry
      float bestDist = 1e9;
      vec3 bestCol = uPalette[0];
      for (int i = 0; i < 36; i++) {
        vec3 d = col - uPalette[i];
        float dist = dot(d, d);
        if (dist < bestDist) {
          bestDist = dist;
          bestCol = uPalette[i];
        }
      }
      fragColor = vec4(precipitation(bestCol,vUv), 1.0);
    }
  `;

  let worldProg, uWorld, worldVariant;
  let meshProg, uMesh;
  const ditherProg = createProgram(QUAD_VS, DITHER_FS);

  // Fullscreen quad VAO
  const quadVao = gl.createVertexArray();
  gl.bindVertexArray(quadVao);
  const quadVbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadVbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  function createTriangleMesh() {
    const pos = [], norm = [], col = [];
    let surfaces = null;
    function addTri(a, b, c, rgb, surface=0, vertexNormals=null) {
      const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
      const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
      let nx = uy * vz - uz * vy;
      let ny = uz * vx - ux * vz;
      let nz = ux * vy - uy * vx;
      const len = Math.hypot(nx, ny, nz) || 1;
      nx /= len; ny /= len; nz /= len;
      if(surface && !surfaces) surfaces=new Array(pos.length/3).fill(0);
      if(surfaces) surfaces.push(surface,surface,surface);
      pos.push(...a, ...b, ...c);
      // Asset-specific normals from Blender produce smooth airfoils and floats.
      // All original scenery/vehicles remain on geometric flat normals.
      if(vertexNormals && vertexNormals.length===3) {
        for(const n of vertexNormals) norm.push(...n);
      } else norm.push(nx, ny, nz, nx, ny, nz, nx, ny, nz);
      if(Array.isArray(rgb[0]))col.push(...rgb[0],...rgb[1],...rgb[2]);
      else col.push(...rgb,...rgb,...rgb);
    }
    function addQuad(a, b, c, d, rgb, surface=0) {
      if(Array.isArray(rgb[0])){
        addTri(a,b,c,[rgb[0],rgb[1],rgb[2]],surface);
        addTri(a,c,d,[rgb[0],rgb[2],rgb[3]],surface);
      }else{
        addTri(a,b,c,rgb,surface);
        addTri(a,c,d,rgb,surface);
      }
    }

    function upload() {
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      const buffers = [];
      function makeBuf(arr, loc, size=3) {
        const b = gl.createBuffer();
        buffers.push(b);
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
      }
      makeBuf(pos, 0);
      makeBuf(norm, 1);
      makeBuf(col, 2);
      if(surfaces) makeBuf(surfaces, 3, 1);
      return { vao, buffers, count: pos.length / 3 };
    }
    return { addTri, addQuad, upload };
  }

  function buildFighterMesh() {
    const { addTri, addQuad, upload } = createTriangleMesh();
    const box = (...args) => addModelBox(addQuad, ...args);
    const radome = [0.14, 0.13, 0.22];
    const slate = [0.34, 0.39, 0.48];
    const grey = [0.54, 0.59, 0.67];
    const lightGrey = [0.70, 0.74, 0.80];
    const canopyFrame = [0.34, 0.48, 0.57];
    const redCap = [0.85, 0.22, 0.22];
    const nozzleDark = [0.16, 0.14, 0.20];

    // Forward nose cone (+Z is forward)
    const noseTip = [0, 0.0, 2.55];
    const nTop = [0, 0.24, 1.35];
    const nBot = [0, -0.18, 1.35];
    const nLeft = [-0.28, 0.02, 1.35];
    const nRight = [0.28, 0.02, 1.35];
    addTri(noseTip, nRight, nTop, radome);
    addTri(noseTip, nTop, nLeft, radome);
    addTri(noseTip, nLeft, nBot, radome);
    addTri(noseTip, nBot, nRight, radome);

    // Fuselage mid-body (splinter grey/slate)
    const fTopF = [0, 0.30, 0.45], fTopR = [0, 0.28, -1.55];
    const fBotF = [0, -0.22, 0.45], fBotR = [0, -0.20, -1.55];
    const fLF = [-0.46, 0.04, 0.45], fLR = [-0.48, 0.04, -1.55];
    const fRF = [0.46, 0.04, 0.45], fRR = [0.48, 0.04, -1.55];

    addQuad(nTop, nRight, fRF, fTopF, grey);
    addQuad(nLeft, nTop, fTopF, fLF, slate);
    addQuad(nBot, nLeft, fLF, fBotF, grey);
    addQuad(nRight, nBot, fBotF, fRF, slate);

    addQuad(fTopF, fRF, fRR, fTopR, slate,4);
    addQuad(fLF, fTopF, fTopR, fLR, grey,4);
    addQuad(fBotF, fLF, fLR, fBotR, slate);
    addQuad(fRF, fBotF, fBotR, fRR, grey,4);

    // Clear bubble canopy: only the structural frame is opaque, leaving the
    // pilot visible from chase and top-down views.
    box(0,0.31,1.02,0.055,0.08,0.32,canopyFrame);
    box(0,0.54,0.53,0.055,0.08,0.72,canopyFrame);
    box(-0.215,0.32,0.52,0.045,0.07,1.18,canopyFrame);
    box(0.215,0.32,0.52,0.045,0.07,1.18,canopyFrame);
    box(0,0.31,-0.10,0.46,0.07,0.06,canopyFrame);

    // Visible modern fighter pilot: dark flight suit, harness, helmet, oxygen
    // mask and visor. The compact proportions fit beneath the clear canopy.
    const flightSuit=[0.18,0.24,0.25], harness=[0.72,0.67,0.48];
    const helmet=[0.78,0.79,0.75], visor=[0.12,0.22,0.27], mask=[0.25,0.29,0.29];
    box(0,0.31,0.36,0.30,0.34,0.29,flightSuit);
    box(0,0.48,0.49,0.26,0.10,0.08,harness);
    for(const side of [-1,1]){
      box(side*0.13,0.34,0.37,0.045,0.36,0.31,harness);
      box(side*0.22,0.31,0.50,0.10,0.26,0.10,flightSuit);
    }
    box(0,0.59,0.43,0.25,0.25,0.25,helmet);
    box(0,0.62,0.555,0.21,0.10,0.035,visor);
    box(0,0.54,0.565,0.13,0.08,0.04,mask);
    box(0,0.18,0.24,0.38,0.18,0.42,[0.15,0.17,0.18]);

    // Cropped delta wings (left & right)
    for (const s of [-1, 1]) {
      const rootF = [s * 0.44, 0.05, 0.35];
      const rootR = [s * 0.46, 0.04, -1.35];
      const tipF = [s * 2.15, -0.02, -0.68];
      const tipR = [s * 2.15, -0.02, -1.25];
      const rootFB = [s * 0.44, -0.03, 0.35];
      const rootRB = [s * 0.46, -0.03, -1.35];
      if (s > 0) {
        addQuad(rootF, tipF, tipR, rootR, lightGrey);
        addQuad(rootFB, rootRB, tipR, tipF, slate);
      } else {
        addQuad(rootF, rootR, tipR, tipF, lightGrey);
        addQuad(rootFB, tipF, tipR, rootRB, slate);
      }
      // Horizontal stabilizers
      const hRootF = [s * 0.44, 0.04, -1.45];
      const hRootR = [s * 0.40, 0.04, -2.05];
      const hTipF = [s * 1.15, 0.02, -1.78];
      const hTipR = [s * 1.15, 0.02, -2.05];
      if (s > 0) {
        addQuad(hRootF, hTipF, hTipR, hRootR, grey);
        addQuad(hRootF, hRootR, hTipR, hTipF, slate);
      } else {
        addQuad(hRootF, hRootR, hTipR, hTipF, grey);
        addQuad(hRootF, hTipF, hTipR, hRootR, slate);
      }

      // Canted twin vertical tails with red caps
      const vBaseF = [s * 0.34, 0.22, -1.05];
      const vBaseR = [s * 0.34, 0.20, -1.85];
      const vMidF = [s * 0.56, 0.78, -1.45];
      const vMidR = [s * 0.56, 0.78, -1.88];
      const vTopF = [s * 0.62, 0.94, -1.55];
      const vTopR = [s * 0.62, 0.94, -1.90];
      if (s > 0) {
        addQuad(vBaseF, vMidF, vMidR, vBaseR, grey);
        addQuad(vBaseF, vBaseR, vMidR, vMidF, slate);
        addQuad(vMidF, vTopF, vTopR, vMidR, redCap);
        addQuad(vMidF, vMidR, vTopR, vTopF, redCap);
      } else {
        addQuad(vBaseF, vBaseR, vMidR, vMidF, grey);
        addQuad(vBaseF, vMidF, vMidR, vBaseR, slate);
        addQuad(vMidF, vMidR, vTopR, vTopF, redCap);
        addQuad(vMidF, vTopF, vTopR, vMidR, redCap);
      }

      // Twin engine nozzles
      const nx = s * 0.22;
      const nz0 = -1.55, nz1 = -1.92;
      const r = 0.14;
      const ptsF = [[nx, r, nz0], [nx + r, 0, nz0], [nx, -r, nz0], [nx - r, 0, nz0]];
      const ptsR = [[nx, r * 0.85, nz1], [nx + r * 0.85, 0, nz1], [nx, -r * 0.85, nz1], [nx - r * 0.85, 0, nz1]];
      for (let k = 0; k < 4; k++) {
        const kn = (k + 1) % 4;
        addQuad(ptsF[k], ptsF[kn], ptsR[kn], ptsR[k], nozzleDark);
      }
      addQuad(ptsR[0], ptsR[1], ptsR[2], ptsR[3], [0.98, 0.45, 0.16]);
    }
    // PATROL_NYC_HERO_TRANSPORT_V5: structural seams and cockpit hardware.
    const seal=[.23,.26,.30],trim=[.55,.60,.66];
    for(const side of [-1,1]){
      addQuad([side*.66,.086,-.35],[side*1.88,.003,-.90],
        [side*1.72,.003,-1.01],[side*.67,.086,-.49],seal);
      box(side*.50,-.035,.33,.15,.20,.62,trim);
      box(side*.58,-.01,.45,.055,.14,.40,[.10,.15,.20]);
      box(side*2.12,.01,-.92,.10,.035,.12,
        side>0?[.19,.75,.41]:[.88,.20,.16]);
      for(const z of [-.72,-1.05])box(side*1.19,.074,z,.40,.011,.025,seal);
    }
    box(0,.37,.92,.40,.038,.055,trim);
    box(0,.34,.33,.42,.027,.12,seal);

    // Fighter close-up pass: intakes, panel seams, service markings, exhaust petals.
    const titanium=[.35,.37,.39], panel=[.22,.28,.34];
    for(const side of [-1,1]){
      // Open-looking dark intake with an aluminum lip.
      box(side*.495,-.075,.26,.20,.22,.39,titanium);
      box(side*.505,-.086,.39,.150,.150,.05,[.08,.11,.15]);
      // Wing flap hinge and access-panel lines.
      for(const zz of [-.48,-.91,-1.16])
        box(side*1.24,.079,zz,.67,.016,.020,panel);
      for(const zz of [.92,.53,-.26,-1.27])
        box(side*.325,.308,zz,.055,.014,.065,panel);
      box(side*.36,.17,1.08,.09,.028,.11,[.80,.82,.82]);
      // Twelve-sided visible engine exhaust turbine petals.
      const nx=side*.22;
      for(let k=0;k<12;k++){
        const a=k*Math.PI/6,b=(k+1)*Math.PI/6;
        const pt=(t,r,z)=>[nx+Math.cos(t)*r,Math.sin(t)*r,z];
        addQuad(pt(a,.18,-1.85),pt(b,.18,-1.85),
          pt(b,.145,-1.96),pt(a,.145,-1.96),titanium);
      }
    }
    box(0,.69,.30,.055,.07,.07,[.20,.26,.31]);
    return upload();
  }

  // Build simple diamond/box mesh for Missiles & Afterburner plumes
  function buildConeMesh(len, rad, tipCol, baseCol) {
    const pos = [], norm = [], col = [];
    function addTri(a, b, c, rgb) {
      const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
      const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const l = Math.hypot(nx, ny, nz) || 1;
      pos.push(...a, ...b, ...c);
      norm.push(nx / l, ny / l, nz / l, nx / l, ny / l, nz / l, nx / l, ny / l, nz / l);
      col.push(...rgb, ...rgb, ...rgb);
    }
    const tip = [0, 0, len];
    const base = [0, 0, -len * 0.3];
    const ring = [[0, rad, 0], [rad, 0, 0], [0, -rad, 0], [-rad, 0, 0]];
    for (let i = 0; i < 4; i++) {
      const j = (i + 1) % 4;
      addTri(tip, ring[j], ring[i], tipCol);
      addTri(base, ring[i], ring[j], baseCol);
    }
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    for (const [arr, loc] of [[pos, 0], [norm, 1], [col, 2]]) {
      const b = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
    }
    return { vao, count: pos.length / 3 };
  }

  function buildSaucerMesh() {
    const { addQuad, upload } = createTriangleMesh();
    // Stacked rings form the dome, rim and underside.
    const rings = [[0.01,0.93],[0.65,0.82],[1.02,0.30],[2.23,0.12],[2.35,-0.08],[1.36,-0.36],[0.01,-0.44]];
    const colors = [[0.26,0.90,0.77],[0.22,0.64,0.77],[0.57,0.66,0.75],[0.83,0.90,0.33],[0.28,0.39,0.52],[0.31,0.68,0.55]];
    const sectors = 16;
    const point = ([radius, height], i) => {
      const angle = i * 2 * Math.PI / sectors;
      return [Math.sin(angle) * radius, height, Math.cos(angle) * radius];
    };
    for (let j = 0; j < rings.length - 1; j++) {
      for (let i = 0; i < sectors; i++) {
        const color = j === 3 && i % 2 ? [0.25,0.40,0.50] : colors[j];
        addQuad(point(rings[j],i),point(rings[j+1],i),
          point(rings[j+1],i+1),point(rings[j],i+1),color);
      }
    }
    return upload();
  }

  function buildJetpackMesh() {
    const body=createTriangleMesh(), lights=createTriangleMesh();
    const box=(mesh,x,y,z,w,h,d,color)=>addModelBox(mesh.addQuad,x,y,z,w,h,d,color);
    const red=[0.63,0.12,0.09], deepRed=[0.34,0.07,0.07];
    const gold=[0.88,0.61,0.16], paleGold=[0.95,0.77,0.31];
    const joint=[0.22,0.24,0.25], glow=[0.32,0.88,1.0];

    // Faceted tapered shells read as curved armor at normal flight distance,
    // while remaining a single lightweight static mesh.
    const shell=(mesh,x,z,y0,y1,rx0,rz0,rx1,rz1,color,sides=8)=>{
      const point=(y,rx,rz,i)=>{
        const a=(i+0.5)*Math.PI*2/sides;
        return [x+Math.sin(a)*rx,y,z+Math.cos(a)*rz];
      };
      for(let i=0;i<sides;i++)mesh.addQuad(
        point(y0,rx0,rz0,i),point(y0,rx0,rz0,i+1),
        point(y1,rx1,rz1,i+1),point(y1,rx1,rz1,i),color);
      for(let i=0;i<sides;i++){
        mesh.addTri([x,y0,z],point(y0,rx0,rz0,i+1),point(y0,rx0,rz0,i),color);
        mesh.addTri([x,y1,z],point(y1,rx1,rz1,i),point(y1,rx1,rz1,i+1),color);
      }
    };

    // Mark 42-inspired modular armor: gold-dominant plates with deep red
    // shoulders, boots and torso sections over a dark articulated undersuit.
    shell(body,0,0,-0.16,0.82,0.32,0.22,0.43,0.25,gold,10);
    shell(body,0,0,0.72,1.03,0.43,0.25,0.30,0.22,red,10);
    // Chest plate, abdominal ribs and raised collar.
    box(body,0,0.47,0.245,0.63,0.58,0.105,paleGold);
    for(const side of [-1,1])for(let row=0;row<3;row++)
      box(body,side*(0.15+row*0.018),0.12+row*0.15,0.255,0.25,0.095,0.055,row===1?red:gold);
    box(body,0,0.88,0.02,0.66,0.23,0.49,deepRed);
    box(body,0,1.00,0.02,0.48,0.12,0.43,gold);

    // Multi-plane helmet: red crown, gold faceplate, jaw and cheek panels.
    shell(body,0,0.005,1.00,1.43,0.27,0.235,0.235,0.215,red,10);
    box(body,0,1.235,0.232,0.39,0.27,0.055,gold);
    body.addTri([-0.195,1.37,0.264],[0.195,1.37,0.264],[0,1.49,0.16],red);
    body.addTri([-0.195,1.10,0.265],[0.195,1.10,0.265],[0,0.99,0.19],deepRed);
    box(body,-0.225,1.13,0.11,0.085,0.22,0.22,gold);
    box(body,0.225,1.13,0.11,0.085,0.22,0.22,gold);
    for(const side of [-1,1]){
      // Shoulder bell, articulated arm, gauntlet and palm emitter.
      shell(body,side*0.48,0,0.58,0.94,0.19,0.22,0.26,0.24,red,8);
      shell(body,side*0.54,0.02,0.05,0.64,0.135,0.16,0.16,0.18,gold,8);
      shell(body,side*0.55,0.05,-0.23,0.10,0.16,0.18,0.13,0.15,red,8);
      box(body,side*0.57,-0.09,0.18,0.20,0.20,0.08,paleGold);
      box(body,side*0.41,0.58,-0.20,0.18,0.25,0.22,joint);

      // Hip plates, tapered thigh, knee cap, shin and armored boot.
      box(body,side*0.25,-0.15,0.02,0.30,0.20,0.34,deepRed);
      shell(body,side*0.25,0.01,-0.73,-0.19,0.17,0.19,0.155,0.18,gold,8);
      box(body,side*0.25,-0.72,0.18,0.25,0.20,0.11,red);
      shell(body,side*0.25,0.025,-1.11,-0.76,0.16,0.19,0.145,0.16,red,8);
      box(body,side*0.25,-1.16,0.15,0.34,0.17,0.48,paleGold);
      box(body,side*0.24,-0.20,-0.12,0.21,0.18,0.25,joint);

      // Compact back thrusters and segmented spinal armor.
      box(body,side*0.23,0.48,-0.29,0.25,0.64,0.15,deepRed);
      box(body,side*0.23,0.22,-0.385,0.13,0.26,0.08,gold);
      box(lights,side*0.57,-0.045,0.225,0.13,0.13,0.045,glow);
      box(lights,side*0.24,-1.21,0.23,0.17,0.07,0.20,glow);
      box(lights,side*0.23,0.17,-0.432,0.10,0.18,0.035,glow);
    }
    // Triangular arc reactor and eye slits remain emissive in low light.
    lights.addTri([-0.13,0.50,0.322],[0.13,0.50,0.322],[0,0.25,0.322],glow);
    box(lights,-0.115,1.29,0.267,0.14,0.032,0.025,glow);
    box(lights,0.115,1.29,0.267,0.14,0.032,0.025,glow);
    return {body:body.upload(),lights:lights.upload()};
  }

  // PATROL_CESSNA185_FLOATS_V1: physically dimensioned 1m/unit fallback.
  // This built-in mesh is available even if the optional Blender GLB has
  // not been baked yet or the user is offline. Non-CAD artistic approximation.
  function buildCessna185FloatMesh(){
    const {addQuad,addTri,upload}=createTriangleMesh();
    const box=(...args)=>addModelBox(addQuad,...args);
    const white=[.80,.83,.80],aluminum=[.63,.68,.71],blue=[.09,.21,.31],
      glass=[.10,.23,.29],rubber=[.10,.11,.12],orange=[.84,.29,.16];
    const station=[
      [-3.69,.055,.08,.08],[-2.82,.37,.35,.04],[-1.35,.65,.71,.12],
      [.48,.72,.72,.13],[1.65,.58,.58,.10],[2.75,.40,.39,.07],
      [3.68,.11,.12,.035],[4.1205,.035,.045,.02]
    ];
    const face=(z,rx,ry,cy,i,N=12)=>{
      const a=2*Math.PI*i/N;
      return [rx*Math.cos(a),cy+ry*Math.sin(a),z];
    };
    for(let i=0;i<station.length-1;i++){
      const a=station[i],b=station[i+1];
      for(let k=0;k<12;k++){
        addQuad(face(...a,k),face(...a,k+1),
          face(...b,k+1),face(...b,k),i===3?aluminum:white,4);
      }
    }
    // Profiled six-sided high wing reaching the genuine 10.922m span.
    for(const side of [-1,1]){
      const sections=[[.54,1.72,.69,.91],[2.60,1.48,.60,.99],[5.461,1.02,.29,1.12]];
      const at=(s,k)=>{
        const [span,chord,lead,y]=sections[s];
        const profile=[[lead,.04],[lead-chord*.28,.11],[lead-chord,.025],
          [lead-chord,-.055],[lead-chord*.28,-.074],[lead,-.055]];
        return [side*span,y+profile[k][1],profile[k][0]];
      };
      for(let i=0;i<2;i++)for(let k=0;k<6;k++)
        addQuad(at(i,k),at(i,(k+1)%6),at(i+1,(k+1)%6),
          at(i+1,k),aluminum,4);
      // Fuselage cabin glazing, spars, raised empennage and tip lights.
      box(side*.67,.32,.46,.045,.55,1.72,glass,4);
      box(side*.66,.03,-.38,.052,.10,3.9,blue,4);
      box(side*1.17,.38,-3.02,1.98,.082,.74,aluminum,4);
      box(side*5.34,1.13,-.19,.19,.07,.85,orange,4);
      addRideBeam(addQuad,[side*.49,-.09,-.52],[side*3.30,1.02,-.20],.073,aluminum);
      // Each pontoon is a faceted hull with tapered prow and step.
      const floats=[[-2.83,.03,-1.13],[-2.48,.42,-1.10],
        [-1.55,.51,-1.06],[-.35,.51,-1.03],[.15,.48,-1.00],
        [1.40,.43,-1.02],[2.42,.32,-1.01],[3.02,.03,-.96]];
      const ring=(row,index)=>{
        const [z,w,cy]=floats[row];
        const profile=[[-1,-.04],[-.72,-.37],[0,-.48],
          [.72,-.37],[1,-.04],[.82,.42],[-.82,.42]];
        return [side*1.27+w*profile[index][0],cy+profile[index][1],z];
      };
      for(let row=0;row<floats.length-1;row++)for(let k=0;k<7;k++)
        addQuad(ring(row,k),ring(row,(k+1)%7),
          ring(row+1,(k+1)%7),ring(row+1,k),aluminum,4);
      for(const z of [-1.45,1.45])
        addRideBeam(addQuad,[side*.95,-.16,z],[side*1.27,-.68,z],.068,aluminum);
      box(side*1.27,-1.37,.2,.03,.035,4.35,white,4);
    }
    box(0,1.11,-3.23,.10,1.85,1.05,aluminum,4);
    box(0,1.47,-3.60,.12,.77,.18,blue,4);
    box(0,.53,1.31,1.08,.59,.065,glass,4);
    box(0,.19,2.94,1.03,.115,.58,blue,4);
    // Propeller is visible in front of the aircraft and not a jet exhaust.
    addRideBeam(addQuad,[0,-1.01,4.12],[0,1.15,4.12],.09,rubber);
    box(0,.07,4.24,.30,.30,.27,aluminum,4);
    return upload();
  }

  const ironManMeshes=buildJetpackMesh();
  const aircraftMeshes = {
    fighter: buildFighterMesh(),
    saucer: buildSaucerMesh(),
    jetpack: ironManMeshes.body,
    seaplane: buildCessna185FloatMesh()
  };
  // The optional real Blender GLB hot-swaps the meter-scale fallback, never
  // gates launching. A single bounded mesh batch works on every PATROL map.
  let floatplaneAssetReady=false,floatplaneAssetLoading=false;
  function prepareFloatplaneAsset(){
    if(floatplaneAssetReady||floatplaneAssetLoading||gl.isContextLost())return;
    floatplaneAssetLoading=true;
    import('./assets/aircraft/floatplane-glb.js')
      .then(m=>m.loadFloatplaneGLB('./assets/aircraft/cessna185-floats.glb',createTriangleMesh))
      .then(({mesh,metadata})=>{
        if(gl.isContextLost()){disposeSceneMesh(mesh);return;}
        const old=aircraftMeshes.seaplane;
        aircraftMeshes.seaplane=mesh;
        floatplaneAssetReady=true;
        if(old)disposeSceneMesh(old);
        console.info('[PATROL] Blender Cessna 185 loaded',metadata);
      })
      .catch(error=>console.info('[PATROL] Procedural C185 fallback:',error.message))
      .finally(()=>{floatplaneAssetLoading=false;});
  }

  // PATROL_NYC_FLATIRON_V9: based on the NPS National Register description.
  // Original bounded art: rounded prow, limestone podium, glazed terra cotta
  // shaft, upper Beaux-Arts cornices and paired sash-window bay rhythm.
  function buildFlatironArchitecture({addQuad,addTri,addLightQuad}){
    const plan=[[-6.65,-7.95],[6.65,-7.95],[1.05,6.63]];
    for(let i=0;i<=6;i++){
      const t=i/6;
      plan.push([.32-.76*t,8.11+.20*Math.sin(Math.PI*t)]);
    }
    plan.push([-1.14,6.55]);
    const ring=(y,s=1)=>plan.map(([x,z])=>[s*x,y,s*z]);
    const base=[.60,.57,.51],shaft=[.73,.68,.59],lime=[.83,.77,.66],
      dark=[.39,.38,.34],glass=[.20,.30,.34],frame=[.30,.26,.23];
    let quads=0,windows=0,litWindows=0;
    const quad=(a,b,c,d,color,lit=false)=>{
      (lit?addLightQuad:addQuad)(a,b,c,d,color);
      quads++;if(lit)litWindows++;
    };
    for(const [lo,hi,color] of [[0,3.60,base],[3.60,11.85,shaft],
      [11.85,16.75,lime]]){
      const lower=ring(lo),upper=ring(hi);

          lerp(x,hi.p[j][0],t),y,lerp(z,hi.p[j][1],t)
        ]);
      }
      for(let tier=0;tier<2;tier++){
        const lo=ringProfiles[tier],hi=ringProfiles[tier+1];
        // Every wide facet has a different subdued glass reflectance.
        for(let face=0;face<8;face++){
          const j=(face+1)%8;
          addQuad([lo.p[face][0],lo.y,lo.p[face][1]],
            [lo.p[j][0],lo.y,lo.p[j][1]],
            [hi.p[j][0],hi.y,hi.p[j][1]],
            [hi.p[face][0],hi.y,hi.p[face][1]],
            glazing[(face+tier*3)%8],5);
        }
      }
      // Explicit mullions track the same sloped polygon geometry as glass.
      // No dark floating window columns and no repeated opaque blocks.
      for(let alt=9.5;alt<60;alt+=2.65){
        const pts=towerRing(alt);
        for(let i=0;i<8;i++){
          const next=(i+1)%8;
          addRideBeam(addQuad,pts[i],pts[next],
            .027,[.42,.51,.56]);
        }
      }
      for(let face=0;face<8;face++){
        const column=towerRing(7)[face],middle=towerRing(32)[face],
          crown=towerRing(60)[face];
        addRideBeam(addQuad,column,middle,.066,[.56,.64,.68]);
        addRideBeam(addQuad,middle,crown,.061,[.52,.61,.65]);
      }
      // Rooftop communications enclosure, stepped mast and thin antennas.
      stack([[60,5.36,5.36],[60.5,5.12,5.12]],steel,8);
      stack([[60.5,1.65,1.65],[62.3,1.36,1.36]],spandrel,8);
      box(0,62.4,0,3.1,.35,3.1,[.63,.66,.65]);
      mast(62.75,77,.49,[.57,.62,.65]);
      for(const dx of [-1.12,1.12]){

      }
      light(0,76.83,0,.20,.24,.20,[.97,.29,.22]);
    }
    return {body:upload(),lights:lights.upload()};
  }

  function addModelBox(addQuad, x, y, z, width, height, length, color, materialClass=0) {
    const l = x-width/2, r = x+width/2, b = y-height/2, t = y+height/2;
    const f = z+length/2, k = z-length/2;
    const a=[l,b,f],c=[r,b,f],e=[r,t,f],g=[l,t,f];
    const i=[l,b,k],j=[r,b,k],m=[r,t,k],n=[l,t,k];
    for (const face of [[a,c,e,g],[j,i,n,m],[i,a,g,n],[c,j,m,e],[g,e,m,n],[i,j,c,a]]) {
      addQuad(...face,color,materialClass);
    }
  }

  let railSections = [];

  function bridgeRoadHeight(x) {
    const bridge = EAST_RIVER_BRIDGE;
    const approach = clamp((Math.abs(x-bridge.x)-bridge.halfLength)/bridge.ramp,0,1);
    return lerp(bridge.deck+0.60, STREET_Y, approach);
  }

  function pushRoadStrip(addQuad, a, b, width, color, lift=0, surface=0) {
    const [dx,dz] = [b[0]-a[0],b[2]-a[2]];
    const length = Math.hypot(dx,dz);
    if (!length) return;
    const x = dz/length*width/2, z = -dx/length*width/2;
    addQuad([a[0]+x,a[1]+lift,a[2]+z],[a[0]-x,a[1]+lift,a[2]-z],
      [b[0]-x,b[1]+lift,b[2]-z],[b[0]+x,b[1]+lift,b[2]+z],color,surface);
  }

  function railwayPoints(track) {
    const points=[[track.west,track.z-track.radius],[track.east,track.z-track.radius]];
    for(let i=1;i<=16;i++){
      const a=i*Math.PI/16;
      points.push([track.east+Math.sin(a)*track.radius,track.z-Math.cos(a)*track.radius]);
    }
    points.push([track.west,track.z+track.radius]);
    for(let i=1;i<=16;i++){
      const a=i*Math.PI/16;
      points.push([track.west-Math.sin(a)*track.radius,track.z+Math.cos(a)*track.radius]);
    }
    return points;
  }

  function buildBridgeDeck(addQuad,box) {
    const {x,z,halfLength,halfWidth,ramp}=EAST_RIVER_BRIDGE;
    const road=[0.27,0.29,0.31], concrete=[0.51,0.49,0.44], steel=[0.32,0.37,0.40];
    const reach=halfLength+ramp;
    for(let a=x-reach;a<x+reach;){
      const limit=a<x-halfLength?x-halfLength:a<x+halfLength?x+halfLength:x+reach;
      const b=Math.min(a+3,limit),ya=bridgeRoadHeight(a),yb=bridgeRoadHeight(b);
      pushRoadStrip(addQuad,[a,ya,z],[b,yb,z],halfWidth*2,concrete);
      pushRoadStrip(addQuad,[a,ya,z],[b,yb,z],halfWidth*2-1.2,road,0.021,3);
      for(const side of [-1,1]){
        const zz=z+side*halfWidth;
        const edgeA=[a,ya,zz],edgeB=[b,yb,zz];
        addQuad(edgeA,edgeB,[b,yb-0.62,zz],[a,ya-0.62,zz],steel);
        addRideBeam(addQuad,[a,ya-1.29,zz-side*0.42],[b,yb-1.29,zz-side*0.42],0.27,steel);
        addRideBeam(addQuad,[a,ya-0.60,zz-side*0.42],[b,yb-1.29,zz-side*0.42],0.12,steel);
        if(Math.floor((a-x+reach)/3)%3===0){
          addRideBeam(addQuad,[a,ya-1.14,z-3.82],[a,ya-1.14,z+3.82],0.43,steel);
        }
      }
      const index=Math.round((a-x+reach)/3);
      if(index%3===0){
        pushRoadStrip(addQuad,[a,ya,z],[b,yb,z],0.12,[0.94,0.77,0.42],0.037);
      }
      for(const side of [-1,1]){
        const zz=z+side*(halfWidth-0.61);
        pushRoadStrip(addQuad,[a,ya,zz],[b,yb,zz],0.09,[0.81,0.80,0.75],0.030);
      }
      a=b;
    }
    // Brooklyn Bridge: pedestrian boardwalk, stringers and bolted rails.
    const timber=[.42,.33,.24],steelFrame=[.32,.35,.37];
    for(let bx=x-halfLength+2;bx<x+halfLength-2;bx+=3.2){
      const y=bridgeRoadHeight(bx);
      box(bx,y+.13,z,3.0,.23,1.40,timber);
      box(bx,y+.252,z,.055,.012,1.39,[.24,.23,.22]);
      for(const side of [-1,1]){
        const zRail=z+side*.72;
        box(bx,y+.95,zRail,.075,1.45,.075,steelFrame);
        box(bx,y+1.66,zRail,3.1,.068,.070,steelFrame);
      }
    }

    // Detail pass: separate wooden transverse plank joints, curb stringers,
    // walkway safety mesh and under-deck steel cross bracing.
    const paleWood=[.48,.38,.27], darkJoint=[.22,.21,.20], railWire=[.39,.42,.42];
    for(let bx=x-halfLength+1.0; bx<x+halfLength-1.0; bx+=1.35){
      const y=bridgeRoadHeight(bx);
      box(bx,y+.270,z,1.30,.014,1.34,paleWood);
      box(bx+.66,y+.278,z,.034,.020,1.34,darkJoint);
      if(Math.round((bx-x)*10)%3===0){
        for(const side of [-1,1]){
          const rz=z+side*.72;
          box(bx,y+1.18,rz,.027,.024,.050,railWire);
          box(bx,y+1.38,rz,.029,.024,.050,railWire);
        }
      }
    }
    for(let bx=x-halfLength+4;bx<x+halfLength-4;bx+=7){
      const y=bridgeRoadHeight(bx);
      for(const side of [-1,1]){
        addRideBeam(addQuad,[bx-3.2,y-.34,z+side*3.75],
          [bx+3.2,y-1.22,z+side*.82],.055,steelFrame);
      }
    }

    // Protected cycling strip and original walkway lane markings.
    // Kept on the same bridge collision deck and follows approach elevations.
    for(let xx=x-halfLength+1;xx<x+halfLength-1;xx+=5.5){
      const yy=bridgeRoadHeight(xx)+.045, next=Math.min(xx+5.5,x+halfLength-1);
      pushRoadStrip(addQuad,[xx,yy,z+halfWidth*.58],
        [next,bridgeRoadHeight(next)+.045,z+halfWidth*.58],
        .065,[.83,.85,.80],.004);
      if(Math.round(xx)%2===0)
        pushRoadStrip(addQuad,[xx,yy,z+halfWidth*.20],
          [Math.min(xx+1.85,next),bridgeRoadHeight(Math.min(xx+1.85,next))+.045,z+halfWidth*.20],
          .055,[.88,.84,.65],.005);
    }
    // Stone cable-anchor housings flank each shore approach.
    for(const side of [-1,1])for(const ax of [x-halfLength-9,x+halfLength+9]){
      const y=bridgeRoadHeight(ax),az=z+side*3.67;
      box(ax,y-.34,az,3.35,1.21,1.56,[.51,.49,.45]);
      box(ax,y+.20,az,3.52,.21,1.72,[.59,.57,.51]);
    }
    // Piers stop where the ramps meet the street. The river span remains open.
    for(const side of [-1,1]){
      for(let dx=halfLength+5;dx<reach-6;dx+=12){
        const px=x+side*dx, height=bridgeRoadHeight(px)-1.40;
        const base=sampleTerrainHeight(px,z);
        if(base<=WATER_H+0.6 || height-base<0.75)continue;
        for(const dz of [-2.52,2.52]) box(px,base+(height-base)/2,z+dz,1.10,height-base,1.28,concrete);
        box(px,height-0.10,z,1.44,0.39,6.7,concrete);

    }
  }

  function buildBridgeRiverfront(addQuad,box) {
    const harborStone=[0.50,0.50,0.46], promenade=[0.62,0.59,0.53];
    const shore=(z,side)=>{
      for(let offset=0;offset<=108;offset+=2){
        const x=86+side*offset;
        if(sampleTerrainHeight(x,z)>WATER_H+0.67)return x;
      }
      return null;
    };
    for(const side of [-1,1])for(let z=-397;z<-300;z+=4){
      const a=shore(z,side),b=shore(z+4,side);
      if(a===null || b===null || Math.abs(a-b)>11)continue;
      const x=a+side*0.85, next=b+side*0.85;
      const y=Math.max(sampleTerrainHeight(x,z),sampleTerrainHeight(next,z+4))+0.10;
      pushRoadStrip(addQuad,[x+side*2.05,y,z],[next+side*2.05,y,z+4],3.4,promenade,0,2);
      addQuad([x,WATER_H-0.4,z],[next,WATER_H-0.4,z+4],[next,y+0.30,z+4],[x,y+0.30,z],harborStone,1);
      pushRoadStrip(addQuad,[x,y+0.30,z],[next,y+0.30,z+4],0.53,harborStone,0,2);
      if(Math.abs(z-EAST_RIVER_BRIDGE.z)>9){
        box(x+side*0.63,y+0.43,z+0.55,0.22,0.87,0.22,[0.28,0.34,0.37]);
      }
    }
  }

  // Existing authored NYC roads predate the newer procedural road network.
  // Clip their complete sidewalk envelope against the same live city land
  // and occupied parcels, rather than drawing old roads through the harbor.
  // Return separate dry portions; bridge decks use their own water-safe path.
  function clipAuthoredNycStreet(a,b,terrainAt,lotAt,waterY) {
    const dx=b[0]-a[0],dz=b[1]-a[1],length=Math.hypot(dx,dz);
    if(!Number.isFinite(length)||length<4)return [];
    const nx=-dz/length,nz=dx/length,halfEnvelope=6.05;
    const offsets=[-1,-.8,-.6,-.4,-.2,0,.2,.4,.6,.8,1];
    const clearAt=t=>{
      const x=a[0]+dx*t,z=a[1]+dz*t;
      for(const across of offsets){
        const sx=x+nx*halfEnvelope*across;
        const sz=z+nz*halfEnvelope*across;
        if(terrainAt(sx,sz)<=waterY+.68 || lotAt(sx,sz))return false;
      }
      return true;
    };
    // At most 0.75 world units between cells; each cell is probed at its
    // midpoint as well as both ends, catching the narrow shore inlets that
    // slipped between the old endpoint-only checks.
    const steps=Math.max(1,Math.ceil(length/.75));
    const runs=[];
    let start=-1;
    const point=t=>[a[0]+dx*t,a[1]+dz*t];
    const flush=end=>{
      if(start<0)return;
      // Trim a partial cell at the shoreline to avoid a hanging curb tip.
      const first=start+(start>0?1:0);
      const last=end-(end<steps?1:0);
      if(last>first){
        const p=point(first/steps),q=point(last/steps);
        if(Math.hypot(q[0]-p[0],q[1]-p[1])>=4)runs.push([p,q]);
      }
      start=-1;
    };
    let previous=clearAt(0);
    for(let cell=0;cell<steps;cell++){
      const next=clearAt((cell+1)/steps);
      const safe=previous&&next&&clearAt((cell+.5)/steps);
      if(safe&&start<0)start=cell;
      if(!safe)flush(cell);
      previous=next;
    }
    flush(steps);
    return runs;
  }

  function buildStreetScene(addQuad, box) {
    const pavement = [0.25,0.28,0.30], sidewalk = [0.53,0.54,0.51], paint = [0.84,0.78,0.52];
    for (const street of CITY_STREETS.slice(1)) {
      for (let i=1;i<street.length;i++) {
        const originalA=street[i-1], originalB=street[i];
        const a0=originalA,b0=originalB;
        // Stop authoring roads outside the landmark neighborhoods.
        // A nearest-point segment check retains roads crossing a focus area.
        const nearZone=NYC_FOCUS_ZONES.some(zone=>{
          const vx=b0[0]-a0[0],vz=b0[1]-a0[1];
          const t=Math.max(0,Math.min(1,
            ((zone[0]-a0[0])*vx+(zone[1]-a0[1])*vz)/(vx*vx+vz*vz||1)));
          const dx=a0[0]+vx*t-zone[0],dz=a0[1]+vz*t-zone[1];
          const r=zone[3]+16;
          return dx*dx+dz*dz<r*r;
        });
        if(!nearZone)continue;
        // The entire 11.6-unit sidewalk and lamp envelope must be dry and
        // unoccupied, not just the centerline on a long historic road.
        const fragments=clipAuthoredNycStreet(originalA,originalB,
          sampleTerrainHeight,cityLotAt,WATER_H);
        for(const [a,b] of fragments){
        const start=[a[0],STREET_Y,a[1]], end=[b[0],STREET_Y,b[1]];
        pushRoadStrip(addQuad,start,end,11.6,sidewalk);
        pushRoadStrip(addQuad,start,end,8.0,pavement,0.035);
        const distance=Math.hypot(b[0]-a[0],b[1]-a[1]);
        if(distance>6.0){
          const fx=(b[0]-a[0])/distance, fz=(b[1]-a[1])/distance;
          const nx=fz,nz=-fx;
          // Raised curbstones and narrow drainage channels: the original
          // scene had a single sidewalk rectangle with no raised edge.
          for(const side of [-1,1]){
            const curbStart=[a[0]+nx*side*4.10,STREET_Y+.103,
              a[1]+nz*side*4.10];
            const curbEnd=[b[0]+nx*side*4.10,STREET_Y+.103,
              b[1]+nz*side*4.10];
            pushRoadStrip(addQuad,curbStart,curbEnd,.26,
              [.63,.62,.56],0,2);
            const gutterStart=[a[0]+nx*side*3.91,STREET_Y+.057,
              a[1]+nz*side*3.91];
            const gutterEnd=[b[0]+nx*side*3.91,STREET_Y+.057,
              b[1]+nz*side*3.91];
            pushRoadStrip(addQuad,gutterStart,gutterEnd,.10,
              [.18,.20,.22]);
          }
          // Roadside street lamps use the road tangent, not world X/Z,
          // so they follow Broadway-like diagonal roads naturally.
          if(distance>27){
            for(let along=19;along<distance-12;along+=38){
              const bx=a[0]+fx*along,bz=a[1]+fz*along;
              if(nycDetailBand(bx,bz)<2)continue;
              const side=((Math.floor(along/38)+i)%2)*2-1;
              const lx=bx+nx*side*5.17,lz=bz+nz*side*5.17;
              const metal=[.28,.34,.36];
              box(lx,STREET_Y+1.92,lz,.105,3.77,.105,metal);
              box(lx,STREET_Y+.15,lz,.24,.26,.24,[.45,.47,.46]);
              addRideBeam(addQuad,[lx,STREET_Y+3.71,lz],
                [lx-nx*side*.86,STREET_Y+3.69,lz-nz*side*.86],
                .055,metal);
              const px=lx-nx*side*.86,pz=lz-nz*side*.86;
              box(px,STREET_Y+3.64,pz,.42,.105,.31,[.89,.80,.58]);
              box(px,STREET_Y+3.70,pz,.46,.055,.35,metal);
              // Non-repeating urban fittings; only every third fixture.
              if(Math.floor(along/38)%3===1){
                const sign=[.12+((i*3)%5)*.03,.35,.30+((i+2)%4)*.06];
                box(lx,STREET_Y+2.86,lz,.42,.28,.055,sign);
                box(lx,STREET_Y+2.96,lz+.028,.29,.038,.065,[.78,.82,.77]);
              }else if(Math.floor(along/38)%3===2){
                const hx=bx+nx*side*5.02,hz=bz+nz*side*5.02;
                box(hx,STREET_Y+.32,hz,.22,.52,.22,[.72,.22,.17]);
                box(hx,STREET_Y+.57,hz,.32,.10,.32,[.80,.28,.21]);
                box(hx,STREET_Y+.65,hz,.10,.12,.10,[.55,.55,.54]);
              }
            }
          }
          // Diagonal-road crosswalks; stripes follow the actual road heading.
          if(i>1 && distance>34 &&
             Math.hypot(b[0]-originalB[0],b[1]-originalB[1])<.5 &&
             nycDetailBand(b[0],b[1])>=2){
            const cx=b[0]-fx*3.25,cz=b[1]-fz*3.25;
            for(let lateral=-3.25;lateral<=3.25;lateral+=.83){
              const x0=cx+nx*lateral,z0=cz+nz*lateral;
              const x1=x0+nx*.49,z1=z0+nz*.49;
              pushRoadStrip(addQuad,
                [x0,STREET_Y+.079,z0],
                [x1,STREET_Y+.079,z1],.91,[.86,.86,.80]);
            }
          }
        }
        for (let j=4;j+2<distance-2;j+=8) {
          const point=t=>[lerp(a[0],b[0],t),STREET_Y,lerp(a[1],b[1],t)];
          pushRoadStrip(addQuad,point(j/distance),point((j+2)/distance),0.15,paint,0.055);
        }
        }
      }
    }
    const bridge=EAST_RIVER_BRIDGE;
    const left=bridge.x-bridge.halfLength, right=bridge.x+bridge.halfLength;
    buildBridgeDeck(addQuad,box);
    buildBridgeRiverfront(addQuad,box);
    for (const x of [left-bridge.ramp-1,right+bridge.ramp+1]) {
      for (let stripe=-3;stripe<=3;stripe++) {
        box(x,STREET_Y+0.067,bridge.z+stripe*0.91,0.65,0.025,0.46,[0.82,0.83,0.77]);
      }
      for (const side of [-1,1]) {
        const z=bridge.z+side*5.1;
        box(x,STREET_Y+2,z,0.14,4,0.14,[0.30,0.33,0.33]);
        box(x,STREET_Y+3.72,z,0.33,0.77,0.27,[0.21,0.25,0.24]);
        box(x,STREET_Y+3.53,z-side*0.15,0.17,0.15,0.06,[0.30,0.66,0.39]);
      }
    }
    // An elevated train line on the Brooklyn side.
    const metal = [0.32,0.35,0.37], rail = [0.57,0.60,0.61];
    const track=BROOKLYN_RAIL;
    const route=makeTrafficRoute(railwayPoints(track));
    const n=route.points.length-1;
    for(let i=0;i<n;i++){
      const [ax,az]=route.points[i], [bx,bz]=route.points[i+1];
      const a=[ax,track.height-0.24,az],b=[bx,track.height-0.24,bz];
      pushRoadStrip(addQuad,a,b,3.18,metal);
      const length=Math.hypot(bx-ax,bz-az), nx=(bz-az)/length,nz=(ax-bx)/length;
      for(const offset of [-0.63,0.63]){
        pushRoadStrip(addQuad,[ax+nx*offset,track.height-0.07,az+nz*offset],
          [bx+nx*offset,track.height-0.07,bz+nz*offset],0.14,rail);
      }
    }
    for(let at=0;at<route.total;at+=16){
      const {x,z,yaw}=railPose({route},at);
      box(x,17.15,z,1.65,5,1.65,metal);
      box(x,19.31,z,2.32+Math.abs(Math.sin(yaw))*0.38,0.3,2.43,metal);
    }
    // Place the elevated platform next to the subway car instead of a
    // detached deck 13 units from the rails. Keep a door-width boarding gap
    // and align both platform/canopy with the actual rail geometry.
    const platformZ=track.z-2.55;
    box(336,track.height-.10,platformZ,33,.72,1.80,sidewalk);
    for(const xx of [324,336,348])
      box(xx,track.height+1.70,platformZ,.27,3.30,.34,metal);
    box(336,track.height+3.30,platformZ,35,.40,2.10,metal);
  }

  function updateBridgeRails() {
    if (bridgeRails) {
      gl.deleteVertexArray(bridgeRails.vao);
      for (const buffer of bridgeRails.buffers) gl.deleteBuffer(buffer);
      bridgeRails = null;
    }
    if (!selectedMap.city) return;
    const {addQuad,upload}=createTriangleMesh();
    const bridge=EAST_RIVER_BRIDGE;
    for (const section of railSections) {
      if (section.broken) continue;
      const z=bridge.z+section.side*(bridge.halfWidth-0.16);
      const a=section.start,b=section.end;
      const metal=[0.39,0.43,0.44];
      for(const height of [0.65,1.28]) {
        const p=[a,bridgeRoadHeight(a)+height,z], q=[b,bridgeRoadHeight(b)+height,z];
        pushRoadStrip(addQuad,p,q,0.16,metal);
        addQuad(p,q,[q[0],q[1]+0.19,z],[p[0],p[1]+0.19,z],metal);
      }
      for (let x=a+0.3;x<b;x+=1.4) {
        addModelBox(addQuad,x,bridgeRoadHeight(x)+0.79,z,0.12,1.17,0.18,metal);
      }
    }
    bridgeRails=upload();
  }

  function makeTrafficRoute(points) {
    const lengths=[0];
    for(let i=1;i<points.length;i++) {
      lengths.push(lengths[i-1]+Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]));
    }
    return { points, lengths, total:lengths.at(-1) };
  }

  function railPose(actor,distance) {
    const {route}=actor;
    const offset=((distance%route.total)+route.total)%route.total;
    const i=route.lengths.findIndex((length,index)=>index>0&&length>=offset);
    const a=route.points[i-1],b=route.points[i];
    const t=(offset-route.lengths[i-1])/(route.lengths[i]-route.lengths[i-1]);
    return {x:lerp(a[0],b[0],t),z:lerp(a[1],b[1],t),y:BROOKLYN_RAIL.height,
      yaw:Math.atan2(b[0]-a[0],b[1]-a[1])};
  }

  function trafficPose(actor,time) {
    if(actor.parked)return actor.parked;
    const {route,pace,offset,kind}=actor;
    const cycle=(time*pace+offset)%(actor.vegas||actor.oneWay?route.total:2*route.total);
    const direction=cycle<route.total?1:-1;
    const distance=direction===1?cycle:2*route.total-cycle;
    const i=route.lengths.findIndex((at,index)=>index>0 && at>=distance);
    const a=route.points[i-1],b=route.points[i];
    const fraction=(distance-route.lengths[i-1])/(route.lengths[i]-route.lengths[i-1]);
    const yaw=Math.atan2((b[0]-a[0])*direction,(b[1]-a[1])*direction);
    const lateral=kind==='walker'?(actor.laneOffset??4.60):
      actor.expressway?(actor.laneOffset??1.65):actor.vegas?VEGAS_FAST_LANE:actor.bridge?1.07:1.76;
    const x=lerp(a[0],b[0],fraction)+Math.cos(yaw)*lateral;
    const z=lerp(a[1],b[1],fraction)-Math.sin(yaw)*lateral;
    const y=actor.expressway?lerp(a[2],b[2],fraction)+0.055:
      actor.vegas?sampleTerrainHeight(x,z)+0.30:
      actor.dc?WATER_H+2.56:
      actor.bridge?bridgeRoadHeight(x)+0.055:STREET_Y+0.07;
    return {x,y,z,yaw};
  }

  function prepareCityTraffic() {
    railSections=[];
    cityTraffic=[];
    civilAirTraffic=[];
    if (selectedMap.dc) {
      for (const [i,street] of DC_STREETS.entries()) {
        const route=makeTrafficRoute(street);

        for(let j=0;j<walkers;j++)cityTraffic.push({kind:'walker',dc:true,route,laneOffset:DC_ROADS[i].width/2+0.72,
          offset:(j+0.35)*route.total/walkers+i*7,pace:0.82+(j%4)*0.16});
        if(i<9)for(let j=0;j<2;j++)cityTraffic.push({kind:'taxi',dc:true,route,
          offset:(j+0.2)*route.total/2+i*11,pace:5.1+(i+j)%3});
      }
    } else if (selectedMap.city) {
      const bridge=EAST_RIVER_BRIDGE;
      const reach=bridge.halfLength+bridge.ramp;
      for(const side of [-1,1]) for(let x=bridge.x-reach;x<bridge.x+reach;x+=12) {
        railSections.push({start:x,end:Math.min(x+12,bridge.x+reach),side,broken:false});

      for (const [i,street] of CITY_STREETS.slice(0,3).entries()) {

        }
        if (i>0) for(let j=0;j<7;j++) {

        }
        for(let j=0;j<5;j++)

      civilAirTraffic.push(

        {center:[-112,-210],rx:185,rz:96,altitude:78,phase:2.5,pace:-0.057,scale:1.82,livery:1},
        {center:[112,-412],rx:220,rz:72,altitude:54,phase:4.1,pace:0.048,scale:1.62,livery:2},
        {center:[320,-388],rx:84,rz:22,altitude:35,phase:Math.PI*0.92,pace:0.022,scale:1.30,livery:0,approach:true},
        {center:[74,-105],rx:295,rz:160,altitude:96,phase:1.0,pace:-0.043,scale:2.40,livery:2},
        {center:[350,-388],rx:120,rz:30,altitude:46,phase:5.5,pace:-0.018,scale:1.50,livery:1,approach:true}
      );
    } else if(selectedMap.vegas){

    if(selectedMap.city||selectedMap.vegas){

      const route=makeTrafficRoute(expresswayRoute(design));
      const ramp=makeTrafficRoute(expresswayRoute(design,design.ramp));
      for(let i=0;i<6;i++)cityTraffic.push({kind:'taxi',expressway:true,route,offset:i*route.total/3.0,pace:8.2+i%2});

  function buildStreetVehicle(kind,clothing=[0.27,0.37,0.52],skin=[0.69,0.51,0.39]) {
    const { addTri,addQuad,upload }=createTriangleMesh();
    const box=(...args)=>addModelBox(addQuad,...args);
    const glass=[0.25,0.39,0.44], rubber=[0.12,0.14,0.15];
    if(['taxi','police','sedan','suv','van'].includes(kind)) {
      // PATROL_NYC_CIVILIAN_FLEET_V10: additional resident/fleet silhouettes.
      // Generic Camry-style sedan, RAV4-style SUV and local delivery van,
      // not licensed or dimension-verified manufacturer models.
      const police=kind==='police',suv=kind==='suv',van=kind==='van';
      const body=police?[.80,.83,.86]:kind==='taxi'?[.96,.66,.11]:
        kind==='sedan'?[.24,.28,.34]:suv?[.65,.69,.70]:[.88,.89,.87];

      // Six longitudinal sections create a sculpted hood, tapered bumpers,
      // chamfered shoulder line and curved boot instead of a single cuboid.
      const shell=[
        [-1.95,.64,.78,.63],[-1.74,.79,.93,.76],
        [-1.12,.835,1.035,.88],[.82,.835,1.035,.89],
        [1.57,.79,.96,.80],[1.95,.64,.79,.64]
      ];
      function contour([z,halfW,top,shoulder]){
        return [
          [-halfW*.88,.35,z],[-halfW,.53,z],[-halfW,shoulder-.04,z],
          [-halfW*.88,top-.015,z],[-halfW*.65,top,z],
          [halfW*.65,top,z],[halfW*.88,top-.015,z],
          [halfW,shoulder-.04,z],[halfW,.53,z],[halfW*.88,.35,z]
        ];
      }
      const cross=shell.map(contour);
      for(let k=0;k<cross.length-1;k++){
        for(let j=0;j<cross[k].length;j++)
          addQuad(cross[k][j],cross[k][(j+1)%10],
            cross[k+1][(j+1)%10],cross[k+1][j],

  // Procedural, logo-free civilian airliners based on the proportions of the
  // open CC-BY airliner reference set. This fits PATROL's raw WebGL2 pipeline.
  function buildCivilAirlinerMesh(livery=0) {
    const body=createTriangleMesh(), trim=createTriangleMesh(), lights=createTriangleMesh(), gear=createTriangleMesh();
    const fuselage=livery===1?[0.82,0.84,0.86]:livery===2?[0.92,0.92,0.88]:[0.90,0.91,0.89];
    const stripe=livery===1?[0.12,0.31,0.62]:livery===2?[0.06,0.45,0.54]:[0.18,0.25,0.36];
    const window=[0.035,0.095,0.13], dark=[0.025,0.045,0.068], glow=[1.0,0.83,0.46];
    const rings=[[3.45,0.02,0.02],[2.85,0.58,0.56],[1.55,0.70,0.68],[-1.80,0.62,0.60],[-3.05,0.31,0.30],[-3.38,0.08,0.08]];
    const ringPoint=([z,rx,ry],i)=>{const a=i*Math.PI*2/16;return [Math.cos(a)*rx,0.14+Math.sin(a)*ry,z];};
    for(let r=0;r<rings.length-1;r++)for(let i=0;i<16;i++)body.addQuad(
      ringPoint(rings[r],i),ringPoint(rings[r],i+1),ringPoint(rings[r+1],i+1),ringPoint(rings[r+1],i),fuselage);
    for(const side of [-1,1]){
      body.addQuad([side*0.38,0.08,0.92],[side*4.10,0.03,-0.05],[side*3.45,0.01,-0.46],[side*0.40,0.10,-0.25],fuselage);
      body.addQuad([side*0.42,0.10,-0.25],[side*3.45,0.01,-0.46],[side*2.78,-0.01,-0.85],[side*0.36,0.06,-0.54],stripe);
      addModelBox(body.addQuad,side*1.62,-0.23,0.23,0.34,0.44,0.78,dark);
      addModelBox(body.addQuad,side*1.62,-0.28,0.23,0.16,0.10,0.58,window);
    }
    body.addQuad([-0.24,0.20,-2.42],[0.24,0.20,-2.42],[0.92,0.18,-3.08],[-0.92,0.18,-3.08],fuselage);
    body.addQuad([-0.18,0.17,-2.46],[0.18,0.17,-2.46],[0.48,1.22,-3.02],[-0.48,1.22,-3.02],stripe);
    body.addQuad([-0.48,0.20,-2.70],[0.48,0.20,-2.70],[0.28,0.76,-3.24],[-0.28,0.76,-3.24],fuselage);
    for(const side of [-1,1])for(let i=0;i<10;i++){
      const z=1.98-i*0.43, x=side*(0.63+0.04*Math.min(i,5));
      addModelBox(trim.addQuad,x,0.42,z,0.045,0.13,0.20,window);
    }
    addModelBox(trim.addQuad,0,0.53,0.30,0.06,0.08,4.6,stripe);
    addModelBox(trim.addQuad,0,0.31,-2.98,0.32,0.08,0.42,stripe);
    // Multi-part engine intake fan, swept winglets and cockpit eyebrows.
    for(const side of [-1,1]){
      const cx=side*1.62,cy=-.23;
      for(let k=0;k<12;k++){
        const a=k*Math.PI/6,b=(k+1)*Math.PI/6;
        const p=(ang,r,z)=>[cx+Math.cos(ang)*r,cy+Math.sin(ang)*r,z];
        trim.addQuad(p(a,.235,.636),p(b,.235,.636),
          p(b,.155,.661),p(a,.155,.661),[.60,.63,.66]);
        trim.addTri([cx,cy,.665],p(b,.14,.665),p(a,.14,.665),dark);
      }
      body.addQuad([side*3.91,.05,-.13],[side*4.09,.52,-.29],
        [side*3.80,.52,-.43],[side*3.42,.02,-.45],stripe);
      body.addTri([side*.41,.31,2.58],[side*.11,.45,2.82],
        [side*.52,.31,2.15],window);
      addModelBox(trim.addQuad,side*.66,.34,1.13,.025,.15,.026,dark);
      addModelBox(lights.addQuad,side*4.03,.06,-.20,.06,.05,.07,
        side>0?[.22,.84,.45]:[.94,.24,.20]);
    }
    addModelBox(lights.addQuad,-0.06,0.20,3.39,0.12,0.08,0.10,glow);
    addModelBox(lights.addQuad,0.06,0.20,3.39,0.12,0.08,0.10,glow);
    for(const side of [-1,1])addModelBox(lights.addQuad,side*3.42,0.05,-0.20,0.07,0.06,0.18,glow);

    // Airliner close-range geometry: rounded nacelles, flap seams and gear.
    for(const side of [-1,1]){
      const ex=side*1.62, ey=-.23, engineColor=[.66,.70,.72];
      for(let j=0;j<16;j++){
        const a=j*Math.PI/8,b=(j+1)*Math.PI/8;
        const p=(theta,r,z)=>[ex+Math.cos(theta)*r,ey+Math.sin(theta)*r,z];
        body.addQuad(p(a,.32,.43),p(b,.32,.43),p(b,.29,-.48),p(a,.29,-.48),fuselage);
        trim.addQuad(p(a,.33,.51),p(b,.33,.51),p(b,.255,.52),p(a,.255,.52),engineColor);
      }
      for(let i=0;i<3;i++){
        const wx=side*(.95+i*.93);
        addModelBox(trim.addQuad,wx,.064,-.38,.23,.018,.022,[.38,.43,.46]);
      }
      // Small retracted gear door markings remain visible while flying.
      addModelBox(trim.addQuad,side*.45,-.50,-.75,.24,.035,.48,[.37,.39,.41]);
      addModelBox(trim.addQuad,side*.46,.40,2.25,.17,.065,.13,window);
    }
    // Grey radome ring and antenna fairing.
    addModelBox(trim.addQuad,0,.10,2.90,.20,.018,.08,[.66,.68,.69]);
    addModelBox(trim.addQuad,0,.68,-1.86,.12,.20,.31,fuselage);

    // Solid wing undersides, visible flaps and ground-approach landing gear.
    // The gear uses a separate shared mesh and is drawn for approach traffic.
    const underWing=[.49,.53,.57],tire=[.095,.115,.13],wheel=[.49,.52,.53];
    for(const side of [-1,1]){
      body.addQuad([side*.38,-.047,.89],[side*3.89,-.087,-.07],
        [side*3.35,-.075,-.45],[side*.41,-.042,-.27],underWing,4);
      body.addQuad([side*.41,-.048,-.27],[side*3.35,-.075,-.45],
        [side*2.75,-.071,-.86],[side*.36,-.047,-.55],underWing,4);
      for(let i=0;i<3;i++){
        const wx=side*(1.12+i*.77);
        body.addQuad([wx,.041,-.45],[wx+side*.45,.033,-.50],
          [wx+side*.41,.031,-.59],[wx,.043,-.55],[.48,.53,.56],4);
      }
      const gx=side*.52;
      addModelBox(gear.addQuad,gx,-.78,-.68,.12,.70,.13,[.58,.60,.60]);
      addModelBox(gear.addQuad,gx,-1.09,-.68,.29,.16,.20,[.19,.22,.24]);
      for(let k=0;k<12;k++){
        const a=k*Math.PI/6,b=(k+1)*Math.PI/6;
        const p=(theta,r)=>[gx+side*.18,-1.13+Math.sin(theta)*r,-.68+Math.cos(theta)*r];
        gear.addQuad(p(a,.19),p(b,.19),p(b,.11),p(a,.11),tire);
        gear.addTri([gx+side*.182,-1.13,-.68],p(a,.096),p(b,.096),wheel);
      }
    }
    addModelBox(gear.addQuad,0,-.70,1.55,.10,.66,.11,[.58,.60,.61]);
    for(const side of [-1,1]){
      addModelBox(gear.addQuad,side*.12,-1.04,1.55,.10,.25,.23,tire);
    }
    return {body:body.upload(),trim:trim.upload(),lights:lights.upload(),gear:gear.upload()};
  }

  const civilAirlinerMeshes=[0,1,2].map(buildCivilAirlinerMesh);

  function civilAirlinerPose(actor,time) {
    const a=actor.phase+time*actor.pace;
    const x=actor.center[0]+Math.cos(a)*actor.rx,z=actor.center[1]+Math.sin(a)*actor.rz;
    if(actor.approach)return {x,z,y:actor.altitude+10.0*(0.5+0.5*Math.sin(a)),yaw:Math.atan2(-Math.sin(a)*actor.rz,Math.cos(a)*actor.rx)};
    return {x,z,y:actor.altitude+Math.sin(a*1.7)*2.8,yaw:Math.atan2(Math.cos(a)*actor.rz,Math.sin(a)*actor.rx)};
  }

  function drawCivilAirTraffic(drawMesh) {
    if(!selectedMap.city)return;
    for(const actor of civilAirTraffic){
      const pose=civilAirlinerPose(actor,sceneryTime),dx=pose.x-camPos[0],dz=pose.z-camPos[2];
      if(dx*dx+dz*dz>620*620)continue;
      const front=[Math.sin(pose.yaw),0,Math.cos(pose.yaw)],right=[front[2],0,-front[0]];
      const model=mat4FromBasis([pose.x,pose.y,pose.z],right,worldUp,front,actor.scale);
      const meshes=civilAirlinerMeshes[actor.livery];
      drawMesh(meshes.body,model);
      drawMesh(meshes.trim,model);
      if(actor.approach)drawMesh(meshes.gear,model);
      if(Math.sin(sceneryTime*3.0+actor.phase)>-0.15)drawMesh(meshes.lights,model,true);
    }
  }

  function drawStreetWalker(drawMesh,body,{x,y,z,yaw,stride,scale=1},animateLegs=true){
    const front=[Math.sin(yaw),0,Math.cos(yaw)],right=[front[2],0,-front[0]];
    drawMesh(body,mat4FromBasis([x,y,z],right,worldUp,front,scale));
    // At a distance the two animated leg draw calls are smaller than a pixel.
    if(!animateLegs)return;
    for(const side of [-1,1]){
      const angle=side*stride;
      const up=worldUp.map((v,i)=>v*Math.cos(angle)+front[i]*Math.sin(angle));
      const fwd=front.map((v,i)=>v*Math.cos(angle)-worldUp[i]*Math.sin(angle));
