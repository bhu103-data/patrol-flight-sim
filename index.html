  }

  function buildTimesSquareDistrict({box,lamp,addTri,addQuad,lightQuad,solidAt,place},ledQuad){
    const district=TIMES_SQUARE,avenue=district.avenue;
    const ground=STREET_Y+0.09, street=STREET_Y+0.04;
    const sidewalk=[0.49,0.48,0.47], slate=[0.56,0.54,0.51], granite=[0.61,0.59,0.55];
    const asphalt=[0.28,0.29,0.32], steel=[0.24,0.27,0.28], warm=[1.0,0.82,0.54], white=[0.94,0.92,0.83];
    const point=(x,z,y=ground)=>[x,y,z];
    const surface=(left,right,south,north,y,color)=>
      addQuad(point(left,south,y),point(left,north,y),point(right,north,y),point(right,south,y),color);
    const paintRoad=(a,b,width,color,lift=0)=>pushRoadStrip(addQuad,point(...a,street),point(...b,street),width,color,lift);

    // Seventh Avenue remains a southbound street. The Broadway plazas keep the
    // diagonal alignment but leave the numbered cross streets open between blocks.
    paintRoad([-35,-70],[-35,71],8.4,sidewalk);
    paintRoad([-35,-70],[-35,71],5.85,asphalt,0.017);
    paintRoad([avenue,-70],[avenue,71],11.9,sidewalk);
    paintRoad([avenue,-70],[avenue,71],8.5,asphalt,0.018);
    for(let z=-67;z<67;z+=4.8)paintRoad([avenue,z],[avenue,z+2.0],0.10,white,0.033);
    for(const [a,b] of [[-70,-40],[50,72]]){
      paintRoad([timesBroadway(a),a],[timesBroadway(b),b],9.5,sidewalk);
      paintRoad([timesBroadway(a),a],[timesBroadway(b),b],6.9,asphalt,0.018);
    }
    for(let block=0;block<district.crossings.length-1;block++){
      const south=district.crossings[block]+2.9,north=district.crossings[block+1]-2.9;
      const edge=(z,side)=>timesBroadway(z)+side*4.6;
      const addBand=(offset,width,y,color)=>addQuad(point(edge(south,-1)+offset,south,y),point(edge(north,-1)+offset,north,y),
        point(edge(north,-1)+offset+width,north,y),point(edge(south,-1)+offset+width,south,y),color);
      addBand(0,9.2,ground,slate);
      const gap=(z,side)=>{

      }
      for(let row=0;row<Math.floor((north-south)/1.64);row++){
        const a=south+row*1.64,b=Math.min(north,a+1.61);
        for(let col=0;col<6;col++){
          const offset=col*1.53,shade=0.94+0.06*Math.sin(col*4.16+row*2.86+block);
          addQuad(point(edge(a,-1)+offset,a,ground+0.014),point(edge(b,-1)+offset,b,ground+0.014),
            point(edge(b,-1)+offset+1.49,b,ground+0.014),point(edge(a,-1)+offset+1.49,a,ground+0.014),granite.map(v=>v*shade));
        }

      if(Math.abs(timesBroadway((south+north)/2)-avenue)>10){
        for(const z of [south+1.2,north-1.2]){
          const x=timesBroadway(z);

    paintRoad([avenue,6],[avenue,32],8.5,asphalt,0.083);

      for(const [x,direction] of [[avenue,1],[timesBroadway(z),-1]]){

          for(let stripe=-3;stripe<=3;stripe++)box(x+stripe*0.71,street+0.116,z+dz,0.43,0.025,0.49,white);

      lamp(x-0.19,ground+3.02,z-2.75,0.087,0.105,0.16,[1.0,0.42,0.19]);

    function marquee(x,z,y,width,height,color,text,side=1){
      const face=z+side*0.17;
      box(x,y,z,width+0.27,height+0.25,0.30,steel);
      const p=(u,v,offset=0)=>[x+u,y+v,face+side*offset];
      ledQuad(p(-width/2,-height/2),p(width/2,-height/2),
        p(width/2,height/2),p(-width/2,height/2),color,text);
      for(const h of [-height/2,height/2])

      box(x,y+height*.5+.17,face-side*.04,width+.26,.10,.26,sil);

      for(let i=0;i<Math.min(7,Math.max(2,Math.floor(width/2.5)));i++){

      {name:'1530 Broadway',address:'43rd–44th',x:-14,z:-10,w:13,d:10,h:24,
        color:[.60,.54,.45],front:1,sideSign:1,

      {name:'1515 Broadway',address:'44th–45th',x:39,z:6,w:15,d:10,h:35,
        color:[.36,.40,.46],front:-1,sideSign:1,

      {name:'1540 Broadway',address:'44th–45th',x:-15,z:6,w:13,d:10,h:30,
        color:[.55,.50,.46],front:-1,sideSign:1,
        panels:[[15.8,13,[.25,.54,.71],'1540 BROADWAY']]},
      {name:'1535 Broadway / Marriott Marquis',address:'45th–46th',
        x:44,z:22,w:18,d:9,h:44,color:[.33,.40,.45],front:-1,sideSign:1,
        panels:[[23,21,[.33,.64,.74],'MARQUIS PLAZA']]},
      {name:'1552 Broadway',address:'45th–46th',x:-16,z:22,w:13,d:10,h:26,
        color:[.56,.45,.39],front:-1,sideSign:0,
        panels:[[14,11,[.67,.47,.26],'LIGHTYEAR']]},
      {name:'1565 Broadway / Digital Stack',address:'46th–47th',

        panels:[[8.5,6.4,[.31,.62,.59],'THE DIGITAL STACK'],
                [21.4,11.5,[.49,.30,.73],'BROADWAY NORTH']]},
      {name:'1557 Broadway / Duffys Duo',address:'46th–47th',

      {name:'TSX Broadway',address:'46th–47th',x:44,z:41,w:14,d:10,h:37,
        color:[.27,.36,.42],front:-1,sideSign:1,
        panels:[[19.3,19.7,[.48,.29,.68],'TSX BROADWAY']]},
      {name:'2 Times Square',address:'47th–48th',x:4,z:61,w:7,d:10,h:39,

    for(const [i,b] of blocks.entries()){

      }else{

      box(x,ground+1.34,z,w+0.14,2.68,d+0.18,[0.37,0.39,0.40]);
      box(x,ground+h-0.15,z,w+0.25,0.32,d+0.25,color.map(v=>v*1.19));
      box(x-0.63,ground+h+0.42,z+0.55,w*0.47,0.88,d*0.35,[0.37,0.39,0.40]);
      // Real urban roof clutter (mechanical louvers, ducts, parapet,
      // solar-shaded setbacks) at a fixed geometry budget per site.
      for(let unit=0;unit<2+(i%3);unit++){
        const xx=x+(unit-1)*w*.19,zz=z+(unit%2?.16:-.18)*d;
        box(xx,ground+h+.55,zz,w*.11+.15,.95+(unit%2)*.57,
          d*.17,unit%2?stone:metal);
        for(let louver=0;louver<4;louver++){
          const y=ground+h+.25+louver*.16;
          box(xx,y,zz+d*.086+.025,w*.09,.028,.04,[.22,.30,.34]);
        }
      }
      // Signature tower profiles: asymmetric fins / light-well frames
      // replace identical top-of-box silhouettes across all 13 sites.
      if(style===0||style===4){
        for(const side of [-1,1])for(let ridge=0;ridge<3;ridge++){
          const px=x+side*w*(.31+ridge*.035);
          box(px,ground+h*.48,z+d*.13,.095,h*.81,
            .12,stone);
        }
      }else if(style===1||style===5){
        for(let tier=0;tier<3;tier++){
          const yy=ground+h*.80+tier*.65;
          box(x+w*.15,yy,z-d*.12,
            w*(.55-tier*.08),.13,d*(.50-tier*.07),metal);
        }
      }else if(style===2){
        for(const side of [-1,1]){
          box(x+side*w*.32,ground+h*.51,z-d*.19,
            .14,h*.75,.18,stone);
          box(x+side*w*.25,ground+h*.63,z-d*.21,
            .075,h*.48,.14,metal);
        }
      }else{
        for(let unit=0;unit<4;unit++){
          const zz=z-d*.30+unit*d*.20;

        }
        }

    const terrainPath=(points,width,color,lift=0.09)=>{
      for(let i=1;i<points.length;i++){
        const a=points[i-1],b=points[i],length=Math.hypot(b[0]-a[0],b[1]-a[1]);
        if(length<0.001)continue;
        const dx=(b[1]-a[1])/length*width/2,dz=(a[0]-b[0])/length*width/2;
        const point=(f,side)=>{
          const x=lerp(a[0],b[0],f)+dx*side,z=lerp(a[1],b[1],f)+dz*side;
          return [x,level(x,z)+lift,z];
        };
        const segments=Math.ceil(length/3.2);
        for(let j=0;j<segments;j++){
          const first=point(j/segments,1),second=point(j/segments,-1),
            third=point((j+1)/segments,-1),fourth=point((j+1)/segments,1);
          // ALASKA_SAFE_ROAD_GATE_V1: clip road pieces intersecting water.
          // A strip must be dry across its full width, not just its center.
          if(selectedMap.alaska){
            // A narrow tidal inlet can pass BETWEEN corner/midpoint samples.
            // Survey quarter-length intervals across the entire road width,
            // keeping only dry mesh pieces rather than deleting whole routes.
            let flooded=false;
            for(const fraction of [0,.25,.5,.75,1]){
              const t=(j+fraction)/segments;
              for(const side of [-1,0,1]){
                const p=point(t,side);
                if(sampleTerrainHeight(p[0],p[2])<=WATER_H+.92){
                  flooded=true;break;
                }
              }
              if(flooded)break;
            }
            if(flooded)continue;
          }
          addQuad(first,second,third,fourth,color);
        }
      }
    };
    const walkwayRail=(x,z,y,span)=>{
      addRideBeam(addQuad,[x-span/2,y+0.89,z],[x+span/2,y+0.89,z],0.086,agedWood);
      for(let px=x-span/2;px<x+span/2+0.1;px+=2.25){
        box(px,y+0.42,z,0.12,0.84,0.12,agedWood);
      }
    };
    const planted=(x,z,size)=>{
      const y=level(x,z);
      box(x,y+0.23,z,size,0.50,1.85,concrete);
      box(x,y+0.47,z,size-0.24,0.20,1.57,moss);
      for(let dx=-size/2+0.7;dx<size/2-0.2;dx+=1.35){
        cylinder(x+dx,z,[[y+0.37,0.45],[y+0.85,0.58],[y+1.08,0.19]],[0.29,0.42,0.25],7);
      }
    };

    if(selectedMap===FLIGHT_MAPS.coast){
      const site=findScenerySite(63,-490,{footprint:7,range:117})||
        findScenerySite(-105,-362,{footprint:7,range:126});
      if(!site)return;
      const {x,y,z}=site;
      const stone=[0.81,0.77,0.65], red=[0.61,0.22,0.19], dark=[0.27,0.33,0.36];
      place('Tidewatch Lighthouse',site);
      cylinder(x,z,[[y-0.65,3.45],[y+0.68,3.45]],concrete,14);
      for(let i=0;i<4;i++){
        const bottom=y+0.66+i*2.76, radius=2.5-i*0.26;
        cylinder(x,z,[[bottom,radius],[bottom+2.76,radius-0.26]],i%2?red:stone,14);
      }
      box(x,y+1.61,z-2.43,0.92,1.92,0.21,dark);
      cylinder(x,z,[[y+11.70,2.05],[y+12.06,2.05]],dark,14);
      cylinder(x,z,[[y+12.12,1.34],[y+13.53,1.37]],[0.33,0.50,0.57],12);
      cylinder(x,z,[[y+13.53,1.63],[y+14.66,0.07]],red,12);
      lamp(x,y+12.87,z,1.35,0.38,1.35,amber);
      const base=[x,y+12.86,z];
      sceneryMovers.push({kind:'lighthouseBeam',pos:base});
      solidAt('lighthouse',x,z,y-0.4,y+14.66,2.5,2.5);
      const keeper=findScenerySite(x+13,z-8,{footprint:4,range:18,avoid:(a,b)=>Math.hypot(a-x,b-z)<10});
      if(keeper){
        shed(keeper,5.8,7.0,[0.76,0.72,0.62],1.35,'lighthouse keeper cottage');
        terrainPath([[x+3.3,z-2],[x+6,z-5],[keeper.x-2.4,keeper.z-3.8]],2.3,concrete);
      }
    }else if(selectedMap.airfield){
      const a=selectedMap.airfield;

        avoid:(x,z)=>x<a.x+22 || Math.abs(z-a.z)>55});

      terrainPath([[a.x+a.halfWidth,z-6],[x-5,z-6],[x+7,z-6]],5.2,asphalt,0.17);
      terrainPath([[x-7,z-6],[x-7,z+9],[x+4,z+9]],5.6,asphalt,0.17);
      for(let i=0;i<7;i++){
        const px=x-13+i*2.6, pz=z-6;
        terrainPath([[px,pz],[px+1.45,pz]],0.12,[0.87,0.72,0.35],0.19);
        lamp(px,level(px,pz-2.8)+0.25,pz-2.8,0.15,0.22,0.15,blue);
      }
      const wx=x-9,wz=z+10,wy=level(wx,wz);
      cylinder(wx,wz,[[wy,0.16],[wy+4.3,0.09]],chalk,8);
      sceneryMovers.push({kind:'windsock',pos:[wx,wy+4.34,wz]});
      solidAt('windsock mast',wx,wz,wy,wy+4.34,0.17,0.17);

    }else if(selectedMap.city){
      // Old small Pond was located by mistake in the Reservoir section.

      }
      for(const side of [-1,1])walkwayRail(x,z+side*2.9,deck,11.25);
      solidAt('lookout deck',x,z,deck-0.38,deck,6.1,3.05);
      terrainPath([[x+6.2,z],[x+11,z],[x+15,z+5],[x+22,z+9]],1.6,[0.53,0.48,0.41]);
      const cabin=findScenerySite(x+13,z+9,{footprint:4,range:18,
        avoid:(a,b)=>Math.hypot(a-x,b-z)<10});
      if(cabin)shed(cabin,6.6,7.8,[0.59,0.37,0.25],1.5,'lookout shelter');
      box(x+2,deck+0.64,z+2.74,1.48,0.42,0.12,agedWood);
      lamp(x-4.8,deck+1.04,z+2.88,0.24,0.24,0.24,amber);
    }else if(selectedMap.vegas){

      terrainPath([[runwayX+9.4,z],[x-12,z],[x-12,z+14]],7.5,asphalt,0.18);
      for(let visit=0;visit<3;visit++){
        const pz=z-11+visit*10;
        terrainPath([[x-15,pz],[x+3,pz]],7.7,asphalt,0.19);
        terrainPath([[x-13,pz],[x-2,pz]],0.13,[0.88,0.71,0.41],0.22);
        for(const side of [-1,1]){
          lamp(x-16,level(x-16,pz+side*3.4)+0.21,pz+side*3.4,0.17,0.17,0.17,blue);

      box(x+6,y+1.68,z,9.4,3.36,31.0,[0.57,0.55,0.51]);

      for(let i=-6;i<=6;i++){

      for(let i=0;i<rings.length-1;i++)for(let edge=0;edge<8;edge++){
        addQuad(profile(rings[i],edge),profile(rings[i],edge+1),

  function buildVegasStrip(geometry) {
    const {box,lamp,cylinder,solidAt,place,addQuad}=geometry;
    const hotelDistricts=[
      {x:-107,z:-371,halfX:58,halfZ:46},
      {x:-89,z:-156,halfX:48,halfZ:51},
      {x:15,z:-166,halfX:33,halfZ:22},
      {x:-99,z:-67,halfX:47,halfZ:39},
      {x:17,z:33,halfX:43,halfZ:44},
      {x:10,z:155,halfX:38,halfZ:41},
      {x:57,z:-274,halfX:40,halfZ:39},
      {x:83,z:43,halfX:19,halfZ:24}
    ];
    const hotelLot=(x,z,w,d)=>hotelDistricts.some(area=>
      Math.abs(x-area.x)<area.halfX+w && Math.abs(z-area.z)<area.halfZ+d);
    const amber=[1.0,0.70,0.30],blue=[0.35,0.67,0.96],pink=[0.99,0.43,0.70];
    const roadway=[0.25,0.26,0.27];
    const roadX=VEGAS_BOULEVARD;
    buildVegasRoads(box,lamp,addQuad);
    place('Sands Avenue',{x:126,z:-20});
    place('Tropicana Avenue',{x:81,z:-323});
    buildVegasHotels(geometry);
    buildParisVegas(geometry);
    buildVegasPromenades(geometry);
    const stopX=-25.95,stopZ=-171.5,stopY=sampleTerrainHeight(stopX,stopZ);
    buildPoliceStop(geometry,{x:stopX,y:stopY+0.32,z:stopZ,yaw:0,sidewalkX:-23.91,footY:stopY+0.285});
    renderExpressway(VEGAS_EXPRESSWAY,geometry);
    buildVegasRides(geometry);

    const strip=VEGAS_SITES.strip;
    place(strip.name,strip);
    for(let i=0;i<10;i++) {
      for(const side of [-1,1]){
        const x=roadX+side*(23+i%3*2.6),z=-298+i*62+side*7;
        if(hotelLot(x,z,8,9)||VEGAS_CROSS_STREETS.some(road=>Math.abs(road.z-z)<16)||Math.abs(z)<28&&side>0)continue;
        const ground=sampleTerrainHeight(x,z), h=8+i%4*3.2;
        box(x,ground+h/2,z,15,h,18,[0.31+i%3*0.06,0.32,0.36+i%2*0.08]);
        box(x+side*3,ground+h+0.6,z,8,1.3,11,[0.44,0.42,0.43]);
        for(let floor=2.0;floor<h-1;floor+=2.1){
          for(let column=-3;column<=3;column++){
            const dx=column*1.55;
            for(const end of [-1,1]){
              box(x+dx,ground+floor,z+end*9.035,0.83,0.77,0.07,[0.28,0.39,0.52]);
              if((column+i+Math.floor(floor)+end)%4===0)
                lamp(x+dx,ground+floor,z+end*9.074,0.61,0.58,0.025,[0.73,0.60,0.40]);
            }
            box(x-side*7.53,ground+floor,z+column*1.85,0.06,0.81,0.86,[0.30,0.43,0.57]);
          }
        }
        for(const dz of [-7,7])lamp(x-side*7.57,ground+h*0.52,z+dz,0.09,h*0.9,0.30,i%3===0?pink:i%3===1?blue:amber);
        lamp(x-side*7.6,ground+h-0.8,z,0.12,0.38,13.2,i%2?blue:pink);
        solidAt('Strip hotel',x,z,ground,ground+h+1.2,7.5,9);
      }
    }
    const sphere=VEGAS_SITES.sphere;
    const sphereY=sampleTerrainHeight(sphere.x,sphere.z);
    cylinder(sphere.x,sphere.z,[[sphereY,15.4],[sphereY+0.55,15.4]],[0.26,0.29,0.34],32);
    place(sphere.name,sphere);
    solidAt('Sphere',sphere.x,sphere.z,sphereY,sphereY+2*sphereRadius+0.5,sphereRadius,sphereRadius);

    const tower=VEGAS_SITES.tower;
    const t=sampleTerrainHeight(tower.x,tower.z);
    cylinder(tower.x,tower.z,[[t,5.3],[t+3,4.3],[t+39.5,2.65]],[0.63,0.64,0.63],16);
    cylinder(tower.x,tower.z,[[t+39,2.9],[t+43.5,7],[t+47,6.8],[t+48,4]],[0.38,0.40,0.45],20);
    cylinder(tower.x,tower.z,[[t+47,0.72],[t+57,0.19]],[0.58,0.58,0.60],8);
    for(let i=0;i<18;i++){
      const a=i*Math.PI/9;
      lamp(tower.x+Math.sin(a)*6.82,t+45,tower.z+Math.cos(a)*6.82,0.46,0.5,0.48,pink);
    }
    lamp(tower.x,t+56.9,tower.z,0.29,0.43,0.29,[1,0.24,0.21]);
    place(tower.name,tower);
    solidAt('observation tower',tower.x,tower.z,t,t+57,4.1,4.1);

    // Secondary hotel wings and low-rise blocks fill out the streets behind the Strip.
    for(const [col,east] of [-141,-111,6,87,151].entries()) {
      for(let row=0;row<13;row++) {
        const x=east+Math.sin(row*2.1+col)*6.5,z=-366+row*56+(col%2)*7.5;
        if(hotelLot(x,z,10,12) || VEGAS_CROSS_STREETS.some(street=>Math.abs(street.z-z)<17) ||
          sceneryObjects.some(o=>Math.abs(o.x-x)<o.halfX+12&&Math.abs(o.z-z)<o.halfZ+14)) continue;
        const height=5.2+((col*5+row*3)%7)*1.36;
        const width=12+((row+col)%3)*2.5,length=16+(row%3)*2.3;
        const grade=sampleTerrainHeight(x,z);
        const walls=col%2?[0.46,0.41,0.41]:[0.42,0.45,0.48];
        box(x,grade+height/2,z,width,height,length,walls);
        box(x-1.2,grade+height+0.38,z+1.4,width*0.42,0.76,length*0.49,[0.32,0.33,0.36]);
        for(let w=-2;w<=2;w++){
          const xOff=w*width*0.135;
          box(x+xOff,grade+height*0.62,z-length/2-0.06,0.69,0.95,0.12,[0.25,0.34,0.46]);
          if((row+w+2)%3===0)lamp(x+xOff,grade+height*0.62,z-length/2-0.14,0.53,0.67,0.09,[0.69,0.54,0.39]);
        }
        solidAt('commercial building',x,z,grade,grade+height+0.76,width/2,length/2);
      }
    }

    const runway=VEGAS_SITES.airport;
    const base=sampleTerrainHeight(runway.x,runway.z)+0.11;
    box(runway.x,base-0.065,runway.z,runway.halfWidth*2,0.11,runway.halfLength*2,roadway);
    for(let dz=-runway.halfLength+4;dz<runway.halfLength-4;dz+=10){
      box(runway.x,base,runway.z+dz,0.24,0.014,4.2,[0.86,0.85,0.78]);
      for(const side of [-1,1])lamp(runway.x+side*(runway.halfWidth-0.3),base+0.04,runway.z+dz,0.19,0.10,0.18,amber);
    }
    for(const side of [-1,1])for(let i=-3;i<=3;i++){
      box(runway.x+i*1.58,base+0.01,runway.z+side*(runway.halfLength-4),0.39,0.017,3.5,[0.89,0.89,0.82]);
    }
    box(runway.x+30,base+3.2,runway.z-12,23,6.4,26,[0.45,0.46,0.46]);
    lamp(runway.x+18.44,base+3.1,runway.z-12,0.05,0.32,19,blue);
    place(runway.name,runway);
    solidAt('airport hangar',runway.x+30,runway.z-12,base,base+6.4,11.5,13);
  }

  // The rasterized lettering is batched into the same emissive mesh as the windows.
  function addVegasLettering(lightQuad,name,point,width,height,color) {
    const mask=document.createElement('canvas');
    mask.width=Math.ceil(width/height*28); mask.height=28;
    const ctx=mask.getContext('2d');
    ctx.font='bold 23px Georgia, serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(name,mask.width/2,14,mask.width);
    const pixels=ctx.getImageData(0,0,mask.width,28).data;
    for(let row=0;row<28;row++){
      let col=0;
      while(col<mask.width){
        const start=col;
        while(col<mask.width && pixels[(row*mask.width+col)*4+3]>=128)col++;
        if(col===start){col++;continue;}
        const a=start/mask.width-0.5,b=col/mask.width-0.5;
        const low=(0.5-(row+1)/28)*height,high=(0.5-row/28)*height;
        lightQuad(point(a*width,low),point(b*width,low),point(b*width,high),point(a*width,high),color);
      }
    }
  }

  function buildVegasHotels({box,lamp,cylinder,solidAt,place,addQuad,lightQuad}) {
    const ground=sampleTerrainHeight(VEGAS_BOULEVARD,0);
    const limestone=[0.79,0.70,0.56], cream=[0.89,0.81,0.67], copper=[0.42,0.28,0.19];
    const warm=[1.0,0.79,0.47], glass=[0.23,0.32,0.40], asphalt=[0.24,0.25,0.26];
    const paving=[0.54,0.49,0.42], iron=[0.24,0.23,0.21];

    function mass(name,x,z,width,depth,height,wall) {
      box(x,ground+(height-0.4)/2,z,width,height+0.4,depth,wall);
      solidAt(name,x,z,ground,ground+height,width/2,depth/2);
    }

    function drive(points,width) {
      points=points.map(([x,z],i)=>{
        const end=i===0||i===points.length-1;
        return [end&&Math.abs(x-VEGAS_BOULEVARD)<13?
          VEGAS_BOULEVARD+Math.sign(x-VEGAS_BOULEVARD)*8.3:x,z];
      });
      for(let i=1;i<points.length;i++){
        const a=[points[i-1][0],ground+0.24,points[i-1][1]];
        const b=[points[i][0],ground+0.24,points[i][1]];
        pushRoadStrip(addQuad,a,b,width+1.2,paving);
        pushRoadStrip(addQuad,a,b,width,asphalt,0.028);
        const distance=Math.hypot(b[0]-a[0],b[2]-a[2]);
        for(let along=2;along+1.55<distance-1;along+=4.6){
          const point=t=>[lerp(a[0],b[0],t/distance),a[1],lerp(a[2],b[2],t/distance)];
          pushRoadStrip(addQuad,point(along),point(along+1.55),0.085,[0.83,0.78,0.67],0.037);
        }
      }
      for(const [x,z] of points.slice(1,-1)){
        cylinder(x,z,[[ground+0.242,width/2+0.60]],paving,16);
        cylinder(x,z,[[ground+0.268,width/2]],asphalt,16);
      }
    }

    function resortGuests(points,count,seed) {
      const route=makeTrafficRoute(points);
      for(let i=0;i<count;i++){
        sceneryMovers.push({kind:'cityGuest',route,offset:route.total*(2*i+0.21)/count,
          pace:0.72+(i%4)*0.061,index:seed+i,scale:0.86+(i%5)*0.059});
      }
    }

    function plantedCourt(x,z,width,depth) {
      box(x,ground+0.06,z,width,0.20,depth,paving);
      for(const side of [-1,1]){
        const row=z+side*(depth/2-1.2);
        box(x,ground+0.23,row,width-1.3,0.29,1.8,cream);
        box(x,ground+0.42,row,width-1.65,0.22,1.42,[0.22,0.30,0.18]);
        for(let i=0;i<3;i++){
          const px=x+(i-1)*width*0.28;
          palm(px,row,2.9+i*0.35);

  function addRideBeam(addQuad,a,b,width,color) {
    const fwd=v3Norm(b.map((value,i)=>value-a[i]));
    const axis=Math.abs(fwd[1])>0.96?[1,0,0]:[0,1,0];
    const right=v3Norm(v3Cross(axis,fwd)),up=v3Cross(fwd,right);
    const corners=point=>[[-1,-1],[1,-1],[1,1],[-1,1]].map(([r,u])=>
      point.map((value,i)=>value+width*0.5*(r*right[i]+u*up[i])));
    const start=corners(a),end=corners(b);
    for(let i=0;i<4;i++){
      const j=(i+1)%4;
      addQuad(start[i],start[j],end[j],end[i],color);
    }
    addQuad(...start.slice().reverse(),color);
    addQuad(...end,color);
  }

  function buildNeonRunStation({box,lamp,solidAt,addQuad,lightQuad},ground,stationZ,points) {

    }
    box(55,ground+0.04,-316.38,74,0.13,0.72,curb);
    surface(73.5,82.3,-316.74,-315.0,walkY+0.005,[0.67,0.64,0.57]);
    for(const x of [21,89]){
      box(x,ground+0.25,-263,3.0,0.5,25,curb);
      box(x,ground+0.47,-263,2.57,0.10,24.6,grass);
      for(let i=0;i<6;i++){
        box(x+0.24*Math.sin(i*2),ground+0.56,-273+i*4.2,1.5,0.13,1.8,[0.32,0.39,0.24]);
      }
    }
    for(const x of [28,42,85]){
      box(x,walkY+0.50,-312.1,3.1,0.11,0.52,[0.39,0.27,0.20]);
      box(x,walkY+0.82,-312.34,3.08,0.33,0.10,[0.43,0.30,0.22]);
      for(const side of [-1,1])box(x+side,walkY+0.23,-312.1,0.11,0.46,0.42,rail);
      box(x+2.25,walkY+0.32,-312.15,0.42,0.64,0.45,rail);
    }

    function barrier(a,b,baseA,baseB){
      for(const height of [0.49,1.02]){
        addRideBeam(addQuad,[a[0],baseA+height,a[1]],[b[0],baseB+height,b[1]],0.061,rail);
      }
      const steps=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/1.7);
      for(let i=0;i<=steps;i++){
        const f=i/steps;
        box(lerp(a[0],b[0],f),lerp(baseA,baseB,f)+0.51,lerp(a[1],b[1],f),0.075,1.06,0.075,rail);
      }
    }

    function ramp(lowX,highX,z){
      const hw=1.03;
      const a=[lowX,walkY,z-hw],b=[lowX,walkY,z+hw];
      const c=[highX,deckY,z+hw],d=[highX,deckY,z-hw];
      const top=lowX<highX?[a,b,c,d]:[b,a,d,c];
      addQuad(...top,concrete);
      for(const side of [-1,1]){
        const edgeZ=z+side*hw;
        barrier([lowX,edgeZ],[highX,edgeZ],walkY,deckY);
        addQuad([lowX,ground,edgeZ],[highX,ground,edgeZ],[highX,deckY,edgeZ],[lowX,walkY,edgeZ],curb);
      }
      const steps=Math.ceil(Math.abs(highX-lowX));
      for(let i=0;i<steps;i++){
        const t=i/steps,next=(i+1)/steps;
        const x=lerp(lowX,highX,(t+next)/2);

      }
    }

    const boardWalk=stationZ-2.90, exitWalk=stationZ+2.05;
    const boardEdge=stationZ-4.02, exitEdge=stationZ+3.26;
    const trackAt=x=>{
      for(let i=91;i<=100;i++){
        if(points[i][0]>x)continue;
        const a=points[i-1],b=points[i],t=(x-a[0])/(b[0]-a[0]);
        return lerp(a[2],b[2],t);
      }
      return stationZ;
    };
    for(const side of [front,back]){

  function neonRunGuestPose(actor,time) {
    const scale=actor.scale??1;
    if(!actor.route){
      const [x,y,z]=actor.pos;
      return {x,y,z,yaw:actor.yaw+0.10*Math.sin(time*0.52+actor.index),stride:0,scale};
    }
    const {route,offset,pace}=actor;
    const travel=(time*pace+offset)%(2*route.total);
    const forward=travel<route.total?1:-1;
    const distance=forward===1?travel:2*route.total-travel;
    const next=route.lengths.findIndex((length,index)=>index>0&&length>=distance);
    const a=route.points[next-1],b=route.points[next];
    const t=(distance-route.lengths[next-1])/(route.lengths[next]-route.lengths[next-1]);
    const stride=0.42*Math.sin((time*pace+offset)*7.9)*clamp(Math.min(distance,route.total-distance)/0.42,0,1);
    return {x:lerp(a[0],b[0],t),y:lerp(a[2],b[2],t),z:lerp(a[1],b[1],t),
      yaw:Math.atan2((b[0]-a[0])*forward,(b[1]-a[1])*forward),stride,scale};
  }

  function coasterCarPose(actor,time,car) {
    const phase=time%actor.total;
    const offset=phase-clamp(phase-actor.stationTime,0,actor.dwell);
    const stage=actor.times.findIndex((at,i)=>i>0 && at>=offset);
    const progress=(offset-actor.times[stage-1])/(actor.times[stage]-actor.times[stage-1]);
    const head=lerp(actor.lengths[stage-1],actor.lengths[stage],progress);
    const distance=(head-car*2.16+actor.length)%actor.length;
    function onTrack(at){
      const wrapped=(at+actor.length)%actor.length;
      const next=actor.lengths.findIndex((length,i)=>i>0 && length>=wrapped);
      const a=actor.points[next-1],b=actor.points[next];
      const t=(wrapped-actor.lengths[next-1])/(actor.lengths[next]-actor.lengths[next-1]);
      return a.map((value,i)=>lerp(value,b[i],t));
    }
    const pos=onTrack(distance),before=onTrack(distance-0.74),after=onTrack(distance+0.74);
    const fwd=v3Norm(after.map((value,i)=>value-before[i]));
    const right=v3Norm(v3Cross(worldUp,fwd));
    return {pos,right,up:v3Cross(fwd,right),fwd};
  }

  function sceneryObstacle(x,z,y) {
    let nearest;
    for(const item of sceneryObjects){
      const dx=Math.abs(x-item.x), dz=Math.abs(z-item.z);

      if(y!==undefined && (y<item.y-0.42 || y>top+0.42))continue;
      if(!nearest || top>nearest.top)nearest=item.roofSlope||item.roofSlopeZ?{...item,top}:item;
    }
    return nearest;

  function makeVegasTraffic() {
    const northSouthPairs=[[-323,-115],[-115,105],[105,299]];
    for(const [index,[south,north]] of northSouthPairs.entries())for(const side of [-1,1]){
      const outer=side===1?VEGAS_PARADISE:VEGAS_SERVICE_ROAD;
      const corners=[[VEGAS_BOULEVARD,south],[VEGAS_BOULEVARD,north],[outer,north],[outer,south]];
      if(side===-1)corners.reverse();
      const points=[];
      for(let j=0;j<4;j++){
        const a=corners[(j+3)%4],b=corners[j],c=corners[(j+1)%4];
        const entry=b.map((v,axis)=>v+Math.sign(a[axis]-v)*6.3);
        const exit=b.map((v,axis)=>v+Math.sign(c[axis]-v)*6.3);
        for(let step=0;step<=5;step++){
          const t=step/5;
          points.push(entry.map((v,axis)=>(1-t)**2*v+2*t*(1-t)*b[axis]+t*t*exit[axis]));
        }
      }
      points.push(points[0]);
      const route=makeTrafficRoute(points);
      for(let j=0;j<5;j++) {
        cityTraffic.push({kind:'taxi',vegas:true,route,offset:35+index*12+j*route.total/5+(side===-1?18:0),pace:8.4+index*0.9});
      }
      if(index===0&&side===1){

  function buildVegasRoads(box,lamp,addQuad) {
    const asphalt=[0.23,0.24,0.26], edge=[0.52,0.50,0.47], white=[0.79,0.78,0.72], yellow=[0.91,0.68,0.33];
    const road=(a,b,width)=>{
      const dist=Math.hypot(b[0]-a[0],b[1]-a[1]);
      const face=(at,offset=0)=>{
        const along=at/dist;
        const x=lerp(a[0],b[0],along)+(b[1]-a[1])/dist*offset;
        const z=lerp(a[1],b[1],along)-(b[0]-a[0])/dist*offset;
        return [x,sampleTerrainHeight(x,z)+0.25,z];
      };
      for(let at=0;at<dist;at+=5.5){
        const next=Math.min(dist,at+5.5),p=face(at),q=face(next);
        pushRoadStrip(addQuad,p,q,width,edge,0.025);
        pushRoadStrip(addQuad,p,q,width-2.15,asphalt,0.045);
      }
      for(let at=5;at<dist-4;at+=10){
        const near=face(at),far=face(at+3.7);
        pushRoadStrip(addQuad,near,far,0.15,yellow,0.058);
        for(const offset of [-width*0.20,width*0.20]){
          pushRoadStrip(addQuad,face(at,offset),face(at+3,offset),0.13,white,0.060);
        }
      }
    };
    road([VEGAS_BOULEVARD,-422],[VEGAS_BOULEVARD,409],19.3);
    road([VEGAS_PARADISE,-368],[VEGAS_PARADISE,348],15.2);
    road([VEGAS_SERVICE_ROAD,-337],[VEGAS_SERVICE_ROAD,313],13.2);
    for(const {z} of VEGAS_CROSS_STREETS){
      road([VEGAS_SERVICE_ROAD-6,z],[169,z],14.5);
      const y=sampleTerrainHeight(VEGAS_BOULEVARD,z)+0.33;
      // Asphalt covers at-grade crossings and the crosswalks sit on top.
      box(VEGAS_BOULEVARD,y-0.028,z,19.5,0.025,14.6,asphalt);
      for (const side of [-1,1]) {
        const crossZ=z+side*6.15;
        for(let i=-6;i<=6;i++){
          box(VEGAS_BOULEVARD+i*1.43,y+0.014,crossZ,0.84,0.025,1.38,white);
        }
        box(VEGAS_BOULEVARD+side*4.27,y+0.012,z+side*8.06,7.85,0.024,0.18,white);
        for(const bank of [-1,1]){
          const x=VEGAS_BOULEVARD+bank*10.42;
          pushRoadStrip(addQuad,[x,y-0.018,crossZ],[x+bank*0.68,y-0.044,z+side*8.34],1.85,edge);
          box(x-bank*0.24,y-0.007,crossZ,0.52,0.020,1.22,[0.77,0.60,0.32]);
        }
        box(VEGAS_BOULEVARD+side*9.7,y+2,z-7.8,0.14,4,0.14,[0.24,0.28,0.31]);
        lamp(VEGAS_BOULEVARD+side*9.7,y+3.86,z-7.66,0.20,0.29,0.09,[0.47,0.85,0.47]);
      }
    }
    road([VEGAS_PARADISE,-323],[165,-362],11.9);
    road([165,-362],[177,-411],11.9);
    for(let z=-400;z<396;z+=32){
      for(const side of [-1,1]){
        const x=VEGAS_BOULEVARD+side*9.87,y=sampleTerrainHeight(x,z)+0.26;
        box(x,y+1.48,z,0.16,2.96,0.17,[0.33,0.36,0.38]);
        lamp(x-side*0.51,y+2.99,z,0.49,0.15,0.31,[1,0.78,0.54]);
      }
    }
  }

  function prepareSphereShow() {
    disposeSceneMesh(sphereMesh);
    sphereMesh=null;
    sphereCenter=null;
    sphereImpact=null;
    sphereShowControl.hidden=!selectedMap.vegas;
    if(!selectedMap.vegas)return;
    const {x,z}=VEGAS_SITES.sphere;
    const y=sampleTerrainHeight(x,z)+sphereRadius+0.5;
    sphereCenter=[x,y,z];
    const {addQuad,upload}=createTriangleMesh();
    const vertex=(row,side)=>{
      const lon=side*2*Math.PI/80, lat=-Math.PI/2+row*Math.PI/40;
      return [x+Math.sin(lon)*Math.cos(lat)*sphereRadius,y+Math.sin(lat)*sphereRadius,
        z+Math.cos(lon)*Math.cos(lat)*sphereRadius];
    };
    for(let row=0;row<40;row++)for(let side=0;side<80;side++){
      addQuad(vertex(row,side),vertex(row,side+1),vertex(row+1,side+1),
        vertex(row+1,side),[0.25,0.46,0.67]);
    }
    sphereMesh=upload();
    if(!earthPhoto){
      earthPhoto=gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,earthPhoto);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([31,65,113,255]));
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      loadEarthImage(offlineEarthPhoto).then(img=>{
        if(earthPhotoState!=='live')uploadEarthImage(img);
      }).catch(()=>{});
    }
    refreshSpherePhoto();
  }

  function loadEarthImage(url) {
    return new Promise((resolve,reject)=>{
      const image=new Image();
      if(!url.startsWith('data:'))image.crossOrigin='anonymous';
      image.onload=()=>resolve(image);
      image.onerror=()=>reject(new Error('Sphere image unavailable'));
      image.src=url;
    });
  }

  function uploadEarthImage(image) {
    const scaled=document.createElement('canvas');
    scaled.width=scaled.height=512;
    scaled.getContext('2d').drawImage(image,0,0,512,512);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,earthPhoto);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    try {
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,scaled);
    } finally {
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    }
  }

  async function refreshSpherePhoto() {
    if(!selectedMap.vegas || earthRefreshPending || Date.now()<nextEarthRefresh)return;
    earthRefreshPending=true;
    nextEarthRefresh=Date.now()+180000;
    try {
      const response=await fetch('https://epic.gsfc.nasa.gov/api/natural',{signal:AbortSignal.timeout(8000)});
      if(!response.ok)throw new Error('EPIC request failed');
      const photos=await response.json();
      const latest=Array.isArray(photos)?photos.reduce((newest,photo)=>
        typeof photo?.date==='string' && (!newest || photo.date>newest.date)?photo:newest,null):null;
      if(!latest || !/^epic_[a-z0-9]+_\d{8,18}$/i.test(latest.image) ||
        !/^\d{4}-\d{2}-\d{2} /.test(latest.date))throw new Error('Invalid EPIC metadata');
      const date=latest.date.slice(0,10).replaceAll('-','/');
      const url='https://api.nasa.gov/EPIC/archive/natural/'+date+'/jpg/'+latest.image+'.jpg?api_key=DEMO_KEY';
      const imageResponse=await fetch(url,{signal:AbortSignal.timeout(10000)});
      if(!imageResponse.ok)throw new Error('EPIC image request failed');
      const blob=await imageResponse.blob();
      if(!blob.type.startsWith('image/') || blob.size>5000000)throw new Error('Invalid EPIC image');
      const bitmap=await createImageBitmap(blob);
      try {
        uploadEarthImage(bitmap);
      } finally {
        bitmap.close();
      }
      earthPhotoState='live';
      nextEarthRefresh=Date.now()+900000;
    } catch {
      // The packaged EPIC image and original animations remain available offline.
    } finally {
      earthRefreshPending=false;
    }
  }

  function updateSphereStatus() {
    if(!selectedMap.vegas)return;
    const slot=chosenSpherePattern<0?Math.floor(sceneryTime/11)%sphereShowNames.length:chosenSpherePattern;
    const show=sphereShowNames[slot];
    const source=show==='Earth'?(earthPhotoState==='live'?' · NASA EPIC latest image':' · NASA EPIC offline image'):'';
    const text=chosenSpherePattern<0?'Now showing '+show+source:source.replace(/^ · /,'');
    if(sphereStatus.textContent!==text)sphereStatus.textContent=text;
    refreshSpherePhoto();
  }

  function cycleSpherePattern() {
    if(!flying || crash || !selectedMap.vegas)return;
    chosenSpherePattern=chosenSpherePattern===sphereShowNames.length-1?-1:chosenSpherePattern+1;
    spherePattern.value=String(chosenSpherePattern);
    updateSphereStatus();
  }

  function sphereTakesHit(x,y,z) {
    if(!sphereCenter)return false;
    const delta=[x-sphereCenter[0],y-sphereCenter[1],z-sphereCenter[2]];
    if(Math.hypot(...delta)>sphereRadius+0.22)return false;
    sphereImpact={direction:v3Norm(delta),started:sceneryTime};
    return true;
  }

  function drawSphereShow(drawMesh) {
    if(!sphereMesh)return;
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D,earthPhoto);
    gl.uniform1i(uMesh.earthPhoto,1);
    gl.uniform1i(uMesh.sphereShow,1);
    gl.uniform1f(uMesh.spherePattern,chosenSpherePattern);
    gl.uniform3fv(uMesh.sphereCenter,sphereCenter);
    gl.uniform4fv(uMesh.sphereImpact,sphereImpact?
      [...sphereImpact.direction,sceneryTime-sphereImpact.started]:[0,0,0,-1]);
    drawMesh(sphereMesh,mat4FromBasis([0,0,0],[1,0,0],worldUp,[0,0,1],1),false,false,false);
    gl.uniform1i(uMesh.sphereShow,0);
    gl.activeTexture(gl.TEXTURE0);
  }
  const missileMesh = buildConeMesh(0.65, 0.065, [0.88, 0.24, 0.24], [0.85, 0.85, 0.88]);
  const plumeOuterMesh = buildConeMesh(1.3, 0.14, [0.98, 0.58, 0.18], [0.95, 0.35, 0.15]);
  const plumeCoreMesh = buildConeMesh(0.75, 0.075, [1.0, 0.96, 0.85], [1.0, 0.86, 0.55]);
  const laserMesh = buildConeMesh(4.4, 0.045, [0.64, 0.98, 1.0], [0.15, 0.78, 1.0]);

  // Dynamically scaled scene framebuffer. The HUD has a separate logical size.
  // Start with a small buffer so the first raymarch does not submit a
  // full-resolution workload before the frame-time controller can react.
  const startupScale = 0.35;
  // More detailed 3D maps start sharp; adaptive scaling still handles slower GPUs.
  const cityScaleFloor=()=>Math.min(innerWidth,innerHeight)<620?.43:.55;
  const cityScaleStart=()=>{
    const mobile=Math.min(innerWidth,innerHeight)<620;
    // Keep the original 3D-map quality/performance profile everywhere
    // except NYC. Manhattan's distant facades and Central Park tree canopies
    // gain a sharper initial raster before adaptive frame pacing takes over.
    return selectedMap.city?(mobile?.67:.84):(mobile?.59:.73);
  };
  const sceneScaleFloor=()=>smoothScenery()?cityScaleFloor():startupScale;
  let resScale = startupScale, scaleCeiling = 1, fastFrames = 0;
  let fboW, fboH, hudW, hudH;
  let sceneFbo = null, sceneTex = null, sceneDepth = null;
  let directRendering = graphicsCompat, frameCheckPending = true;
  let renderVerified = false;
  const frameSample = new Uint8Array(4);

  const smoothScenery = () => Boolean(selectedMap.city || selectedMap.alaska || selectedMap.vegas || selectedMap.dc || selectedMap.chongqing);

  function resizeTargets() {
    if(gl.isContextLost())return;
    const viewWidth = Math.max(1, window.innerWidth);
    const viewHeight = Math.max(1, window.innerHeight);
    const aspect = viewWidth / viewHeight;
    const density = Math.min(window.devicePixelRatio || 1, 1.5);
    const targetHeight = smoothScenery()
      ? Math.min(viewHeight * density, 1080, 1920 / aspect)
      : Math.min(Math.max(viewHeight, 320), 540, 1200 / aspect);
    const targetLimit=directRendering?0.60:1;
    const scale=Math.min(resScale,targetLimit);
    fboH = Math.max(1, Math.round(targetHeight * scale));
    fboW = Math.max(1, Math.round(targetHeight * scale * aspect));

    // Avoid backing-store reallocations when only the 3D scale changes.
    // In particular, preserve the independent full-resolution 2D cockpit HUD.
    if(glCanvas.width !== fboW) glCanvas.width = fboW;
    if(glCanvas.height !== fboH) glCanvas.height = fboH;
    const desiredHudW = Math.round(viewWidth * density);
    const desiredHudH = Math.round(viewHeight * density);
    if(hudCanvas.width !== desiredHudW) hudCanvas.width = desiredHudW;
    if(hudCanvas.height !== desiredHudH) hudCanvas.height = desiredHudH;
    hudH = smoothScenery() ? Math.min(viewHeight, 720) : 340;
    hudW = Math.max(1, hudH * aspect);
    hudCtx.setTransform(hudCanvas.width/hudW,0,0,hudCanvas.height/hudH,0,0);

    if (sceneTex) gl.deleteTexture(sceneTex);
    if (sceneDepth) gl.deleteRenderbuffer(sceneDepth);
    if (sceneFbo) gl.deleteFramebuffer(sceneFbo);
    sceneTex=sceneDepth=sceneFbo=null;
    // Keep the expensive readPixels health check for startup and recovery,
    // not each routine adaptive resolution adjustment.
    if(!renderVerified)frameCheckPending=true;
    if(directRendering)return;

    gl.activeTexture(gl.TEXTURE0);
    sceneTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, fboW, fboH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const filter = smoothScenery() ? gl.LINEAR : gl.NEAREST;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    sceneDepth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, sceneDepth);

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function v3Cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }
  function v3Norm(a) {
    const l = Math.hypot(a[0], a[1], a[2]) || 1;
    return [a[0] / l, a[1] / l, a[2] / l];
  }
  function mat4Perspective(fovRad, aspect, near, far) {
    const f = 1.0 / Math.tan(fovRad * 0.5);
    const nf = 1.0 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, 2 * far * near * nf, 0
    ]);
  }
  function mat4LookAt(eye, center, up) {
    const f = v3Norm([center[0] - eye[0], center[1] - eye[1], center[2] - eye[2]]);
    // The flight map is east-right (+X), north-up (+Z), and +Y is altitude.
    const r = v3Norm(v3Cross(up, f));
    const u = v3Cross(f, r);
    return new Float32Array([
      r[0], u[0], -f[0], 0,
      r[1], u[1], -f[1], 0,
      r[2], u[2], -f[2], 0,
      -(r[0] * eye[0] + r[1] * eye[1] + r[2] * eye[2]),
      -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]),
      (f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2]),
      1
    ]);
  }
  function mat4Mul(a, b) {
    const out = new Float32Array(16);
    for (let c = 0; c < 4; c++) {
      for (let r = 0; r < 4; r++) {
        out[c * 4 + r] =
          a[0 * 4 + r] * b[c * 4 + 0] +
          a[1 * 4 + r] * b[c * 4 + 1] +
          a[2 * 4 + r] * b[c * 4 + 2] +
          a[3 * 4 + r] * b[c * 4 + 3];
      }
    }
    return out;
  }
  function mat4FromBasis(pos, right, up, fwd, scale = 1) {
    return new Float32Array([
      right[0] * scale, right[1] * scale, right[2] * scale, 0,
      up[0] * scale,    up[1] * scale,    up[2] * scale,    0,
      fwd[0] * scale,   fwd[1] * scale,   fwd[2] * scale,   0,
      pos[0],           pos[1],           pos[2],           1

  // Terrain Height Query on CPU (matches shader exactly)
  const WATER_H = 12.2;
  const TERRAIN_SCALE = 54.0;
  const terrainScaleFor = map => map.alaska ? 75 : map.vegas ? 68 : TERRAIN_SCALE;

  function sampleTerrainHeight(x,z) {
    const field=cityGroundField || heightField;
    if (!field) return WATER_H;
    const last = MAP_SIZE - 1;
    const fx = clamp((x / MAP_SPAN + 0.5) * MAP_SIZE - 0.5, 0, last);
    const fy = clamp((z / MAP_SPAN + 0.5) * MAP_SIZE - 0.5, 0, last);
    const ix = Math.floor(fx);
    const iy = Math.floor(fy);
    const tx = fx - ix;
    const ty = fy - iy;
    const ix1 = Math.min(ix + 1, last);
    const iy1 = Math.min(iy + 1, last);
    const h00 = field[iy * MAP_SIZE + ix];
    const h10 = field[iy * MAP_SIZE + ix1];
    const h01 = field[iy1 * MAP_SIZE + ix];
    const h11 = field[iy1 * MAP_SIZE + ix1];
    const h = lerp(lerp(h00, h10, tx), lerp(h01, h11, tx), ty) * terrainScaleFor(selectedMap);
    return Math.max(h, WATER_H);
  }

  function sampleGroundHeight(x,z) {
    const terrain=sampleTerrainHeight(x,z);
    const lot=cityLotAt(x,z);
    if(!lot)return terrain;
    let roof=Math.max(terrain,WATER_H+2.38+(lot[6]?1.75:lot[4]));
    // PATROL_DUMBO_WATER_TANK_COLLISION_V1: the 16-sided Brooklyn roof
    // tanks are rendered above their roofs, not included in the building
    // parcel's base height. Model their actual circular barrel footprint,
    // rather than creating an invisible wall across the entire roof.
    // Keep exactly the same site, LOD and deterministic style gate as the
    // physical mesh in buildCityBuildings().
    if(selectedMap.city && !lot[7] && !lot[6] &&
       lot[0]>205&&lot[0]<435&&lot[1]>-415&&lot[1]<-195 &&
       lot[4]>12&&lot[2]>7&&lot[3]>10 &&
       nycDetailBand(lot[0],lot[1])===3){
      const gx=Math.floor((lot[0]-MANHATTAN_GRID.tilt*lot[1]-
        MANHATTAN_GRID.offset)/MANHATTAN_GRID.blockWidth);
      const gz=Math.floor(lot[1]/MANHATTAN_GRID.blockLength);
      const seed=(Math.imul(gx,73856093)^Math.imul(gz,19349663)^
        Math.imul(gx*gz,83492791))>>>0;
      const archType=seed%13;
      if(archType%5===2){
        const tx=lot[0]+lot[2]*.16,tz=lot[1]+lot[3]*.12;
        const radius=.76+(archType%3)*.055;
        if(Math.hypot(x-tx,z-tz)<radius+.09)
          roof=Math.max(roof,WATER_H+2.38+lot[4]+2.77);
      }
    }
    return roof;
  }

  function navigationSurface(x, z) {
    const ground = sampleGroundHeight(x, z);
    const scenery=sceneryObstacle(x,z);
    if(scenery)return Math.max(ground,scenery.top);
    if (selectedMap.alaska) {
      const object=alaskaObstacles.find(o=>Math.abs(x-o.x)<o.halfX && Math.abs(z-o.z)<o.halfZ);
      return object ? Math.max(ground,object.top) : ground;
    }
    if (!selectedMap.city) return ground;
    for (const mark of NEW_YORK_LANDMARKS) {
      if (Math.abs(x - mark.x) <= mark.w && Math.abs(z - mark.z) <= mark.d) {
        return Math.max(ground, sampleGroundHeight(mark.x, mark.z) + mark.top);
      }
    }
    return ground;
  }

  function initAudio() {
    if (audioCtx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = new Ctx();

    // Brown/Pink noise buffer for jet engine & afterburner roar
    const bufLen = audioCtx.sampleRate * 2;
    const noiseBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    let lastOut = 0;
    for (let i = 0; i < bufLen; i++) {
      const white = Math.random() * 2 - 1;
      data[i] = (lastOut + 0.04 * white) / 1.04;
      lastOut = data[i];
      data[i] *= 2.5;
    }

    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;

    engineFilter = audioCtx.createBiquadFilter();
    engineFilter.type = 'lowpass';
    engineFilter.frequency.value = 180;

    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0.0;

    src.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    src.start();

    // Afterburner rumble oscillator
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = 54;
    const abFilt = audioCtx.createBiquadFilter();
    abFilt.type = 'lowpass';
    abFilt.frequency.value = 140;
    abGain = audioCtx.createGain();
    abGain.gain.value = 0.0;
    osc.connect(abFilt);
    abFilt.connect(abGain);
    abGain.connect(audioCtx.destination);
    osc.start();
  }

    const now = audioCtx.currentTime;

    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(620, now);
    osc.frequency.exponentialRampToValueAtTime(110, now + 0.35);
    g.gain.setValueAtTime(0.18, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.4);
  }

  }

    const ride=onboardView?sceneryMovers.find(actor=>actor.kind===view.ride):null;
    if(ride?.kind==='coaster'){
      const {pos,up,right,fwd}=coasterCarPose(ride,sceneryTime+4,0);
      const eye=pos.map((value,i)=>value+up[i]*1.26+fwd[i]*0.53);
      const look=eye.map((value,i)=>value+18*(fwd[i]*Math.cos(lookAngle)+right[i]*Math.sin(lookAngle)));
      return {eye,look,up,fov:lerp(82,53,zoom),attached:true};
    }
    if(ride?.kind==='wheel'){
      const [x,y,z]=skywheelCabinPosition(ride,skywheelAngle(sceneryTime),3);
      const eye=[x-0.05,y+0.04,z+0.25];
      const look=[eye[0]-30*Math.cos(lookAngle),eye[1]-3.2,eye[2]+30*Math.sin(lookAngle)];
      return {eye,look,up:worldUp,fov:lerp(78,48,zoom),attached:true};
    }
    const ground=sampleTerrainHeight(view.x,view.z);
    const angle=view.bearing*Math.PI/180+lookAngle;
    const radius=view.radius*lerp(1.24,0.56,zoom);
    const x=view.x+radius*Math.sin(angle),z=view.z+radius*Math.cos(angle);
    const height=Math.max(ground+view.height+view.rise*lerp(1.2,0.68,zoom),navigationSurface(x,z)+3);
    return {eye:[x,height,z],look:[view.x,ground+view.height,view.z],up:worldUp,fov:lerp(66,43,zoom)};
  }

  function sampleFlightEnvironment(dt){
    skyElapsed+=dt;
    if(skyTime.value==='auto')skyClock+=dt;
    const day=Math.floor(skyElapsed/ENVIRONMENT_DAY);
    const hour=skyTime.value==='auto'?(skyStartingHour+skyClock*24/ENVIRONMENT_DAY)%24:Number(skyTime.value);
    const season=skySeason.value==='auto'?((day+2)%4):Number(skySeason.value);
    const seasonName=ENVIRONMENT_SEASONS[season];
    const sequence=selectedMap.vegas?['Clear','Clear','Overcast','Clear','Rain','Clear','Fog','Clear']
      : season===3?['Clear','Snow','Overcast','Snow','Fog','Clear','Snow','Overcast']
      : ['Clear','Overcast','Rain','Clear','Fog','Rain','Overcast','Clear'];
    const weather=skyWeather.value==='auto'?sequence[Math.floor(skyElapsed/53)%sequence.length]:skyWeather.value;
    const target=ENVIRONMENT_WEATHER[weather];
    const blend=skyNeedsReset||skyWeather.value!=='auto'?1:1-Math.exp(-dt*0.9);
    skyConditions=skyConditions.map((value,i)=>lerp(value,target[i],blend));
    skyNeedsReset=false;
    const [cloud,fog,rain,snow]=skyConditions;
    const latitude=(selectedMap.alaska?60:selectedMap.city?41:selectedMap.vegas?36:44)*Math.PI/180;
    const seasonalAngles=[8,22,-5,-19];
    const progress=skyElapsed/ENVIRONMENT_DAY-day;
    const declination=lerp(seasonalAngles[season],seasonalAngles[(season+1)%4],
      skySeason.value==='auto'?progress:0)*Math.PI/180;
    const horizontal=angle=>{
      const c=Math.cos(angle)*Math.cos(declination),s=Math.sin(declination);
      return [-Math.sin(angle)*Math.cos(declination),
        Math.sin(latitude)*s+Math.cos(latitude)*c,
        Math.cos(latitude)*s-Math.sin(latitude)*c];
    };
    const hourAngle=(hour-12)*Math.PI/12;
    const sun=horizontal(hourAngle);
    const phase=(0.42+skyElapsed/(ENVIRONMENT_DAY*8))%1;
    const moon=horizontal(hourAngle-phase*Math.PI*2);
    const daylight=clamp((sun[1]+0.11)/0.31,0,1);
    const twilight=clamp(1-Math.abs(sun[1]+0.04)/0.31,0,1);
    const minutes=Math.floor(hour*60);
    const clock=String(Math.floor(minutes/60)).padStart(2,'0')+':'+String(minutes%60).padStart(2,'0');
    const caption=clock+' · '+seasonName+' · '+weather;
    if(skyStatus.textContent!==caption)skyStatus.textContent=caption;
    return {sun,moon,atmosphere:[daylight,twilight,cloud,fog],
      climate:[season===0?1:season===1?0.55:0,season===2?1:0,Math.max(season===3?1:0,snow*0.58),rain],
      precipitation:[rain,snow]};
  }

  function fireMissile() {
    if(selectedAircraft==='jetpack'){
      fireCannon();

    }
    if (!flying || crash || selectedAircraft !== "fighter") return;
    // Pick next loaded hardpoint
    let slot = -1;
    for (let i = 0; i < 4; i++) {
      if (hardpointTimers[i] <= 0) { slot = i; break; }
    }
    if (slot === -1) return;

    hardpointTimers[slot] = 4.5;
    updateMissilePips();
    playMissileSound();

    const basis = getPlaneBasis();
    const hp = HARDPOINTS[slot];
    const startPos = [
      plane.pos[0] + basis.right[0] * hp[0] + basis.up[0] * hp[1] + basis.fwd[0] * hp[2],
      plane.pos[1] + basis.right[1] * hp[0] + basis.up[1] * hp[1] + basis.fwd[1] * hp[2],
      plane.pos[2] + basis.right[2] * hp[0] + basis.up[2] * hp[1] + basis.fwd[2] * hp[2]
    ];

    // If level flight, angle slightly downward toward forward ground; otherwise fly along nose
    const aimPitch = plane.pitch > -0.06 ? plane.pitch - 0.14 : plane.pitch;
    const dir = v3Norm([
      Math.sin(plane.yaw) * Math.cos(aimPitch),
      Math.sin(aimPitch),
      Math.cos(plane.yaw) * Math.cos(aimPitch)
    ]);

      dir,
      speed: plane.speed + 48.0,

  // Touch Controls

  function updateJoy(t) {
