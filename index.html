      drawMesh(walkerLeg,mat4FromBasis(hip,right,up,fwd,scale));
    }
  }

  function drawCityTraffic(drawMesh) {
    if (!selectedMap.city && !selectedMap.vegas && !selectedMap.dc) return;
    const origin = mat4FromBasis([0,0,0],[1,0,0],[0,1,0],[0,0,1],1);
    if (bridgeRails) drawMesh(bridgeRails,origin);
    for (const actor of cityTraffic) {
      if(actor.kind==='train'){
        for(let car=0;car<4;car++){
          const {x,y,z,yaw}=railPose(actor,sceneryTime*actor.pace+actor.offset-car*13.35);
          const dx=x-camPos[0],dz=z-camPos[2];
          if(dx*dx+dz*dz>455*455)continue;
          const forward=[Math.sin(yaw),0,Math.cos(yaw)];
          drawMesh(streetMeshes.train,mat4FromBasis([x,y,z],[forward[2],0,-forward[0]],worldUp,forward,1));
        }
        continue;
      }
      const {x,y,z,yaw}=actor.wreck || trafficPose(actor,sceneryTime);
      const dx=x-camPos[0],dz=z-camPos[2],distanceSq=dx*dx+dz*dz;
      if (distanceSq>455*455) continue;
      if(selectedMap.city && nycDetailBand(x,z)===0)continue;
      if(actor.kind==='walker'){
        drawStreetWalker(drawMesh,streetMeshes.walker,{x,y,z,yaw,stride:Math.sin(sceneryTime*7.2+actor.offset)*0.45},distanceSq<130*130);
      } else {
        const front=[Math.sin(yaw),0,Math.cos(yaw)],right=[front[2],0,-front[0]];
        const model=mat4FromBasis([x,y,z],right,worldUp,front);
        drawMesh(actor.wreck?wreckedTaxiMesh:streetMeshes[actor.kind],model);
        if(!actor.wreck && actor.kind==='taxi' && distanceSq<240*240){
          drawMesh(taxiLamps,model,true);
        }
      }
    }
  }

  let backgroundBuildings = null;
  let landscapeDetails = null;

  let cityGroundField = null;
  let cityLots = [];
  const lotIndex=new Map();
  let rebuildCity = false;
  let fallingBuildings=[];
  const buildingHits=new Map();

  function lotKey(x,z) {
    return Math.floor(z/MANHATTAN_GRID.blockLength)*256 +
      Math.floor((x-MANHATTAN_GRID.tilt*z-MANHATTAN_GRID.offset)/MANHATTAN_GRID.blockWidth);
  }

  function cityLotAt(x,z) {
    if (!selectedMap.city) return null;
    const key=lotKey(x,z);
    for (let row=-1;row<=1;row++) for (let column=-1;column<=1;column++) {
      const bucket=lotIndex.get(key+row*256+column);
      if(!bucket)continue;
      for(const lot of bucket){
        if(Math.abs(x-lot[0])>lot[2]/2||Math.abs(z-lot[1])>lot[3]/2)continue;
        if(!lot[7]||insideCityFootprint(x,z,lot[7]))return lot;
      }
    }
    return null;
  }

  function insideCityFootprint(x,z,poly){
    let inside=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const a=poly[i],b=poly[j];
      if((a[1]>z)!==(b[1]>z)&&
         x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0])inside=!inside;
    }
    return inside;
  }


  // ROAD-PARCEL_CLEARANCE_V1: preserve actual Manhattan road centerlines.
  // Filter both geometry and the collision index, so no invisible wall remains.
  function nycParcelCrossesRoad(lot,roadMargin=5.85){
    if(!lot||![lot[0],lot[1],lot[2],lot[3]].every(Number.isFinite))return true;
    const [x,z,w,d]=lot;
    // The surveyed NYC polygon is more accurate than its bounding box.
    // Keep the old conservative box clearance for procedural buildings.
    const poly=Array.isArray(lot[7])&&lot[7].length>=3&&lot[7].length<=64&&
      lot[7].every(p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite))
      ?lot[7]:null;
    const extents=poly||[[x-w*.5,z-d*.5],[x+w*.5,z+d*.5]];
    const minX=Math.min(...extents.map(p=>p[0]))-roadMargin,
          maxX=Math.max(...extents.map(p=>p[0]))+roadMargin;
    const minZ=Math.min(...extents.map(p=>p[1]))-roadMargin,
          maxZ=Math.max(...extents.map(p=>p[1]))+roadMargin;
    const distanceSq=(p,a,b)=>{
      const dx=b[0]-a[0],dz=b[1]-a[1],den=dx*dx+dz*dz;
      const t=den>0?Math.max(0,Math.min(1,
        ((p[0]-a[0])*dx+(p[1]-a[1])*dz)/den)):0;
      return (p[0]-a[0]-dx*t)**2+(p[1]-a[1]-dz*t)**2;
    };
    const orient=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-
      (b[1]-a[1])*(c[0]-a[0]);
    const marginSq=roadMargin*roadMargin;
    // Measure the road centerline to each real polygon edge, including
    // intersections where neither road endpoint lies inside the building.
    const polygonTouches=(a,b)=>{
      if(insideCityFootprint(a[0],a[1],poly)||
         insideCityFootprint(b[0],b[1],poly))return true;
      for(let i=0;i<poly.length;i++){
        const c=poly[i],d=poly[(i+1)%poly.length],
              o1=orient(a,b,c),o2=orient(a,b,d),
              o3=orient(c,d,a),o4=orient(c,d,b);
        if(((o1>0&&o2<0)||(o1<0&&o2>0))&&
           ((o3>0&&o4<0)||(o3<0&&o4>0)))return true;
        if(Math.min(distanceSq(a,c,d),distanceSq(b,c,d),
          distanceSq(c,a,b),distanceSq(d,a,b))<=marginSq)return true;
      }
      return false;
    };
    for(const path of [...CITY_STREETS,CITY_EXPRESSWAY.points,CITY_EXPRESSWAY.ramp])
      for(let j=1;j<path.length;j++){
        const a=path[j-1],b=path[j];
        if(Math.max(a[0],b[0])<minX||Math.min(a[0],b[0])>maxX||
           Math.max(a[1],b[1])<minZ||Math.min(a[1],b[1])>maxZ)continue;
        if(poly){
          if(polygonTouches(a,b))return true;
          continue;
        }
        // Original swept AABB filter for non-GIS parcels.
        const dx=b[0]-a[0],dz=b[1]-a[1];
        let entry=0,exit=1;
        for(const [lo,hi,p,v] of [[minX,maxX,a[0],dx],[minZ,maxZ,a[1],dz]]){
          if(Math.abs(v)<1e-9){if(p<lo||p>hi){entry=2;break;}continue;}
          const t0=(lo-p)/v,t1=(hi-p)/v;
          entry=Math.max(entry,Math.min(t0,t1));
          exit=Math.min(exit,Math.max(t0,t1));
          if(entry>exit)break;
        }
        if(entry<=exit)return true;
      }
    return false;
  }

  function setupCityLots(parcels,ground) {
    cityGroundField=ground;
    // This applies to NYC only; all other maps keep their original parcels.
    const safeParcels=selectedMap.city
      ?parcels.filter(lot=>!nycParcelCrossesRoad(lot))
      :parcels;
    if(selectedMap.city)console.info('[PATROL] NYC protected roadway parcels',
      parcels.length-safeParcels.length,'removed from',parcels.length);
    cityLots=safeParcels;
    lotIndex.clear();
    // Index every spatial cell touched by the full municipal footprint.
    // Center-only indexing misses corners of long walls during road clearance.
    for (const lot of safeParcels){
      const [x,z,w,d]=lot;
      const corners=[
        [x-w/2,z-d/2],[x+w/2,z-d/2],
        [x-w/2,z+d/2],[x+w/2,z+d/2]
      ];
      const ix=corners.map(([cx,cz])=>Math.floor(
        (cx-MANHATTAN_GRID.tilt*cz-MANHATTAN_GRID.offset)/
        MANHATTAN_GRID.blockWidth));
      const iz=corners.map(([,cz])=>Math.floor(cz/MANHATTAN_GRID.blockLength));
      for(let row=Math.min(...iz);row<=Math.max(...iz);row++)
        for(let col=Math.min(...ix);col<=Math.max(...ix);col++){
          const key=row*256+col,bucket=lotIndex.get(key);
          if(bucket)bucket.push(lot);
          else lotIndex.set(key,[lot]);
        }
    }
    for (const entry of fallingBuildings) disposeSceneMesh(entry.mesh);
    fallingBuildings=[];
    for(const hit of buildingHits.values())for(const mesh of hit.scars)disposeSceneMesh(mesh);
    buildingHits.clear();
    rebuildCity=false;
  }

  function disposeSceneMesh(mesh) {
    if (!mesh) return;
    gl.deleteVertexArray(mesh.vao);
    for (const buffer of mesh.buffers) gl.deleteBuffer(buffer);
  }

  function damageCityBuilding(lot,impact,cannon) {
    if(lot[6])return;
    if(!cannon){
      collapseBuilding(lot,impact);
      return;
    }
    let hit=buildingHits.get(lot);
    if(!hit){
      hit={scars:[]};
      buildingHits.set(lot,hit);
    }
    if(hit.scars.length>=4){
      collapseBuilding(lot,impact);
      return;
    }
    const [x,z,width,depth,height]=lot;
    const alongX=Math.abs(impact[0]-x)/width>Math.abs(impact[2]-z)/depth;
    const side=Math.sign(impact[alongX?0:2]-(alongX?x:z))||1;
    const base=WATER_H+2.38;
    const centerY=clamp(impact[1],base+0.32,base+height-0.32);
    const centerU=alongX?clamp(impact[2],z-depth/2+0.43,z+depth/2-0.43)
      :clamp(impact[0],x-width/2+0.43,x+width/2-0.43);
    const plane=(alongX?x+side*width/2:z+side*depth/2)+side*0.018;
    const point=(u,v)=>alongX?[plane,centerY+v,centerU+u]:[centerU+u,centerY+v,plane];
    const mesh=createTriangleMesh(), size=0.22+hit.scars.length*0.09;
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4,b=(i+1)*Math.PI/4;
      const color=i%3===0?[0.21,0.19,0.18]:[0.13,0.115,0.105];
      mesh.addTri(point(0,0),point(Math.cos(a)*size,Math.sin(a)*size*0.65),
        point(Math.cos(b)*size,Math.sin(b)*size*0.65),color);
    }
    hit.scars.push(mesh.upload());
    spawnWreckFragments(impact,['masonry','glass','steel'],6,4.5,0.27);
  }

  function collapseBuilding(lot,impact) {
    if (lot[6]) return;
    const base=WATER_H+2.38;
    const falling=buildCityBuildings([lot],true);
    const hit=buildingHits.get(lot);
    if(hit){
      for(const mesh of hit.scars)disposeSceneMesh(mesh);
      buildingHits.delete(lot);
    }
    lot[6]=true;
    rebuildCity=true;
    const direction=v3Norm([lot[0]-impact[0]+0.001,0,lot[1]-impact[2]]);
    fallingBuildings.push({mesh:falling, started:sceneryTime, height:lot[4],
      origin:[lot[0],base,lot[1]],direction,groundDust:false});
    spawnWreckFragments(impact,['masonry','masonry','glass','steel'],34,16,1.2);
    for(let i=0;i<28;i++){
      const angle=i*2.39996;
      const speed=2.2+(i%7)*1.15;
      trails.push({pos:[...impact],type:'smoke',dust:i%6!==0,ember:i%6===0,alpha:0.83,
        vx:Math.sin(angle)*speed,vz:Math.cos(angle)*speed,vy:1.1+(i%5)*0.82});
    }
  }

  function refreshDestroyedCity() {
    if (rebuildCity) {
      disposeSceneMesh(backgroundBuildings);
      backgroundBuildings=buildCityBuildings(cityLots);
      rebuildCity=false;
    }
    for (let i=fallingBuildings.length-1;i>=0;i--) {
      const falling=fallingBuildings[i], age=sceneryTime-falling.started;
      if(age>0.49 && !falling.groundDust){
        falling.groundDust=true;
        const [x,y,z]=falling.origin;
        spawnWreckFragments([x,y+0.42,z],['masonry','steel','glass'],18,8,0.73);
        for(let j=0;j<22;j++){
          const angle=j*2.39996;
          const speed=3+(j%7)*0.8;
          trails.push({pos:[x+Math.cos(angle)*2,y+0.6,z+Math.sin(angle)*2],type:'smoke',dust:true,
            alpha:0.93,vx:Math.cos(angle)*speed,vz:Math.sin(angle)*speed,vy:0.6+j%4*0.45});
        }
      }
      if(age<1.44)continue;
      disposeSceneMesh(fallingBuildings[i].mesh);
      fallingBuildings.splice(i,1);
    }
  }

  // PATROL_NYC_FINANCIAL_FACADE_V8: a bounded, single-batch physical
  // facade relief pass. Visual approximations, not surveyed buildings.
  function addDowntownFacadeRelief(addQuad,box,{x,y,z,w,d,h,archType,facadeTier}){
    const style=archType%4,split=archType%5;
    const low=split===0?.57:split===1?.68:split===2?.77:split===3?.63:.73;
    const mid=split===0?.87:split===1?.91:split===2?.94:split===3?.83:.89;
    const colors=[
      [[.76,.70,.59],[.37,.40,.39],[.32,.38,.39]],
      [[.61,.54,.44],[.44,.51,.55],[.22,.43,.52]],
      [[.70,.66,.57],[.32,.34,.35],[.25,.32,.36]],
      [[.57,.55,.50],[.50,.58,.60],[.29,.49,.56]]
    ][style],stone=colors[0],metal=colors[1],glass=colors[2];
    let panels=0;
    function strip(axis,side,a,b,bot,top,tier,tint){
      const point=(u,v)=>axis===0
        ?[tier.x+u,v,z+side*(tier.d*.5+.11)]
        :[tier.x+side*(tier.w*.5+.11),v,z+u];
      const p=point(a,bot),q=point(b,bot),r=point(b,top),s=point(a,top);
      if(axis===0?side>0:side<0)addQuad(p,q,r,s,tint);
      else addQuad(s,r,q,p,tint);
      panels++;
    }
    // Do not draw uninterrupted rails through the stepped upper floors.
    for(const [bottom,top] of [[3.2,h*low-.20],[h*low+.22,h*mid-.20],
      [h*mid+.22,h-.29]]){
      if(top-bottom<1.16)continue;
      const tier=facadeTier((bottom+top)*.5);
      for(let axis=0;axis<2;axis++){
        const span=axis===0?tier.w:tier.d;
        if(span<1.9)continue;
        const count=Math.min(7,Math.max(3,Math.floor(span/1.65)));
        const pitch=span/count;
        for(const side of [-1,1]){
          for(let i=1;i<count;i++){
            const offset=-span*.5+i*pitch;
            strip(axis,side,offset-.065,offset+.065,
              y+bottom,y+top,tier,style%2===0?stone:metal);
          }
          if(style%2===1){
            for(let i=0;i<count;i+=2){
              const offset=-span*.5+(i+.5)*pitch;
              strip(axis,side,offset-pitch*.14,offset+pitch*.14,
                y+bottom+.31,y+top-.28,tier,glass);
            }
          }else{
            const floors=Math.min(6,Math.max(2,Math.floor((top-bottom)/3.1)));
            for(let j=1;j<floors;j++){
              const alt=y+bottom+(top-bottom)*j/floors;
              strip(axis,side,-span*.46,span*.46,alt,alt+.07,tier,metal);
            }
          }
          strip(axis,side,-span*.49,span*.49,y+top-.12,y+top+.05,tier,stone);
        }
      }
    }
    // Stone/steel parapet is below the building's existing hitbox top.
    const roof=facadeTier(h-.16),capY=y+h-.14;
    if(roof.w>2&&roof.d>2){
      box(roof.x,capY,z-roof.d*.46,roof.w*.91,.13,.20,metal);
      box(roof.x,capY,z+roof.d*.46,roof.w*.91,.13,.20,metal);
      box(roof.x-roof.w*.45,capY,z,.19,.13,roof.d*.9,metal);
      box(roof.x+roof.w*.45,capY,z,.19,.13,roof.d*.9,metal);
    }
    return panels;
  }

  // PATROL_NYC_OTI_GIS_MESH_V1: 60 municipal exterior footprint polygons.
  // Batched into the existing city mesh; the game transform is deliberately
  // compressed, while polygon topology / building identity comes from NYC OTI.
  function buildOfficialFootprintMesh(addTri,addQuad,lot,y,detailBand=2){
    const [x,z,w,d,h,tone,destroyed,outline]=lot;
    if(!Array.isArray(outline)||outline.length<3)return {walls:0,windows:0,roof:0};
    let area=0;
    for(let i=0;i<outline.length;i++){
      const a=outline[i],b=outline[(i+1)%outline.length];
      area+=a[0]*b[1]-b[0]*a[1];
    }
    if(Math.abs(area)<.01)return {walls:0,windows:0,roof:0};
    const sign=area>0?1:-1;
    const roofY=y+(destroyed?.48:h);
    const isGlass=tone>.42&&h>12;
    const palettes=[
      [[.57,.54,.48],[.24,.31,.35]],
      [[.65,.59,.51],[.28,.29,.27]],
      [[.40,.49,.55],[.20,.31,.39]],
      [[.70,.66,.58],[.32,.30,.28]]
    ];
    const [stone,glass]=palettes[Math.floor(tone*palettes.length)%palettes.length];
    const wallTint=isGlass?glass:stone,frameTint=isGlass?[.35,.42,.45]:[.48,.44,.39];
    let walls=0,windows=0,roof=0;
    const face=(a,b,c,d,color,surface=0)=>{
      if(sign>0)addQuad(d,c,b,a,color,surface);
      else addQuad(a,b,c,d,color,surface);
    };
    for(let i=0;i<outline.length;i++){
      const a=outline[i],b=outline[(i+1)%outline.length];
      const dx=b[0]-a[0],dz=b[1]-a[1],length=Math.hypot(dx,dz);
      if(length<.10)continue;
      const loA=[a[0],y,a[1]],loB=[b[0],y,b[1]];
      const hiB=[b[0],roofY,b[1]],hiA=[a[0],roofY,a[1]];
      face(loA,loB,hiB,hiA,wallTint,9);
      walls++;
      if(destroyed||length<1.4||detailBand<2)continue;
      const normal=[sign*dz/length,-sign*dx/length];
      const at=(t,yy,offset)=>[
        a[0]+dx*t+normal[0]*offset,yy,
        a[1]+dz*t+normal[1]*offset
      ];
      const bayCount=Math.min(3,Math.max(1,Math.floor(length/2.7)));
      const floors=Math.min(detailBand>=3?9:6,Math.floor((h-2.4)/3.15));
      for(let floor=0;floor<floors;floor++){
        const bottom=y+2.9+floor*3.15,top=Math.min(roofY-.54,bottom+1.80);
        if(top<=bottom)continue;
        for(let bay=0;bay<bayCount;bay++){
          const left=(bay+.20)/bayCount,right=(bay+.80)/bayCount;
          const tint=(i*11+floor*17+bay*7)%23===0?
            [.40,.40,.37]:glass;
          face(at(left,bottom,.062),at(right,bottom,.062),
            at(right,top,.062),at(left,top,.062),tint,10);
          face(at(left,bottom+.05,.071),at(right,bottom+.05,.071),
            at(right,bottom+.095,.071),at(left,bottom+.095,.071),frameTint,9);
          windows++;
        }
      }
    }
    // Ear clipping handles the OTI's concave L-, U- and wedge-shaped roofs.
    // Unlike a centroid fan, no roof is drawn outside its source footprint.
    const indices=outline.map((_,i)=>i),cross=(a,b,c)=>
      (b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
    let attempts=0;
    while(indices.length>2&&attempts<outline.length*outline.length){
      attempts++;
      let clipped=false;
      for(let i=0;i<indices.length;i++){
        const ia=indices[(i-1+indices.length)%indices.length],
          ib=indices[i],ic=indices[(i+1)%indices.length];
        const a=outline[ia],b=outline[ib],c=outline[ic];
        if(cross(a,b,c)*sign<.001)continue;
        let blocked=false;
        for(const idx of indices){
          if(idx===ia||idx===ib||idx===ic)continue;
          const p=outline[idx];
          if(cross(a,b,p)*sign>=-.00001 &&
             cross(b,c,p)*sign>=-.00001 &&
             cross(c,a,p)*sign>=-.00001){blocked=true;break}
        }
        if(blocked)continue;
        const A=[a[0],roofY,a[1]],B=[b[0],roofY,b[1]],C=[c[0],roofY,c[1]];
        if(sign>0)addTri(C,B,A,isGlass?[.31,.36,.37]:[.47,.44,.40],11);
        else addTri(A,B,C,isGlass?[.31,.36,.37]:[.47,.44,.40],11);
        indices.splice(i,1);roof++;clipped=true;break;
      }
      if(!clipped)break;
    }
    return {walls,windows,roof,expectedRoof:outline.length-2};
  }

  function buildCityBuildings(parcels,local=false) {
    const {addTri,addQuad,upload}=createTriangleMesh();
    let detailedDowntown=0;
    for(const lot of parcels){
      const [east,north,w,d,h,tone,destroyed]=lot;
      // Local collapsing rubble must bypass regional LOD; it is positioned
      // later by a model transform and does not live at world origin.
      const detailBand=local?2:nycDetailBand(east,north);
      if(detailBand===0)continue;
      const x=local?0:east,z=local?0:north,y=local?0:WATER_H+2.38;
      if(!local&&lot[7]){
        buildOfficialFootprintMesh(addTri,addQuad,lot,y,detailBand);
        continue;
      }
      // NYC_DOWNTOWN_ARCH_V7 — different facade identities for adjacent lots.
      // HEAT is a VISUAL reference only; no third-party code or assets copied.
      // Building styles combine Indiana-limestone-like stone, terracotta,
      // brick, blue/neutral glass and darker late-20th-century curtain walls.
      // Keep Manhattan's financial-district tower styles on Manhattan.
      // Brooklyn Bridge/DUMBO has a distinct low-/mid-rise brick streetscape.
      const bridgeheadBrooklyn=!local && detailBand>=2 &&
        east>205&&east<435&&north>-415&&north<-195;
      const heroDowntown=!local && detailBand>=2 &&
        east>-180&&east<170&&north>-526&&north<-195;
      const gridX=Math.floor((east-MANHATTAN_GRID.tilt*north-
        MANHATTAN_GRID.offset)/MANHATTAN_GRID.blockWidth);
      const gridZ=Math.floor(north/MANHATTAN_GRID.blockLength);
      // Nonperiodic parcel seed avoids visible diagonal repetitions along
      // Manhattan's street grid; preserve exactly 13 controlled material
      // families and existing height/collision/LOD constraints.
      const parcelSeed=(Math.imul(gridX,73856093) ^
        Math.imul(gridZ,19349663) ^ Math.imul(gridX*gridZ,83492791))>>>0;
      const archType=parcelSeed%13;
      // Align windows with the lower/middle/crown setback geometry.
      function facadeTier(alt){
        if(!heroDowntown || h<9.2)return {x,w,d};
        const kind=archType%5;
        const lower=kind===0?.57:kind===1?.68:kind===2?.77:kind===3?.63:.73;
        const mid=kind===0?.87:kind===1?.91:kind===2?.94:kind===3?.83:.89;
        if(alt<h*lower-.16)return {x,w,d};
        if(alt<h*mid-.16){
          const k=.68+(archType%4)*.055;
          return {x:x+(kind%2?.12:-.12)*w,w:w*k,d:d*k};
        }

         north>-515&&north<-245&&east>-160&&east<80&&

  }

  function createLandscapeDetails() {

      };

      }
      for (let i=0;i<10;i++) {
        const top = sections.at(-1);
        addTri([x,y+top[0],z],ring(top,i),ring(top,i+1),color);

    if (selectedMap.city) {
      const {x,z,halfLength,deck,halfWidth} = EAST_RIVER_BRIDGE;

      }
      for(const x of [left+2,right-4]) for(let stripe=-3;stripe<=3;stripe++) {
        box(x,surface+0.038,strip.z+stripe*1.7,2.7,0.012,0.46,[0.94,0.94,0.89]);
      }
      const [west,east]=EAST_RIVER_BRIDGE.towers;
      for(const center of [x+west,x+east]){
        box(center,WATER_H-0.20,z,8.2,2.15,12.7,[0.51,0.49,0.45]);
        for(const side of [-1,1]){
          const leg=z+side*3.58;
          box(center,28,leg,4.9,34,2.4,stone);
          for(const level of [16,21,26,32,38,43.8]){
            box(center,level,leg,5.04,0.14,2.49,[0.54,0.51,0.46]);
            for(const dx of [-2.47,2.47]){
              box(center+dx,level+0.73,leg+side*0.78,0.08,1.21,0.28,[0.55,0.52,0.48]);
              box(center+dx,level+1.54,leg-side*0.47,0.08,1.28,0.27,[0.58,0.55,0.50]);
            }
          }
          box(center,45.58,leg,5.58,1.45,2.94,stone);
        }
        box(center,45.0,z,5.30,1.7,8.6,stone);
        // Physical pointed stone-arch spandrel (not a decal or floating rib).
        // The masonry fills only ABOVE the underpass; the carriageway,
        // raised footpath, ship clearance and original collision stay clear.
        // A curved, 24-segment underside connects both visible tower faces.
        const archY=u=>34.25+7.95*Math.pow(1-Math.abs(u),.72);
        const archOuter=2.49,archHalfSpan=2.38,archTop=44.24;
        const lightStone=[.67,.64,.57],underStone=[.38,.39,.36],
              cutStone=[.59,.57,.51],pointMortar=[.44,.43,.40];
        for(let segment=0;segment<24;segment++){
          const u0=-1+segment/12,u1=-1+(segment+1)/12;
          const z0=z+u0*archHalfSpan,z1=z+u1*archHalfSpan;
          const h0=archY(u0),h1=archY(u1);
          const fill=(segment%7===0)?cutStone:lightStone;
          for(const front of [-1,1]){
            const xx=center+front*archOuter;
            const a=[xx,h0,z0],b=[xx,h1,z1],
              c=[xx,archTop,z1],d=[xx,archTop,z0];
            if(front<0)addQuad(a,b,c,d,fill);
            else addQuad(d,c,b,a,fill);
            // Raised voussoirs follow the opening and cast real highlights.
            const lipX=xx+front*.075;
            addRideBeam(addQuad,
              [lipX,h0+.06,z0],[lipX,h1+.06,z1],
              .087,[.73,.69,.61]);
            if(segment%3===0 && segment>0){
              const yy=archY(u0)+.17;
              addRideBeam(addQuad,[lipX,yy,z0],
                [lipX,Math.min(archTop-.12,yy+.68),z0+.075],
                .033,pointMortar);
            }
          }
          // The underside is a real stone tunnel vault, not an open roof.
          addQuad([center-archOuter,h0,z0],
            [center+archOuter,h0,z0],
            [center+archOuter,h1,z1],
            [center-archOuter,h1,z1],underStone);
        }
        for(const front of [-1,1])for(const side of [-1,1]){
          const px=center+front*(archOuter+.06),zz=z+side*(archHalfSpan+.06);
          box(px,34.33,zz,.19,.43,.29,lightStone);
          box(px,33.82,zz,.15,.12,.53,pointMortar);
        }
      }

      // Limestone masonry courses and voussoir accents close to both towers.
      // Geometry is attached to the existing Gothic tower meshes, no duplicates.
      const mortarColor=[.40,.40,.37], stoneHighlight=[.69,.65,.57];
      for(const center of [x+west,x+east]){
        for(const side of [-1,1]){
          const zz=z+side*4.82;
          for(let y=13.5;y<44.0;y+=1.48){
            const phase=(Math.round(y*10)%2)*.93;
            box(center,y,zz,4.72,.060,.030,mortarColor);
            for(let b=-1;b<=1;b++){
              box(center+b*1.48+phase*.18,y+.62,zz+side*.012,.028,1.09,.035,mortarColor);
            }
          }
          box(center,44.75,z+side*3.58,6.04,.24,3.28,stoneHighlight);
        }
      }
      function cableHeight(dx) {
        if(dx<west)return lerp(27.6,45,(dx+halfLength)/(west+halfLength));
        if(dx>east)return lerp(45,27.6,(dx-east)/(halfLength-east));
        const t=(dx-west)/(east-west);
        return 29+16*(2*t-1)**2;
      }

      // Extra visual cable rhythm, positioned against the authored road surface.
      for(const side of [-1,1]){
        const zz=z+side*3.58;
        for(let dx=-halfLength+2;dx<halfLength-2;dx+=2){
          const xx=x+dx, low=deck+.59, upper=cableHeight(dx);
          addRideBeam(addQuad,[xx,low,zz],[xx,upper,zz],.034,suspender);
        }
        for(const tower of [west,east]){
          for(let dx=-halfLength+9;dx<halfLength-9;dx+=12){
            if(Math.abs(dx-tower)>72||Math.abs(dx-tower)<8)continue;
            addRideBeam(addQuad,[x+tower,43.4,zz],
              [x+dx,deck+.65,zz],.049,metal);
          }
        }
      }
      for (const side of [-1,1]) {
        const rail = z + side*3.58;
        for (let i=-halfLength;i<halfLength;i+=4) {
          const j = Math.min(i+4,halfLength);
          const left = cableHeight(i), right = cableHeight(j);
          for(const offset of [-0.28,0.27]){
            addRideBeam(addQuad,[x+i,left,rail+offset],[x+j,right,rail+offset],0.18,metal);
          }
          if(i%8===0 && i>west+3 && i<east-3){
            const tower=i<(west+east)/2?west:east;
            addRideBeam(addQuad,[x+tower,37.4,rail],[x+i,deck+0.65,rail],0.10,suspender);
          }
          if (i>-halfLength) box(x+i,(left+deck)/2,rail,0.13,left-deck,0.13,suspender);
        }
      }
    }

    // Trees are batched into one mesh, with clearance around the moose meadows.
    const alaska = selectedMap.alaska;
    // Avoid obvious duplicate old conical trees when photographic Alaska
    // forest geometry is available. Keep them in compatibility fallback.
    const patches = alaska && !graphicsCompat ? [] : alaska
      ? [[-176,-430],[160,-330],[-185,-160],[166,12],[-142,205],[169,255]]
      : [[79,160],[90,255]];
    for (const [cx,cz] of patches) for (let i=0;i<28;i++) {
      const x = cx+Math.sin(i*4.32+cz)*30;
      const z = cz+Math.cos(i*3.82+cx)*(alaska?53:48);
      const y = sampleGroundHeight(x,z);
      if (y<WATER_H+1.8 || y>34) continue;
      const h = 3.3+(i%7)*0.62;
      box(x,y+h*0.31,z,0.25,h*0.62,0.25,[0.31,0.23,0.17]);
      for (let tier=0;tier<3;tier++) {
        const base = h*(0.21+tier*0.21), radius = h*(0.24-tier*0.048);
        const foliage = tier === 0 ? [0.16,0.27,0.20] : [0.24,0.38,0.27];
        tapered(x,y,z,[[base,radius,radius],[base+h*0.44,0.06,0.06]],foliage,i);
      }
    }

    if (alaska) {
      // Continuous glacial tongue with a blue calving face and dark crevasses.
      const columns = 20, rows = 17;
      function glacierPoint(col,row) {
        const across = 2*col/columns - 1;
        const t = row/rows;
        const x = 130 + across*(66-24*t) + Math.sin(t*3.9)*12;
        const z = 449 + t*148 - (1-across*across)*17 + Math.sin(col*1.8)*2.3;
        const edge = 1 - Math.abs(across)**8;
        const ice = (4.6 + 5.8*edge)*Math.min(1,(1-t)*5.8);
        const roughness = Math.sin(col*2.8+row*1.6)*0.56 + Math.sin(row*3.7+col)*0.45;
        return [x,sampleGroundHeight(x,z)+ice+roughness,z];
      }
      for (let col=0;col<columns;col++) {
        const a=glacierPoint(col,0), b=glacierPoint(col+1,0);
        addQuad([a[0],sampleGroundHeight(a[0],a[2])-0.18,a[2]],
          [b[0],sampleGroundHeight(b[0],b[2])-0.18,b[2]],b,a,
          col%3===0 ? [0.34,0.65,0.76] : [0.61,0.80,0.85],12);
        for (let row=0;row<rows;row++) {
          const streak = 0.5 + 0.5*Math.sin(row*0.86+Math.sin(col*0.62)*1.5);
          const ice = [0.69+0.15*streak,0.83+0.08*streak,0.88+0.05*streak];
          addQuad(glacierPoint(col,row),glacierPoint(col,row+1),
            glacierPoint(col+1,row+1),glacierPoint(col+1,row),ice,12);
        }
      }
      for (let i=0;i<25;i++) {
        const x = 75 + (i*37)%110;
        const z = 290 + (i*29)%167;
        if (sampleGroundHeight(x,z)>WATER_H) continue;
        const size = 1.8+(i%5)*0.86;
        const tint = i%2 ? [0.70,0.86,0.92] : [0.85,0.93,0.94];
        tapered(x,WATER_H-0.22,z,[[0,size,size*0.8],[0.52,size*0.96,size*0.74],[0.74,size*0.71,size*0.61]],tint,i);
      }
    }
    return upload();
  }

  function breakBridgeRail(x,y,z,radius) {
    const bridge=EAST_RIVER_BRIDGE;
    const relative=z-bridge.z;
    if (Math.abs(Math.abs(relative)-(bridge.halfWidth-0.16))>radius+0.22) return false;
    const height=y-bridgeRoadHeight(x);
    if (height<-radius || height>1.5+radius) return false;
    const section=railSections.find(s=>!s.broken && s.side===Math.sign(relative) &&
      x>=s.start-radius && x<=s.end+radius);
    if (!section) return false;
    section.broken=true;
    updateBridgeRails();
    return true;
  }

  function isBridgeCollision(x,y,z,radius=0) {
    const bridge = EAST_RIVER_BRIDGE;
    const offset=x-bridge.x, dx=Math.abs(offset), dz=Math.abs(z-bridge.z);
    const deck=bridgeRoadHeight(x);
    if(dx<=bridge.halfLength+bridge.ramp && dz<=bridge.halfWidth+radius &&
       y>=deck-1.52-radius && y<=deck+radius)return true;
    if(dx>bridge.halfLength && dx<bridge.halfLength+bridge.ramp){
      const near=bridge.halfLength+5+Math.round((dx-bridge.halfLength-5)/12)*12;
      if(near>=bridge.halfLength+5 && near<bridge.halfLength+bridge.ramp-6 && Math.abs(dx-near)<0.72+radius){
        const pierX=bridge.x+Math.sign(offset)*near,base=sampleTerrainHeight(pierX,bridge.z);
        const top=bridgeRoadHeight(pierX)-1.40;
        if(base>WATER_H+0.6 && top-base>0.75 &&
           ((Math.abs(dz-2.52)<0.64+radius && y>=base-radius && y<=top+radius) ||
            (dz<3.35+radius && y>=top-0.30-radius && y<=top+0.1+radius)))return true;
      }
    }
    if(!bridge.towers.some(tower=>Math.abs(offset-tower)<=2.73+radius))return false;
    if(y>=WATER_H-0.3 && y<=WATER_H+0.94+radius && dz<=6.35+radius)return true;
    if(Math.abs(dz-3.58)<=1.20+radius && y>=WATER_H && y<=46.30+radius)return true;
    const arch=42.2-Math.min(dz,2.43)*5.7/2.43;
    return dz<=2.43+radius && y>=arch-radius && y<=45.85+radius;
  }

  const shipMeshes = Object.fromEntries(Object.keys(SHIP_TYPES).map(kind => [kind, buildShipMesh(kind)]));
  const mooseMesh = buildMooseMesh();

  function buildBirdModels(eagle=false) {
    const body = createTriangleMesh();
    const white = [0.89,0.91,0.89], grey = [0.61,0.67,0.69], black = [0.17,0.19,0.22];
    const torso=eagle?[0.31,0.23,0.18]:white;
    const mantle=eagle?[0.29,0.22,0.18]:grey;
    const tail=eagle?white:grey;
    function addBodyRing(z, radius, centerY, nextZ, nextRadius, nextY, color) {
      for (let i=0;i<8;i++) {
        const rim = (depth,r,y,j) => [r*Math.sin(j*Math.PI/4),y+r*Math.cos(j*Math.PI/4),depth];
        body.addQuad(rim(z,radius,centerY,i),rim(z,radius,centerY,i+1),
          rim(nextZ,nextRadius,nextY,i+1),rim(nextZ,nextRadius,nextY,i),color);
      }
    }
    addBodyRing(-0.90,0.04,0,-0.22,0.21,0,tail);
    addBodyRing(-0.22,0.21,0,0.45,0.22,0.02,torso);
    addBodyRing(0.45,0.22,0.02,0.64,0.15,0.14,white);
    addBodyRing(0.64,0.15,0.14,0.83,0.12,0.14,white);
    addBodyRing(0.83,0.12,0.14,1.08,0.018,0.10,[0.85,0.62,0.27]);
    body.addTri([-0.20,0,-0.86],[0.20,0,-0.86],[0,0,-0.30],tail);

    const wings = [-1,1].map(side => {
      const { addQuad, addTri, upload } = createTriangleMesh();
      const point = (x,z) => [x*side,0,z];
      addQuad(point(0,0.29),point(0.90,0.15),point(1.16,-0.30),point(0,-0.40),mantle);
      addQuad(point(0.90,0.15),point(1.60,-0.08),point(1.72,-0.34),point(1.16,-0.30),mantle);
      addTri(point(1.60,-0.08),point(2.03,-0.42),point(1.72,-0.34),black);
      if(eagle){
        addTri(point(1.55,-0.18),point(2.19,-0.29),point(1.69,-0.29),black);
        addTri(point(1.60,-0.31),point(1.99,-0.53),point(1.53,-0.48),mantle);
        addTri(point(0.93,-0.27),point(1.53,-0.48),point(0.96,-0.53),mantle);
      }
      return upload();
    });
    return { body: body.upload(), wings };
  }

  const gullModels = buildBirdModels();

  let alaskaHarbor=null;
  let alaskaFalls=null;
  let alaskaObstacles=[];

  function buildAlaskaHarbor() {
    const {addTri,addQuad,upload}=createTriangleMesh();
    const box=(...args)=>addModelBox(addQuad,...args);
    const wood=[0.43,0.32,0.24], roof=[0.24,0.29,0.32], glass=[0.28,0.47,0.52];
    const ivory=[0.89,0.88,0.81], red=[0.66,0.26,0.19];
    const harbor=ALASKA_PLACES.harbor;
    const alaskaVillageAudit={cabins:0,sidingRows:0,roofSeams:0};
    const cape=ALASKA_PLACES.beacon;
    const waterline=WATER_H;
    const deck=waterline+1.60;

    // LAND_PAD_GUARD_V1: check all footprints; water-clamped terrain
    // would otherwise place houses exactly at the water surface.
    function dryPad(x,z,w,d,maxMove=38,maxSlope=1.8){
      const candidates=[[x,z]];
      for(let ring=1;ring<=Math.ceil(maxMove/7);ring++){
        const radius=ring*7;
        if(radius>maxMove)break;
        for(let step=0;step<16;step++){
          const angle=step*Math.PI/8+ring*.29;
          candidates.push([x+Math.cos(angle)*radius,z+Math.sin(angle)*radius]);
        }
      }
      for(const [cx,cz] of candidates){
        // Sample seven points per axis across the full foundation and margin.
        // Even a 5x5 grid can miss a narrow inlet between quarter-points.
        const heights=[];
        for(let ix=0;ix<=6;ix++)for(let iz=0;iz<=6;iz++){
          const ux=ix/6-.5,uz=iz/6-.5;
          heights.push(sampleTerrainHeight(cx+ux*(w+.65),cz+uz*(d+.65)));
        }
        const low=Math.min(...heights),high=Math.max(...heights);
        if(!Number.isFinite(low)||!Number.isFinite(high)||
           low<=WATER_H+1.0||high-low>maxSlope)continue;
        if(alaskaObstacles.some(o=>Math.abs(cx-o.x)<w*.5+o.halfX+2.2 &&
           Math.abs(cz-o.z)<d*.5+o.halfZ+2.2))continue;
        return {x:cx,z:cz,y:low,top:high};
      }
      return null;
    }
    function hut(x,z,w,l,color) {
      const pad=dryPad(x,z,w,l,126,3.9);
      if(!pad)return;
      x=pad.x;z=pad.z;
      // Surveyed hillside: floors rest above the highest corner; independent
      // stilt footings run down to terrain instead of suspending over water.
      const floor=pad.top+0.24;
      const wallTop=floor+3.5;
      for(const dx of [-.43,.43])for(const dz of [-.43,.43]){
        const sx=x+dx*w,sz=z+dz*l,base=sampleTerrainHeight(sx,sz);
        const h=Math.max(.30,floor-base);
        box(sx,base+h*.5,sz,.34,h,.34,[.29,.24,.19]);
      }
      box(x,floor-0.05,z,w+0.3,0.42,l+0.3,wood);
      box(x,floor+1.75,z,w,3.5,l,color,15);
      const a=x-w/2-0.24,b=x+w/2+0.24,c=z-l/2-0.31,d=z+l/2+0.31;
      const ridge=wallTop+1.45;
      addQuad([a,wallTop,c],[a,wallTop,d],[x,ridge,d],[x,ridge,c],roof,16);
      addQuad([b,wallTop,d],[b,wallTop,c],[x,ridge,c],[x,ridge,d],[0.28,0.32,0.35],16);
      addTri([a,wallTop,c],[x,ridge,c],[b,wallTop,c],color,15);
      addTri([b,wallTop,d],[x,ridge,d],[a,wallTop,d],color,15);
      box(x-w/2-0.035,floor+1.17,z,0.09,2.32,1.42,wood);
      for(const dz of [-l*0.30,l*0.30]) {
        box(x-w/2-0.061,floor+2.19,z+dz,0.13,1.28,1.53,ivory);
        box(x-w/2-0.127,floor+2.19,z+dz,0.085,1.07,1.28,glass);
        box(x-w/2-0.175,floor+2.19,z+dz,0.06,1.06,0.09,ivory);
      }
      // Terrain-grounded coastal lodge detail: original geometry, all batched
      // into the harbor's existing single WebGL mesh (no clone/box skyline).
      // Thin boards follow the outer timber walls; deep glazed panes remain
      // further out so the horizontal siding never covers the windows.
      const baseTint=Array.isArray(color)?color:[.55,.45,.34];
      const sidingTones=[.91,1.03,.96,1.08,.88,1.0,.93,1.04];
      for(let row=0;row<12;row++){
        const y=floor+.20+row*.276;
        const shade=sidingTones[(row+Math.round(Math.abs(x+z)))%sidingTones.length];
        const plank=baseTint.map((v,k)=>Math.min(.89,v*shade*(k===1?1.018:1)));
        for(const side of [-1,1]){
          box(x+side*(w/2+.054),y,z,.063,.038,l-.32,plank);
          box(x,y,z+side*(l/2+.054),w-.27,.038,.063,plank);
        }
      }
      // Four exposed structural corner posts and raised eave fascia.
      for(const sx of [-1,1])for(const sz of [-1,1])
        box(x+sx*(w/2+.075),floor+1.78,z+sz*(l/2+.075),
          .14,3.56,.14,[.39,.33,.27]);
      for(const sx of [-1,1]){
        box(x+sx*(w/2+.20),wallTop-.035,z,.13,.20,l+.61,[.27,.29,.30]);
      }
      // Standing-seam roof strips follow the real sloped gable instead of
      // a second roof cuboid. Limited repeated seams for GPU efficiency.
      for(let k=0;k<Math.ceil(l/1.48);k++){
        const zz=c+.26+k*1.48;
        if(zz>d-.16)break;
        for(const edge of [a,b]){
          addRideBeam(addQuad,[edge,wallTop+.022,zz],
            [x,ridge+.04,zz],.031,[.39,.43,.45]);
        }
      }
      addRideBeam(addQuad,[x,ridge+.075,c],[x,ridge+.075,d],
        .068,[.30,.34,.36]);
      // Paneled east wall, north gable and doors replace blank solid facades.
      // Each pane sits outside the cladding; window trim is framed explicitly.
      function glazedEast(cz){
        const wallX=x+w/2+.115,y=floor+2.18;
        box(wallX,y,cz,.048,1.25,1.39,[.14,.27,.30]);
        for(const dz of [-.74,.74])
          box(wallX+.035,y,cz+dz,.095,1.42,.068,ivory);
        for(const dy of [-.69,.69])
          box(wallX+.035,y+dy,cz,.095,.073,1.55,ivory);
        box(wallX+.057,y,cz,.073,1.27,.054,ivory);
        box(wallX+.067,y-.025,cz,.074,.055,1.33,ivory);
      }
      for(const zz of [-l*.25,l*.25])glazedEast(z+zz);
      const north=z+l/2+.115,ny=floor+2.13;
      for(const xx of [-w*.25,w*.25]){
        box(x+xx,ny,north,1.20,1.16,.055,[.12,.25,.30]);
        for(const ox of [-.65,.65])
          box(x+xx+ox,ny,north+.024,.075,1.31,.075,ivory);
        for(const oy of [-.65,.65])
          box(x+xx,ny+oy,north+.035,1.33,.075,.075,ivory);
        box(x+xx,ny,north+.065,.055,1.15,.075,ivory);
      }
      const south=z-l/2-.115,doorX=x+.12*w;
      box(doorX,floor+1.12,south,1.18,2.23,.06,[.27,.32,.31]);
      box(doorX,floor+1.62,south-.055,.76,.82,.058,[.11,.21,.25]);
      for(const ox of [-.65,.65])
        box(doorX+ox,floor+1.13,south-.08,.09,2.31,.075,ivory);
      box(doorX,floor+2.30,south-.09,1.39,.105,.092,ivory);
      box(doorX+.39,floor+1.05,south-.085,.083,.075,.083,[.74,.66,.44]);
      // A porch may extend from the house only where its OWN footprint has
      // surveyed dry ground; support posts terminate at terrain height.
      const porchZ=z-l/2-1.10;
      const porchTerrain=[-1.1,0,1.1].map(dx=>
        sampleTerrainHeight(doorX+dx,porchZ));
      // The centerline alone misses flooded corners on narrow fjord inlets.
      // Check the entire 2.66 m by 1.88 m deck at its actual outer edges.
      const porchFootprintTerrain=[];
      for(const dx of [-1.33,-.665,0,.665,1.33])
        for(const dz of [-.94,-.47,0,.47,.94])
          porchFootprintTerrain.push(sampleTerrainHeight(
            doorX+dx,porchZ+dz));
      if(Math.min(...porchTerrain)>WATER_H+.95 &&
          Math.max(...porchTerrain)-Math.min(...porchTerrain)<2.4 &&
          porchFootprintTerrain.every(h=>Number.isFinite(h)&&h>WATER_H+.95) &&
          Math.max(...porchFootprintTerrain)-Math.min(...porchFootprintTerrain)<2.4){
        const porch=floor+.05;
        box(doorX,porch-.11,porchZ,2.66,.22,1.88,[.42,.33,.24]);
        for(const dx of [-1.08,1.08]){
          const px=doorX+dx,ground=sampleTerrainHeight(px,porchZ);
          const postHeight=Math.max(.25,porch-ground);
          box(px,ground+postHeight*.5,porchZ,.20,postHeight,.20,[.33,.27,.21]);
        }
        // Offset treads follow the downhill elevation, never hang over water.
        const stepZ=porchZ-1.02,stepGround=sampleTerrainHeight(doorX,stepZ);
        // Treads project beyond their centerline toward water; inspect edges.
        const stepTerrain=[];
        for(const dx of [-.86,0,.86])
          for(const dz of [-.43,0,.18])
            stepTerrain.push(sampleTerrainHeight(doorX+dx,stepZ+dz));
        if(stepGround>WATER_H+.95 && porch-stepGround<2.5 &&
            stepTerrain.every(h=>Number.isFinite(h)&&h>WATER_H+.95) &&
            Math.max(...stepTerrain)-Math.min(...stepTerrain)<2.4){
          const levels=Math.max(1,Math.ceil((porch-stepGround)/.29));
          for(let n=0;n<levels;n++){
            const treadY=porch-(n+1)*(porch-stepGround)/levels;
            box(doorX,treadY-.07,stepZ-.25*n/levels,1.72,.14,.35,[.49,.40,.30]);
          }
        }
      }
      // One stone flue is partially embedded in the pitched roof, not floating
      // above its ridge. Use a fixed proportional roof height in local space.
      const chimneyX=x+w*.13,chimneyZ=z+l*.18;
      const roofAt=wallTop+(ridge-wallTop)*(1-Math.abs(w*.13)/(w*.5+.24));
      box(chimneyX,roofAt+.55,chimneyZ,.69,1.10,.70,[.39,.39,.37]);
      box(chimneyX,roofAt+1.10,chimneyZ,.91,.15,.94,[.25,.28,.29]);
      alaskaVillageAudit.cabins++;
      alaskaVillageAudit.sidingRows+=12;
      alaskaVillageAudit.roofSeams+=Math.ceil(l/1.48);
      alaskaObstacles.push({x,z,y:floor,halfX:w/2,halfZ:l/2,top:ridge,name:'harbor building'});
    }

    hut(harbor.x-19,harbor.z-13,10,16,red);
    hut(harbor.x-5,harbor.z+7,11,14,[0.36,0.48,0.45]);
    hut(harbor.x+13,harbor.z-6,12,12,[0.69,0.54,0.33]);
    hut(harbor.x-16,harbor.z+26,9,12,[0.57,0.42,0.28]);
    hut(harbor.x+15,harbor.z+23,8,12,red);
    hut(harbor.x+26,harbor.z-24,10,15,[0.47,0.55,0.55]);

    // Surveyed coastal undergrowth fills the otherwise empty green shelf.
    // Not repeated cone trees: short fern/berry bush fan leaves with varied
    // radial silhouettes. The dry-footprint test keeps every plant out of
    // water, foundations, entrances and the harbor walkway.
    const scrubHash=n=>{
      const v=Math.sin(n*127.1+32.53)*43758.5453;
      return v-Math.floor(v);
    };
    alaskaVillageAudit.undergrowth=0;
    for(let i=0;i<680 && alaskaVillageAudit.undergrowth<270;i++){
      const x=98+scrubHash(i*41+7)*188;
      const z=-622+scrubHash(i*67+13)*208;
      const y=sampleTerrainHeight(x,z);
      if(y<WATER_H+1.55 || y>WATER_H+22 ||
         Math.hypot(x-harbor.x,z-harbor.z)>157 ||
         Math.abs(z-harbor.z)<5.8&&x<243)continue;
      const nearby=[sampleTerrainHeight(x+1.3,z),
        sampleTerrainHeight(x-1.3,z),
        sampleTerrainHeight(x,z+1.3),sampleTerrainHeight(x,z-1.3)];
      if(Math.min(...nearby)<=WATER_H+1.1 ||
         nearby.some(h=>Math.abs(h-y)>1.28))continue;
      if(alaskaObstacles.some(o=>o.name==='harbor building' &&
         Math.abs(x-o.x)<o.halfX+3.7 &&
         Math.abs(z-o.z)<o.halfZ+3.7))continue;
      const size=.36+scrubHash(i*57+19)*.68;
      const center=[x,y+.07,z];
      const hue=scrubHash(i*87+11);
      const olive=[.11+.055*hue,.23+.085*hue,.12+.037*hue];
      const dark=[.072+.031*hue,.15+.052*hue,.083+.026*hue];
      for(let j=0;j<7;j++){
        const angle=(j+scrubHash(i*13))*Math.PI*2/7;
        const radius=size*(.70+.40*scrubHash(i*11+j*43));
        const dx=Math.cos(angle)*radius,dz=Math.sin(angle)*radius;
        const tip=[x+dx*.58,y+size*(.48+.48*scrubHash(i+j*17)),z+dz*.58];
        const base=[x+dx,y+.11+size*.13,z+dz];
        const bend=[x+dx*1.18,y+.13+size*.17,z+dz*1.18];
        const leaf=j%3===0?olive:dark;
        addTri(center,base,tip,leaf);
        if(j%2===0)addTri(base,bend,tip,olive);
      }
      alaskaVillageAudit.undergrowth++;
    }

    // Pier, finger docks, planks and a ramp back to the village.
    const pierX=62, pierZ=harbor.z;
    box(pierX,deck-0.17,pierZ,30,0.31,5.1,[0.58,0.46,0.34]);
    for(let x=48;x<77;x+=1.15){
      box(x,deck-0.002,pierZ,0.065,0.026,4.34,[0.29,0.23,0.19]);
    }
    for(const z of [pierZ-1.8,pierZ+1.8]){
      for(let x=49;x<77;x+=6)box(x,(waterline+deck)/2-0.6,z,0.34,2.6,0.34,wood);
    }
    for(const x of [50,60,70]) {
      box(x,deck-0.20,pierZ-6,2.2,0.29,10.2,[0.49,0.41,0.30]);
      box(x,deck-0.20,pierZ+5.8,2.2,0.29,9.8,[0.49,0.41,0.30]);
    }
    // This surveyed coast remains water past the old x=169 road endpoint.
    // Only the dock over water is allowed, held by real visible timber piles.
    // Shore trail begins at an elevation-validated dry landing.
    let shoreX=null;
    for(let candidate=183;candidate<=235;candidate++){
      const y=sampleTerrainHeight(candidate,pierZ);
      if(y<=WATER_H+1.05||Math.abs(y-deck)>1.40)continue;
      if([-2.4,0,2.4].every(dz=>{
        const cross=sampleTerrainHeight(candidate,pierZ+dz);
        return cross>WATER_H+.95 && Math.abs(cross-y)<.55;
      })){shoreX=candidate;break;}
    }
    if(shoreX!==null){
      const landingY=sampleTerrainHeight(shoreX,pierZ)+0.20;
      const walkwayY=x=>lerp(deck,landingY,
        clamp((x-76)/Math.max(1,shoreX-76),0,1));
      const deckColor=[.52,.40,.28],pileColor=[.32,.27,.22];
      for(let x=76;x<shoreX;x+=6){
        const next=Math.min(x+6,shoreX);
        const top=walkwayY(x),topNext=walkwayY(next);
        box((x+next)*.5,(top+topNext)*.5-.13,pierZ,
          next-x+.05,.24,3.42,deckColor);
        for(const side of [-1,1]){
          const z=pierZ+side*1.44;
          const base=Math.min(top-.28,
            Math.max(WATER_H-.72,sampleTerrainHeight(x,z)-.32));
          const height=top-base;
          box(x,base+height*.5,z,.33,height,.33,pileColor);
          box(x,top+.50,pierZ+side*1.71,.11,1.05,.11,pileColor);
          addRideBeam(addQuad,[x,top+.92,pierZ+side*1.71],
            [next,topNext+.92,pierZ+side*1.71],.055,pileColor);
        }
      }
      // Pedestrian shore trail follows measured dry terrain; no floating road.
      for(let x=shoreX;x<shoreX+23;x+=3.5){
        const next=x+3.5,a=sampleTerrainHeight(x,pierZ),
          b=sampleTerrainHeight(next,pierZ);
        if([x,next].some(px=>[-1.25,0,1.25].some(dz=>
          sampleTerrainHeight(px,pierZ+dz)<=WATER_H+.95)))break;
        pushRoadStrip(addQuad,[x,a+.13,pierZ],
          [next,b+.13,pierZ],2.45,[.50,.43,.34],.028);
      }
    }
    alaskaObstacles.push({x:pierX,z:pierZ,y:deck-0.37,halfX:15,halfZ:2.5,top:deck+0.13,name:'harbor pier'});

    // Moored floatplane, with pontoons and a red wing stripe.
    const px=61,pz=pierZ+14,py=waterline;
    for(const side of [-1,1]){
      box(px+side*1.33,py+0.27,pz,0.57,0.48,4.9,ivory);
      box(px+side*1.21,py+0.75,pz,0.10,0.69,0.17,roof);
    }
    box(px,py+1.25,pz,0.62,0.77,4.8,ivory);
    box(px,py+1.66,pz+0.50,0.63,0.46,1.17,glass);
    box(px,py+1.94,pz+0.25,7.9,0.17,1.63,ivory);
    box(px,py+2.035,pz+0.68,7.8,0.024,0.24,red);
    box(px,py+1.95,pz-2.08,0.14,1.14,0.79,red);
    box(px,py+1.39,pz+2.53,0.10,1.12,0.10,roof);
    alaskaObstacles.push({x:px,z:pz,y:waterline,halfX:3.9,halfZ:2.6,top:py+2.5,name:'moored floatplane'});

    // An actual lighthouse must stand on a dry coastal rock or pad.
    const beaconPad=dryPad(cape.x,cape.z,6.4,6.4,28);
    if(beaconPad){
    const foot=beaconPad.y,capeX=beaconPad.x,capeZ=beaconPad.z;
    function beaconBand(y1,y2,r1,r2,color) {
      const p=(y,r,i)=>[capeX+Math.sin(i*Math.PI/6)*r,foot+y,capeZ+Math.cos(i*Math.PI/6)*r];
      for(let i=0;i<12;i++) addQuad(p(y1,r1,i),p(y1,r1,i+1),p(y2,r2,i+1),p(y2,r2,i),color);
    }
    beaconBand(0,1.4,4.0,3.9,[0.50,0.51,0.48]);
    beaconBand(1.4,5.1,2.9,2.63,ivory);
    beaconBand(5.1,7.1,2.63,2.47,red);
    beaconBand(7.1,10.4,2.47,2.15,ivory);
    beaconBand(10.4,10.9,2.92,2.92,roof);
    beaconBand(10.9,13.4,1.93,1.93,[0.40,0.59,0.64]);
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4;
      box(capeX+Math.sin(a)*2,foot+12.2,capeZ+Math.cos(a)*2,0.15,2.57,0.15,roof);
    }
    beaconBand(13.4,15.1,2.26,0.20,red);
    box(capeX,foot+15.2,capeZ,0.20,0.63,0.20,roof);
    alaskaObstacles.push({x:capeX,z:capeZ,y:foot,halfX:2.6,halfZ:2.6,top:foot+15.5,name:'Cape Beacon'});
    }
    console.info('[PATROL] Alaska surveyed village',JSON.stringify(alaskaVillageAudit));
    return upload();
  }

  function buildAlaskaFalls() {
    const {addQuad,upload}=createTriangleMesh();
    const {x,z}=ALASKA_PLACES.falls;
    for(let branch=0;branch<2;branch++){
      function point(i,side) {
        const t=i/30;
        const east=x-88+i*2.97;
        const center=z+branch*(7+11*t*t)+Math.sin(t*6.8+branch*1.6)*(2.8+3.2*t);
        const north=center+side*(0.99+1.9*t+0.46*Math.sin(t*12.3+branch));
        return [east,sampleTerrainHeight(east,north)+0.30,north];
      }
      for(let i=0;i<30;i++) {
        const brightness=0.5+0.5*Math.sin(i*0.85+branch);
        const tint=[0.48+0.13*brightness,0.69+0.13*brightness,0.77+0.09*brightness];
        const a=point(i,-1),b=point(i,1),c=point(i+1,1),d=point(i+1,-1);
        if(Math.min(a[1],b[1],c[1],d[1])<=WATER_H+.58)continue;
        addQuad(a,b,c,d,tint);
      }
    }
    return upload();
  }

      } else {

  let wreckFragments=[];

  function refreshVehicleTargets() {
    vehicleTargets=[];
    for(const boat of boats) {
      if(boat.wreck)continue;
      const [x,z,yaw]=sceneryPose(boat,sceneryTime);
      vehicleTargets.push({actor:boat,kind:'ship',x,z,yaw,y:WATER_H,top:boat.top,
        width:boat.halfWidth,length:boat.halfLength});
    }
    for(const actor of cityTraffic) {
      if(actor.kind!=='taxi'&&actor.kind!=='police')continue;
      const pose=actor.wreck || trafficPose(actor,sceneryTime);
      const top=actor.wreck?0.76:actor.kind==='police'?1.88:1.76;
      vehicleTargets.push({actor,kind:'taxi',...pose,top,width:0.86,length:1.96});
    }
  }

  function vehicleAt(x,y,z,padding=0) {
    for(const target of vehicleTargets) {
      if(target.actor.wreck && target.kind==='ship')continue;
      if(y<target.y-padding || y>target.y+target.top+padding ||
        Math.abs(x-target.x)>target.length+target.width+padding ||
        Math.abs(z-target.z)>target.length+target.width+padding)continue;
      const sin=Math.sin(target.yaw),cos=Math.cos(target.yaw);
      const dx=x-target.x,dz=z-target.z;
      if(Math.abs(cos*dx-sin*dz)<=target.width+padding &&
        Math.abs(sin*dx+cos*dz)<=target.length+padding)return target;
    }
    return null;
  }

  function spawnWreckFragments(impact,materials,count,spread,scale,floats=false) {
    for(let i=0;i<count;i++){
      const angle=i*2.39996+sceneryTime;
      const speed=spread*(0.42+(i%8)*0.11);
      const size=scale*(0.45+(i%9)*0.09);
      wreckFragments.push({pos:[...impact],vx:Math.cos(angle)*speed,vz:Math.sin(angle)*speed,
        vy:spread*(0.45+(i%5)*0.18),angle,spin:(i%2?1:-1)*(2.1+i%6),
        age:0,life:8+(i%7)*1.15,size,kind:materials[i%materials.length],floats,settled:false});
    }
    if(wreckFragments.length>120)wreckFragments.splice(0,wreckFragments.length-120);
  }

  function damageVehicle(target,impact,power) {
    const {actor,kind}=target;
    if(actor.wreck)return;
    actor.hull=(actor.hull || 0)+power;
    const destroyed=actor.hull>=(kind==='taxi'?2:3);
    if(!destroyed){
      spawnWreckFragments(impact,['glass','steel'],4,4,0.29);
      return;
    }
    actor.wreck={x:target.x,y:target.y,z:target.z,yaw:target.yaw,started:sceneryTime};
    if(kind==='ship'){
      spawnWreckFragments(impact,['steel','cabin','glass'],26,12,1.05,true);
      impacts[impactCursor]={x:target.x,y:WATER_H,z:target.z,age:0,isWater:1};
      impactCursor=(impactCursor+1)%impacts.length;
    } else {
      spawnWreckFragments(impact,['taxi','glass','steel'],15,8,0.54);
    }
  }

  function advanceWreckFragments(dt) {
    for(let i=wreckFragments.length-1;i>=0;i--){
      const part=wreckFragments[i];
      part.age+=dt;
      if(part.age>=part.life){wreckFragments.splice(i,1);continue;}
      if(part.settled){
        if(part.floats){
          part.pos[0]+=part.vx*dt;
          part.pos[2]+=part.vz*dt;
          part.pos[1]=sampleTerrainHeight(part.pos[0],part.pos[2])+part.size*0.24+
            0.075*Math.sin(part.age*2.4+part.angle);
          part.angle+=part.spin*dt;
        }
        continue;
      }
      const previousY=part.pos[1];
      part.pos[0]+=part.vx*dt;
      part.pos[2]+=part.vz*dt;
      part.angle+=part.spin*dt;
      if(!part.settled)part.vy-=19*dt;
      part.pos[1]+=part.vy*dt;
      const [x,,z]=part.pos;
      let floor=sampleTerrainHeight(x,z)+part.size*0.24;
      const bridge=EAST_RIVER_BRIDGE;
      if(selectedMap.city && Math.abs(z-bridge.z)<bridge.halfWidth &&
           Math.abs(x-bridge.x)<bridge.halfLength+bridge.ramp) {
        const deck=bridgeRoadHeight(x)+part.size*0.24;
        if(previousY>=deck-0.02)floor=Math.max(floor,deck);
      }
      if(part.pos[1]>floor)continue;
      part.pos[1]=floor;
      if(Math.abs(part.vy)>2.6 && floor-part.size*0.24>WATER_H+0.06){
        part.vy*=-0.32;part.vx*=0.52;part.vz*=0.52;part.spin*=0.62;
      }else{
        part.settled=true;part.vy=0;
        part.vx=part.floats?part.vx*0.13:0;part.vz=part.floats?part.vz*0.13:0;
        part.spin=part.floats?part.spin*0.10:0;
      }
    }
  }

  function drawSplitShip(boat,drawMesh) {
    const wreck=boat.wreck;
    const t=sceneryTime-wreck.started;
    if(t>8.0)return;
    const front=[Math.sin(wreck.yaw),0,Math.cos(wreck.yaw)],right=[front[2],0,-front[0]];
    for(const [index,mesh] of splitShipMeshes[boat.kind].entries()){
      const side=index?1:-1;
      const tilt=side*Math.min(0.48,t*0.34);
      const up=[-front[0]*Math.sin(tilt),Math.cos(tilt),-front[2]*Math.sin(tilt)];
      const forward=[front[0]*Math.cos(tilt),Math.sin(tilt),front[2]*Math.cos(tilt)];
      const split=side*Math.min(7.5,t*2.4);
      const pos=[wreck.x+front[0]*split,WATER_H-Math.max(0,t-0.7)**1.65,
        wreck.z+front[2]*split];
      drawMesh(mesh,mat4FromBasis(pos,right,up,forward,1),false,false,false);
    }
  }

  function drawWreckFragments(drawMesh) {
    for(const part of wreckFragments){
      if(Math.hypot(part.pos[0]-camPos[0],part.pos[2]-camPos[2])>220)continue;
      const sin=Math.sin(part.angle),cos=Math.cos(part.angle),roll=part.angle*1.35;
      const fwd=[sin,0,cos],right=[cos*Math.cos(roll),Math.sin(roll),-sin*Math.cos(roll)];
      const up=v3Cross(fwd,right);
      drawMesh(fragmentMeshes[part.kind],mat4FromBasis(part.pos,right,up,fwd,part.size),false,false,false);
    }
  }

  function loadAlaskaPhotoTextures(){
    if(alaskaPhotoTextures||alaskaPhotoLoading||graphicsCompat||
       !smoothScenery()||directRendering)return;
    alaskaPhotoLoading=true;
    const epoch=++alaskaPhotoGeneration;
    const files=['alaska-photo-albedo.webp','alaska-photo-nrm-rough.webp'];
    Promise.all(files.map(name=>new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=()=>reject(new Error('Missing Alaska photo '+name));
      img.src='./assets/alaska/'+name;
    }))).then(images=>{
      if(epoch!==alaskaPhotoGeneration||!selectedMap.alaska||gl.isContextLost())return;
      const made=[];
      try{
        for(const img of images){
          if(img.naturalWidth!==1024||img.naturalHeight!==256)
            throw new Error('Invalid Alaska PBR atlas dimensions');
          const tex=gl.createTexture();
          if(!tex)throw new Error('Alaska photo GPU allocation failed');
          made.push(tex);
          gl.bindTexture(gl.TEXTURE_2D,tex);
          gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,img);
          gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
          gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
          gl.generateMipmap(gl.TEXTURE_2D);
        }
        alaskaPhotoTextures={albedo:made[0],normalRough:made[1]};
        console.info('[PATROL] Alaska CC0 photographic rock/snow PBR ready');
      }catch(error){
        for(const tex of made)gl.deleteTexture(tex);
        console.warn('[PATROL] Alaska photo materials fallback:',error);
      }finally{
        gl.bindTexture(gl.TEXTURE_2D,null);
      }
    }).catch(error=>console.warn('[PATROL] Alaska procedural material fallback:',error))
      .finally(()=>{if(epoch===alaskaPhotoGeneration)alaskaPhotoLoading=false;});
  }
  let nycHeroScenery=null,nycStreetMesh=null,nycGisMesh=null,nycParkMesh=null,nycHeroEpoch=0;
  let dcSurfaceMeshes=[];
  let dcTextureArray=null;
  let dcTexturesLoading=false;

  function loadDcTextures(){
    if(dcTextureArray||dcTexturesLoading||directRendering)return;
    dcTexturesLoading=true;
    const files=['dc-albedo','dc-normal-roughness'];
    Promise.all(files.map(name=>new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=reject;
      img.src='./assets/'+name+'.webp';
    }))).then(images=>{
      if(gl.isContextLost()||directRendering)return;
      const size=512,layers=5,tile=document.createElement('canvas');
      tile.width=tile.height=size;
      const ctx=tile.getContext('2d',{willReadFrequently:true});
      const texture=gl.createTexture();
      gl.activeTexture(gl.TEXTURE2);
      gl.bindTexture(gl.TEXTURE_2D_ARRAY,texture);
      gl.texStorage3D(gl.TEXTURE_2D_ARRAY,10,gl.RGBA8,size,size,layers*2);
      for(const [row,image] of images.entries())for(let column=0;column<layers;column++){
        ctx.drawImage(image,column*size,0,size,size,0,0,size,size);
        gl.texSubImage3D(gl.TEXTURE_2D_ARRAY,0,0,0,row*layers+column,size,size,1,
          gl.RGBA,gl.UNSIGNED_BYTE,ctx.getImageData(0,0,size,size).data);
      }
      gl.texParameteri(gl.TEXTURE_2D_ARRAY,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D_ARRAY,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.generateMipmap(gl.TEXTURE_2D_ARRAY);
      const extension=gl.getExtension('EXT_texture_filter_anisotropic');
      if(extension)gl.texParameterf(gl.TEXTURE_2D_ARRAY,extension.TEXTURE_MAX_ANISOTROPY_EXT,
        Math.min(8,gl.getParameter(extension.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
      gl.activeTexture(gl.TEXTURE0);
      dcTextureArray=texture;
      frameCheckPending=true;
    }).catch(()=>{
      // Keep the authored base colors when the texture pack is unavailable.
    }).finally(()=>{dcTexturesLoading=false;});
  }
  let mapLights=null;
  let timesSquareScreens=null;
  // PATROL_NYC_STATIC_LED_V5 — original, unique, static ad art.
  let timesSquareFallback=null,nycLedAtlas=null,nycLedGeneration=0;
  let sceneryPlaces=[];
  let sceneryObjects=[];
  let sceneryMovers=[];

  function findScenerySite(x,z,{water=false,footprint=7,range=90,avoid,validate}={}) {
    let nearest=null, best=Infinity;
    for(let dx=-range;dx<=range;dx+=9) for(let dz=-range;dz<=range;dz+=9){
      const score=dx*dx+dz*dz;
      if(score>=best)continue;
      const east=x+dx,north=z+dz;
      if(Math.hypot(east,north)>(selectedMap.city?NYC_FLIGHT_RADIUS:FLIGHT_RADIUS)-60 ||
          avoid?.(east,north))continue;
      const y=sampleTerrainHeight(east,north);
      if(water?y>WATER_H:y<WATER_H+1.1)continue;
      const corners=[[-1,-1],[-1,1],[1,-1],[1,1]];
      if(!corners.every(([i,j])=>{
        const sx=east+i*footprint,sz=north+j*footprint;
        const altitude=sampleTerrainHeight(sx,sz);
        return water?altitude<=WATER_H:!cityLotAt(sx,sz)&&Math.abs(altitude-y)<2.6&&altitude>WATER_H+0.8;
      })||(!water&&cityLotAt(east,north)))continue;
      // ALASKA_FULL_FOOTPRINT_V1: a shoreline inlet can pass four corners
      // yet bisect the foundations. Validate interior fifth-grid samples too.
      if(selectedMap.alaska&&!water){
        let valid=true;
        for(let ix=-2;ix<=2&&valid;ix++)for(let iz=-2;iz<=2;iz++){
          const sx=east+ix*footprint*.5,sz=north+iz*footprint*.5;
          const altitude=sampleTerrainHeight(sx,sz);
          if(altitude<=WATER_H+1.0||
             Math.abs(altitude-y)>2.6||cityLotAt(sx,sz)){valid=false;break;}
        }
        if(!valid)continue;
      }
      if(validate&&!validate(east,north))continue;
      nearest={x:east,z:north,y};
      best=score;
    }
    return nearest;
  }

  function createMapScenery() {
    disposeSceneMesh(alaskaDetailMesh);
    alaskaDetailMesh=null;
    for(const actor of alaskaIceActors)disposeSceneMesh(actor.mesh);
    alaskaIceActors=[];
    alaskaIcePose=null;
    disposeSceneMesh(nycHeroScenery);
    disposeSceneMesh(nycStreetMesh);
    disposeSceneMesh(nycGisMesh);
    disposeSceneMesh(nycParkMesh);
    nycHeroScenery=nycStreetMesh=nycGisMesh=nycParkMesh=null;
    const heroEpoch=++nycHeroEpoch;
    disposeSceneMesh(mapScenery);
    disposeSceneMesh(mapLights);
    disposeSceneMesh(timesSquareScreens);
    disposeSceneMesh(timesSquareFallback);
    for(const mesh of dcSurfaceMeshes)disposeSceneMesh(mesh);
    dcSurfaceMeshes=[];
    timesSquareScreens=null;
    timesSquareFallback=null;
    nycLedGeneration++;
    if(nycLedAtlas){gl.deleteTexture(nycLedAtlas);nycLedAtlas=null;}
    mapScenery=mapLights=null;
    sceneryPlaces=[];
    sceneryObjects=[];
    sceneryMovers=[];
    const solid=createTriangleMesh(), lights=createTriangleMesh();
    // Optional Alaska-only detail. Epoch guard prevents map-switch GPU leaks.
    if(selectedMap.alaska && !graphicsCompat && smoothScenery()){
      import('./assets/alaska/alaska-fjord-detail.js')
        .then(({buildAlaskaFjordDetail})=>{
          if(!selectedMap.alaska || heroEpoch!==nycHeroEpoch || gl.isContextLost())return;
          const detail=createTriangleMesh();
          const stats=buildAlaskaFjordDetail({
            addTri:detail.addTri,addQuad:detail.addQuad,
            terrainAt:(x,z)=>sampleTerrainHeight(x,z),waterY:WATER_H
          });
          const uploaded=detail.upload();
          if(!selectedMap.alaska || heroEpoch!==nycHeroEpoch || gl.isContextLost())
            disposeSceneMesh(uploaded);
          else{alaskaDetailMesh=uploaded;console.info('[PATROL] Alaska fjord detail',stats);}
        })
        .catch(error=>console.warn('[PATROL] Alaska detail fallback:',error));
    }
    // Dynamic, terrain-aware Alaska ice. No wave/terrain collision changes.
    if(selectedMap.alaska && !graphicsCompat && smoothScenery()){
      import('./assets/alaska/alaska-ice-motion.js').then(({
        createAlaskaIceActors,poseAlaskaIce
      })=>{
        if(!selectedMap.alaska||heroEpoch!==nycHeroEpoch||gl.isContextLost())return;
        const actors=createAlaskaIceActors({
          makeMesh:createTriangleMesh,
          terrainAt:(x,z)=>sampleTerrainHeight(x,z),
          waterY:WATER_H
        });
        if(!selectedMap.alaska||heroEpoch!==nycHeroEpoch||gl.isContextLost()){
          for(const actor of actors)disposeSceneMesh(actor.mesh);
          return;
        }
        alaskaIceActors=actors;
        alaskaIcePose=poseAlaskaIce;
        console.info('[PATROL] Alaska shoreline-aware moving ice',actors.length);
      }).catch(error=>console.warn('[PATROL] Alaska ice motion fallback:',error));
    }
    // PATROL_NYC_STREETS_V10: city-only streets and street-level props.
    // Static geometry in its own draw batch, no WebGPU or second renderer.
    if(selectedMap.city && !graphicsCompat && smoothScenery()){
      import('./assets/nyc/nyc-street-network.js').then(({buildNycStreetNetwork})=>{
        if(!selectedMap.city||heroEpoch!==nycHeroEpoch||gl.isContextLost())return;
        const detail=createTriangleMesh();
        const stats=buildNycStreetNetwork({
          addQuad:detail.addQuad,addTri:detail.addTri,
          box:(...args)=>addModelBox(detail.addQuad,...args),
          beam:(a,b,w,c)=>addRideBeam(detail.addQuad,a,b,w,c),
          ribbon:(a,b,w,col)=>pushRoadStrip(detail.addQuad,a,b,w,col),
          terrainAt:(x,z)=>sampleTerrainHeight(x,z),
          // PATROL_NYC_STREET_FURNITURE_V11: five-point lot clearance.
          // This keeps shelters, vendors, signals and tree beds outside the
          // existing building collision volumes when the terrain is ready.
          isClear:(x,z,r=.5)=>[[0,0],[-r,-r],[-r,r],[r,-r],[r,r]]
            .every(([dx,dz])=>!cityLotAt(x+dx,z+dz)),
          detailBand:nycDetailBand,grid:MANHATTAN_GRID,
          streetY:STREET_Y,waterY:WATER_H,
          timesBounds:TIMES_SQUARE.bounds,
          existingStreets:[...CITY_STREETS,CITY_EXPRESSWAY.points,CITY_EXPRESSWAY.ramp],
          lettering:(label,p,w,h,color)=>addVegasLettering(detail.addQuad,label,
            (u,v)=>[p[0]+u,p[1]+v,p[2]],w,h,color),
          // PATROL_NYC_ROAD_MARKINGS_V12: flat upward-facing painted
          // lettering in the existing city batch, no extra texture/renderer.
          pavementText:(label,p,w,h,color)=>addVegasLettering(detail.addQuad,label,
            (u,v)=>[p[0]+u,p[1],p[2]-v],w,h,color)
        });
        const uploaded=detail.upload();
        if(heroEpoch!==nycHeroEpoch||gl.isContextLost())disposeSceneMesh(uploaded);
        else{nycStreetMesh=uploaded;console.info('[PATROL] NYC streets',stats);}
      }).catch(error=>console.warn('[PATROL] NYC road fallback:',error));
    }
    // Separate single-batch harbor geometry; no extra renderer/scene graph.
    if(selectedMap.city && !graphicsCompat && smoothScenery()){
      import('./assets/nyc/nyc-hero.js').then(({buildNycHeroScenery,buildManhattanWaterfront})=>{
        if(!selectedMap.city||heroEpoch!==nycHeroEpoch||gl.isContextLost())return;
        const detail=createTriangleMesh();
        buildNycHeroScenery({
          addQuad:detail.addQuad,
          box:(...args)=>addModelBox(detail.addQuad,...args),
          beam:(a,b,w,c)=>addRideBeam(detail.addQuad,a,b,w,c),
          waterY:WATER_H,groundY:sampleTerrainHeight(-140,-611),
          spawn:NYC_HERO_ROUTE.spawn,liberty:NYC_HERO_ROUTE.liberty
        });
        const waterfront=buildManhattanWaterfront({
          addQuad:detail.addQuad,
          box:(...args)=>addModelBox(detail.addQuad,...args),
          beam:(a,b,w,c)=>addRideBeam(detail.addQuad,a,b,w,c),
          waterY:WATER_H,
          terrain:(x,z)=>sampleTerrainHeight(x,z)
        });
        const uploaded=detail.upload();
        if(heroEpoch!==nycHeroEpoch||gl.isContextLost())disposeSceneMesh(uploaded);
        else {
          nycHeroScenery=uploaded;
          // Activate colliders only for the same NYC scene generation that
          // owns these pier meshes. Map changes reset sceneryObjects, while
          // stale asynchronous loads must never leak obstacles into Alaska.
          sceneryObjects.push(...waterfront.pierObstacles);
        }
      }).catch(error=>console.warn('[PATROL] Harbor detail fallback:',error));
    }
    // Park geometry uses a separate, bounded triangle batch, but the same
    // WebGL renderer as Manhattan. Load only when the city is active.
    if(selectedMap.city && !graphicsCompat && smoothScenery()){
      Promise.all([import('./assets/nyc/central-park.js'),
        import('./assets/nyc/central-park-amenities.js')]).then(([{buildCentralPark},{buildCentralParkAmenities}])=>{
        if(!selectedMap.city||heroEpoch!==nycHeroEpoch||gl.isContextLost())return;
        const detail=createTriangleMesh();
        const parkQuality=window.matchMedia('(max-width:760px), (pointer:coarse)').matches?'low':'high';
        const parkOpts={
          addQuad:detail.addQuad,addTri:detail.addTri,
          box:(...args)=>addModelBox(detail.addQuad,...args),
          beam:(a,b,w,color)=>addRideBeam(detail.addQuad,a,b,w,color),
          ribbon:(a,b,w,color)=>pushRoadStrip(detail.addQuad,a,b,w,color),
          terrainAt:(x,z)=>sampleTerrainHeight(x,z),
          waterY:WATER_H,streetY:STREET_Y,grid:MANHATTAN_GRID,
          quality:parkQuality
        };
        const stats=buildCentralPark(parkOpts);
        const amenityStats=buildCentralParkAmenities(parkOpts);
        const uploaded=detail.upload();
        if(!selectedMap.city||heroEpoch!==nycHeroEpoch||gl.isContextLost()){
          disposeSceneMesh(uploaded);return;
        }
        nycParkMesh=uploaded;
        // Only the substantial castle is a flight collision obstacle.
        // Tree crowns stay visual-only to avoid expensive hitbox scans.
        const bx=MANHATTAN_GRID.tilt*181+MANHATTAN_GRID.offset-16;
        const by=sampleTerrainHeight(bx,181);
        sceneryObjects.push({name:'Belvedere Castle',x:bx,z:181,y:by,
          top:by+7.4,halfX:5,halfZ:5});
        console.info('[PATROL] Central Park',stats,amenityStats);
      }).catch(error=>console.warn('[PATROL] Central Park fallback:',error));
    }
    const box=(...args)=>addModelBox(solid.addQuad,...args);
    const lamp=(...args)=>addModelBox(lights.addQuad,...args);
    const iron=[0.30,0.35,0.38], pale=[0.79,0.80,0.74], red=[0.64,0.24,0.18];
    const timber=[0.41,0.32,0.24], amber=[0.95,0.71,0.38];
    const place=(name,site)=>sceneryPlaces.push({name,x:site.x,z:site.z});
    if(selectedMap.city){
      for(const site of [...CENTRAL_PARK_SITES,
        {name:'Central Park Zoo',u:27,z:89},
        {name:'Strawberry Fields',u:-28,z:130},
        {name:'Loeb Boathouse',u:18,z:157},

        place(site.name,{x:MANHATTAN_GRID.tilt*site.z+MANHATTAN_GRID.offset+site.u,z:site.z});

    const solidAt=(name,x,z,y,top,halfX,halfZ,roofSlope=0,roofSlopeZ=0)=>
      sceneryObjects.push({name,x,z,y,top,halfX,halfZ,roofSlope,roofSlopeZ});

    function cylinder(x,z,levels,color,sides=12,spiral=0,mesh=solid) {
      const point=(level,i)=>{
        const [y,r]=level;
        const a=i*Math.PI*2/sides+spiral;
        return [x+Math.sin(a)*r,y,z+Math.cos(a)*r];
      };
      for(let row=0;row<levels.length-1;row++)for(let i=0;i<sides;i++){
        const a=point(levels[row],i),b=point(levels[row],i+1);
        mesh.addQuad(a,b,point(levels[row+1],i+1),point(levels[row+1],i),color);
      }
      const tip=levels.at(-1);
      for(let i=0;i<sides;i++)mesh.addTri([x,tip[0],z],point(tip,i),point(tip,i+1),color);
    }

    // Alaska-only surveyed foundation: reject submerged inlets and steep
    // slopes across the complete cabin footprint, not only the corners.
    function alaskaShedPad(x,z,w,d){
      const heights=[];
      for(let ix=0;ix<=6;ix++)for(let iz=0;iz<=6;iz++){
        const px=x+(ix/6-.5)*(w+.8),pz=z+(iz/6-.5)*(d+.8);
        heights.push(sampleTerrainHeight(px,pz));
      }
      if(!heights.every(Number.isFinite))return null;
      const low=Math.min(...heights),high=Math.max(...heights);
      if(low<=WATER_H+1.0||high-low>2.15)return null;
      return {low,top:high+.12};
    }
    function shed(site,w,l,body,roofHeight,name){
      let {x,y,z}=site;
      if(selectedMap.alaska){
        const pad=alaskaShedPad(x,z,w,l);
        if(!pad)return false;
        // Raise the foundation to the highest surveyed terrain sample and
        // visibly support its lower corners instead of floating on the slope.
        y=pad.top;
        for(const dx of [-.4,.4])for(const dz of [-.4,.4]){
          const sx=x+dx*w,sz=z+dz*l,base=sampleTerrainHeight(sx,sz);
          const height=Math.max(.25,y-base);
          box(sx,base+height*.5,sz,.27,height,.27,[.36,.31,.26]);
        }
      }
      box(x,y+1.8,z,w,3.7,l,body);
      const a=x-w/2-.35,b=x+w/2+.35,f=z-l/2-.3,k=z+l/2+.3;
      const top=y+3.6, ridge=top+roofHeight;
      solid.addQuad([a,top,f],[a,top,k],[x,ridge,k],[x,ridge,f],iron);
      solid.addQuad([b,top,k],[b,top,f],[x,ridge,f],[x,ridge,k],iron);
      solid.addTri([a,top,f],[x,ridge,f],[b,top,f],body);
      solid.addTri([b,top,k],[x,ridge,k],[a,top,k],body);
      box(x,y+1.2,f-0.06,w*0.32,2.35,0.18,timber);
      for(const side of [-1,1])box(x+side*w*0.31,y+2.15,k+0.03,1.3,0.92,0.11,[0.34,0.49,0.54]);
      solidAt(name,x,z,y,ridge,w/2,l/2);
      return true;
    }

    if(selectedMap.alaska) {
      // The original small search has no buildable full-footprint site in
      // the actual USGS DEM; retain the glacier corridor with a bounded search.
      const camp=findScenerySite(150,314,{footprint:8,range:180,
        validate:(x,z)=>Boolean(alaskaShedPad(x,z,10,13))});
      if(camp && shed(camp,10,13,[0.80,0.45,0.21],1.5,'research cabin')){
        place('Glacier Research Camp',camp);
        // A second building gets its own land-clearance/spacing survey.
        const annex=findScenerySite(camp.x+17,camp.z+7,{
          footprint:5,range:27,
          validate:(x,z)=>Boolean(alaskaShedPad(x,z,8,9)),
          avoid:(x,z)=>Math.abs(x-camp.x)<11&&Math.abs(z-camp.z)<12
        });
        if(annex)shed(annex,8,9,[0.62,0.68,0.69],1.1,'research cabin');
        const mast=findScenerySite(camp.x-13,camp.z+11,{
          footprint:3.2,range:24,
          avoid:(x,z)=>Math.abs(x-camp.x)<9&&Math.abs(z-camp.z)<10
        });
        if(mast){
          cylinder(mast.x,mast.z,[[mast.y,0.27],[mast.y+9,0.14]],iron,8);
          box(mast.x,mast.y+9,mast.z,4.0,0.19,0.18,pale);
          lamp(mast.x,mast.y+9.8,mast.z,0.32,0.38,0.32,[0.94,0.30,0.23]);
        }
      }
      const routes=[{x:-12,z:-301,rx:18,rz:56},{x:5,z:38,rx:17,rz:61}];
      for(const [index,route] of routes.entries()){
        if(Array.from({length:24},(_,i)=>routePose(route,i*Math.PI/12))
          .every(([x,z])=>sampleTerrainHeight(x,z)<=WATER_H)){
          sceneryMovers.push({kind:'whale',...route,phase:index*2.3,rate:0.115+index*0.02});
          if(index===0)place('Whale Passage',route);
        }
      }
    } else if(selectedMap===FLIGHT_MAPS.coast) {
      const anchors=[[-98,112],[-52,150],[-8,182],[36,207]];
      for(const [index,[x,z]] of anchors.entries()){
        const site=findScenerySite(x,z,{footprint:3,range:135,avoid:(a,b)=>
          sceneryMovers.some(t=>Math.hypot(a-t.x,b-t.z)<32)});
        if(!site)continue;
        const height=17+(index%3)*2.4;
        cylinder(site.x,site.z,[[site.y,1.38],[site.y+1,1.19],[site.y+height,0.49]],pale,10);
        box(site.x,site.y+height,site.z,1.9,1.45,2.8,iron);
        sceneryMovers.push({kind:'turbine',...site,top:site.y+height,phase:index*1.15});
        solidAt('wind turbine',site.x,site.z,site.y,site.y+height+1,1.55,1.55);
        if(!sceneryPlaces.length)place('Copper Wind Farm',site);
      }
    } else if(selectedMap.airfield) {
      const farm=findScenerySite(254,-116,{footprint:12,range:81});
      if(farm){
        place('Alder Farm',farm);
        shed(farm,17,22,red,3,'farm barn');
        const other={x:farm.x+20,z:farm.z+12};
        shed({...other,y:sampleTerrainHeight(other.x,other.z)},10,12,[0.66,0.57,0.45],1.8,'farm shed');
        for(const dx of [-13,-19]){
          const x=farm.x+dx,z=farm.z+4,y=sampleTerrainHeight(x,z);
          cylinder(x,z,[[y,2.15],[y+6,2.15],[y+7.42,0.23]],[0.54,0.59,0.57],14);
          solidAt('grain silo',x,z,y,y+7.42,2.1,2.1);
        }
        for(let i=0;i<10;i++){
          const z=farm.z-22+i*2.1;
          box(farm.x+2,sampleTerrainHeight(farm.x+2,z)+0.07,z,0.17,0.2,0.85,timber);
        }
      }
    } else if(selectedMap.chongqing) {
      const base=sampleTerrainHeight(CHONGQING_SITES.hongyadong.x,CHONGQING_SITES.hongyadong.z)+0.08;
      const asphalt=[0.16,0.18,0.20], concrete=[0.48,0.46,0.41], glass=[0.25,0.43,0.48];
      const timber=[0.45,0.26,0.16], amber=[0.98,0.56,0.20], red=[0.54,0.16,0.11];
      const road=(route,width=8)=>{

        {box,lamp,addTri:solid.addTri,addQuad:solid.addQuad,

      // PATROL_NYC_GIS_INFILL_V11_HOOK — official FID/HEIGHTROOF
      // polygons from NYC public data, clipped to open lots; no extra engine.
      // Disable for troubleshooting: ?nycGIS=off
      if(!graphicsCompat && smoothScenery() &&
         new URLSearchParams(location.search).get('nycGIS')!=='off'){
        const sceneEpoch=heroEpoch;
        Promise.all([
          import('./assets/nyc/nyc-gis-infill.js'),
          fetch('./assets/nyc/times-square-footprints.json').then(r=>{
            if(!r.ok)throw Error('NYC GIS HTTP '+r.status);

          if(!selectedMap.city||sceneEpoch!==nycHeroEpoch||gl.isContextLost())return;

            addTri:(a,b,c,color,surface=0)=>
              dataMesh.addTri(a,b,c,color,surface),
            box:(...args)=>addModelBox(dataMesh.addQuad,...args),

      }
      const ledColumns=Math.max(8,Math.ceil(Math.sqrt(adPanels.length)));

      timesSquareFallback=oldScreens.upload();

        // own atlas; previous builds never block the newest art from loading.

          .then(module=>{
            if(gl.isContextLost()||!selectedMap.city||generation!==nycLedGeneration)return null;

          .then(texture=>{

        z>=-405 && z<=-359 ? ![13,22,32,46].some(offset=>sampleTerrainHeight(x-offset,z)<=WATER_H) : true});

          lamp(dock.x-18,dock.y+13.9,z,0.36,0.28,0.39,amber);

        }
        for(let i=0;i<12;i++) {
          const x=dock.x+8+(i%3)*4.1,z=dock.z-21+Math.floor(i/3)*4.1;
          const y=sampleTerrainHeight(x,z);
          box(x,y+0.88,z,3.6,1.76,3.9,i%3===0?red:i%3===1?iron:[0.42,0.52,0.44]);
        }

    } else if(selectedMap.vegas) {
      buildVegasStrip({box,lamp,cylinder,solidAt,place,addQuad:solid.addQuad,lightQuad:lights.addQuad});
    }
    buildLocalLandmark({box,lamp,cylinder,addQuad:solid.addQuad,solidAt,place,shed});
    if(sceneryPlaces.length || selectedMap.vegas){
