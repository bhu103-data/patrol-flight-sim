  btnBoost.addEventListener('touchend', (e) => { e.preventDefault(); plane.afterburner = false; btnBoost.classList.remove('active'); }, { passive: false });

  function getPlaneBasis() {
    const cy = Math.cos(plane.yaw), sy = Math.sin(plane.yaw);
    const cp = Math.cos(plane.pitch), sp = Math.sin(plane.pitch);
    const fwd = [sy * cp, sp, cy * cp];
    const worldUp = [0, 1, 0];
    let right = v3Norm(v3Cross(worldUp, fwd));
    let up = v3Cross(fwd, right);

    const totalRoll = plane.bank + (plane.rollAnim > 0 ? plane.rollAnim * Math.PI * 2 * plane.rollDir : 0);
    const cr = Math.cos(totalRoll), sr = Math.sin(totalRoll);
    const rRolled = [
      right[0] * cr + up[0] * sr,
      right[1] * cr + up[1] * sr,
      right[2] * cr + up[2] * sr
    ];
    const uRolled = [
      up[0] * cr - right[0] * sr,
      up[1] * cr - right[1] * sr,
      up[2] * cr - right[2] * sr
    ];
    return { fwd, right: rRolled, up: uRolled };
  }

  // Camera State for Smooth ~1.0s Transitions
  let camPos = [210, 36, 198];
  let camLook = [210, 34, 220];
  let camUp = [0, 1, 0];
  let camInitialized = false;

  function computeTargetCamera(basis) {
    const p = plane.pos;
    if (viewIdx === 0) {
      // CHASE
      const eye = [
        p[0] - basis.fwd[0] * 8.2 + basis.up[0] * 1.95,
        p[1] - basis.fwd[1] * 8.2 + basis.up[1] * 1.95 + 0.55,
        p[2] - basis.fwd[2] * 8.2 + basis.up[2] * 1.95
      ];
      const look = [
        p[0] + basis.fwd[0] * 18.0,
        p[1] + basis.fwd[1] * 18.0 + 0.4,
        p[2] + basis.fwd[2] * 18.0
      ];
      const up = v3Norm([basis.up[0] * 0.35, 1.0, basis.up[2] * 0.35]);
      return { eye, look, up, fov: 58 };
    } else if (viewIdx === 1) {
      // COCKPIT
      const eye = [
        p[0] + basis.fwd[0] * 0.72 + basis.up[0] * 0.42,
        p[1] + basis.fwd[1] * 0.72 + basis.up[1] * 0.42,
        p[2] + basis.fwd[2] * 0.72 + basis.up[2] * 0.42
      ];
      const look = [
        eye[0] + basis.fwd[0] * 30.0,
        eye[1] + basis.fwd[1] * 30.0,
        eye[2] + basis.fwd[2] * 30.0
      ];
      return { eye, look, up: basis.up, fov: 64 };
    } else {
      // TOP-DOWN (North-Up)
      const eye = [p[0], p[1] + 54.0, p[2]];
      const look = [p[0], p[1], p[2]];
      return { eye, look, up: [0, 0, 1], fov: 55 };
    }
  }

  // Canvas 2D Cockpit & HUD Renderer
  function drawHudAndCockpit(time, basis, viewProj) {
    const w = hudW;
    const h = hudH;
    hudCtx.clearRect(0, 0, w, h);

    // Project 3D world point to 2D pixel coords
    function project3D(pt) {
      const cx = viewProj[0] * pt[0] + viewProj[4] * pt[1] + viewProj[8] * pt[2] + viewProj[12];
      const cy = viewProj[1] * pt[0] + viewProj[5] * pt[1] + viewProj[9] * pt[2] + viewProj[13];
      const cw = viewProj[3] * pt[0] + viewProj[7] * pt[1] + viewProj[11] * pt[2] + viewProj[15];
      if (cw <= 0.05) return null;
      return [(cx / cw * 0.5 + 0.5) * w, (1.0 - (cy / cw * 0.5 + 0.5)) * h];
    }

    const beacon = route[gateIndex];
    const projected = beacon && project3D(beacon);
    if (projected) {
      const [x, y] = projected;
      const radius = clamp(1300 / Math.max(1, Math.hypot(...beacon.map((v, i) => v - plane.pos[i]))), 8, 53);
      hudCtx.save();
      hudCtx.strokeStyle = '#ffdfa3';
      hudCtx.lineWidth = 2;
      hudCtx.setLineDash([4, 3]);
      hudCtx.beginPath();
      hudCtx.arc(x, y, radius, 0, 2 * Math.PI);
      hudCtx.stroke();
      if(tourStops.length && x>=35 && x<=w-35 && y>=24 && y<=h-25){
        hudCtx.setLineDash([]);
        hudCtx.textAlign='center';
        hudCtx.font='bold 12px system-ui,sans-serif';
        hudCtx.strokeStyle='#172b38';
        hudCtx.lineWidth=3;
        hudCtx.fillStyle='#fff0ce';
        const label=tourStops[gateIndex].name;
        hudCtx.strokeText(label,x,y-radius-6);
        hudCtx.fillText(label,x,y-radius-6);
      }
      hudCtx.restore();
    }

    // Draw Wingtip Vapor Trails
    hudCtx.fillStyle = 'rgba(247, 239, 242, 0.78)';
    for (const tr of trails) {
      const s = project3D(tr.pos);
      if (!s) continue;
      if (tr.type === 'vapor') {
        hudCtx.fillStyle = `rgba(247, 239, 242, ${tr.alpha.toFixed(2)})`;
        hudCtx.fillRect(Math.round(s[0]), Math.round(s[1]), 2, 2);
      } else if (tr.dust) {
        const size = 2.5 + (1-tr.alpha)*10;
        const cloud = hudCtx.createRadialGradient(s[0],s[1],0,s[0],s[1],size);
        cloud.addColorStop(0,'rgba(132,116,96,'+(tr.alpha*0.57)+')');
        cloud.addColorStop(1,'rgba(132,116,96,0)');
        hudCtx.fillStyle=cloud;
        hudCtx.fillRect(s[0]-size,s[1]-size,size*2,size*2);
      } else if (tr.type === 'smoke') {
        const sz = Math.max(2, Math.round((1.0 - tr.alpha) * 5 + 2));
        hudCtx.fillStyle = tr.ember
          ? `rgba(252, 196, 93, ${tr.alpha.toFixed(2)})`
          : `rgba(218, 200, 212, ${(tr.alpha * 0.75).toFixed(2)})`;
        hudCtx.fillRect(Math.round(s[0] - sz * 0.5), Math.round(s[1] - sz * 0.5), sz, sz);
      }
    }

    // Draw Explosions (Flash, Fireball, Expanding Shock Ring, Water Plume)
    for (const ex of explosions) {
      const s = project3D(ex.pos);
      if (!s) continue;
      const t = ex.age / ex.maxAge;
      const sx = Math.round(s[0]);
      const sy = Math.round(s[1]);

      if (ex.crash || ex.structure) {
        drawCrashBurst(sx, sy, t, ex.isWater);
        continue;
      }

      // Expanding shock ring
      if (t < 0.55) {
        const rad = Math.round(4 + t * 56);
        hudCtx.strokeStyle = ex.isWater ? 'rgba(247, 239, 242, 0.8)' : 'rgba(255, 220, 145, 0.85)';
        hudCtx.lineWidth = 1;
        hudCtx.beginPath();
        hudCtx.arc(sx, sy, rad, 0, Math.PI * 2);
        hudCtx.stroke();
      }

      if (ex.isWater) {
        // Water spray column
        const colH = Math.round(Math.sin(Math.min(1, t * 1.4) * Math.PI) * 28);
        const colW = Math.round(6 + t * 14);
        hudCtx.fillStyle = '#f7eff2';
        hudCtx.fillRect(sx - 3, sy - colH, 6, colH);
        hudCtx.fillStyle = '#94c9be';
        hudCtx.fillRect(sx - Math.floor(colW / 2), sy - Math.floor(colH * 0.55), colW, Math.floor(colH * 0.55));
      } else {
        // Flash & Fireball
        if (t < 0.14) {
          hudCtx.fillStyle = '#fff0d6';
          hudCtx.fillRect(sx - 12, sy - 12, 24, 24);
        }
        if (t < 0.75) {
          const r = Math.round((1.0 - t * 0.7) * 14);
          hudCtx.fillStyle = '#b84b2c';
          hudCtx.fillRect(sx - r, sy - r, r * 2, r * 2);
          hudCtx.fillStyle = '#f5983b';
          const r2 = Math.max(2, Math.floor(r * 0.65));
          hudCtx.fillRect(sx - r2, sy - r2, r2 * 2, r2 * 2);
        }
      }
    }

    if (crash) return;

    // Top-Down target reticle when steering
    if (viewIdx === 2) {
      const mx = Math.round(mouseClient.x * (w / window.innerWidth));
      const my = Math.round(mouseClient.y * (h / window.innerHeight));
      hudCtx.strokeStyle = 'rgba(255, 214, 153, 0.75)';
      hudCtx.strokeRect(mx - 5, my - 5, 10, 10);
    }

    // COCKPIT & HUD OVERLAY (Fades in cleanly in Cockpit view)
    if (viewIdx !== 1) return;

    if(selectedAircraft==='jetpack'){
      // Helmet-mounted JARVIS-style tactical interface for the Mark 42 suit.
      const cx=w*0.5,cy=h*0.48,cyan='#75efff',dim='rgba(117,239,255,0.42)';
      const scan=(time*34)%h;
      hudCtx.save();
      const wash=hudCtx.createRadialGradient(cx,cy,8,cx,cy,Math.max(w,h)*0.62);
      wash.addColorStop(0,'rgba(10,58,68,0.02)');
      wash.addColorStop(0.72,'rgba(5,35,44,0.09)');
      wash.addColorStop(1,'rgba(2,17,24,0.34)');
      hudCtx.fillStyle=wash;
      hudCtx.fillRect(0,0,w,h);
      hudCtx.strokeStyle=cyan;
      hudCtx.fillStyle=cyan;
      hudCtx.lineWidth=1;
      hudCtx.font='9px "Share Tech Mono", monospace';
      hudCtx.fillText('JARVIS // MARK 42',16,18);
      hudCtx.fillText('ARMOR INTEGRITY 100%',16,32);
      hudCtx.textAlign='right';
      hudCtx.fillText(armorLandingMode?'LANDING ASSIST ACTIVE':'REPULSOR FLIGHT STABLE',w-16,18);
      hudCtx.fillText('TWIN LASERS '+(sceneryTime>=cannonReadyAt?'READY':'CYCLING'),w-16,32);
      hudCtx.textAlign='left';
      for(const radius of [28,47,73]){
        hudCtx.globalAlpha=radius===47?0.72:0.34;
        hudCtx.beginPath();
        hudCtx.arc(cx,cy,radius,time*(radius===47?-0.18:0.12),time*0.12+Math.PI*1.45);
        hudCtx.stroke();
      }
      hudCtx.globalAlpha=1;
      const reticle=18+Math.sin(time*3)*2;
      hudCtx.strokeRect(cx-reticle,cy-reticle,reticle*2,reticle*2);
      hudCtx.beginPath();
      hudCtx.moveTo(cx-34,cy);hudCtx.lineTo(cx-10,cy);
      hudCtx.moveTo(cx+10,cy);hudCtx.lineTo(cx+34,cy);
      hudCtx.moveTo(cx,cy-34);hudCtx.lineTo(cx,cy-10);
      hudCtx.moveTo(cx,cy+10);hudCtx.lineTo(cx,cy+34);
      hudCtx.stroke();
      const altitude=Math.round(plane.pos[1]*85),speed=Math.round(plane.speed*18.5);
      hudCtx.fillText('SPD '+String(speed).padStart(3,'0')+' KTS',18,h-36);
      hudCtx.fillText('ALT '+String(altitude).padStart(5,'0')+' FT',18,h-22);
      hudCtx.textAlign='right';
      hudCtx.fillText('HDG '+String(Math.round(((plane.yaw*180/Math.PI)%360+360)%360)).padStart(3,'0'),w-18,h-36);
      hudCtx.fillText('RADAR '+Math.round(plane.radarAlt*85)+' FT',w-18,h-22);
      hudCtx.textAlign='left';
      hudCtx.strokeStyle=dim;
      hudCtx.beginPath();hudCtx.moveTo(0,scan);hudCtx.lineTo(w,scan);hudCtx.stroke();
      // Helmet edge brackets give the first-person view a physical visor frame.
      for(const side of [-1,1]){
        const x=side<0?9:w-9,inner=side<0?55:w-55;
        hudCtx.beginPath();
        hudCtx.moveTo(x,58);hudCtx.lineTo(inner,96);hudCtx.lineTo(inner,h-72);hudCtx.lineTo(x,h-42);
        hudCtx.stroke();
      }
      hudCtx.restore();
      return;
    }

    const cx = Math.floor(w * 0.5);
    const cy = Math.floor(h * 0.44);

    // 1. HEAD-UP DISPLAY (HUD) — Pitch ladder aligned to true exterior horizon
    const hudCol = '#72ff9f';
    const hudDim = 'rgba(114, 255, 159, 0.42)';
    hudCtx.strokeStyle = hudCol;
    hudCtx.fillStyle = hudCol;
    hudCtx.font = '8px "Share Tech Mono", monospace';
    hudCtx.lineWidth = 1;

    // Velocity vector / gun cross
    hudCtx.strokeRect(cx - 2, cy - 2, 4, 4);
    hudCtx.beginPath();
    hudCtx.moveTo(cx - 10, cy); hudCtx.lineTo(cx - 4, cy);
    hudCtx.moveTo(cx + 4, cy); hudCtx.lineTo(cx + 10, cy);
    hudCtx.moveTo(cx, cy - 8); hudCtx.lineTo(cx, cy - 4);
    hudCtx.stroke();

    // True horizon + pitch ladder
    const totalRoll = plane.bank + (plane.rollAnim > 0 ? plane.rollAnim * Math.PI * 2 * plane.rollDir : 0);
    const fovRad = 64 * Math.PI / 180;
    const pxPerRad = (h * 0.5) / Math.tan(fovRad * 0.5);

    hudCtx.save();
    hudCtx.translate(cx, cy);
    hudCtx.rotate(-totalRoll);
    for (let deg = -30; deg <= 30; deg += 10) {
      const rad = deg * Math.PI / 180;
      const dy = (plane.pitch - rad) * pxPerRad;
      if (Math.abs(dy) > h * 0.34) continue;
      const halfW = deg === 0 ? 54 : 26;
      hudCtx.strokeStyle = deg === 0 ? hudCol : hudDim;
      hudCtx.beginPath();
      hudCtx.moveTo(-halfW, dy); hudCtx.lineTo(-12, dy);
      hudCtx.moveTo(12, dy); hudCtx.lineTo(halfW, dy);
      hudCtx.stroke();
      if (deg !== 0) {
        hudCtx.fillText(String(Math.abs(deg)), halfW + 3, dy + 3);
      }
    }
    hudCtx.restore();

    // Heading tape at top
    const hdgDeg = Math.round(((plane.yaw * 180 / Math.PI) % 360 + 360) % 360);
    hudCtx.strokeStyle = hudCol;
    hudCtx.beginPath();
    hudCtx.moveTo(cx - 55, 22); hudCtx.lineTo(cx + 55, 22);
    hudCtx.moveTo(cx, 22); hudCtx.lineTo(cx, 26);
    hudCtx.stroke();
    hudCtx.fillText(String(hdgDeg).padStart(3, '0') + '°', cx - 10, 18);

    // Left tape: Airspeed (KTS) & G-load
    const kts = Math.round(plane.speed * 18.5);
    hudCtx.strokeRect(cx - 115, cy - 10, 32, 13);
    hudCtx.fillText(String(kts), cx - 111, cy - 1);
    hudCtx.fillText('G ' + plane.gForce.toFixed(1), cx - 115, cy + 16);

    // Right tape: Altitude (FT) & Radar Altitude
    const altFt = Math.round(plane.pos[1] * 85);
    const radFt = Math.round(plane.radarAlt * 85);
    hudCtx.strokeRect(cx + 83, cy - 10, 36, 13);
    hudCtx.fillText(String(altFt), cx + 86, cy - 1);
    hudCtx.fillText('R ' + radFt, cx + 83, cy + 16);

    // Missile count & low-altitude pull-up warning on HUD
    const readyCount = hardpointTimers.filter(t => t <= 0).length;
    hudCtx.fillText('MSL ' + readyCount + '/4', cx - 115, cy + 28);
    if (plane.radarAlt < 4.5 && Math.floor(time * 8) % 2 === 0) {
      hudCtx.fillStyle = '#ff9838';
      hudCtx.fillText('PULL UP', cx - 18, cy + 26);
      hudCtx.fillStyle = hudCol;
    }

    // 2. HAND-DRAWN PIXEL COCKPIT INSTRUMENT DASHBOARD
    const dashTop = Math.floor(h * 0.66);
    const dashH = h - dashTop;

    // Canopy bow struts
    hudCtx.strokeStyle = '#141022';
    hudCtx.lineWidth = 4;
    hudCtx.beginPath();
    hudCtx.moveTo(0, Math.floor(h * 0.25));
    hudCtx.lineTo(Math.floor(w * 0.14), dashTop + 8);
    hudCtx.moveTo(w, Math.floor(h * 0.25));
    hudCtx.lineTo(Math.floor(w * 0.86), dashTop + 8);
    hudCtx.stroke();

    // Glare shield & main panel housing
    hudCtx.fillStyle = '#181426';
    hudCtx.fillRect(0, dashTop, w, dashH);
    hudCtx.fillStyle = '#262138';
    hudCtx.fillRect(10, dashTop + 3, w - 20, 4);
    hudCtx.fillStyle = '#100d1a';
    hudCtx.fillRect(14, dashTop + 8, w - 28, dashH - 8);

    // Helper for circular dial
    function drawDial(dx, dy, r, label, angleRad, valText) {
      hudCtx.fillStyle = '#0b0912';
      hudCtx.beginPath();
      hudCtx.arc(dx, dy, r, 0, Math.PI * 2);
      hudCtx.fill();
      hudCtx.strokeStyle = '#4c4466';
      hudCtx.lineWidth = 1;
      hudCtx.stroke();

      for (let t = 0; t < 12; t++) {
        const a = (t / 12) * Math.PI * 2;
        hudCtx.beginPath();
        hudCtx.moveTo(dx + Math.cos(a) * (r - 3), dy + Math.sin(a) * (r - 3));
        hudCtx.lineTo(dx + Math.cos(a) * (r - 1), dy + Math.sin(a) * (r - 1));
        hudCtx.stroke();
      }
      // Needle
      hudCtx.strokeStyle = '#ffd699';
      hudCtx.beginPath();
      hudCtx.moveTo(dx, dy);
      hudCtx.lineTo(dx + Math.cos(angleRad) * (r - 3), dy + Math.sin(angleRad) * (r - 3));
      hudCtx.stroke();

      hudCtx.fillStyle = '#9e8b99';
      hudCtx.fillText(label, dx - 9, dy - r + 8);
      if (valText) {
        hudCtx.fillStyle = '#f5983b';
        hudCtx.fillText(valText, dx - 11, dy + r - 3);
      }
    }

    const row1Y = dashTop + 26;
    const row2Y = dashTop + 62;

    // Airspeed Indicator (ASI)
    drawDial(cx - 118, row1Y, 17, 'ASI', (kts / 800) * Math.PI * 1.7 - Math.PI * 0.85, String(kts));

    // Artificial Horizon (ADI)
    const adiX = cx - 72, adiY = row1Y, adiR = 19;
    hudCtx.save();
    hudCtx.beginPath();
    hudCtx.arc(adiX, adiY, adiR, 0, Math.PI * 2);
    hudCtx.clip();
    hudCtx.translate(adiX, adiY);
    hudCtx.rotate(-totalRoll);
    const pShift = clamp(plane.pitch * 24, -14, 14);
    hudCtx.fillStyle = '#3d788f';
    hudCtx.fillRect(-24, -24, 48, 24 + pShift);
    hudCtx.fillStyle = '#70442c';
    hudCtx.fillRect(-24, pShift, 48, 24 - pShift);
    hudCtx.strokeStyle = '#fff0d6';
    hudCtx.beginPath();
    hudCtx.moveTo(-22, pShift); hudCtx.lineTo(22, pShift);
    hudCtx.stroke();
    hudCtx.restore();
    hudCtx.strokeStyle = '#f5983b';
    hudCtx.strokeRect(adiX - 5, adiY - 1, 10, 2);

    // Altimeter with numeric readout
    drawDial(cx - 26, row1Y, 17, 'ALT', (altFt / 4000) * Math.PI * 2 - Math.PI * 0.5, String(altFt));

    // Turn & Slip Coordinator
    const tsX = cx - 118, tsY = row2Y;
    drawDial(tsX, tsY, 15, 'TRN', clamp(mouseNorm.x * 0.9, -1, 1) - Math.PI * 0.5, '');
    hudCtx.fillStyle = '#262138';
    hudCtx.fillRect(tsX - 11, tsY + 6, 22, 4);
    hudCtx.fillStyle = '#fff0d6';
    hudCtx.fillRect(tsX - 2 + Math.round(clamp(mouseNorm.x * 6, -7, 7)), tsY + 6, 4, 4);

    // Heading Compass Rose
    drawDial(cx - 72, tsY, 16, 'HDG', plane.yaw - Math.PI * 0.5, String(hdgDeg).padStart(3, '0'));

    // Vertical Speed Indicator (VSI)
    drawDial(cx - 26, tsY, 15, 'VSI', clamp(plane.vsi * 0.14, -1.3, 1.3) + Math.PI, '');

    // Center Amber Ground-Mapping Terrain Radar Strip Sweep
    const radX = cx + 6, radY = dashTop + 11, radW = 68, radH = 62;
    hudCtx.fillStyle = '#120a04';
    hudCtx.fillRect(radX, radY, radW, radH);
    hudCtx.strokeStyle = '#8a4b14';
    hudCtx.strokeRect(radX, radY, radW, radH);

    // Sample live forward terrain elevation onto radar strip
    const sweepCol = Math.floor((time * 42) % radW);
    for (let rx = 0; rx < radW; rx += 2) {
      const scanDist = 8 + (rx / radW) * 140;
      const sx = plane.pos[0] + Math.sin(plane.yaw) * scanDist;
      const sz = plane.pos[2] + Math.cos(plane.yaw) * scanDist;
      const gh = sampleGroundHeight(sx, sz);
      const normH = clamp((gh - WATER_H) / 20.0, 0.0, 1.0);
      const barH = Math.max(2, Math.round(normH * (radH - 10)));
      const isSweep = Math.abs(rx - sweepCol) <= 2;
      hudCtx.fillStyle = isSweep ? '#ffd699' : (gh <= WATER_H + 0.05 ? '#3b1e08' : '#d9781e');
      hudCtx.fillRect(radX + rx, radY + radH - 2 - barH, 2, barH);
    }
    hudCtx.fillStyle = '#f5983b';
    hudCtx.fillText('GND RDR', radX + 4, radY + 9);

    // Engine Gauges (RPM / EGT vertical bars)
    const engX = cx + 82, engY = dashTop + 12;
    hudCtx.fillStyle = '#0d0a16';
    hudCtx.fillRect(engX, engY, 34, 42);
    hudCtx.strokeStyle = '#4c4466';
    hudCtx.strokeRect(engX, engY, 34, 42);
    const rpmFrac = plane.afterburner ? 1.0 : 0.72;
    const egtFrac = plane.afterburner ? 0.94 : 0.62;
    hudCtx.fillStyle = plane.afterburner ? '#ff6a33' : '#f5983b';
    hudCtx.fillRect(engX + 5, engY + 38 - Math.round(rpmFrac * 26), 8, Math.round(rpmFrac * 26));
    hudCtx.fillRect(engX + 20, engY + 38 - Math.round(egtFrac * 26), 8, Math.round(egtFrac * 26));
    hudCtx.fillStyle = '#9e8b99';
    hudCtx.fillText('RPM EGT', engX + 2, engY + 9);

    // Local Time Clock
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    hudCtx.fillStyle = '#0b0912';
    hudCtx.fillRect(engX, engY + 46, 34, 15);
    hudCtx.strokeStyle = '#4c4466';
    hudCtx.strokeRect(engX, engY + 46, 34, 15);
    hudCtx.fillStyle = '#ffd699';
    hudCtx.fillText(hh + ':' + mm, engX + 4, engY + 56);

    // Warning Annunciator Lights
    const warnX = cx + 122, warnY = dashTop + 12;
    const warns = [
      { txt: 'AB', active: plane.afterburner, col: '#ff8c38' },
      { txt: 'LOW', active: plane.radarAlt < 4.5, col: '#ff3b3b' },
      { txt: 'MSL', active: readyCount === 0, col: '#f5b83b' }
    ];
    warns.forEach((wn, idx) => {
      const wy = warnY + idx * 14;
      hudCtx.fillStyle = wn.active ? wn.col : '#1c172b';
      hudCtx.fillRect(warnX, wy, 24, 11);
      hudCtx.fillStyle = wn.active ? '#120a14' : '#574e6e';
      hudCtx.fillText(wn.txt, warnX + 3, wy + 8);
    });

    // Moving Throttle Lever on left console
    const thrX = 22, thrY = dashTop + 14, thrH = 54;
    hudCtx.fillStyle = '#0b0912';
    hudCtx.fillRect(thrX, thrY, 10, thrH);
    hudCtx.strokeStyle = '#4c4466';
    hudCtx.strokeRect(thrX, thrY, 10, thrH);
    const knobY = thrY + thrH - 8 - Math.round((plane.afterburner ? 1.0 : 0.52) * (thrH - 12));
    hudCtx.fillStyle = plane.afterburner ? '#f5983b' : '#a8b5c7';
    hudCtx.fillRect(thrX - 3, knobY, 16, 7);
  }

  const mapPanel = document.getElementById('flightMap');
  const mapToggle = document.getElementById('mapToggle');
  const mapCanvas = document.getElementById('flightMapCanvas');
  const mapCtx = mapCanvas.getContext('2d');
  const boundaryStatus = document.getElementById('boundaryStatus');
  const mapWidth = mapCanvas.width;
  const mapScale = mapWidth / MAP_SPAN;
  let mapRaster;
  let lastMapFrame = -Infinity;

  function toggleFlightMap() {
    const expanded = mapPanel.classList.toggle('expanded');
    mapToggle.setAttribute('aria-expanded', String(expanded));
    mapToggle.textContent = expanded ? 'SHRINK MAP [N]' : 'ENLARGE MAP [N]';
    lastMapFrame = -Infinity;
  }
  mapToggle.addEventListener('click', toggleFlightMap);

  function paintTerrainMap(raster, map, getHeight, preview = false) {
    const mapWidth = raster.width;
    const mapScale = mapWidth / MAP_SPAN;
    const ctx = raster.getContext('2d');
    const pixels = ctx.createImageData(mapWidth, mapWidth);
    const { airfield, city, alaska, vegas } = map;
    for (let y = 0; y < mapWidth; y++) {
      for (let x = 0; x < mapWidth; x++) {
        const east = (x + 0.5 - mapWidth / 2) / mapScale;
        const north = (mapWidth / 2 - y - 0.5) / mapScale;
        const h = getHeight(east, north);
        const offset = (y * mapWidth + x) * 4;
        const band = Math.floor((h - WATER_H) / 4);
        const water = h <= WATER_H;
        if (vegas) {
          const ridge=clamp((h-19.2)/35,0,1);
          pixels.data[offset]=158+48*ridge;
          pixels.data[offset+1]=104+28*ridge;
          pixels.data[offset+2]=69+22*ridge;
        } else if (alaska && !water) {
          const snow = Math.min(1, Math.max(0,(h-WATER_H-12)/16));
          pixels.data[offset] = 66 + 154*snow;
          pixels.data[offset+1] = 101 + 128*snow;
          pixels.data[offset+2] = 86 + 153*snow;
        } else if (city && !water) {
          const localX = east - (city.tilt * north + city.offset);
          const park = Math.abs(localX) < city.parkHalfWidth && Math.abs(north - city.parkCenter) < city.parkHalfLength;
          pixels.data[offset] = park ? 74 : 99 + band * 12;
          pixels.data[offset + 1] = park ? 121 : 106 + band * 12;
          pixels.data[offset + 2] = park ? 69 : 116 + band * 11;
        } else if (airfield && !water) {
          pixels.data[offset] = 70 + band * 13;
          pixels.data[offset + 1] = 104 + band * 8;
          pixels.data[offset + 2] = 64 + band * 12;
        } else {
          pixels.data[offset] = water ? 31 : band < 1 ? 117 : 104 + band * 12;
          pixels.data[offset + 1] = water ? 53 : band < 1 ? 106 : 72 + band * 10;
          pixels.data[offset + 2] = water ? 80 : band < 1 ? 66 : 48 + band * 11;
        }
        pixels.data[offset + 3] = 255;
      }
    }
    ctx.putImageData(pixels, 0, 0);
    if (airfield) {
      const center = mapWidth / 2;
      ctx.fillStyle = '#e4ddcb';
      ctx.fillRect(center + (airfield.x - airfield.halfWidth) * mapScale,
        center - (airfield.z + airfield.halfLength) * mapScale,
        airfield.halfWidth * 2 * mapScale, airfield.halfLength * 2 * mapScale);
    }
    if (city) {
      const strip=city.runway;
      ctx.fillStyle='#e4ddcb';
      ctx.fillRect(mapWidth/2+(strip.x-strip.halfLength)*mapScale,
        mapWidth/2-(strip.z+strip.halfWidth)*mapScale,
        strip.halfLength*2*mapScale,strip.halfWidth*2*mapScale);
      // Blue curved water footprints also appear on the radar map/preview.
      for(const lake of city.parkWaters||[]){
        ctx.beginPath();
        for(let n=0;n<=64;n++){
          const a=n/64*Math.PI*2;
          const r=1+.055*Math.sin(3*a+lake.phase)+
            .025*Math.cos(7*a-lake.phase);
          const z=lake.cz+Math.sin(a)*lake.rz*r;
          const u=lake.cx+Math.cos(a)*lake.rx*r;
          const x=u+city.offset+city.tilt*z;
          const px=mapWidth/2+x*mapScale,py=mapWidth/2-z*mapScale;
          if(n===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        ctx.closePath();
        ctx.fillStyle='#19475b';ctx.fill();
        ctx.lineWidth=Math.max(.7,mapScale*1.5);
        ctx.strokeStyle='#c1bca5';ctx.stroke();
      }
    }
    if(vegas){
      const center=mapWidth/2;
      ctx.fillStyle='#3c3b47';
      ctx.fillRect(center+(VEGAS_BOULEVARD-8)*mapScale,center-409*mapScale,16*mapScale,831*mapScale);
      ctx.fillRect(center+(VEGAS_PARADISE-6)*mapScale,center-348*mapScale,12*mapScale,716*mapScale);
      for(const {z} of VEGAS_CROSS_STREETS){
        ctx.fillRect(center-158*mapScale,center-(z+5)*mapScale,327*mapScale,10*mapScale);
      }
      const strip=vegas.airport;
      ctx.fillRect(center+(strip.x-strip.halfWidth)*mapScale,center-(strip.z+strip.halfLength)*mapScale,
        strip.halfWidth*2*mapScale,strip.halfLength*2*mapScale);
    }
    if(city||vegas){
      const design=city?CITY_EXPRESSWAY:VEGAS_EXPRESSWAY,center=mapWidth/2;
      ctx.lineCap='round';
      ctx.lineJoin='round';
      for(const [line,trail] of [[2.3,design.points],[1.5,design.ramp]]){
        ctx.beginPath();
        for(const [i,[x,z]] of trail.entries()){
          const px=center+x*mapScale,py=center-z*mapScale;
          if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        ctx.lineWidth=line;
        ctx.strokeStyle=city?'#d1c9a8':'#a9a497';
        ctx.stroke();
      }
    }
    if (preview) return;
    ctx.fillStyle = '#0b1024a6';
    ctx.beginPath();
    ctx.rect(0, 0, mapWidth, mapWidth);
    ctx.arc(mapWidth / 2, mapWidth / 2,
      (city?NYC_FLIGHT_RADIUS:FLIGHT_RADIUS)*mapScale, 0, 2 * Math.PI);
    ctx.fill('evenodd');
  }

  function loadMapPreviews() {
    const url = URL.createObjectURL(new Blob([workerSrc], { type: 'application/javascript' }));
    let worker;
    try {
      worker = new Worker(url);
    } catch {
      URL.revokeObjectURL(url);
      return;
    }
    const size = 160;
    const cards = Array.from(flightSetup.querySelectorAll('canvas[data-map]'));
    function stop() {
      worker.terminate();
      URL.revokeObjectURL(url);
    }
    worker.onerror = stop;
    worker.onmessageerror = stop;
    worker.onmessage = ({ data }) => {
      if (data.type !== 'preview') return;
      const card = cards.find(item => item.dataset.map === data.key);
      const toIndex = value => clamp(Math.floor((value / MAP_SPAN + 0.5) * size), 0, size-1);
      paintTerrainMap(card, FLIGHT_MAPS[data.key], (x,z) =>
        Math.max(WATER_H, data.height[toIndex(z)*size+toIndex(x)] * terrainScaleFor(FLIGHT_MAPS[data.key])), true);
      card.dataset.ready = 'true';
      if (cards.every(item => item.dataset.ready)) stop();
    };
    for (const { dataset: { map: key } } of cards) {
      worker.postMessage({ ...FLIGHT_MAPS[key], key, size, preview: true,
        span: MAP_SPAN, scale: terrainScaleFor(FLIGHT_MAPS[key]), water: WATER_H });
    }
  }

  function drawFlightMap(now, assisted) {
    if (now - lastMapFrame < 100) return;
    lastMapFrame = now;
    const center = mapWidth / 2;
    const activeRadius=selectedMap.city?NYC_FLIGHT_RADIUS:FLIGHT_RADIUS;
    const edge = activeRadius - Math.hypot(plane.pos[0], plane.pos[2]);
    const warning = edge < WARNING_DISTANCE;
    const status = assisted ? 'AUTO TURN' : warning ? 'EDGE AHEAD' : 'EDGE';
    const text = status + ' · ' + Math.max(0, Math.ceil(edge)) + ' u';
    if (boundaryStatus.textContent !== text) boundaryStatus.textContent = text;
    mapPanel.classList.toggle('warning', warning);
    mapPanel.classList.toggle('guarding', assisted);

    mapCtx.putImageData(mapRaster,0,0);
    mapCtx.strokeStyle = assisted ? '#ff795e' : '#ffd699';
    mapCtx.lineWidth = 4;
    mapCtx.setLineDash([10, 7]);
    mapCtx.beginPath();
    mapCtx.arc(center, center, activeRadius * mapScale, 0, 2 * Math.PI);
    mapCtx.stroke();
    mapCtx.setLineDash([]);

    mapCtx.fillStyle = '#fff0d6';
    mapCtx.font = 'bold 26px monospace';
    mapCtx.textAlign = 'center';
    mapCtx.fillText('N', center, 29);

    if (mapPanel.classList.contains('expanded')) {
      mapCtx.font = 'bold 16px monospace';
      mapCtx.strokeStyle = '#211827';
      mapCtx.lineWidth = 4;
      const labels=[];
      for (const mark of [...selectedMap.landmarks,...(selectedMap.places||[]),...sceneryPlaces]) {
        const x = center + mark.x * mapScale;
        const y = center - mark.z * mapScale;
        const isPlace=selectedMap.places?.includes(mark)||sceneryPlaces.includes(mark);
        const preferred=y-(isPlace?12:0);
        const half=mapCtx.measureText(mark.name).width/2+4;
        const labelX=clamp(x,half,mapWidth-half);
        const labelY=[0,-18,18,-36,36,-54,54].map(offset=>clamp(preferred+offset,22,mapWidth-9))
          .find(candidate=>labels.every(label=>
            Math.abs(candidate-label.y)>=17 || Math.abs(labelX-label.x)>=half+label.half))??preferred;
        labels.push({x:labelX,y:labelY,half});
        if(isPlace){
          mapCtx.beginPath();mapCtx.arc(x,y,3.2,0,Math.PI*2);mapCtx.fill();
        }
        mapCtx.strokeText(mark.name,labelX,labelY);
        mapCtx.fillText(mark.name,labelX,labelY);
      }
    }

    const showTourRoute=tourStops.length && mapPanel.classList.contains('expanded');
    if (showTourRoute && gateIndex<route.length){
      mapCtx.strokeStyle='#f1ca83';
      mapCtx.lineWidth=2;
      mapCtx.setLineDash([5,5]);
      mapCtx.beginPath();
      mapCtx.moveTo(center+plane.pos[0]*mapScale,center-plane.pos[2]*mapScale);
      for(let i=gateIndex;i<route.length;i++){
        const [x,,z]=route[i];
        mapCtx.lineTo(center+x*mapScale,center-z*mapScale);
      }
      mapCtx.stroke();
      mapCtx.setLineDash([]);
    }

    for (let i = gateIndex; i < route.length; i++) {
      const [x, , z] = route[i];
      mapCtx.fillStyle = i === gateIndex ? '#fff0ae' : '#cfad79';
      mapCtx.beginPath();
      const dotX=center+x*mapScale,dotY=center-z*mapScale;
      mapCtx.arc(dotX,dotY,i===gateIndex?9:showTourRoute?7:5,0,2*Math.PI);
      mapCtx.fill();
      if(showTourRoute) {
        mapCtx.fillStyle='#211827';
        mapCtx.font='bold 10px system-ui,sans-serif';
        mapCtx.fillText(String(i+1),dotX,dotY+3.4);
      }
    }
    if (mapPanel.classList.contains('expanded')) {
      for (const boat of boats) {
        if (boat.wreck) continue;
        const [x,z] = sceneryPose(boat,sceneryTime);
        mapCtx.fillStyle = '#8de1f5';
        mapCtx.fillRect(center + x*mapScale-2,center - z*mapScale-3,4,6);
      }
      for (const animal of moose) {
        const [x,z] = sceneryPose(animal,sceneryTime);
        mapCtx.fillStyle = '#f4be78';
        mapCtx.fillRect(center+x*mapScale-1,center-z*mapScale-1,3,3);
      }
    }
    mapCtx.fillStyle = '#fff0d6';
    mapCtx.save();
    mapCtx.translate(center + plane.pos[0] * mapScale, center - plane.pos[2] * mapScale);
    mapCtx.rotate(plane.yaw);
    mapCtx.beginPath();
    mapCtx.moveTo(0, -17);
    mapCtx.lineTo(11, 12);
    mapCtx.lineTo(0, 7);
    mapCtx.lineTo(-11, 12);
    mapCtx.closePath();
    mapCtx.strokeStyle = '#171421';
    mapCtx.lineWidth = 4;
    mapCtx.fill();
    mapCtx.stroke();
    mapCtx.restore();
  }

  let lastRandomMap=null;
  function updateFlightOptions() {
    const settings=new FormData(flightSetup);
    const map=FLIGHT_MAPS[settings.get('flightMap')];
    const available=settings.get('aircraft')==='fighter' && Boolean(map?.runwayStart);
    runwayChoice.hidden=!available;
    runwayStart.disabled=!available;
    // The aircraft is universal; water-launch is a site capability, not a map-only plane.
    // Desert and Chongqing's independently launched world have their own starts.
    const waterAvailable=settings.get('aircraft')==='seaplane' &&
      Boolean(map) && !map.vegas && !map.chongqing;
    waterStartChoice.hidden=!waterAvailable;
    waterStart.disabled=!waterAvailable;
    scenicTourChoice.hidden=!map?.tour;
    scenicTour.disabled=!map?.tour;
    if(scenicTour.disabled && scenicTour.checked){
      flightSetup.querySelector('input[name="flightMode"][value="free"]').checked=true;
    }
  }
  flightSetup.addEventListener('change',updateFlightOptions);
  updateFlightOptions();

  async function launchFlight(event) {
    event.preventDefault();
    // PATROL_CQ_CINEMATIC_V3: carry Manhattan's selected environment from
    // the shared PATROL launcher into the independent Chongqing Three.js scene.
    // No flight/control or approved Blender asset behavior is changed.
    if (new FormData(flightSetup).get('flightMap') === 'chongqing') {
      const rawHour=document.getElementById('skyTime')?.value||'auto';
      const hour=Number(rawHour);
      const time=rawHour==='auto'?'dusk':
        hour>=6&&hour<16?'day':
        hour>=16&&hour<20?'dusk':'night';
      const quality=document.getElementById('nyStreetQuality')?.value;
      const aircraft=new FormData(flightSetup).get('aircraft');
      // Chongqing has a separate renderer but keeps the SAME launcher craft.
      const query=new URLSearchParams({time,aircraft:
        aircraft==='seaplane'?'seaplane':aircraft||'jetpack'});
      if(quality==='0')query.set('quality','low');
      window.location.assign('./chongqing.html?'+query);
      return;
    }
    if (loading) return;
    if(gl.isContextLost()){
      menuError.textContent='Graphics are temporarily unavailable. Reload the page to retry.';
      menuError.hidden=false;
      return;
    }
    crash = null;
    crashOverlay.hidden = true;
    groundWarning.hidden = true;
    const settings = new FormData(flightSetup);
    const choice=settings.get('flightMap');
    if(choice==='random'){
      const pool=Object.values(FLIGHT_MAPS).filter(map=>map!==lastRandomMap);
      selectedMap=pool[Math.floor(Math.random()*pool.length)];
      lastRandomMap=selectedMap;
    }else{
      selectedMap=FLIGHT_MAPS[choice];
    }
    try {
      selectWorldProgram(selectedMap);
    } catch (error) {
      console.error(error);
      showGraphicsRecovery('The map shader could not start.');
      return;
    }
    if(selectedMap.dc)loadDcTextures();
    if(selectedMap.alaska)loadAlaskaPhotoTextures();
    else disposeAlaskaPhotoTextures();
    document.getElementById('wrap').classList.toggle('smooth-city', smoothScenery());
    resScale = smoothScenery()?cityScaleStart():startupScale;
    scaleCeiling = 1;
    fastFrames = slowFrames = 0;
    resizeTargets();
    const mode=settings.get('flightMode');
    selectedAircraft = settings.get('aircraft');
    if(selectedAircraft==='seaplane')prepareFloatplaneAsset();
    const waterStartRequested=selectedAircraft==='seaplane' && settings.has('waterStart');
    const runway = selectedAircraft==='fighter' && settings.has('runwayStart') ? selectedMap.runwayStart : null;
    loading = true;
    startFlight.disabled = true;
    titleOverlay.hidden = true;
    menuError.hidden = true;
    loadBar.style.width = '0%';
    document.getElementById('loadDestination').textContent = 'Loading ' + selectedMap.name;
    loadStep.textContent = 'Preparing terrain…';
    loadOverlay.classList.remove('done');

    let worker,workerUrl,usingFallback=false;
    function disposeWorker() {
      worker?.terminate();
      worker=null;
      if(workerUrl)URL.revokeObjectURL(workerUrl);
      workerUrl=null;
    }
    function cleanup(hideLoading=true) {
      disposeWorker();
      loading = false;
      startFlight.disabled = false;
      if(hideLoading)loadOverlay.classList.add('done');
    }
    function showError() {
      cleanup();
      menuError.textContent = 'Terrain failed to load. Choose a map and try again.';
      menuError.hidden = false;
      titleOverlay.hidden = false;
      startFlight.focus();
    }

    function receiveTerrain(data) {
      if (data.type === 'progress') {
        loadBar.style.width = data.pct + '%';
        loadStep.textContent = data.label;
        return;
      }
      if (data.type !== 'done') return;
      heightField = data.height;
      setupCityLots(data.parcels,data.ground);
      disposeSceneMesh(backgroundBuildings);
      disposeSceneMesh(landscapeDetails);
      backgroundBuildings = selectedMap.city ? buildCityBuildings(cityLots) : null;
      if(selectedMap.city && smoothScenery())prepareNycRealismAssets();
      landscapeDetails = smoothScenery() ? createLandscapeDetails() : null;
      prepareAlaskaLandmarks();
      prepareCoastalTraffic();
      prepareCityTraffic();
      createMapScenery();
      prepareSphereShow();
      prepareScenicViews();
      wreckFragments=[];
      refreshVehicleTargets();
      const mapImage=document.createElement('canvas');
      mapImage.width=mapImage.height=mapWidth;
      paintTerrainMap(mapImage,selectedMap,sampleGroundHeight);
      mapRaster=mapImage.getContext('2d').getImageData(0,0,mapWidth,mapWidth);
      if (terrainTex) gl.deleteTexture(terrainTex);
      terrainTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, terrainTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, MAP_SIZE, MAP_SIZE, 0, gl.RGBA, gl.UNSIGNED_BYTE, data.packed);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

      tourStops=mode==='tour' && selectedMap.tour ? (
        selectedMap.alaska && terrainOptions.alaskaDEM
          ? selectedMap.tour.map(stop=>({
              ...stop,pos:[stop.pos[0],
                Math.max(stop.pos[1],sampleGroundHeight(stop.pos[0],stop.pos[2])+9),
                stop.pos[2]]
            }))
          : selectedMap.tour
        ) : [];
      route=tourStops.length ? tourStops.map(stop=>stop.pos) : mode==='route'
        ? selectedMap.checkpoints.map(([x,z])=>[x,Math.max(40,sampleGroundHeight(x,z)+12),z])
        : [];
      gateIndex = 0;
      flightSeconds = 0;
      missionStatus.hidden = !route.length;
      missionStatus.classList.toggle('tour',Boolean(tourStops.length));
      grounded=Boolean(runway);
      waterborne=false;
      gearDown=grounded;
      armorLandingMode=false;
      brakes=false;
      // Explicit Alaska-only inspection viewpoint for glacier face art QA.
      // Normal free flight and existing mission spawns remain unchanged.
      const alaskaGlacierView=selectedMap.alaska && !runway &&
        new URLSearchParams(location.search).get('alaskaView')==='glacier';
      const alaskaHarborView=selectedMap.alaska && !runway &&
        new URLSearchParams(location.search).get('alaskaView')==='harbor';
      Object.assign(plane, {
        pos: runway ? [runway.x,sampleTerrainHeight(runway.x,runway.z)+GEAR_CLEARANCE,runway.z]
          : alaskaHarborView
            ? [88,Math.max(46,sampleGroundHeight(88,-559)+21),-559]
          : alaskaGlacierView
            ? [105,Math.min(CEILING-8,Math.max(44,sampleGroundHeight(105,245)+18)),245]
          : (selectedMap.alaska && terrainOptions.alaskaDEM
              ? [selectedMap.spawn[0],
                 Math.max(selectedMap.spawn[1],
                   sampleGroundHeight(selectedMap.spawn[0],selectedMap.spawn[2])+12),
                 selectedMap.spawn[2]]
              : [...(selectedMap.spawn || [30,40,-185])]),
        yaw: runway ? runway.yaw : alaskaHarborView ? 1.18 : 0,
        pitch: alaskaHarborView ? -0.08 : 0, bank: 0, rollAnim: 0,
        speed: grounded ? 0 : AIRCRAFT[selectedAircraft].cruise, afterburner: false
      });
      // A returning astronaut takes precedence over a new water-start preference.
      let resumedFromCosmos=false;
      // Resume the actual flight location after visiting the orbital/galactic scene.
      // Store only session-scoped state, never use an untrusted URL as coordinates.
      try {
        const save=JSON.parse(sessionStorage.getItem('patrol.cosmos.lastLaunch')||'null');
        const mapKey=Object.keys(FLIGHT_MAPS).find(key=>FLIGHT_MAPS[key]===selectedMap);
        if(save && save.map===mapKey && save.craft===selectedAircraft){
          sessionStorage.removeItem('patrol.cosmos.lastLaunch');
          if(save.playing && Array.isArray(save.position) && save.position.length===3 &&
              save.position.every(Number.isFinite)){
            const [sx,sy,sz]=save.position;
            const limit=(selectedMap.city?NYC_FLIGHT_RADIUS:FLIGHT_RADIUS)-4;
            if(Math.hypot(sx,sz)<limit){
              const safeY=Math.max(sampleGroundHeight(sx,sz)+3,
                Math.min(sy,CEILING-6));
              plane.pos=[sx,safeY,sz];
              plane.yaw=Number.isFinite(save.yaw)?save.yaw:0;
              plane.pitch=sy>=CEILING-6?0:clamp(save.pitch||0,-0.35,0.45);
              plane.bank=0;
              plane.speed=clamp(save.speed||AIRCRAFT[selectedAircraft].cruise,
                0,AIRCRAFT[selectedAircraft].boost);
              plane.vsi=0;
              grounded=false;
              gearDown=false;
              resumedFromCosmos=true;
            }
          }
        }
      } catch(error) {
        console.warn('Cosmos flight restoration skipped:',error);
      }
      if(waterStartRequested && !resumedFromCosmos &&
          !alaskaGlacierView && !alaskaHarborView){
        const waterSite=findFloatWaterStart();
        if(waterSite){
          plane.pos=[waterSite[0],WATER_H+FLOAT_CLEARANCE,waterSite[1]];
          plane.yaw=waterSite[2];
          plane.pitch=plane.bank=plane.rollAnim=0;
          plane.speed=0;
          plane.afterburner=false;
          plane.vsi=0;
          grounded=false;
          gearDown=false;
          waterborne=true;
          console.info('[PATROL] Water launch validated',selectedMap.name,waterSite);
        }else{
          console.warn('[PATROL] No safe floatplane launch water; starting in flight',selectedMap.name);
        }
      }

      renderGearStatus();
      updateMission(0);
      mouseNorm.x = mouseNorm.y = 0;
      mouseClient.x = window.innerWidth / 2;
      mouseClient.y = window.innerHeight / 2;
      leftDown = false;
      joyTouchId = null;
      joyKnob.style.transform = '';
      btnBoost.classList.remove('active');
      steeringKeys.clear();
      activeMissiles.length = trails.length = explosions.length = 0;
      cannonReadyAt=0;
      for (const impact of impacts) impact.age = -1;
      hardpointTimers.fill(0);
      updateMissilePips();
      aircraftName.textContent = AIRCRAFT[selectedAircraft].name;
      document.getElementById('btnCannon').textContent=selectedAircraft==='jetpack'?'LASER':'GUN';
      document.getElementById('btnGear').textContent=selectedAircraft==='jetpack'?'LAND':
        selectedAircraft==='seaplane'?'DOCK':'GEAR';
      for (const control of fighterControls) control.hidden =
        !['fighter','seaplane'].includes(selectedAircraft);
      // No cannon/missile controls on an unarmed civil floatplane.
      if(selectedAircraft==='seaplane'){
        document.getElementById('btnCannon').hidden=true;
        document.getElementById('btnFire').hidden=true;
      }
      if(selectedAircraft==='jetpack')for(const control of armorCompatibleControls)control.hidden=false;
      // Unarmed C185 must never show jet-missile or cannon hotkeys.
      for(const control of document.querySelectorAll('.missile-control'))
        control.hidden=selectedAircraft!=='fighter';
      for(const control of document.querySelectorAll('.gun-control'))
        control.hidden=!['fighter','jetpack'].includes(selectedAircraft);
      camInitialized = false;
      lastMapFrame = -Infinity;
      if (mapPanel.classList.contains('expanded')) toggleFlightMap();
      mapPanel.hidden = false;
      cleanup(false);
      loadStep.textContent='Checking graphics…';
      renderVerified=false;
      frameCheckPending=true;
      flying = true;
      glCanvas.focus({ preventScroll: true });
      resetFlightEnvironment();
      lastTime = null;
      flightFrame = requestAnimationFrame(loop);
    }

    if(selectedMap.city&&!Array.isArray(selectedMap.city.officialFootprints)){
      // Same-origin static snapshot; flight stays playable if an older
      // GitHub Pages cache hasn't received the geo-data file yet.
      try{
        loadStep.textContent='Loading NYC OTI building footprints…';
        const response=await fetch('./assets/nyc/official-financial-footprints.json');
        if(!response.ok)throw new Error('HTTP '+response.status);
        const snapshot=await response.json();
        if(snapshot.schema!=='patrol-nyc-oti-footprints-v1'||
           !Array.isArray(snapshot.footprints)||snapshot.footprints.length>200||
           !snapshot.footprints.every(row=>Array.isArray(row)&&row.length>=7&&
             Number.isFinite(row[1])&&Number.isFinite(row[2])&&
             Number.isFinite(row[3])&&Number.isFinite(row[4])&&
             Number.isFinite(row[5])&&Array.isArray(row[6])))
          throw new Error('Unrecognized NYC footprint snapshot');
        selectedMap.city.officialFootprints=snapshot.footprints;
      }catch(error){
        console.warn('[PATROL] NYC official footprint fallback:',error);
        selectedMap.city.officialFootprints=[];
      }
    }
    const terrainOptions={
      size:MAP_SIZE,span:MAP_SPAN,landmarks:selectedMap.landmarks,
      scale:terrainScaleFor(selectedMap),water:WATER_H,
      airfield:selectedMap.airfield,city:selectedMap.city,alaska:selectedMap.alaska,
      vegas:selectedMap.vegas,dc:selectedMap.dc,chongqing:selectedMap.chongqing
    };
    if(selectedMap.alaska &&
       new URLSearchParams(location.search).get('alaskaTerrain')!=='legacy'){
      // The baked public-domain heightmap is fetched once at level start,
      // decoded and handed to the Web Worker. If missing or unavailable,
      // automatically retain the original, fully playable fjord level.
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),6500);
      try {
        loadStep.textContent='Loading surveyed Tracy Arm elevations…';
        const {loadAlaskaDEM}=await import('./assets/alaska/usgs-dem.js');
        const dem=await loadAlaskaDEM(
          './assets/alaska/tracy-arm-3dep.json',fetch,controller.signal);
        const highest=dem.heights.reduce((max,value)=>Math.max(max,value),0);
        dem.verticalScale=Math.min(.04,
          (terrainScaleFor(selectedMap)*.90-WATER_H)/Math.max(highest,1));
        terrainOptions.alaskaDEM=dem;
        console.info('[PATROL] Alaska measured USGS terrain loaded',
          {bbox:dem.bbox,highest,verticalScale:dem.verticalScale});
      }catch(error){
        console.warn('[PATROL] Alaska USGS DEM fallback to legacy terrain:',error);
      }finally{
        clearTimeout(timer);
      }
    }
    function acceptTerrain(data) {
      if(gl.isContextLost()){
        cleanup();
        startFlight.disabled=true;
        return;
      }
      try {
        receiveTerrain(data);
      } catch(error) {
        console.error(error);
        showError();
      }
    }
    function generateWithoutWorker(event) {
      event?.preventDefault();
      if(usingFallback || !loading)return;
      usingFallback=true;
      disposeWorker();
      const steps=generateTerrain(terrainOptions);
      function runTerrainStep() {
        if(!loading)return;
        try {
          const {value,done}=steps.next();
          if(value)acceptTerrain(value);
          if(!done && loading)setTimeout(runTerrainStep,0);
        } catch(error) {
          console.error(error);
          showError();
        }
      }
      setTimeout(runTerrainStep,0);
    }
    try {
      workerUrl=URL.createObjectURL(new Blob([workerSrc],{type:'application/javascript'}));
      worker=new Worker(workerUrl);
      worker.onerror=generateWithoutWorker;
      worker.onmessageerror=generateWithoutWorker;
      worker.onmessage=({data})=>acceptTerrain(data);
      worker.postMessage(terrainOptions);
    } catch {
      generateWithoutWorker();
    }
  }
  flightSetup.addEventListener('submit', launchFlight);

  function tourGuidance(target) {
    const dx=target[0]-plane.pos[0],dy=target[1]-plane.pos[1],dz=target[2]-plane.pos[2];
    const heading=Math.atan2(dx,dz);
    const difference=Math.atan2(Math.sin(heading-plane.yaw),Math.cos(heading-plane.yaw));
    const turn=Math.round(Math.abs(difference)*180/Math.PI);
    const turnText=turn<=8?'STRAIGHT':(difference<0?'TURN LEFT ':'TURN RIGHT ')+turn+'°';
    const altitude=Math.round(Math.abs(dy));
    const altitudeText=altitude<=5?'HOLD ALT':(dy>0?'CLIMB ':'DESCEND ')+altitude+' u';
    return turnText+' · '+altitudeText;
  }

  function updateMission(dt) {
    const next=route[gateIndex];
    if (!next) return;
    flightSeconds+=dt;
    const distance=Math.hypot(next[0]-plane.pos[0],next[1]-plane.pos[1],next[2]-plane.pos[2]);
    if (dt>0 && distance<=(tourStops.length?24:15)) gateIndex++;
    const target=route[gateIndex];
    let status;
    if(tourStops.length){
      status=target
        ? (gateIndex+1)+' / '+route.length+' · '+tourStops[gateIndex].name+'\n'+
          Math.round(Math.hypot(target[0]-plane.pos[0],target[2]-plane.pos[2]))+' u · '+tourGuidance(target)
        : 'Scenic Tour complete · '+route.length+' / '+route.length;
    }else{
      status=target
        ? 'Checkpoint '+gateIndex+' / '+route.length+(dt>0?' · '+Math.round(Math.hypot(
          target[0]-plane.pos[0],target[1]-plane.pos[1],target[2]-plane.pos[2]))+' u':'')
        : 'Course complete · '+flightSeconds.toFixed(1)+' s';
    }
    if (missionStatus.textContent!==status) missionStatus.textContent=status;
  }

  // Uniform Locations
  function selectWorldProgram(map) {

    // Windows D3D11 compiler from building a single oversized pixel program.
    const flags=[map.airfield,map.alaska,map.vegas,map.dc,map.city].map(Boolean);
    const key=flags.join(',');
    if(worldVariant===key)return;
    const names=['uAlderValley','uAlaska','uVegas','uDc','uManhattan'];
    const shader=names.reduce((src,name,i)=>src.replace('uniform bool '+name+';', 'const bool '+name+' = '+flags[i]+';'),WORLD_FS);
    const program=createProgram(QUAD_VS,shader);

      if(!map.alaska)meshSource=meshSource.replace('uniform bool uAlaskaMesh;', 'const bool uAlaskaMesh = false;');
      if(!map.vegas)meshSource=meshSource.replace('uniform bool uSphereShow;', 'const bool uSphereShow = false;');
      if(!map.city)meshSource=meshSource.replace('uniform bool uTimesScreen;', 'const bool uTimesScreen = false;');
      if(graphicsCompat || !map.city)meshSource=meshSource.replace('uniform float uNyStreetQuality;', 'const float uNyStreetQuality = 0.0;');

  const paletteFlat = new Float32Array(36 * 3);

  // Main Simulation & Render Loop
  let lastTime = null;
  let slowFrames = 0;
  let lastScaleAdjustment = -Infinity;
  let trailAccum = 0;

  // Boats follow closed loops checked against the actual height field.
  let boats = [];
  let moose = [];
  let gulls = [];
  const boatWakes = new Float32Array(16);
  const boatLengths = new Float32Array(4);
  // Reused every frame; allocating these inside loop() created avoidable
  // garbage during flight and caused periodic GC hitches.
  const impactUniforms = new Float32Array(32);
  const impactTypeUniforms = new Float32Array(32);
  let sceneryTime = 0;
  const worldUp = [0,1,0];

  function routePose(route, phase) {
    return [
      route.x + Math.cos(phase)*route.rx,
      route.z + Math.sin(phase)*route.rz,
      Math.atan2(-Math.sin(phase)*route.rx, Math.cos(phase)*route.rz)
    ];
  }

  function setBoatPace(boat, phase, speed) {
    const lengths = [0];
    let prev = routePose(boat,0);
    const divisions = 96;
    for (let i=1;i<=divisions;i++) {
      const next = routePose(boat,i * Math.PI * 2 / divisions);
      lengths.push(lengths[i-1]+Math.hypot(next[0]-prev[0],next[1]-prev[1]));
      prev = next;
    }
    return { lengths, speed, start: lengths[Math.round(phase*divisions)] };
  }

  function prepareCoastalTraffic() {
    boats = [];
    moose = [];
    gulls = [];
    boatWakes.fill(0);
    sceneryTime = 0;
    const anchor=selectedMap.shipAnchor;
    if(!anchor)return;
    for (const [index, kind] of ['cruise','ferry','cargo','ferry'].entries()) {
      const size = SHIP_TYPES[kind];
      const preferred = { x: anchor[0] + (index%2)*185, z: anchor[1] + Math.floor(index/2)*225 };
      let best = null;
      let distance = Infinity;
      for (let z=-710;z<=710;z+=28) for (let x=-710;x<=710;x+=28) {
        const baseScore = Math.hypot(x-preferred.x,z-preferred.z);
        if (baseScore >= distance || boats.some(b=>Math.hypot(x-b.x,z-b.z)<148)) continue;
        const route = { x, z, rx: kind === 'cruise' ? 23 : 24, rz: 48+index*3 };
        const clearance = size.halfLength + 3;
        const safe = (px,pz) => {
          if (Math.hypot(px,pz)>=(selectedMap.city?NYC_FLIGHT_RADIUS:FLIGHT_RADIUS)-12 ||
              sampleGroundHeight(px,pz)>WATER_H) return false;
          if (selectedMap.alaska && Math.abs(pz-ALASKA_PLACES.harbor.z)<19 && px>43 && px<142) return false;
          if (!selectedMap.city) return true;
          const bridge=EAST_RIVER_BRIDGE;
          return Math.abs(pz-bridge.z)>bridge.halfWidth+4 ||
            (bridge.towers.every(tower=>Math.abs(px-bridge.x-tower)>5) && WATER_H+size.top<bridgeRoadHeight(px)-1.52);
        };
        const reaches = kind === 'cruise' ? [108,80,48] : [63+index*3,route.rz];
        for (const reach of reaches) {
          const score = baseScore + (reaches[0] - reach)*0.92;
          if (score >= distance) break;
          route.rz = reach;
          let clear = true;
          for (let step=0; step<36 && clear;step++) {
            const [px,pz,yaw] = routePose(route, step*Math.PI/18);
            const sx = Math.sin(yaw), sz = Math.cos(yaw);
            for (const along of [-clearance,0,clearance]) for (const across of [-size.halfWidth,0,size.halfWidth]) {
              if (!safe(px+sx*along+sz*across,pz+sz*along-sx*across)) clear = false;
            }
          }
          if (clear) {
            distance = score;
            best = { ...route };
            break;
          }
        }
      }
      if (best) {
        boats.push({ ...best, ...size, kind, phase: index*1.1,
          pace: setBoatPace(best,index*0.17,[5.4,7.0,4.5,6.3][index]) });
      }
    }

    // Keep flocks close to the arrival route and above nearby terrain.
    const spawn = selectedMap.spawn || [30,40,-185];
    const visibleBoats = [...boats].sort((a,b)=>
      Math.hypot(a.x-spawn[0],a.z-spawn[2])-Math.hypot(b.x-spawn[0],b.z-spawn[2]));
    for (const [flock, center] of visibleBoats.slice(0,2).entries()) {
      const radius = 32+flock*9;
      for (let i=0;i<5;i++) {
        const route = { x: center.x, z: center.z, rx: radius+i*2.1, rz: radius*0.69+i };
        let ground = WATER_H;
        for (let step=0;step<24;step++) {
          const [x,z] = routePose(route,step*Math.PI/12);
          ground = Math.max(ground,navigationSurface(x,z));
        }
        gulls.push({ ...route, phase: i*0.66+flock*0.51, rate: 0.40+flock*0.045,
          altitude: ground+13+i*1.65, stagger: i*1.41+flock*0.65 });
      }
    }

    if (!selectedMap.alaska) return;
    for (const [index,[x,z]] of [[52,-492],[-121,-388],[47,132]].entries()) {
      const route={x,z,rx:51,rz:33};
      let ceiling=28;
      for(let i=0;i<30;i++){
        const [east,north]=routePose(route,i*Math.PI/15);
        ceiling=Math.max(ceiling,navigationSurface(east,north));
      }
      gulls.push({...route,eagle:true,rate:0.26,phase:0.82+index*1.74,
        altitude:ceiling+10+index*2.5,stagger:1.33+index*0.97});
    }
    const meadows = [[-126,-465],[128,-370],[-155,-215],[154,-55],[125,135]];
    for (const [index,[east,north]] of meadows.entries()) {
      for (let i=0;i<3;i++) {
        const x = east + (i-1)*8;
        const z = north + (i%2)*12;
        if (![[-7,0],[7,0],[0,-7],[0,7],[0,0]].every(([dx,dz])=>{
          const y=sampleGroundHeight(x+dx,z+dz);
          return y>WATER_H+1.4 && y<34;
        })) continue;
        moose.push({x,z,rx:6,rz:6,phase:index+i*2,rate:0.19+i*0.025});
      }
    }
  }

  function sceneryPose(actor, time) {
    if (!actor.pace) return routePose(actor, actor.phase+actor.rate*time);
    const { lengths, start, speed } = actor.pace;
    const last = lengths.length - 1;
    const distance = (start+time*speed) % lengths[last];
    let lo = 0, hi = last;
    while (hi-lo > 1) {
      const mid = (lo+hi) >> 1;
      if (lengths[mid] <= distance) lo = mid;
      else hi = mid;
    }
    const fraction = (distance-lengths[lo])/(lengths[hi]-lengths[lo]);
    return routePose(actor,(lo+fraction)*Math.PI*2/last);
  }

  function updateBoatWakes() {
    boatWakes.fill(0);
    for (const [i,boat] of boats.entries()) {
      if(boat.wreck)continue;
      const [x,z,yaw] = sceneryPose(boat,sceneryTime);
      const length = boat.halfLength*0.96;
      boatWakes.set([x-Math.sin(yaw)*length,z-Math.cos(yaw)*length,yaw,boat.halfWidth],i*4);
      boatLengths[i]=boat.halfLength;
    }
  }

  function gullPose(gull, time) {
    const [x,z,yaw] = sceneryPose(gull,time);
    const phase = time*1.33+gull.stagger;
    const flap = gull.eagle
      ? 0.12+Math.sin(time*10.3+gull.stagger)*0.44*Math.max(0,Math.sin(phase))
      : Math.sin(time*15.4+gull.stagger)*0.57*(0.20+0.80*Math.max(0,Math.sin(phase)));
    const altitude = gull.altitude + 1.9*Math.sin(time*0.92+gull.stagger);
    return { pos: [x,altitude,z], yaw, flap };
  }

  function drawSeagulls(drawMesh) {
    for (const gull of gulls) {
      const { pos, yaw, flap } = gullPose(gull,sceneryTime);
      if (Math.hypot(pos[0]-camPos[0],pos[2]-camPos[2]) > 390) continue;
      const front = [Math.sin(yaw),0,Math.cos(yaw)];
      const right = [front[2],0,-front[0]];
      const bird=gull.eagle?eagleModels:gullModels;
      const size=gull.eagle?1.48:1;
      drawMesh(bird.body,mat4FromBasis(pos,right,worldUp,front,size));
      for (const [index,wing] of bird.wings.entries()) {
        const angle = (index === 0 ? -1 : 1)*flap;
        const across = right.map((v,i)=>v*Math.cos(angle)+worldUp[i]*Math.sin(angle));
        const wingUp = worldUp.map((v,i)=>v*Math.cos(angle)-right[i]*Math.sin(angle));
        drawMesh(wing,mat4FromBasis(pos,across,wingUp,front,size));
      }
    }
  }

  const bowWaveMeshes=(()=>{
    const water=createTriangleMesh(),foam=createTriangleMesh(),spray=createTriangleMesh();
    const at=(side,t,layer)=>{
      const amp=Math.pow(Math.sin(Math.PI*t),0.82);
      const z=1.04-t*1.43;
      const x=side*(0.30+t*1.26+(layer===0?0:layer===1?0.15:0.42)*amp);
      const y=layer===1?(0.21+Math.cos(t*1.4)*0.87)*amp:0;
      return [x,y,z];
    };
    for(const side of [-1,1])for(let i=0;i<14;i++){
      const a=i/14,b=(i+1)/14;
      water.addQuad(at(side,a,0),at(side,b,0),at(side,b,1),at(side,a,1),[0.19,0.39,0.45]);
      water.addQuad(at(side,a,1),at(side,b,1),at(side,b,2),at(side,a,2),[0.26,0.48,0.53]);
      if(i%4!==1){
        const aa=at(side,a,1),bb=at(side,b,1);
        const tail=p=>[p[0]+side*0.09,p[1]*0.81+0.03,p[2]+0.017];
        foam.addQuad([aa[0],aa[1]+0.035,aa[2]],[bb[0],bb[1]+0.035,bb[2]],tail(bb),tail(aa),
          i%3===0?[0.78,0.91,0.94]:[0.57,0.76,0.81]);
      }
    }
    addModelBox(spray.addQuad,0,0,0,0.08,0.15,0.08,[0.74,0.87,0.91]);
    return {water:water.upload(),foam:foam.upload(),spray:spray.upload()};
  })();

  function drawHullWash(drawMesh,boat,x,z,front,right){
    if(Math.hypot(x-camPos[0],z-camPos[2])>226)return;
    const width=boat.halfWidth,length=boat.halfLength;
    const lift=(0.62+Math.min(1.1,width*0.13))*(1.0+0.12*Math.sin(2.0*sceneryTime+boat.phase));
    const transform=mat4FromBasis([x,WATER_H+0.027,z],right.map(v=>v*width),
      [0,lift,0],front.map(v=>v*length));
    drawMesh(bowWaveMeshes.water,transform);
    drawMesh(bowWaveMeshes.foam,transform);
    for(const side of [-1,1])for(let i=0;i<4;i++){
      const t=(sceneryTime*(0.72+0.14*i)+boat.phase+i*0.27)%1;
      const across=side*width*(0.67+t*0.70);
      const along=length*(0.83-i*0.16-t*0.30);
      const p=[x+right[0]*across+front[0]*along,WATER_H+0.24+Math.sin(Math.PI*t)*lift*(0.70+i*0.11),
        z+right[2]*across+front[2]*along];

  const RESCUE_ANCHORS=[[-7,83,-117],[23,47,-29],[65,72,-46],[77,49,-116]];
  const RESCUE_STAGE=[40,28,-70];
  const RESCUE_FORMS=['Ember','Tide','Crystal','Dust'];
  let rescueStart=null,rescueForm=0;

  function triggerSkylineRescue(){
    if(!flying||crash||!selectedMap.city)return;
    rescueStart=sceneryTime;
    rescueForm=(rescueForm+1)%RESCUE_FORMS.length;
  }

  function skylineRescueFrame(time){
    const automatic=Math.max(0,time-11);
    let age=automatic%73,type=Math.floor(automatic/73)%RESCUE_FORMS.length;
    if(time<11)age=-1;
    if(rescueStart!==null && time-rescueStart<31){
      age=time-rescueStart;
      type=rescueForm;
    }
    return {age,type,active:age>=0&&age<22};
  }

  function skylineRescuerPose(time,event){
    const speed=0.155,swing=time*speed;
    const leg=Math.floor(swing)%RESCUE_ANCHORS.length;
    const a=RESCUE_ANCHORS[leg],b=RESCUE_ANCHORS[(leg+1)%RESCUE_ANCHORS.length];
    const t=swing%1,drop=Math.sin(Math.PI*t);
    const variation=Math.sin(Math.floor(swing)*17.31+1.8);
    let center=a.map((value,i)=>lerp(value,b[i],t)+(i===1?-4-(15.8+4.2*variation)*drop:
      (i===0?2.8:-3.4)*variation*drop));
    if(event.active){
      const progress=clamp((event.age-4)/4,0,1)*(1-clamp((event.age-16)/6,0,1));
      center=center.map((value,i)=>lerp(value,RESCUE_STAGE[i]+(i===0?15*Math.sin(time*1.34):i===1?24:15*Math.cos(time*1.34)),progress));
    }
    return {center,anchor:t<0.5?a:b,tangent:v3Norm([b[0]-a[0],0,b[2]-a[2]])};
  }

  const skylineMeshes=(()=>{
    const body=createTriangleMesh(),trim=createTriangleMesh(),tether=createTriangleMesh();

    shape(trim,0,1.65,0.138,0.23,0.105,0.063,teal);
    shape(trim,0,1.0,0.188,0.48,0.064,0.07,teal);
    const bodyBeam=(a,b,w)=>addRideBeam(body.addQuad,a,b,w,carbon);
    bodyBeam([-0.21,1.34,0],[-0.41,1.67,0.11],0.16);
    bodyBeam([0.21,1.33,0],[0.43,1.17,0.27],0.17);
    bodyBeam([-0.11,0.88,0],[-0.19,0.41,-0.15],0.17);

    addRideBeam(tether.addQuad,[0,0,0],[0,0,1],0.023,white);
    shape(drone,0,0,0,0.78,0.27,0.55,[0.34,0.42,0.49]);
    for(const side of [-1,1])for(const z of [-0.33,0.33]){
