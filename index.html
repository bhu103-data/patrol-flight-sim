<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PATROL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0e0b16;font-family:'Share Tech Mono',monospace;color:#f5d5b8;}
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0b0912;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #glCanvas{image-rendering:auto;}
  #hudCanvas{pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges;}
  #flightMap{position:absolute;top:14px;left:14px;z-index:16;width:min(190px,37vw);
    padding:6px;background:rgba(14,10,24,.88);border:1px solid #a97458;color:#ffd699;}
  #flightMap.expanded{width:min(440px,70vw,68vh);}
  #flightMapCanvas{position:static;width:100%;height:auto;aspect-ratio:1;image-rendering:pixelated;}
  #mapToggle{width:100%;padding:4px;background:#26192e;border:1px solid #a97458;
    color:inherit;cursor:pointer;font:inherit;}
  #boundaryStatus{display:block;text-align:center;padding-top:4px;font-size:clamp(10px,2vw,12px);}
  #flightMap.warning{border-color:#ffad69;color:#ffcf8c;}
  #flightMap.guarding{border-color:#ff795e;color:#ffb2a1;}
  [hidden]{display:none !important;}
  #wrap.smooth-city canvas{image-rendering:auto;}
  .smooth-city #statusBar,.smooth-city #flightMap,.smooth-city .touch-btn{
    font-family:system-ui,sans-serif;border-color:#b9d7e479;background:#172b38d6;color:#eef7fa;
    border-radius:7px;box-shadow:0 2px 12px #0a223343;
  }
  .smooth-city #mapToggle,.smooth-city #flightMenuBtn,.smooth-city #audioBtn{
    font-family:inherit;border-color:#96bac988;background:#234151;color:#eff7fb;border-radius:4px;
  }
  .smooth-city .key-pill{border-color:#aac6d377;background:#142530;color:#ebf7fc;}
  .smooth-city #missionStatus{border-color:#a4c3d27d;background:#162936d9;color:#eff7fb;}
  #sphereShowControl{display:inline-flex;align-items:center;flex-wrap:wrap;gap:3px 6px;font-size:11px;}
  #sphereShowControl select{font:inherit;border:1px solid #96bac988;border-radius:4px;
    background:#234151;color:#eff7fb;padding:3px 5px;}
  #sphereStatus{color:#daeeff;white-space:normal;max-width:31ch;}
  @media(max-width:620px){#sphereShowControl .desktop-only{display:none;}#sphereStatus{font-size:10px;}}
  #skySettings{position:absolute;right:12px;top:12px;z-index:18;display:grid;justify-items:end;gap:6px;
    font:13px system-ui,sans-serif;color:#eef5ff;}
  #skySettings :is(button,select){font:inherit;color:inherit;background:#243a50;border:1px solid #a8c6dc90;border-radius:4px;padding:5px 7px;}
  #skyPanel{display:grid;grid-template-columns:auto minmax(120px,1fr);align-items:center;gap:6px 10px;
    padding:10px;background:#142334eb;border:1px solid #a8c6dc90;border-radius:6px;min-width:233px;}
  #skyStatus{grid-column:1/-1;color:#e6d4ab;font-variant-numeric:tabular-nums;}
  #hotelViewButton,#bridgeShortcutButton,#centralParkShortcutButton,#hotelViews button,#hotelViews select{
    border:1px solid #96bac988;border-radius:4px;background:#234151;color:#eff7fb;
    padding:5px 8px;font:inherit;cursor:pointer;
  }
  #hotelViews{
    position:absolute;top:14px;left:14px;z-index:17;width:min(288px,calc(100vw - 28px));
    display:grid;grid-template-columns:auto minmax(90px,1fr);align-items:center;gap:7px 10px;
    padding:10px 12px;color:#f2f8fa;font:12px system-ui,sans-serif;background:#172b38e8;
    border:1px solid #b9d7e479;border-radius:7px;
  }
  #hotelViews header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:6px;}
  #hotelViews :is(select,input){width:100%;min-width:0;}
  #hotelViews input{accent-color:#e4b96d;}
  #hotelDetail,#rideViewButton,#rescueViewButton,#dcTourButton{grid-column:1/-1;}
  #hotelDetail{color:#d7e9ef;}
  #rideViewButton[aria-pressed="true"]{color:#1c2430;background:#f3c982;border-color:#f3c982;}
  .hotel-view :is(#hudCanvas,#flightMap,#missionStatus,#touchControls,#groundWarning),
  .hotel-view #statusBar .bar-left > :not(#sphereShowControl){display:none;}
  @media(max-width:620px){#hotelViews{padding:7px 9px;gap:5px 7px;}}
  #missionStatus.tour{white-space:pre-line;line-height:1.45;font-variant-numeric:tabular-nums;}
  .smooth-city #boundaryStatus{color:inherit;}
  #titleOverlay{position:absolute;inset:0;display:grid;justify-items:center;align-items:safe center;overflow:auto;padding:16px;
    background:radial-gradient(ellipse at 50% 25%,#392140ed,#100b18f5 72%);z-index:20;}
  .title-badge{width:min(820px,100%);border:1px solid #e88d4f;background:#181123;
    padding:clamp(15px,4vw,30px);box-shadow:0 14px 44px #0009;}
  h1.game-title{font-family:'Press Start 2P',monospace;font-size:clamp(24px,5vw,42px);
    letter-spacing:4px;color:#ffd699;text-shadow:3px 3px #8a2c38;margin:0 0 20px;}
  .flight-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px;}
  .flight-options fieldset{min-width:0;border:1px solid #674863;padding:7px;}
  .flight-options .map-options{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}
  .map-options .map-card{border:1px solid #674863;margin:0;}
  .map-options .map-card:has(input:checked){border-color:#ffb677;}
  .map-options .map-card:has(input:focus-visible){outline:2px solid #ffd699;outline-offset:2px;}
  .map-card :is(canvas,img){position:static;width:100%;height:auto;aspect-ratio:1.75;object-fit:cover;
    display:block;background:#203552;margin-bottom:5px;image-rendering:auto;}
  .map-card small{margin-left:0;}
  .flight-options .random-map{grid-column:1/-1;display:flex;gap:11px;align-items:center;}
  .random-map-icon{display:grid;place-items:center;width:42px;height:35px;
    border:1px solid #856280;background:#322037;color:#ffcf98;font-size:24px;line-height:1;}
  #crashOverlay{position:absolute;inset:0;display:grid;place-items:center;z-index:21;
    background:#120b19aa;padding:15px;}
  #crashOverlay div{width:min(360px,100%);padding:20px;border:1px solid #ff996a;background:#201523;}
  #crashOverlay p{margin:10px 0 18px;}
  #crashOverlay button{background:#f4a259;border:1px solid #ffc690;padding:8px;color:#181123;font:inherit;cursor:pointer;}
  #groundWarning{position:absolute;z-index:13;top:48px;left:50%;transform:translateX(-50%);
    color:#fff2d5;background:#7a2830;padding:5px 10px;pointer-events:none;white-space:nowrap;}
  @media(max-width:620px){
    .flight-options .map-options{grid-template-columns:repeat(2,minmax(0,1fr));}
    .map-card :is(canvas,img){aspect-ratio:2.3;}
    #groundWarning{top:110px;left:auto;right:14px;transform:none;}
  }
  .flight-options legend{color:#ffd699;padding:0 5px;}
  .flight-options label{display:block;margin:3px 0;padding:7px;background:#271a32;cursor:pointer;}
  .flight-options label:has(input:checked){background:#573346;color:#fff1db;}
  .flight-options input{accent-color:#f4a259;margin-right:4px;}
  .flight-options small{display:block;color:#e9bea5;margin:3px 0 0 20px;}
  #startFlight,#flightMenuBtn{cursor:pointer;border:1px solid #e88d4f;color:#1a1325;
    background:#f4a259;font:inherit;padding:6px 10px;}
  #startFlight{width:100%;padding:10px;font-weight:bold;}
  #menuError{color:#ffb2a1;margin-bottom:8px;}
  #missionStatus{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:12;
    pointer-events:none;text-align:center;padding:5px 8px;background:#161020da;color:#ffe1ad;
    font-size:clamp(10px,2vw,14px);border:1px solid #a97458;max-width:40vw;}
  @media(max-width:620px){
    .flight-options{gap:6px;}
    #statusBar .bar-right{gap:4px;}
    #missionStatus{top:60px;left:auto;right:14px;transform:none;}
  }
  #statusBar{
    position:absolute;left:12px;right:12px;bottom:10px;z-index:15;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(14,10,24,0.74);border:1px solid rgba(232,141,79,0.38);
    padding:6px 12px;font-size:12px;color:#f3cfa8;backdrop-filter:blur(2px);
  }
  .bar-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .bar-right{display:flex;align-items:center;gap:12px;}
  .key-pill{
    display:inline-block;padding:1px 5px;border:1px solid rgba(244,162,89,0.55);
    color:#ffd699;font-size:11px;margin-right:3px;background:rgba(42,26,56,0.65);
  }
  .missile-pips{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;margin-left:4px;}
  .pip{width:7px;height:12px;background:#f4a259;border:1px solid #ffd699;display:inline-block;}
  .pip.empty{background:rgba(255,255,255,0.08);border-color:rgba(244,162,89,0.3);}
  #audioBtn{
    background:rgba(36,22,48,0.9);border:1px solid #e88d4f;color:#ffd699;
    font-family:'Share Tech Mono',monospace;font-size:12px;padding:4px 10px;cursor:pointer;
    letter-spacing:1px;
  }
  #audioBtn:hover{background:#e88d4f;color:#140e22;}
  #loadOverlay{
    position:absolute;inset:0;z-index:30;background:#110c1d;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  }
  #loadOverlay.done{display:none;}
  .load-label{font-family:'Press Start 2P',monospace;font-size:12px;color:#f4a259;letter-spacing:2px;}
  .load-bar-outer{width:280px;max-width:80vw;height:16px;border:2px solid #e88d4f;padding:2px;background:#1b132b;}
  .load-bar-inner{height:100%;width:0%;background:#f4a259;transition:width 0.08s linear;}
  #touchControls{
    position:absolute;inset:0;pointer-events:none;z-index:14;display:none;
  }
  @media (pointer:coarse),(max-width:820px){
    #touchControls{display:block;}
    .desktop-only{display:none;}
  }
  .touch-btn{
    position:absolute;pointer-events:auto;background:rgba(20,14,34,0.65);
    border:2px solid rgba(244,162,89,0.6);color:#ffd699;font-family:'Press Start 2P',monospace;
    font-size:10px;display:flex;align-items:center;justify-content:center;border-radius:6px;
    touch-action:none;
  }
  .touch-btn:active,.touch-btn.active{background:rgba(244,162,89,0.45);color:#fff;}
  #btnCam{top:14px;right:14px;width:76px;height:38px;}
  #btnRoll{bottom:54px;right:16px;width:68px;height:44px;}
  #btnBoost{bottom:54px;right:92px;width:74px;height:44px;}
  #btnFire{bottom:106px;right:16px;width:74px;height:44px;}
  #btnCannon{bottom:106px;right:98px;width:72px;height:44px;}
  #btnGear{bottom:158px;right:16px;width:74px;height:44px;}
  #btnBrake{bottom:158px;right:98px;width:72px;height:44px;}
  .runway-choice{display:block;margin-bottom:10px;font-size:13px;color:#f5d5b8;}
  .runway-choice input{margin-right:6px;accent-color:#f4a259;}
  #joyZone{
    position:absolute;left:16px;bottom:54px;width:112px;height:112px;border-radius:50%;
    border:2px dashed rgba(244,162,89,0.45);background:rgba(20,14,34,0.35);pointer-events:auto;touch-action:none;
  }
  #joyKnob{
    position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;
    border-radius:50%;background:rgba(244,162,89,0.55);border:2px solid #ffd699;pointer-events:none;
  }
</style>
</head>

  }
  const NYC_FOCUS_ZONES = [
    [13,4,118,168],       // Times Square / Broadway / 7th Avenue
    [-7,-117,78,115],     // Empire State Building
    [65,-46,64,93],       // Chrysler Building / Grand Central area
    [-30,-180,72,108],    // Flatiron

  function nycDetailBand(x,z){
    const distance=nycHeroDistance(x,z);

    // One World Trade / Tribeca skyline; no discontinuous circular islands.
    // Only the NYC map uses this rule. Ocean itself remains geometry-free.
    const start=NYC_HERO_ROUTE.spawn,end=[-43,-234];
    const dx=end[0]-start[0],dz=end[1]-start[1];
    const t=Math.max(0,Math.min(1,
      ((x-start[0])*dx+(z-start[1])*dz)/(dx*dx+dz*dz)));
    const lateral=Math.hypot(x-(start[0]+t*dx),z-(start[1]+t*dz));
    if(z>-558 && z<-215 && lateral<69+91*t)return 3;
    // Brooklyn Bridge close view needs the same near-field streets and

    if(x>205 && x<438 && z>-410 && z<-194 &&
       Math.min(Math.hypot(x-285,z+330),
         Math.hypot(x-372,z+285))<72)return 3;
    let band=distance<NYC_HERO_ROUTE.skylineRadius?1:0;
    // Connect skyline strips between landmark zones at low geometric cost.

      const dx=x-zone[0],dz=z-zone[1],d2=dx*dx+dz*dz;
      if(d2<zone[2]*zone[2])return 2;
      if(d2<zone[3]*zone[3])band=1;
    }

  }

    name:'Brooklyn Waterfront Expressway',

  function expresswayRoute(design,points=design.points){
    const anchors=points.map(([x,z,alt])=>[x,z,
      (design===CITY_EXPRESSWAY?STREET_Y:sampleTerrainHeight(x,z)+0.27)+alt]);
    const result=[anchors[0]];
    const distance=(p,q)=>Math.hypot(q[0]-p[0],q[1]-p[1]);
    const point=(p,q,t)=>p.map((value,i)=>lerp(value,q[i],t));
    const extend=q=>{
      const p=result.at(-1),steps=Math.ceil(distance(p,q)/3.6);
      for(let i=1;i<=steps;i++)result.push(point(p,q,i/steps));
    };
    for(let i=1;i<anchors.length-1;i++){
      const a=anchors[i-1],b=anchors[i],c=anchors[i+1];
      const radius=Math.min(5.8,distance(a,b)*0.43,distance(b,c)*0.43);
      const entry=point(b,a,radius/distance(a,b)),exit=point(b,c,radius/distance(b,c));
      extend(entry);
      for(let j=1;j<=4;j++){
        const t=j/4;
        result.push(point(point(entry,b,t),point(b,exit,t),t));
      }
    }
    extend(anchors.at(-1));
    return result;
  }

  function renderExpressway(design,{box,lamp,addQuad,lightQuad,solidAt,place}){
    const road=[0.28,0.30,0.32], steel=[0.42,0.46,0.47], lampColor=[1.0,0.84,0.58];

    const main=expresswayRoute(design),ramp=expresswayRoute(design,design.ramp);

      const width=isRamp?5.0:8.1;
      const perpendicular=(a,b)=>{
        const dx=b[0]-a[0],dz=b[1]-a[1],length=Math.hypot(dx,dz);
        return [dz/length,-dx/length];
      };
      const sides=path.map((p,i)=>{
        const n=perpendicular(path[Math.max(0,i-1)],path[Math.min(path.length-1,i+1)]);
        const next=i<path.length-1?perpendicular(p,path[i+1]):n;
        const amount=Math.max(0.83,n[0]*next[0]+n[1]*next[1]);
        return n.map(value=>value/amount);
      });
      const edge=(i,offset,lift=0)=>[path[i][0]+sides[i][0]*offset,path[i][2]+lift,path[i][1]+sides[i][1]*offset];
      let distance=0,nextPole=12;
      for(let i=1;i<path.length;i++){

        addQuad(edge(j,width/2),edge(j,-width/2),edge(i,-width/2),edge(i,width/2),road);
        addQuad(edge(i,width/2,-0.49),edge(i,-width/2,-0.49),edge(j,-width/2,-0.49),edge(j,width/2,-0.49),steel);
        for(const sign of [-1,1]){
          const r=sign*width/2;
          addQuad(edge(j,r),edge(i,r),edge(i,r,-0.49),edge(j,r,-0.49),steel);
          const line=r-sign*0.39;
          addQuad(edge(j,line+0.04,0.035),edge(j,line-0.04,0.035),

        }
        distance+=Math.hypot(b[0]-a[0],b[2]-a[2]);
        if(distance>=nextPole){
          nextPole+=19;
          const p=edge(i,width/2-0.19);
          box(p[0],p[1]+1.56,p[2],0.126,3.12,0.126,steel);
          lamp(p[0]-sides[i][0]*0.26,p[1]+3.19,p[2]-sides[i][1]*0.26,0.43,0.133,0.29,lampColor);
          const rise=mid[1]-base-0.48;
          if(rise>2.2 && (design!==CITY_EXPRESSWAY||Math.abs(mid[2]-EAST_RIVER_BRIDGE.z)>7)){

      vec3 dayColor=mix(vec3(0.64,0.77,0.86),vec3(0.21,0.47,0.73),pow(up,0.53));
      vec3 nightColor=mix(vec3(0.085,0.10,0.17),vec3(0.017,0.026,0.065),sqrt(up));
      if(uVegas)nightColor+=vec3(0.14,0.083,0.075)*pow(1.0-up,3.0);
      vec3 horizon=mix(nightColor,dayColor,day);
      vec3 glow=mix(vec3(0.20,0.12,0.27),vec3(0.89,0.37,0.17),pow(sunAmt,5.0));
      horizon=mix(horizon,glow,twilight*(1.0-smoothstep(0.0,0.55,up))*0.68);
      vec3 overcast=mix(vec3(0.12,0.15,0.22),vec3(0.58,0.65,0.73),day);
      horizon=mix(horizon,overcast,cloud*0.68+uAtmosphere.w*0.20);
      vec2 stars=vec2(atan(rd.z,rd.x)*126.0,asin(clamp(rd.y,-1.0,1.0))*164.0);
      float seed=hash12(floor(stars));
      vec2 center=vec2(0.35+0.27*seed,0.28+0.32*hash12(floor(stars)+19.0));
      float star=(1.0-smoothstep(0.07,0.15,length(fract(stars)-center)))*step(0.972,seed);
      horizon+=vec3(0.66,0.74,0.92)*star*(1.0-day)*(1.0-cloud)*smoothstep(0.01,0.20,rd.y);
      if(uAlaska)horizon+=alaskaAurora(rd);
      float openness=(1.0-cloud*0.88)*(1.0-uAtmosphere.w*0.7);
      horizon+=vec3(1.0,0.62,0.30)*pow(sunAmt,22.0)*openness*smoothstep(-0.08,0.04,uSun.y)*0.40;
      float solarRadius=0.0125+0.0025*(1.0-smoothstep(0.02,0.24,uSun.y));
      float solarEdge=1.0-smoothstep(0.94,1.07,sqrt(max(0.0,2.0*(1.0-sunAmt)))/solarRadius);
      float solarCenter=sqrt(clamp(1.0-(2.0*(1.0-sunAmt))/(solarRadius*solarRadius),0.0,1.0));
      vec3 solarTint=mix(vec3(1.0,0.49,0.22),vec3(1.0,0.96,0.85),smoothstep(0.015,0.28,uSun.y));
      solarTint*=mix(0.82,1.0,solarCenter);
      horizon=mix(horizon,solarTint,solarEdge*openness*smoothstep(-0.018,0.025,uSun.y));
      float moonAmt=dot(rd,uMoon);
      if(moonAmt>0.99958 && uMoon.y>-0.025){
        vec3 tangent=normalize(cross(vec3(0.0,1.0,0.0),uMoon+vec3(0.00001,0.0,0.0)));
        vec3 upMoon=cross(uMoon,tangent);
        vec2 uv=vec2(dot(rd,tangent),dot(rd,upMoon))/0.026;
        float rr=dot(uv,uv);
        vec3 normal=tangent*uv.x+upMoon*uv.y-uMoon*sqrt(max(0.0,1.0-rr));
        float lit=smoothstep(-0.06,0.095,dot(normal,uSun));
        float cloudsOfRock=vnoise(uv*3.4)*0.67+vnoise(uv*7.5+3.6)*0.33;
        float maria=smoothstep(0.42,0.65,cloudsOfRock+0.16*(1.0-smoothstep(0.0,0.31,length(uv-vec2(-0.28,0.28)))));
        float crater=length(uv-vec2(0.33,-0.41));
        float craterRing=(1.0-smoothstep(0.021,0.066,abs(crater-0.13)))*0.16;
        float craterBowl=(1.0-smoothstep(0.065,0.137,crater))*0.17;
        float texture=0.70+0.16*vnoise(uv*28.0)-0.30*maria+craterRing-craterBowl;
        float rim=1.0-smoothstep(0.89,1.0,rr);
        vec3 lunarTint=mix(vec3(0.94,0.74,0.51),vec3(0.84,0.90,0.98),smoothstep(0.025,0.33,uMoon.y));
        horizon=mix(horizon,lunarTint*texture*(0.12+lit*0.95),
          rim*openness*mix(1.0,0.58,day)*smoothstep(-0.018,0.025,uMoon.y));
      }
      return horizon;
    }

    vec3 applyFog(vec3 col, vec3 rd, float dist) {
      float fogAmt=1.0-exp(-dist*(0.0008+0.009*uAtmosphere.w));
      float sunward=max(dot(rd,uSun),0.0);
      vec3 haze=mix(vec3(0.084,0.10,0.17),vec3(0.64,0.73,0.79),uAtmosphere.x);
      haze=mix(haze,vec3(0.42,0.29,0.35)+vec3(0.28,0.08,0.0)*sunward,uAtmosphere.y*0.58);
      return mix(col,haze,min(fogAmt,0.96));
    }

    void main() {
      vec2 ndc = vUv * 2.0 - 1.0;
      vec3 rd = normalize(uCamFwd + ndc.x * uAspect * uFovTan * uCamRight + ndc.y * uFovTan * uCamUp);
      vec3 ro = uCamPos;
      float pixelAngle = abs(dFdy(vUv.y)) * 2.0 * uFovTan;

      vec3 col = getSky(rd);
      float hitDist = 860.0;
      bool hitSurface = false;

      // Raymarch terrain & water
      if (rd.y < 0.18) {
        float t = 1.0;
        float maxT = 820.0;
        if (ro.y > uTerrainScale + 2.0 && rd.y < -0.005) {
          t = max(1.0, (ro.y - (uTerrainScale + 1.5)) / (-rd.y));
        }
        float prevT = t;
        for (int i = 0; i < 118; i++) {
          vec3 p = ro + rd * t;
          float th = terrainHeight(p.xz);
          float surfH = max(th, WATER_H);
          if (p.y <= surfH) {
            // Binary refinement
            float a = prevT, b = t;
            for (int j = 0; j < 5; j++) {
              float m = 0.5 * (a + b);
              vec3 mp = ro + rd * m;
              float mh = max(terrainHeight(mp.xz), WATER_H);
              if (mp.y <= mh) b = m; else a = m;
            }
            hitDist = 0.5 * (a + b);
            hitSurface = true;
            break;
          }
          prevT = t;
          float hDiff = p.y - surfH;
          float stride = max(0.65, hDiff * 0.42 + t * 0.011);
          if (naturalLight() && p.y < uTerrainScale + 1.0) stride = min(stride, 10.0);
          t += stride;
          if (t > maxT) break;
        }
      }

      if(hitSurface && hasOceanCascades() && rd.y < -0.08){
        vec2 flatXZ=(ro+rd*hitDist).xz;
        float depth=WATER_H-terrainHeight(flatXZ);
        if(depth>0.12){
          float pSize=pixelAngle*hitDist/max(abs(rd.y),0.10);
          float flatT=(WATER_H-ro.y)/rd.y;
          float waveT=flatT;
          for(int i=0;i<2;i++){
            vec2 q=(ro+rd*waveT).xz;
            float h=oceanHeight(q,max(WATER_H-terrainHeight(q),0.0),pSize);
            waveT=flatT+clamp(h/rd.y,-3.2,3.2);
          }
          if(terrainHeight((ro+rd*waveT).xz)<WATER_H-0.12){
            hitDist=mix(hitDist,waveT,smoothstep(0.08,0.19,-rd.y));
          }
        }
      }
      if (hitSurface) {
        vec3 p = ro + rd * hitDist;
        vec4 mData = sampleMap(p.xz);
        float th = mData.r * uTerrainScale;
        float biome = mData.g;
        float conifer = mData.b;
        float bakedShade = mData.a / 0.85;

        // Cloud shadow on ground/water
        vec2 cloudProj = p.xz + sunDirection().xz * ((cloudBase() - p.y) / max(sunDirection().y, 0.1));
        float cShad = 1.0 - cloudDensity(cloudProj) * (uAlaska?0.21:uVegas?0.20:0.52);

        // Plane shadow on ground/water
        vec2 planeProj = uPlanePos.xz - sunDirection().xz * ((uPlanePos.y - p.y) / max(sunDirection().y, 0.1));
        float pDist = length(p.xz - planeProj);
        float pShad = smoothstep(1.3, 3.0, pDist);

        float litFactor = clamp(bakedShade * cShad * (0.45 + 0.55 * pShad), 0.0, 1.15);

        if (th <= WATER_H + 0.04) {
          // Swell, chop and capillary ripples share world coordinates; the
          // analytic slopes affect shading only, not collision or water level.
          float depth = max(WATER_H - th, 0.0);
          float pixel = pixelAngle * length(p - ro) / max(abs(rd.y), 0.10);
          float localDetail = 1.0 - smoothstep(0.18, 1.1, pixel);
          // Lower New York Harbor has more swell than the sheltered rivers.
          float harborExposure = uManhattan ? 1.0 - smoothstep(-560.0, -300.0, p.z) : 1.0;
          // Tracy Arm is a sheltered fjord, not an exposed deep-ocean swell.
          float openWater = uAlaska ? 0.38 :
            (uVegas || uAlderValley) ? 0.28 : mix(0.46, 1.0, harborExposure);
          float wind = mix(0.65, 1.25, uAtmosphere.z) * openWater;
          vec2 xz = p.xz;
          vec3 swell = oceanSpectrum(xz,pixel,openWater);
          vec3 chop = oceanWave(xz, vec2(0.44, 0.898), 2.4, 4.85, 0.026, pixel)
                    + oceanWave(xz, vec2(0.992, -0.126), 3.7, 6.02, 0.014, pixel);
          vec3 ripple = oceanWave(xz, vec2(0.87, 0.493), 4.9, 5.1, 0.019, pixel)
                      + oceanWave(xz, vec2(-0.48, 0.877), 7.3, 6.3, 0.010, pixel)
                      + oceanWave(xz, vec2(0.22, -0.975), 11.2, 7.7, 0.005, pixel);
          float gust = mix(0.82, 1.18, vnoise(xz * 0.018 - vec2(0.07,0.04) * uTime));
          float noiseH=vnoise(xz*0.085+vec2(-uTime*0.035,uTime*0.018));
          vec2 noiseSlope=vec2(
            vnoise((xz+vec2(0.72,0.0))*0.085+vec2(-uTime*0.035,uTime*0.018))-noiseH,
            vnoise((xz+vec2(0.0,0.72))*0.085+vec2(-uTime*0.035,uTime*0.018))-noiseH
          )*0.38;
          vec2 slope = wind * gust * (swell.yz + chop.yz + noiseSlope) + ripple.yz * mix(0.35, 0.72, openWater);
          if(hasOceanCascades()){
            swell=oceanCascade(xz,uTime,pixel,0)*oceanShoaling(depth);
            chop=oceanCascade(xz,uTime,pixel,6)*smoothstep(0.06,0.72,depth);
            ripple=oceanCascade(xz,uTime,pixel,12)*smoothstep(0.06,0.72,depth);
            slope=oceanExposure(xz)*gust*(swell.yz+chop.yz+ripple.yz*0.75);
          }
          if(uAlaska){
            // Suppress artificial parallel bright-ocean wave bands in the
            // narrow fjord while retaining small capillary ripples and Fresnel.
            swell*=.57;
            chop*=.51;
            ripple*=.71;
            slope*=.53;
          }
          vec3 wn = normalize(vec3(-slope.x, 1.0, -slope.y));
          vec3 shallow = uAlaska ? vec3(0.13,0.36,0.38) : vec3(0.10,0.45,0.42);
          vec3 deep = uAlaska ? vec3(0.022,0.105,0.16) : vec3(0.018,0.115,0.17);
          if (uManhattan) {
            shallow = vec3(0.075,0.31,0.30);
            deep = mix(vec3(0.040,0.15,0.17), vec3(0.020,0.095,0.145), harborExposure);
          }
          // Beer-Lambert attenuation through the available terrain depth,
          // with a small single-scattering term instead of a flat color mix.
          vec3 sigmaA = uManhattan ? vec3(0.28,0.095,0.060) : vec3(0.22,0.075,0.045);
          vec3 sigmaS = uManhattan ? vec3(0.018,0.055,0.060) : vec3(0.014,0.070,0.074);
          float opticalPath = min(depth / max(abs(rd.y), 0.22), 34.0);
          vec3 transmittance = exp(-(sigmaA + sigmaS) * opticalPath);
          vec3 waterCol = deep * (1.0 - transmittance) + shallow * transmittance;
          waterCol += sigmaS / (sigmaA + sigmaS) * (1.0 - transmittance) * 0.075;
          waterCol *= 1.0 + wind * (swell.x * 0.045 + chop.x * 0.19);
          vec3 V = -rd;
          vec3 reflDir = reflect(rd, wn);
          reflDir.y = abs(reflDir.y);
          float ndv = max(dot(wn, V), 0.0001);
          float fresnel = waterFresnel(ndv);
          float meanSquareSlope = (0.003 + 0.00512 * (4.0 + wind * 6.0)) * mix(0.5,1.0,openWater);
          float unresolved = smoothstep(0.05, 1.3, pixel);
          float roughness = 0.028 + sqrt(meanSquareSlope) * unresolved;
          vec3 roughRefl = normalize(mix(reflDir, vec3(reflDir.x, max(reflDir.y,0.19), reflDir.z), roughness * 1.7));
          vec3 reflectedSky = getSky(roughRefl);
          // Exact dielectric air-to-water Fresnel with rough-slope grazing correction.
           // F0 is ~2% instead of a constant +4.5% artistic reflection floor.
           float filteredFresnel=waterFresnel(clamp(ndv-0.035*roughness*
             smoothstep(0.08,1.1,pixel),0.0001,1.0));
           float waterReflectance=clamp(mix(fresnel,filteredFresnel,0.48),0.02,0.975);
           waterCol=mix(waterCol,reflectedSky,waterReflectance);
          float clearSky = (1.0 - uAtmosphere.z * 0.76) * (1.0 - uAtmosphere.w * 0.55);
          float sunAbove = smoothstep(-0.025, 0.08, uSun.y);
          if(hasOceanCascades()){
            vec3 transmitted=refract(rd,wn,1.0/1.333);
            float path=min(depth/max(0.24,-transmitted.y),16.0);
            vec2 floorXZ=xz+transmitted.xz*path;
            vec3 bottom=mix(vec3(0.23,0.27,0.23),vec3(0.48,0.48,0.34),
                           vnoise(floorXZ*0.54)*0.72+vnoise(floorXZ*2.1)*0.28);
            vec3 waterTransmission=exp(-vec3(0.94,0.48,0.30)*path);
            float floorMask=1.0-smoothstep(0.04,0.27,terrainHeight(floorXZ)-WATER_H);
            float shallowFloor=(1.0-fresnel)*exp(-depth*0.42)*floorMask;
            float focus=0.0;
            if(depth<3.2 && localDetail>0.03 && uSun.y>0.08){
              focus=oceanCaustic(floorXZ,depth)*localDetail*sunAbove*clearSky*litFactor;
            }
            waterCol=mix(waterCol,bottom*waterTransmission*(0.72+focus*0.62),shallowFloor*0.76);
            float back=pow(max(dot(normalize(uSun.xz+vec2(0.0001)),normalize(rd.xz+vec2(0.0001))),0.0),4.0);
            float crest=smoothstep(0.11,0.43,swell.x+chop.x);
            waterCol+=vec3(0.025,0.24,0.18)*crest*back*sunAbove*clearSky*litFactor;
          }
          vec3 sunTint = mix(vec3(1.0,0.56,0.27), vec3(1.0,0.95,0.82), smoothstep(0.02,0.3,uSun.y));
          vec3 H = normalize(uSun + V + vec3(0.0,0.00001,0.0));
          float ndl = max(dot(wn,uSun),0.0), ndh=max(dot(wn,H),0.0), vdh=max(dot(V,H),0.0);
          float alpha2 = max(roughness*roughness,0.0012);
          float ggx = waterDGGX(ndh,alpha2) * waterVSmith(ndl,ndv,alpha2) * waterFresnel(vdh) * ndl;
          float facetSparkle = mix(0.78,1.24,vnoise(xz*1.8+vec2(uTime*0.13,-uTime*0.09)));
          float glitter = min(ggx * facetSparkle, 18.0) * mix(0.075,0.12,localDetail);
          if (uManhattan) glitter *= mix(0.76, 1.0, harborExposure);
          float moonGlint = pow(max(dot(wn, normalize(uMoon - rd + vec3(0.0,0.00001,0.0))), 0.0), 80.0);
          waterCol += sunTint * glitter * clearSky * sunAbove * litFactor;
          waterCol += vec3(0.37,0.53,0.75) * moonGlint * clearSky
                    * (1.0 - uAtmosphere.x) * smoothstep(0.0,0.12,uMoon.y) * 0.3;

          // Broken whitecaps offshore; two broad, irregular swash bands in
          // shallow water. The depth mask comes from the existing terrain.
          vec2 advect = xz - vec2(0.8, 0.6) * uTime * 1.25;
          float breakup = vnoise(advect * 0.23);
          float foamCells = vnoise(advect * 0.71 + vec2(7.1,-3.4));
          float crest = swell.x + chop.x * 1.7;
          float compression = length(slope) + max(crest,0.0) * 0.42;
          float caps = smoothstep(0.62, 1.12, compression + (breakup - 0.5) * 0.24)
                     * smoothstep(0.45,0.72,foamCells) * smoothstep(1.1, 2.7, depth) * wind * 0.32;
          if(hasOceanCascades()){
            caps=oldCrestFoam(xz,oceanExposure(xz)*oceanShoaling(depth),
                             (1.0-smoothstep(1.6,5.6,pixel))*mix(0.10,0.57,foamCells));
          }
          float shore = 0.0;
          if (depth < 1.9) {
            float shoalPhase = depth * 6.4 - uTime * 1.65 + breakup * 4.2 + swell.x * 1.7;
            float pulse = sin(shoalPhase) * 0.72 + sin(shoalPhase*0.47+1.9)*0.28;
            float lace = smoothstep(0.55,0.78,vnoise(xz*0.58+vec2(uTime*0.08,0.0)));
            shore = smoothstep(0.36, 0.88, pulse) * (1.0 - smoothstep(0.04, 1.9, depth))
                  * mix(0.22, 0.72, breakup) * mix(0.45, 1.0, openWater) * mix(0.45,1.0,lace);
            if (uManhattan) shore *= 0.62 + 0.25 * localDetail;
            float caustic = pow(0.5 + 0.5 * sin(3.4*xz.x + 2.1*xz.y + uTime*1.2 + ripple.x*50.0)
                                            * sin(2.2*xz.x - 3.9*xz.y - uTime*0.8), 5.0);
            if(!hasOceanCascades()) waterCol += vec3(0.08,0.12,0.085) * caustic * localDetail * exp(-depth * 1.6)
                      * (1.0 - fresnel) * sunAbove * clearSky * litFactor;
          }

          waterCol = mix(waterCol, vec3(0.78,0.88,0.89), clamp(caps + shore, 0.0, 0.85));

          // Bow pressure, hull wash and broken Kelvin crests are evaluated over the water surface.
          for(int i=0;i<4;i++){
            vec4 wake=uBoatWakes[i];
            if(wake.w<=0.0)continue;
            vec2 delta=p.xz-wake.xy,direction=vec2(sin(wake.z),cos(wake.z));
            float aft=-dot(delta,direction), width=wake.w, hull=uBoatLength[i]*1.96;
            float lateral=abs(dot(delta,vec2(direction.y,-direction.x)));
            if(aft< -hull-4.5 || aft>88.0+width*6.0 || lateral>width+max(aft,0.0)*0.39+7.0)continue;
            float tail=max(0.0,aft);
            float bow=max(0.0,hull+aft);
            float hullAlong=clamp(1.0+aft/max(1.0,hull),0.0,1.0);
            float hullEdge=width*mix(0.44,0.99,sin(hullAlong*3.141593));
            float broken=vnoise(p.xz*0.83-direction*uTime*0.83);
            float small=vnoise(p.xz*2.27+vec2(uTime*0.76,-uTime*0.56));
            float bowArc=(1.0-smoothstep(0.41,1.65,abs(lateral-(width*0.55+bow*0.29))))*
              (1.0-smoothstep(0.0,hull*0.72,bow));
            float sideWash=(1.0-smoothstep(0.27,1.25+width*0.13,abs(lateral-hullEdge)))*
              (1.0-smoothstep(0.0,5.0,aft))*smoothstep(-hull-3.0,-hull+0.9,aft);
            float wakeFade=smoothstep(-3.0,1.5,aft)*(1.0-smoothstep(22.0,88.0+width*6.0,tail));
            float phase=tail*0.38-lateral*0.71-uTime*2.65+broken*2.8;
            float envelope=1.0-smoothstep(1.1,3.6+tail*0.046,abs(lateral-(width*0.77+tail*0.31)));
            float kelvin=pow(max(0.0,sin(phase)),2.2)*envelope*wakeFade;
            float propWidth=width*0.37+tail*0.11;
            float prop=(1.0-smoothstep(propWidth*0.35,propWidth,lateral))*wakeFade*
              (1.0-smoothstep(7.0,43.0,tail));
            float foam=max(max(bowArc*0.86,sideWash*0.62),max(kelvin*0.76,prop*0.79))*
              smoothstep(0.19,0.73,broken*0.59+small*0.41);
            float blueTrough=pow(max(0.0,-sin(phase)),2.0)*envelope*wakeFade*0.43;
            waterCol=mix(waterCol,waterCol*vec3(0.48,0.67,0.84),blueTrough);
            waterCol=mix(waterCol,vec3(0.79,0.92,0.94),clamp(foam,0.0,0.94));
          }

          // Low-altitude jet wake & spray
          if (uPlaneAlt < 5.5) {
            float wakeStrength = 1.0 - uPlaneAlt / 5.5;
            vec2 rel = p.xz - uPlanePos.xz;
            float dWake = length(rel);
            float ring = sin(dWake * 3.2 - uTime * 9.0) * exp(-dWake * 0.22);
            float wakeFoam = smoothstep(0.25, 0.75, ring) * wakeStrength;
            waterCol = mix(waterCol, vec3(0.98, 0.94, 0.90), wakeFoam * 0.75);
          }

          // Missile water impact ripples & foam
          for (int k = 0; k < 8; k++) {
            float age = uImpacts[k].w;
            if (age >= 0.0 && uImpactType[k].x > 0.5) {
              float d = length(p.xz - uImpacts[k].xz);
              float rad = age * 9.5;
              float ring = exp(-abs(d - rad) * 1.4) * exp(-age * 0.45);
              float centerFoam = exp(-d * 0.65) * exp(-age * 0.22);
              waterCol = mix(waterCol, vec3(0.98, 0.93, 0.88), clamp(ring * 0.85 + centerFoam * 0.75, 0.0, 0.9));
            }
          }

          // Apply shadow tint (violet shadows)
          vec3 shadowTint = mix(vec3(0.28, 0.22, 0.42), vec3(1.04, 0.96, 0.88), clamp(litFactor, 0.0, 1.0));
          if (uAlderValley) waterCol = mix(waterCol, vec3(0.12, 0.29, 0.29), 0.35);
          col = mix(waterCol*vec3(0.19,0.25,0.38),waterCol,uAtmosphere.x) * (naturalLight() ? mix(vec3(0.71,0.80,0.89),vec3(1.0),litFactor) : shadowTint);
        } else {
          // LAND RENDERING
          float eps = 0.85;
          float hL = terrainHeight(p.xz - vec2(eps, 0.0));
          float hR = terrainHeight(p.xz + vec2(eps, 0.0));
          float hD = terrainHeight(p.xz - vec2(0.0, eps));
          float hU = terrainHeight(p.xz + vec2(0.0, eps));
          vec3 n = normalize(vec3(hL - hR, 2.0 * eps, hD - hU));

          float alt = th - WATER_H;
          float slope = 1.0 - n.y;

          // Base terrain palette bands
          vec3 sandCol = vec3(0.85, 0.73, 0.54);
          vec3 grassCol = vec3(0.60, 0.66, 0.30);
          vec3 goldTree = vec3(0.93, 0.66, 0.24);
          vec3 orangeTree = vec3(0.87, 0.43, 0.18);
          vec3 crimsonTree = vec3(0.68, 0.20, 0.22);
          vec3 coniferCol = vec3(0.14, 0.23, 0.17);
          vec3 rockCol = vec3(0.42, 0.36, 0.48);
          vec3 snowCol = vec3(0.97, 0.93, 0.95);

          vec3 forestCol = biome < 0.42
            ? mix(goldTree, orangeTree, biome / 0.42)
            : mix(orangeTree, crimsonTree, (biome - 0.42) / 0.58);
          if (conifer > 0.5 && alt > 1.8 && alt < 13.5) {
            forestCol = coniferCol;
          }

          vec3 albedo = grassCol;
          albedo = mix(sandCol, grassCol, smoothstep(0.25, 1.15, alt));
          albedo = mix(albedo, forestCol, smoothstep(1.3, 3.0, alt) * (1.0 - smoothstep(11.5, 14.5, alt)));
          // Steep crags & high elevation rock
          float rockMask = clamp(smoothstep(0.24, 0.44, slope) + smoothstep(12.5, 15.5, alt), 0.0, 1.0);
          albedo = mix(albedo, rockCol, rockMask);
          // Snow on highest peaks
          float snowMask = smoothstep(16.8, 19.2, alt) * (1.0 - smoothstep(0.36, 0.55, slope));
          albedo = mix(albedo, snowCol, snowMask);

          if (uAlderValley) {
            float grain = vnoise(p.xz * 0.34);
            vec3 woodland = mix(vec3(0.16, 0.29, 0.16), vec3(0.32, 0.47, 0.25), grain * 0.6 + biome * 0.4);
            vec2 fieldUV = vec2(p.x + p.z * 0.23, p.z - p.x * 0.13) / vec2(37.0, 57.0);
            float crop = hash12(floor(fieldUV));
            vec2 cell = abs(fract(fieldUV) - 0.5);
            float hedges = smoothstep(0.455, 0.49, max(cell.x, cell.y));
            vec3 field = mix(vec3(0.46, 0.58, 0.25), vec3(0.67, 0.54, 0.30), crop);
            field *= 0.94 + 0.06 * sin(fieldUV.x * 52.0);
            field = mix(field, woodland, hedges);
            float farmland = (1.0 - smoothstep(7.0, 12.0, alt)) * smoothstep(0.15, 1.5, alt);
            albedo = mix(woodland, field, farmland);
            albedo = mix(albedo, vec3(0.44, 0.45, 0.47),
              max(smoothstep(17.0, 27.0, alt), smoothstep(0.17, 0.39, slope)));
            albedo = mix(albedo, snowCol, smoothstep(29.0, 36.0, alt) * (1.0 - smoothstep(0.3, 0.58, slope)));

            vec2 runway = p.xz - vec2(${ALDER_AIRFIELD.x.toFixed(1)}, ${ALDER_AIRFIELD.z.toFixed(1)});
            vec2 runwaySize = vec2(${ALDER_AIRFIELD.halfWidth.toFixed(1)}, ${ALDER_AIRFIELD.halfLength.toFixed(1)});
            if (all(lessThan(abs(runway), runwaySize))) {
              float stripe = (1.0 - smoothstep(0.26, 0.58, abs(runway.x))) * step(0.55, fract(runway.y / 13.0));
              float edge = smoothstep(runwaySize.x - 0.8, runwaySize.x - 0.45, abs(runway.x));
              float threshold = step(runwaySize.y - 13.0, abs(runway.y)) *
                step(0.55, fract((runway.x + runwaySize.x) / 2.0));
              albedo = mix(vec3(0.24, 0.25, 0.28), vec3(0.91, 0.92, 0.86), max(stripe, max(edge, threshold)));
            }
          }

          if(uVegas){
            float grain=vnoise(p.xz*0.19);
            float layers=sin(th*0.54+vnoise(p.xz*0.023)*2.15)*0.5+0.5;
            vec3 powder=mix(vec3(.50,.36,.27),vec3(.72,.54,.40),grain);
            vec3 sandstone=mix(vec3(.45,.24,.18),vec3(.65,.40,.28),layers);
            albedo=mix(powder,sandstone,max(smoothstep(13.0,30.0,alt),smoothstep(.07,.29,slope)));
          }
          if(uDc){
            float grain=vnoise(p.xz*0.14)*0.57+vnoise(p.xz*0.033)*0.43;
            vec3 lawn=mix(vec3(0.24,0.35,0.20),vec3(0.41,0.49,0.29),grain);
            vec3 bank=mix(vec3(0.36,0.33,0.26),vec3(0.49,0.45,0.35),grain);
            albedo=mix(bank,lawn,smoothstep(0.15,2.4,alt));
          }
          if (uAlaska) {
            // Alpine vegetation, sedimentary slate, wind-loaded snow and
            // blue glacial ice at independent spatial scales (Alaska only).
            float macro=vnoise(p.xz*.036);
            float grain=vnoise(p.xz*.23);
            float fleck=vnoise(p.xz*1.10);
            float bedding=.5+.5*sin(alt*.87+macro*5.8);
            vec3 spruce=mix(vec3(.11,.20,.16),vec3(.29,.38,.28),grain*.62+macro*.38);
            vec3 slate=mix(vec3(.23,.29,.33),vec3(.53,.57,.59),grain*.54+bedding*.46);
            slate*=.89+.20*fleck;
            float exposed=max(smoothstep(10.0,23.0,alt),
                              smoothstep(.15,.43,slope));
            albedo=mix(spruce,slate,exposed);
            float wind=smoothstep(.32,.80,macro*.55+grain*.45);
            float frost=smoothstep(17.0,34.0,alt+(macro-.5)*11.0)
                  *(1.0-smoothstep(.29,.62,slope));
            vec3 snowpack=mix(vec3(.70,.80,.84),vec3(.94,.96,.97),grain*.55+fleck*.45);
            albedo=mix(albedo,snowpack,clamp(frost*(.84+.16*wind),0.0,1.0));
            // Flight-scale glacier extent; never presented as surveyed GIS.
            float iceAxis=130.0+12.0*sin(clamp((p.z-449.0)/148.0,0.0,1.0)*3.9);
            float glacier=1.0-smoothstep(63.0,92.0,abs(p.x-iceAxis));
            glacier*=smoothstep(422.0,460.0,p.z)
                      *(1.0-smoothstep(590.0,647.0,p.z));
            float iceVein=vnoise(p.xz*.49+vec2(grain*2.0,-macro*1.8));
            vec3 ice=mix(vec3(.24,.53,.62),vec3(.72,.86,.89),.31+.63*iceVein);
            // Alaska-only close-range glacier cryosphere. Ice flow is
            // longitudinal (+Z); sparse dark fracture seams and compressed
            // blue basal layers fade before the distant DEM horizon.
            float iceNear=glacier*(1.0-smoothstep(82.0,245.0,hitDist));
            if(iceNear>.014){
              vec2 flow=vec2(p.x-iceAxis,p.z-449.0);
              float warp=vnoise(flow*.068+vec2(macro*.5,grain*.3));
              float ridge=vnoise(flow*.24+vec2(iceVein,.31));
              float lamina=.5+.5*sin((p.y-WATER_H)*1.65
                                      +flow.y*.092+warp*5.2);
              float laminaEdge=pow(1.0-abs(2.0*lamina-1.0),3.3);
              // Contorted longitudinal compression fractures, not an
              // artificial repeated cross-hatched chessboard.
              float splitPhase=flow.x*.31+warp*3.3+flow.y*.018;
              float split=1.0-smoothstep(.065,.18,abs(sin(splitPhase)));
              split*=smoothstep(.32,.72,ridge);
              float glacialDust=.05+.15*laminaEdge+.08*(1.0-ridge);
              ice=mix(ice,vec3(.085,.26,.35),glacialDust*.56*iceNear);
              ice=mix(ice,vec3(.045,.19,.26),split*.54*iceNear);
              // Approximate blue light scattering in compacted clear ice.
              // No claim of true subsurface scattering or measured albedo.
              float clearGlance=pow(1.0-max(dot(n,-rd),0.0),3.0);
              ice+=vec3(.018,.085,.105)*clearGlance*iceNear;
              float glint=pow(max(dot(reflect(rd,n),uSun),0.0),64.0);
              ice+=vec3(.10,.14,.18)*glint*iceNear*(1.0-split*.6);
            }
            albedo=mix(albedo,ice,glacier*.82);
            // Near-field CC0 photography: normal and roughness channels are
            // sampled only for Alaska and within a short flight detail radius.
            if(uAlaskaPhotoReady){
              float closeDetail=1.0-smoothstep(95.0,425.0,hitDist);
              float forestFloor=smoothstep(.85,3.2,alt)*
                (1.0-smoothstep(11.0,23.0,alt))*
                (1.0-smoothstep(.15,.39,slope));
              // Soft soil-to-rock transitions avoid the hard circular terrain
              // bands seen during actual WebGL flight screenshot review.
              float forestWeight=smoothstep(.14,.72,forestFloor)*
                (1.0-smoothstep(.28,.63,exposed))*
                (1.0-smoothstep(.30,.65,frost))*
                (1.0-smoothstep(.15,.54,glacier));
              float photoAmount=closeDetail*
                max(max(max(exposed*.74,frost*.87),forestWeight*.37),
                    glacier*.31)*(1.0-glacier*.42);
              if(photoAmount>.018){
                // Reuse bundled real CC0 snow surface photography for the
                // wind-packed glacier crust, without a new external fetch.
                float snowTile=max(step(.51,frost),step(.30,glacier));
                float forestVariant=step(.54,vnoise(p.xz*.028));
                vec2 wallUV=abs(n.x)>abs(n.z)?p.zy:p.xy;
                vec2 projected=mix(p.xz,wallUV,smoothstep(.16,.52,slope));
                vec2 tiled=fract(projected*.107);
                vec2 groundUV=vec2((snowTile+.022+.956*tiled.x)*.25,
                                   .022+.956*tiled.y);
                vec2 forestUV=vec2((2.0+forestVariant+.022+.956*tiled.x)*.25,
                                   .022+.956*tiled.y);
                float lod=clamp(log2(max(hitDist,1.0)*.018),0.0,5.5);
                vec3 alpinePhoto=textureLod(uAlaskaPhotoAlbedo,groundUV,lod).rgb;
                vec3 forestPhoto=textureLod(uAlaskaPhotoAlbedo,forestUV,lod).rgb;
                vec3 photo=mix(alpinePhoto,forestPhoto*vec3(.87,1.02,.88),
                               forestWeight);
                photo=mix(photo,photo*vec3(.72,.88,.96),
                          smoothstep(.24,.75,glacier)*.68);
                vec2 normalUV=mix(groundUV,forestUV,step(.5,forestWeight));
                vec4 normalRough=textureLod(uAlaskaPhotoNormalRough,normalUV,lod);
                float roughness=normalRough.a;
                vec2 texSlope=normalRough.rg*2.0-1.0;
                float microLight=clamp(.87+dot(texSlope,uSun.xz)*.18,.69,1.08);
                photo*=microLight;
                // Brightness-matched forest grain: albedo stays coherent
                // across the 95–425 unit LOD transition, while rock/snow
                // retain their stronger photographic color contribution.
                float colorStrength=mix(.19,.78,1.0-forestWeight);
                albedo=mix(albedo,photo,clamp(photoAmount*colorStrength,0.0,.84));
                float sparkle=pow(max(dot(reflect(rd,n),uSun),0.0),
                                  mix(30.0,95.0,roughness));
                albedo+=vec3(.15,.22,.25)*sparkle*(1.0-roughness)*photoAmount*.065;
              }
            }
          }
                    if (uManhattan) {
            float crossIsland = p.x - (${MANHATTAN_GRID.tilt} * p.z + ${MANHATTAN_GRID.offset.toFixed(1)});
            vec2 blocks = vec2(crossIsland, p.z) / vec2(${MANHATTAN_GRID.blockWidth.toFixed(1)}, ${MANHATTAN_GRID.blockLength.toFixed(1)});
            float block = hash12(floor(blocks));
            bool park = abs(crossIsland) < ${MANHATTAN_GRID.parkHalfWidth.toFixed(1)}
              && abs(p.z - ${MANHATTAN_GRID.parkCenter.toFixed(1)}) < ${MANHATTAN_GRID.parkHalfLength.toFixed(1)};
            vec3 pavement = mix(vec3(0.25,0.26,0.29), vec3(0.41,0.42,0.43), smoothstep(2.1, 3.4, alt));
            vec3 masonry = mix(vec3(0.42,0.46,0.52), vec3(0.73,0.68,0.61), block);
            albedo = mix(pavement, masonry, smoothstep(4.0, 8.0, alt));
            if (slope > 0.32 && alt > 4.0) {
              float rows = step(0.40, fract(p.y * 0.68));
              float panes = step(0.38, fract((p.x + p.z) * 0.46));
              vec3 glass = mix(vec3(0.20,0.29,0.42), vec3(0.85,0.73,0.48), biome * biome);
              albedo = mix(albedo, glass, rows * panes * 0.65);
            }
            if (park) {
              albedo = mix(vec3(0.16,0.30,0.18), vec3(0.36,0.49,0.27), vnoise(p.xz * 0.22));
            }
          }

          // Scorch marks & glowing embers from land missile impacts
          for (int k = 0; k < 8; k++) {
            float age = uImpacts[k].w;
            if (age >= 0.0 && uImpactType[k].x < 0.5) {
              float d = length(p.xz - uImpacts[k].xz);
              float scorch = exp(-d * 0.55) * exp(-age * 0.04);
              albedo = mix(albedo, vec3(0.10, 0.07, 0.11), clamp(scorch * 0.92, 0.0, 0.92));
              float ember = exp(-d * 1.1) * exp(-age * 0.25) * (0.6 + 0.4 * sin(uTime * 11.0 + d * 5.0));
              albedo += vec3(1.0, 0.42, 0.12) * ember * 1.4;
            }
          }

          // Seasonal vegetation and snow cover use a smooth terrain mask.
          float textured=vnoise(p.xz*0.028);
          if(!uVegas && !uManhattan && !uAlaska){
            float growth=smoothstep(0.2,0.55,n.y)*smoothstep(0.8,4.0,alt)*(1.0-smoothstep(16.0,35.0,alt));
            albedo=mix(albedo,vec3(0.27+textured*0.17,0.44+textured*0.15,0.22),growth*uClimate.x*0.74);
            albedo=mix(albedo,vec3(0.70+textured*0.1,0.35+textured*0.18,0.19),growth*uClimate.y*0.63);
          }
          float snowline=uVegas?29.0:uManhattan?-3.0:uAlaska?2.0:6.0;
          float snow=smoothstep(snowline+textured*7.0,snowline+textured*7.0+4.0,alt)*smoothstep(0.35,0.82,n.y);
          albedo=mix(albedo,vec3(0.85,0.90,0.95),snow*uClimate.z*0.93);
          albedo*=1.0-uClimate.w*0.19;

          // Stepped sunset lighting + violet shadows
          float ndotl = max(dot(n, sunDirection()), 0.0);
          float steppedLight = floor(ndotl * 3.2 + 0.35) / 3.0;
          float direct = (naturalLight() ? ndotl : steppedLight) * litFactor;

          vec3 warmSun = vec3(1.08, 0.84, 0.62);
          vec3 violetAmbient = vec3(0.34, 0.26, 0.48);
          if (uAlderValley || naturalLight()) {
            warmSun = vec3(0.96, 0.93, 0.82);
            violetAmbient = vec3(0.43, 0.47, 0.53);
          }
          if(uVegas){
            warmSun=vec3(0.93,0.64,0.46);
            violetAmbient=vec3(0.49,0.47,0.57);
          }
          vec3 nightFill=uVegas?vec3(0.39,0.36,0.43):uManhattan?vec3(0.24,0.27,0.34):vec3(0.13,0.18,0.27);
          vec3 daylight=mix(nightFill,violetAmbient,uAtmosphere.x);
          warmSun=mix(vec3(0.97,0.97,0.91),vec3(1.08,0.67,0.43),uAtmosphere.y*0.75);
          col=albedo*(daylight+warmSun*direct*uAtmosphere.x*(1.0-uAtmosphere.z*0.78));
          if(uVegas)col+=vegasSpill(p,n)*albedo*(1.0-uAtmosphere.x*0.92);
          if(uManhattan)col+=manhattanSpill(p,n)*(0.15+albedo*0.70)*(1.0-uAtmosphere.x*0.91);
        }

        col = applyFog(col, rd, hitDist);
      }

      // Cumulus cloud layer below cruise altitude
      if (abs(rd.y) > 0.002) {
        float t0 = (cloudBase() - ro.y) / rd.y;
        float t1 = (cloudTop() - ro.y) / rd.y;
        float tEnter = min(t0, t1);
        float tExit = max(t0, t1);
        if (tExit > 0.0 && tEnter < hitDist) {
          tEnter = max(0.5, tEnter);
          tExit = min(hitDist, min(tExit, 440.0));
          if (tExit > tEnter) {
            float steps = 7.0;
            float dt = (tExit - tEnter) / steps;
            float accum = 0.0;
            vec3 cloudColAccum = vec3(0.0);
            for (int c = 0; c < 7; c++) {
              float tc = tEnter + (float(c) + 0.5) * dt;
              vec3 cp = ro + rd * tc;
              float d = cloudDensity(cp.xz);
              if (d > 0.01) {
                float hFrac = clamp((cp.y - cloudBase()) / (cloudTop() - cloudBase()), 0.0, 1.0);
                // Stepped peach/violet cloud shading
                float shadeBand = floor((hFrac * 0.75 + (1.0 - d) * 0.35) * 3.0) / 2.0;
                vec3 cShadow = vec3(0.52, 0.36, 0.56);
                vec3 cMid = vec3(0.92, 0.58, 0.54);
                vec3 cLight = vec3(1.0, 0.82, 0.66);
                vec3 cCol = shadeBand < 0.5 ? mix(cShadow, cMid, shadeBand * 2.0) : mix(cMid, cLight, (shadeBand - 0.5) * 2.0);

                if (naturalLight()) cCol = mix(vec3(0.64,0.71,0.77),vec3(0.96,0.98,0.99),hFrac*0.7+(1.0-d)*0.3);
                if(uVegas) cCol = mix(vec3(0.37,0.30,0.45),vec3(0.73,0.49,0.49),hFrac*0.8+(1.0-d)*0.2);

                // Plane shadow cast onto clouds
                vec2 pCloudProj = uPlanePos.xz - sunDirection().xz * ((uPlanePos.y - cp.y) / max(sunDirection().y, 0.1));
                float pCloudDist = length(cp.xz - pCloudProj);
                if (uPlanePos.y > cp.y && pCloudDist < 2.2) {
                  cCol *= 0.62;
                }

                cCol = applyFog(mix(cCol*vec3(0.26,0.31,0.44),cCol,uAtmosphere.x), rd, tc);
                float alpha = d * mix(0.25,0.72,uAtmosphere.z) * (1.0 - accum);
                cloudColAccum += cCol * alpha;
                accum += alpha;
                if (accum > 0.94) break;
              }
            }
            col = col * (1.0 - accum) + cloudColAccum;
          }
        }
      }

      gl_FragDepth = 1.0;
      if (hitSurface) {
        vec4 clip = uWorldViewProj * vec4(ro + rd * hitDist, 1.0);
        gl_FragDepth = clamp(0.5 + 0.5 * clip.z / clip.w, 0.0, 1.0);
      }
      fragColor = vec4(col, 1.0);
    }
  `;

  // 3D Low-Poly Fighter Jet & Missiles Shader (3-tone flat shading + 1px dark outline pass)
  const MESH_VS = `#version 300 es
    layout(location=0) in vec3 aPos;
    layout(location=1) in vec3 aNorm;
    layout(location=2) in vec3 aColor;
    layout(location=3) in float aHarborSurface;
    layout(location=4) in vec3 aScenarioUVMask;

    uniform mat4 uViewProj;
    uniform mat4 uModel;
    uniform float uOutline;

    out vec3 vNorm;
    out vec3 vColor;
    out vec3 vWorld;
    out vec3 vScenarioUVMask;
    flat out float vHarborSurface;

    void main() {
      vec3 pos = aPos + aNorm * uOutline;
      vec4 worldPos = uModel * vec4(pos, 1.0);
      vNorm = mat3(uModel) * aNorm;
      vColor = aColor;
      vHarborSurface = aHarborSurface;
      vScenarioUVMask = aScenarioUVMask;
      vWorld = worldPos.xyz;
      gl_Position = uViewProj * worldPos;
    }
  `;

  const MESH_FS = `#version 300 es
    precision highp float;
    in vec3 vNorm;
    in vec3 vColor;
    in vec3 vWorld;
    in vec3 vScenarioUVMask;
    flat in float vHarborSurface;
    out vec4 fragColor;
    uniform bool uSmooth;
    uniform vec3 uEye;
    uniform bool uCityFacade;
    uniform bool uWaterfall;
    uniform bool uTwilight;
    uniform bool uManhattanView;
    uniform bool uSphereShow;
    uniform float uSpherePattern;
    uniform vec3 uSphereCenter;
    uniform vec4 uSphereImpact;
    uniform sampler2D uEarthPhoto;
    uniform float uSceneTime;

    uniform float uIsOutline;
    uniform float uEmissive;

    ${VEGAS_LIGHTING}

    uniform vec3 uSun;
    uniform vec4 uAtmosphere;
    uniform float uDimLights;
    uniform bool uTimesScreen;
    uniform vec2 uSurfaceWeather;
    // PATROL_SALTLINE_STREETS_V1
    uniform float uNyStreetWetness;
    uniform float uNyStreetQuality;
    uniform sampler2D uNyAsphaltPhoto;
    uniform sampler2D uNyConcretePhoto;
    uniform float uNyPhotoReady;
    uniform sampler2D uScenarioDiffuse;
    uniform float uScenarioDiffuseReady;
    uniform sampler2D uNyLedAtlas;
    uniform float uNyLedReady;
    // PATROL_NYC_MATERIAL_ATLAS_V5: independent building-type materials.
    uniform sampler2D uNyWallDiffuse;
    uniform sampler2D uNyWallNormal;
    uniform sampler2D uNyWallARM;
    uniform sampler2D uNyAsphaltNormal;
    uniform sampler2D uNyAsphaltARM;
    uniform int uNySurfaceClass;
    uniform highp sampler2DArray uDcMaps;
    uniform int uDcSurface;
    uniform bool uAlaskaMesh;
    uniform bool uAlaskaPhotoReady;
    uniform sampler2D uAlaskaPhotoAlbedo;
    uniform sampler2D uAlaskaPhotoNormalRough;

    float harborGrain(vec2 cell) {
      return fract(sin(dot(cell,vec2(71.17,159.73)))*43758.5453);
    }

    // Material detail only. Tags belong to existing triangles, not new geometry.
    vec3 harborSurfaceColor(vec3 base, vec3 n) {
      bool wall=vHarborSurface==1.0;
      bool paving=vHarborSurface==2.0;
      vec2 uv=wall ? vec2(dot(vWorld.xz,normalize(vec2(-n.z,n.x)+vec2(0.0001))),vWorld.y) : vWorld.xz;
      float variation=sin(uv.x*0.31+sin(uv.y*0.42))*0.024;
      vec2 aggregate=uv*(wall?6.0:8.0);
      float grainFade=1.0-smoothstep(0.28,0.90,max(fwidth(aggregate.x),fwidth(aggregate.y)));
      variation+=(harborGrain(floor(aggregate))-0.5)*grainFade*(wall?0.14:0.10);
      if(wall||paving){
        vec2 tile=uv/(wall?vec2(1.35,0.49):vec2(1.28,0.82));
        vec2 footprint=max(fwidth(tile),vec2(0.004));
        tile.x+=wall?0.5*mod(floor(tile.y),2.0):0.0;
        vec2 edge=min(fract(tile),1.0-fract(tile));
        vec2 seam=1.0-smoothstep(vec2(0.016),vec2(0.043)+footprint,edge);
        float fade=1.0-smoothstep(0.15,0.65,max(footprint.x,footprint.y));
        variation+=fade*((harborGrain(floor(tile)+19.0)-0.5)*0.16-max(seam.x,seam.y)*0.20);
      }
      vec3 color=base*(1.0+variation);
      if(wall){
        float damp=(1.0-smoothstep(0.05,0.84,vWorld.y-12.2));
        color*=mix(vec3(1.0),vec3(0.72,0.78,0.76),damp*0.60);
      }
      return color;
    }

    void dcSurface(inout vec3 material, inout vec3 n, out float roughness) {
      vec3 axes=abs(n);
      vec3 tangent,bitangent;
      if(axes.y>=max(axes.x,axes.z)){
        tangent=vec3(1,0,0);
        bitangent=vec3(0,0,-sign(n.y));
      }else if(axes.x>=axes.z){
        tangent=vec3(0,0,-sign(n.x));
        bitangent=vec3(0,1,0);
      }else{
        tangent=vec3(sign(n.z),0,0);
        bitangent=vec3(0,1,0);
      }
      float layer=float(uDcSurface);
      float size=uDcSurface==0?4.8:uDcSurface==1?4.1:uDcSurface==2?3.2:uDcSurface==3?5.3:3.7;
      vec2 uv=vec2(dot(vWorld,tangent),-dot(vWorld,bitangent))/size;
      vec3 photo=texture(uDcMaps,vec3(uv,layer)).rgb;
      vec3 detail=texture(uDcMaps,vec3(uv,layer+5.0)).rgb;
      float longVariation=sin(vWorld.x*0.11+sin(vWorld.z*0.073))*0.035;
      float strength=uDcSurface==0?0.76:uDcSurface==3?0.81:uDcSurface==4?0.42:0.96;
      material*=mix(vec3(1.0),photo*2.0,strength)*(1.0+longVariation);
      vec2 tilt=(detail.rg*2.0-1.0)*vec2(0.40,-0.40)*(uDcSurface==4?0.35:1.0);
      tangent=normalize(tangent-dot(tangent,n)*n);
      bitangent=normalize(cross(n,tangent));
      n=normalize(n+tangent*tilt.x+bitangent*tilt.y);
      roughness=clamp(detail.b-uSurfaceWeather.y*0.25,uDcSurface==4?0.60:0.21,1.0);
    }

    vec3 showPattern(float mode,vec3 n,float t){
      float longitude=atan(n.x,n.z);
      float latitude=asin(clamp(n.y,-1.0,1.0));
      if(mode<0.5){
        float angle=t*0.245;
        vec3 view=vec3(sin(angle),0.0,-cos(angle));
        vec3 east=vec3(cos(angle),0.0,sin(angle));
        float facing=dot(n,view);
        vec2 photo=vec2(dot(n,east),n.y)*0.399+0.50;
        vec3 surface=pow(max(texture(uEarthPhoto,photo).rgb,vec3(0.0)),vec3(0.74))*1.20;
        vec3 edge=vec3(0.10,0.36,0.72);
        return mix(mix(vec3(0.03,0.15,0.37),edge,0.20+0.22*sin(latitude*3.5)),surface,smoothstep(0.02,0.20,facing));
      }
      if(mode<1.5){
        float wave=longitude*3.0+n.y*5.2+t*2.1;
        return vec3(0.51)+vec3(0.38)*cos(wave+vec3(0.0,2.0,4.2)+sin(latitude*5.0-t)*1.3);
      }
      if(mode<2.5){
        float curtain=0.5+0.5*sin(longitude*4.0+t*0.74+n.y*3.0);
        float light=exp(-6.0*abs(n.y-0.26-sin(longitude*3.0+t)*0.24));
        return vec3(.045,.12,.26)+mix(vec3(.07,.89,.60),vec3(.55,.22,.98),curtain)*light;
      }
      float ring=0.5+0.5*sin(11.0*length(n.xy-vec2(0.16*sin(t*.36),-.13))-t*2.5);
      return mix(vec3(.64,.12,.37),vec3(1.0,.72,.24),ring);
    }

    // PATROL_SALTLINE_STREETS_V1 — independent WebGL2 adaptation of rainy-port
    // material principles; no original Saltline code or proprietary assets copied.
    float nyStreetHash(vec2 p) {
      return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);
    }
    float nyStreetNoise(vec2 p) {
      vec2 i=floor(p), f=fract(p);
      f=f*f*(3.0-2.0*f);
      return mix(mix(nyStreetHash(i),nyStreetHash(i+vec2(1,0)),f.x),
                 mix(nyStreetHash(i+vec2(0,1)),nyStreetHash(i+vec2(1,1)),f.x),f.y);
    }
    void nyStreetMaterial(inout vec3 albedo, inout float roughness, inout vec3 normal,
                          out float road, out float puddle) {
      road=0.0; puddle=0.0;
      // Original NYC mesh colors identify asphalt; no second scene render.
      if (normal.y<0.84 || abs(vWorld.y-14.93)>0.23 ||
          abs(vWorld.x)>435.0 || vWorld.z < -620.0 || vWorld.z > 500.0) return;
      vec3 asphaltA=vec3(0.25,0.28,0.30), asphaltB=vec3(0.28,0.29,0.32);
      road=max(1.0-smoothstep(0.042,0.137,length(albedo-asphaltA)),
               1.0-smoothstep(0.040,0.128,length(albedo-asphaltB)));
      if(road<0.015)return;
      // yolo-mini-fps-inspired use of CC0 Poly Haven physical asphalt.
      // Real diffuse variation complements the existing wet road roughness.
      if(uNyPhotoReady>0.5){
        vec3 photo=texture(uNyAsphaltPhoto,vWorld.xz*0.38).rgb;
        float aggregate=dot(photo,vec3(0.2126,0.7152,0.0722));
        float grit=clamp(0.68+aggregate*1.15,0.70,1.42);
        albedo*=mix(1.0,grit,road*0.85);
      }
      float wet=clamp(uNyStreetWetness,0.0,1.0);
      vec2 p=vWorld.xz;
      float fine=nyStreetNoise(p*1.75+vec2(8.3,4.1));
      float coarse=nyStreetNoise(p*0.115)*0.62+nyStreetNoise(p*0.34+37.0)*0.38;
      float basin=coarse+(fine-0.5)*0.09;
      puddle=road*wet*smoothstep(0.51,0.74,basin);
      float damp=road*wet*(0.78+0.22*coarse);
      float aa=max(fwidth(p.x)+fwidth(p.y),0.001);
      float grainFade=1.0-smoothstep(0.12,0.55,aa);
      float grains=(nyStreetHash(floor(p*8.1))-0.5)*grainFade;
      float wear=nyStreetNoise(p*0.52+13.4);
      albedo*=1.0+road*(grains*0.095+(wear-0.5)*0.12);
      albedo*=1.0-damp*0.29-puddle*0.10;
      roughness=mix(0.78,0.33,damp);
      roughness=mix(roughness,0.075,puddle);
      if(uNyPhotoReady>0.5){
        vec2 uv=vWorld.xz*0.38;
        vec3 bump=texture(uNyAsphaltNormal,uv).xyz*2.0-1.0;
        float r=texture(uNyAsphaltARM,uv).g;
        float near=1.0-smoothstep(90.0,255.0,distance(vWorld,uEye));
        normal=normalize(normal+vec3(bump.x,0.0,bump.y)*road*near*0.10);
        roughness=mix(roughness,clamp(r,0.38,0.95),road*near*0.25*(1.0-wet));
      }
    }
    vec3 nyStreetReflection(vec3 worldPos,vec3 normal,vec3 toEye,
                            float road,float puddle) {
      float wet=clamp(uNyStreetWetness,0.0,1.0);
      if (road<0.01 || wet<0.025 || uAtmosphere.x>0.86) return vec3(0.0);
      vec2 p=worldPos.xz;
      float view=pow(1.0-clamp(dot(normal,normalize(toEye)),0.0,1.0),2.0);
      float square=exp(-length((p-vec2(15.0,3.0))*vec2(0.025,0.013)));
      float win=exp(-length((p-vec2(-7.0,-117.0))*vec2(0.023,0.013)));
      float line=pow(max(0.0,cos(p.x*0.73+p.y*0.041)),14.0);
      float second=pow(max(0.0,cos(p.x*0.47-p.y*0.036+0.8)),22.0);
      float broken=0.56+0.44*nyStreetNoise(vec2(p.x*0.19,p.y*0.56));
      float rip=1.0+0.045*sin(p.y*2.4+uSceneTime*3.4)*puddle;
      vec3 magenta=vec3(0.88,0.16,0.39)*line*square;
      vec3 blue=vec3(0.12,0.35,0.95)*second*square;
      vec3 amber=vec3(0.93,0.52,0.17)*line*win*0.58;
      vec3 lamp=manhattanSpill(worldPos,normal)*(0.3+0.7*view);
      float intensity=wet*(0.07+0.23*puddle+0.10*view)*broken*rip*road;
      return (magenta+blue+amber+lamp)*intensity*(1.0-uAtmosphere.x*0.82);
    }
    void nyFacadeRainStreaks(inout vec3 albedo, vec3 normal) {
      if (uNyStreetQuality<1.5 || uCityFacade==false ||
          vHarborSurface==10.0 || vHarborSurface==7.0 ||
          vHarborSurface==13.0 ||
          abs(normal.y)>0.17 ||
          vWorld.y>125.0 || vWorld.y<14.0)return;
      float vert=abs(normal.x)>0.55 ? vWorld.z : vWorld.x;
      float scratch=nyStreetNoise(vec2(vert*3.5,floor(vWorld.y*0.62)));
      float streak=smoothstep(0.73,0.95,scratch);
      float ground=1.0-smoothstep(15.0,25.0,vWorld.y);
      float facadeWeather=uSurfaceWeather.y*0.70+uNyStreetWetness*0.30;
      albedo*=1.0-0.075*ground-0.11*facadeWeather*streak;
    }

    // PATROL_NYC_AAA_LAYERS_V2: close-view material breakup.
    // Derivative antialiasing suppresses micro-geometry shimmer in aerial views.
    void nyLayeredMaterial(inout vec3 albedo, vec3 normal) {
      if(uNyStreetQuality<1.5 || !uManhattanView)return;
      // Camera-relative close-up texture coverage, including the harbor
      // and Financial District. Previous hard-coded Times Square coordinate
      // left Lower Manhattan with plain material at the player's spawn.
      float nearArea=1.0-smoothstep(82.0,250.0,
        length(vWorld.xz-uEye.xz));
      if(nearArea<0.01)return;
      if(normal.y>0.78 && vWorld.y>14.7 && vWorld.y<15.4) {
        // Individual worn stone pavers and dark road-edge gutters.
        vec2 paving=vWorld.xz*1.25;
        vec2 uv=fract(paving);
        float edge=min(min(uv.x,uv.y),min(1.0-uv.x,1.0-uv.y));
        float aa=max(fwidth(paving.x),fwidth(paving.y))*1.7;
        float joint=1.0-smoothstep(0.015,0.035+aa,edge);
        float worn=nyStreetNoise(paving*0.52+vec2(19.0,47.0));
        float sidewalk=smoothstep(0.43,0.52,albedo.r)
            *smoothstep(0.39,0.50,albedo.g);
        albedo*=1.0-sidewalk*nearArea*(joint*0.10+(0.5-worn)*0.065);
        if(uNyPhotoReady>0.5 && sidewalk>0.08){
          vec3 photo=texture(uNyConcretePhoto,vWorld.xz*0.42).rgb;
          float tone=clamp(0.63+dot(photo,vec3(0.22,0.70,0.08)),0.65,1.38);
          albedo*=mix(1.0,tone,sidewalk*nearArea*0.71);
        }
        float grit=nyStreetNoise(vWorld.xz*5.0+13.0);
        albedo*=1.0-nearArea*sidewalk*(grit-0.5)*0.045;
      }
      if(abs(normal.y)<0.20 && vWorld.y>14.0 && vWorld.y<68.0) {
        // Limestone pores, masonry coursing and rain-darkened lower walls.
        vec2 wall=vec2(abs(normal.x)>0.5?vWorld.z:vWorld.x,vWorld.y);
        vec2 mortarUV=vec2(wall.x*0.46+mod(floor(wall.y*0.56),2.0)*0.5,
                           wall.y*0.56);
        vec2 cell=fract(mortarUV);
        float mortar=min(min(cell.x,1.0-cell.x),min(cell.y,1.0-cell.y));
        float anti=max(fwidth(mortarUV.x),fwidth(mortarUV.y))*0.8;
        float groove=1.0-smoothstep(0.012,0.042+anti,mortar);
        float stone=smoothstep(0.37,0.49,albedo.r)*
                    (1.0-smoothstep(0.68,0.89,albedo.r));
        float dirt=nyStreetNoise(wall*vec2(0.6,0.23)+31.0);
        float base=(1.0-smoothstep(15.0,24.0,vWorld.y));
        albedo*=1.0-nearArea*stone*(groove*0.090+
          0.045*(1.0-dirt)+base*0.08);
      }
    }


    // PATROL_NYC_MATERIAL_ATLAS_V5: actual material types rather than grey boxes.
    // 1 Empire limestone/granite, 2 Liberty oxidized copper + granite pedestal,
    // 3 Chrysler brick/metal, 4 One WTC prismatic glass, 5 Flatiron terracotta,
    // 6 One Times Square curtain wall; 0 anonymous city block.
    void nyBuildingPbr(inout vec3 albedo,inout vec3 normal,inout float roughness){
      if(!uManhattanView || !uSmooth || uNyStreetQuality<1.5)return;
      int cls=uNySurfaceClass;
      float near=1.0-smoothstep(105.0,360.0,distance(vWorld,uEye));
      if(near<0.002)return;
      if(cls==2){
        bool patina=vWorld.y>26.0 && vColor.g>vColor.r*1.12;
        if(patina){
          vec2 u=vec2(vWorld.x+vWorld.z*.12,vWorld.y)*1.7;
          float grain=nyStreetNoise(u)*.40+nyStreetNoise(u*3.6+11.0)*.17;
          vec3 copper=mix(vec3(.18,.40,.34),vec3(.37,.59,.49),grain+.15);
          albedo=mix(albedo,copper,near*.64);
          roughness=mix(roughness,.83,near*.73);
        }
        bool gildedFlame=vWorld.y>40.0 && vColor.r>vColor.g*1.07 &&
                          vColor.r>vColor.b*1.25;
        if(gildedFlame){
          albedo=mix(albedo,vec3(.94,.64,.17),near*.63);
          roughness=mix(roughness,.27,near*.70);
        }
      }
      if(uNyPhotoReady<0.5 || abs(normal.y)>.34)return;
      bool stone=cls==1 || cls==5 || (cls==2 && vWorld.y<27.0);
      bool metal=cls==3;
      bool glass=cls==4 || cls==6;
      // Avoid applying a second generic image projection on a tagged
      // NYC OTI or Times Square footprint material.
      bool taggedFacadeSurface=vHarborSurface>5.5 && vHarborSurface<14.5;
      bool commonWall=cls==0 && uCityFacade && !taggedFacadeSurface;
      if(!(stone||metal||glass||commonWall))return;
      vec2 uv=vec2(abs(normal.x)>abs(normal.z)?vWorld.z:vWorld.x,vWorld.y);
      uv*=stone?0.27:0.40;
      vec3 photo=texture(uNyWallDiffuse,uv).rgb;
      vec3 arm=texture(uNyWallARM,uv).rgb;
      vec3 nmap=texture(uNyWallNormal,uv).rgb*2.0-1.0;
      float aggregate=dot(photo,vec3(.2126,.7152,.0722));
      float strength=stone?0.73:metal?0.18:glass?0.08:0.38;
      float modulation=clamp(.58+aggregate*1.25,.56,1.44);
      // Preserve limestone, greenish glass and brick tone identity.
      albedo*=mix(1.0,modulation,near*strength);
      roughness=mix(roughness,clamp(arm.g,.27,.99),
        near*(stone?.68:metal?.45:glass?.19:.51));
      vec3 tangent=normalize(vec3(-normal.z,0.0,normal.x));
      normal=normalize(normal+(tangent*nmap.x+vec3(0.0,nmap.y,0.0))*
        near*(stone?.085:metal?.040:glass?.009:.063));
      if(glass){
        float fresnel=pow(1.0-clamp(abs(dot(normalize(uEye-vWorld),normal)),0.0,1.0),5.0);
        vec3 sky=mix(vec3(.11,.22,.31),vec3(.42,.58,.66),uAtmosphere.x);
        albedo=mix(albedo,sky,near*fresnel*.48);
        roughness=mix(roughness,.24,near*.30);
      }
    }
    // PATROL_NYC_GIS_PBR_V13: City Building Footprints at Times Square
    // and NYC OTI registered financial-district polygons share real
    // stone/glass/roof shading. Surface IDs 6/7/8 and 9/10/11
    // are surveyed sources; 12/13/14 mark *procedural Brooklyn* brick,
    // glazing and roofs using the same PBR material classes, not GIS data.
    // The original geometry/collision, NYC LED displays and other maps
    // remain unchanged.
    // PATROL_NYC_GIS_PBR_V12: geometry from official City Building Footprints.
    // Flat interpolated aHarborSurface tags 6/7/8 distinguish genuine
    // polygon masonry, authored window planes and triangulated rooftops.
    // Original Poly Haven CC0 maps are already bound by NYC material atlas.
    void nyOfficialGisPbr(inout vec3 albedo,inout vec3 n,inout float roughness){
      if(!uManhattanView || !uSmooth || uNyStreetQuality<1.5 ||
          vHarborSurface<5.5 || vHarborSurface>14.5)return;
      float nearDetail=1.0-smoothstep(98.0,340.0,distance(vWorld,uEye));
      if(nearDetail<0.002)return;
      float materialClass=mod(floor(vHarborSurface+.5),3.0);
      if(materialClass<.5){
        // Stable world-space stone/brick mapping keeps scale consistent even
        // across non-axis-aligned official building footprint edges.
        vec3 t=normalize(vec3(-n.z,0.0,n.x)+vec3(0.00001,0.0,0.00001));
        vec2 uv=vec2(dot(vWorld,t),vWorld.y)*vec2(.30,.29);
        float pattern=nyStreetNoise(uv*.65+vec2(11.5,9.4));
        float modulation=.92+.16*pattern;
        float roughTarget=.77;
        if(uNyPhotoReady>0.5){
          vec3 photograph=texture(uNyWallDiffuse,uv).rgb;
          vec3 arm=texture(uNyWallARM,uv).rgb;
          vec3 bump=texture(uNyWallNormal,uv).rgb*2.0-1.0;
          float lum=dot(photograph,vec3(.2126,.7152,.0722));
          modulation*=clamp(.68+.65*lum,.60,1.35);
          roughTarget=clamp(arm.g,.44,.94);
          n=normalize(n+(t*bump.x+vec3(0.0,bump.y,0.0))*
              .072*nearDetail);
        }
        float damping=(1.0-smoothstep(15.2,23.0,vWorld.y))*
                       clamp(uNyStreetWetness,0.0,1.0);
        albedo*=mix(1.0,modulation*(1.0-.18*damping),nearDetail*.80);
        roughness=mix(roughness,roughTarget,nearDetail*.70);
      }else if(materialClass<1.5){
        // Embedded window quads receive Fresnel glazing and deterministic
        // varied indoor light, not a second procedural window grid.
        vec3 view=normalize(uEye-vWorld);
        float facing=abs(dot(view,n));
        float fresnel=.04+.96*pow(1.0-clamp(facing,0.0,1.0),5.0);
        vec3 sky=mix(vec3(.14,.23,.32),vec3(.40,.55,.66),uAtmosphere.x);
        vec3 pane=albedo*.67+sky*(.33+.49*fresnel);
        vec2 cell=floor(vec2(vWorld.x*.68+vWorld.z*.57,
                             vWorld.y*.43));
        float lights=step(.76,nyStreetHash(cell+vec2(37.2,19.5)))*
          (1.0-uAtmosphere.x*.94);
        pane+=vec3(.58,.39,.18)*lights*.24;
        albedo=mix(albedo,pane,nearDetail*.89);
        roughness=mix(roughness,.19+fresnel*.05,nearDetail*.92);
      }else{
        // Gravel-coated roof with roughness variation and no road shader
        // classification. Small skylight-like roof fixtures remain geometry.
        vec2 uv=vWorld.xz*.58;
        float aggregate=nyStreetNoise(uv*3.4);
        albedo*=1.0+nearDetail*(aggregate-.50)*.19;
        float wet=clamp(uNyStreetWetness*.39,0.0,.37);
        roughness=mix(roughness,mix(.88,.55,wet),nearDetail*.75);
      }
    }
    // Tagged surface 12: Alaska glacier mesh; distant, other-map and
    // compatibility geometry retains the existing lightweight fallback.
    void alaskaGlacierFace(inout vec3 material,inout vec3 n,
                           inout float roughness){
      if(!uAlaskaMesh || vHarborSurface<11.5 || vHarborSurface>12.5)return;
      float near=1.0-smoothstep(95.0,375.0,distance(vWorld,uEye));
      if(near<.002)return;
      vec2 uv0=abs(n.y)>.64?vWorld.xz*.115:
                vec2(vWorld.x*.091+vWorld.z*.028,vWorld.y*.16);
      float band=.5+.5*sin(vWorld.y*1.18+vWorld.x*.13+vWorld.z*.038);
      float vein=sin(vWorld.x*.29+vWorld.y*.52+sin(vWorld.z*.08)*2.4);
      float seam=(1.0-smoothstep(.027,.16,abs(vein)))*.29;
      material=mix(material,vec3(.44,.67,.77),
        near*(.22+.18*(1.0-max(n.y,0.0))));
      material*=1.0-near*(.08*band+seam);
      if(uAlaskaPhotoReady){
        // Reuse bundled Poly Haven CC0 snow photo/normal/roughness
        // (atlas column 1 of four), no extra asset/network request.
        vec2 tile=fract(uv0);
        vec2 uv=vec2((1.0+.022+.956*tile.x)*.25,.022+.956*tile.y);
        vec3 photographed=texture(uAlaskaPhotoAlbedo,uv).rgb;
        vec4 normalRough=texture(uAlaskaPhotoNormalRough,uv);
        vec2 micro=normalRough.rg*2.0-1.0;
        vec3 tangent=normalize(vec3(-n.z,0.0,n.x)+vec3(.001,0.0,.001));
        vec3 bitangent=normalize(cross(n,tangent));
        n=normalize(n+(tangent*micro.x+bitangent*micro.y)*.10*near);
        material=mix(material,photographed*vec3(.66,.84,.94),.44*near);
        roughness=mix(roughness,clamp(normalRough.a,.38,.88),.75*near);
      }
      float frostFresnel=pow(1.0-abs(dot(n,normalize(uEye-vWorld))),3.0);
      material+=vec3(.025,.075,.095)*frostFresnel*near;
    }

    // PATROL_ALASKA_LODGE_WOOD_V1: a locally-bounded surface model for real
    // lodge cladding and standing-seam roof panels, without new downloads.
    // Surface 15 marks timber walls, 16 marks dark metal gables. Geometry
    // still follows the surveyed USGS foundations (not over the water).
    void alaskaLodgeCladding(inout vec3 material,inout vec3 n,
                             inout float roughness){
      if(!uAlaskaMesh || vHarborSurface<14.5 ||
          vHarborSurface>16.5)return;
      float near=1.0-smoothstep(105.0,315.0,distance(vWorld,uEye));
      if(near<.003)return;
      if(vHarborSurface<15.5){
        // World-space longitudinal fibers, subtle knots and sawmill ripples.
        // Unlike noise per object this has a stable, visible real-world scale.
        vec2 uv=abs(n.x)>abs(n.z)?vWorld.zy:vWorld.xy;
        float bend=sin(uv.y*.77+uv.x*.49)*1.75;
        float fine=sin(uv.x*15.7+bend+sin(uv.x*3.1)*.85);
        float fibers=sin(uv.x*42.3+bend*1.4)*.34+fine*.66;
        float knots=pow(max(0.0,sin(uv.x*3.4+sin(uv.y*1.6)*1.5)),18.0);
        float age=.92+.090*fibers-.075*knots+
          .030*sin(uv.y*2.5+uv.x*.37);
        material*=mix(1.0,clamp(age,.72,1.15),near*.83);
        roughness=mix(roughness,.82,near*.85);
        if(abs(n.y)<.64){
          vec3 across=normalize(vec3(-n.z,0.0,n.x)+vec3(.001,0.0,.001));
          n=normalize(n+across*fibers*.020*near);
        }
      }else{
        // Dark painted aluminium has narrow longitudinal mill marks rather
        // than reflective plastic/specular ice or a solid black slab.
        float grain=.5+.5*sin(vWorld.z*7.2+vWorld.x*.26);
        material*=mix(1.0,.91+.13*grain,near*.72);
        roughness=mix(roughness,.39,near*.89);
      }
    }
    void main() {
      if(uSphereShow){
        vec3 radial=normalize(vWorld-uSphereCenter);
        bool automatic=uSpherePattern<0.0;
        float index=automatic?floor(uSceneTime/11.0):uSpherePattern;
        float blend=automatic?smoothstep(0.88,1.0,fract(uSceneTime/11.0)):0.0;
        vec3 image=mix(showPattern(mod(index,4.0),radial,uSceneTime),
          showPattern(mod(index+1.0,4.0),radial,uSceneTime),blend);
        float age=uSphereImpact.w;
        if(age>=0.0 && age<1.2){
          float gap=abs(length(radial-uSphereImpact.xyz)-age*1.65);
          float flash=(1.0-smoothstep(0.02,.17,gap))*(1.0-age/1.2);
          image=mix(image,vec3(1.0,.93,.72),flash*0.94);
        }
        fragColor=vec4(clamp(image,0.0,1.0),1.0);
        return;
      }
      if (uIsOutline > 0.5) {
        fragColor = vec4(0.07, 0.05, 0.11, 1.0);
        return;
      }
      if (uEmissive > 0.5) {
        if(uTimesScreen){
          // Original static ad photography-style illustration, not video.
          vec3 hue=uNyLedReady>0.5?
            texture(uNyLedAtlas,vColor.xy).rgb:vColor;
          float pixelGrid=(1.0-smoothstep(.032,.075,length(fract(vWorld.xy*15.0)-.5)))*.025;
          vec3 lit=hue*(1.0+pixelGrid)*(1.0-uAtmosphere.x*.08);
          fragColor=vec4(clamp(lit,0.0,1.0),1.0);
        }else{
          fragColor=vec4(vColor*mix(1.0,0.47,uDimLights*uAtmosphere.x),1.0);
        }
        return;
      }
      vec3 n = normalize(vNorm);
      vec3 material = vColor;
      // One UV-unwrapped, baked base-color atlas per approved Blender GLB.
      // Untouched procedural meshes and untextured GLB faces remain colored.
      if(uScenarioDiffuseReady>0.5 && vScenarioUVMask.z>0.5)
        material*=texture(uScenarioDiffuse,vScenarioUVMask.xy).rgb;
      if(vHarborSurface>0.0 && vHarborSurface<3.5) material=harborSurfaceColor(material,n);
      float surfaceRoughness=1.0;
      float nyRoad=0.0,nyPuddle=0.0;
      if(uManhattanView && uSmooth && uNyStreetQuality>0.5){
        nyStreetMaterial(material,surfaceRoughness,n,nyRoad,nyPuddle);
        nyFacadeRainStreaks(material,n);
        nyLayeredMaterial(material,n);
        nyBuildingPbr(material,n,surfaceRoughness);
        nyOfficialGisPbr(material,n,surfaceRoughness);
      }
      if(uDcSurface>=0 && uDcSurface<5)dcSurface(material,n,surfaceRoughness);
      alaskaGlacierFace(material,n,surfaceRoughness);
      alaskaLodgeCladding(material,n,surfaceRoughness);
      if(uDcSurface==5 && n.y>0.8){
        float wind=uSceneTime*1.28;
        float a=dot(vWorld.xz,vec2(0.33,1.47))+wind;
        float b=dot(vWorld.xz,vec2(-1.31,1.18))-wind*1.38;
        n=normalize(n+vec3(0.027*sin(a)+0.018*cos(b),0.0,0.041*cos(a)-0.024*sin(b)));
        surfaceRoughness=0.24;
      }
      float ndotl=dot(n,uSun);
      if (uSmooth) {
        float direct = max(ndotl,0.0)*(1.0-uAtmosphere.z*0.75);
        float light = 0.61 + 0.40*direct + 0.13*max(n.y,0.0);
        if(uWaterfall){
          float flow=vWorld.x*0.91+vWorld.y*3.6+uSceneTime*10.8+sin(vWorld.z*6.3)*1.1;
          float ripples=smoothstep(0.50,0.92,0.5+0.32*sin(flow)+0.18*sin(flow*1.71+vWorld.z*8.3));
          material=mix(vColor,vec3(0.92,0.97,0.98),0.18+0.66*ripples);
          light=0.86+0.21*direct;
        }
        vec3 toEye = uEye - vWorld;
        float fresnel=pow(clamp(1.0-abs(dot(normalize(toEye),n)),0.0,1.0),3.4);
        // Material classes 4 (paint/metal) and 5 (glass) are explicitly
        // authored on the moving vehicles and boats, independent of map.
        if(vHarborSurface>=3.5 && vHarborSurface<5.5){
          bool clearGlass=vHarborSurface>4.5;
          surfaceRoughness=clearGlass?.16:.34;
          vec3 skyTint=mix(vec3(.12,.20,.28),vec3(.46,.59,.69),uAtmosphere.x);
          material=mix(material,skyTint,
            fresnel*(clearGlass?.62:.20));
        }
        if(uDcSurface==5 && n.y>0.8){
          vec3 reflected=mix(vec3(0.13,0.21,0.31),vec3(0.55,0.69,0.79),uAtmosphere.x);
          material=mix(material,reflected,fresnel*0.72);
        }
        if(uTwilight && material.b>material.r*1.24 && material.b<0.61){
