<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PATROL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0e0b16;font-family:'Share Tech Mono',monospace;color:#f5d5b8;}
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0b0912;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #glCanvas{image-rendering:pixelated;image-rendering:crisp-edges;}
  #hudCanvas{pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges;}
  #flightMap{position:absolute;top:14px;left:14px;z-index:16;width:min(190px,37vw);
    padding:6px;background:rgba(14,10,24,.88);border:1px solid #a97458;color:#ffd699;}
  #flightMap.expanded{width:min(440px,70vw,68vh);}
  #flightMapCanvas{position:static;width:100%;height:auto;aspect-ratio:1;image-rendering:pixelated;}
  #mapToggle{width:100%;padding:4px;background:#26192e;border:1px solid #a97458;
    color:inherit;cursor:pointer;font:inherit;}
  #boundaryStatus{display:block;text-align:center;padding-top:4px;font-size:clamp(10px,2vw,12px);}
  #flightMap.warning{border-color:#ffad69;color:#ffcf8c;}
  #flightMap.guarding{border-color:#ff795e;color:#ffb2a1;}
  [hidden]{display:none !important;}
  #wrap.smooth-city canvas{image-rendering:auto;}
  .smooth-city #statusBar,.smooth-city #flightMap,.smooth-city .touch-btn{
    font-family:system-ui,sans-serif;border-color:#b9d7e479;background:#172b38d6;color:#eef7fa;
    border-radius:7px;box-shadow:0 2px 12px #0a223343;
  }
  .smooth-city #mapToggle,.smooth-city #flightMenuBtn,.smooth-city #audioBtn{
    font-family:inherit;border-color:#96bac988;background:#234151;color:#eff7fb;border-radius:4px;
  }
  .smooth-city .key-pill{border-color:#aac6d377;background:#142530;color:#ebf7fc;}
  .smooth-city #missionStatus{border-color:#a4c3d27d;background:#162936d9;color:#eff7fb;}
  .smooth-city #boundaryStatus{color:inherit;}
  #titleOverlay{position:absolute;inset:0;display:grid;justify-items:center;align-items:safe center;overflow:auto;padding:16px;
    background:radial-gradient(ellipse at 50% 25%,#392140ed,#100b18f5 72%);z-index:20;}
  .title-badge{width:min(820px,100%);border:1px solid #e88d4f;background:#181123;
    padding:clamp(15px,4vw,30px);box-shadow:0 14px 44px #0009;}
  h1.game-title{font-family:'Press Start 2P',monospace;font-size:clamp(24px,5vw,42px);
    letter-spacing:4px;color:#ffd699;text-shadow:3px 3px #8a2c38;margin:0 0 20px;}
  .flight-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px;}
  .flight-options fieldset{min-width:0;border:1px solid #674863;padding:7px;}
  .flight-options .map-options{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;}
  .map-options .map-card{border:1px solid #674863;margin:0;}
  .map-options .map-card:has(input:checked){border-color:#ffb677;}
  .map-options .map-card:has(input:focus-visible){outline:2px solid #ffd699;outline-offset:2px;}
  .map-card :is(canvas,img){position:static;width:100%;height:auto;aspect-ratio:1.75;object-fit:cover;
    display:block;background:#203552;margin-bottom:5px;image-rendering:auto;}
  .map-card small{margin-left:0;}
  #crashOverlay{position:absolute;inset:0;display:grid;place-items:center;z-index:21;
    background:#120b19aa;padding:15px;}
  #crashOverlay div{width:min(360px,100%);padding:20px;border:1px solid #ff996a;background:#201523;}
  #crashOverlay p{margin:10px 0 18px;}
  #crashOverlay button{background:#f4a259;border:1px solid #ffc690;padding:8px;color:#181123;font:inherit;cursor:pointer;}
  #groundWarning{position:absolute;z-index:13;top:48px;left:50%;transform:translateX(-50%);
    color:#fff2d5;background:#7a2830;padding:5px 10px;pointer-events:none;white-space:nowrap;}
  @media(max-width:620px){
    .flight-options .map-options{grid-template-columns:repeat(2,minmax(0,1fr));}
    .map-card :is(canvas,img){aspect-ratio:2.3;}
    #groundWarning{top:110px;left:auto;right:14px;transform:none;}
  }
  .flight-options legend{color:#ffd699;padding:0 5px;}
  .flight-options label{display:block;margin:3px 0;padding:7px;background:#271a32;cursor:pointer;}
  .flight-options label:has(input:checked){background:#573346;color:#fff1db;}
  .flight-options input{accent-color:#f4a259;margin-right:4px;}
  .flight-options small{display:block;color:#e9bea5;margin:3px 0 0 20px;}
  #startFlight,#flightMenuBtn{cursor:pointer;border:1px solid #e88d4f;color:#1a1325;
    background:#f4a259;font:inherit;padding:6px 10px;}
  #startFlight{width:100%;padding:10px;font-weight:bold;}
  #menuError{color:#ffb2a1;margin-bottom:8px;}
  #missionStatus{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:12;
    pointer-events:none;text-align:center;padding:5px 8px;background:#161020da;color:#ffe1ad;
    font-size:clamp(10px,2vw,14px);border:1px solid #a97458;max-width:40vw;}
  @media(max-width:620px){
    .flight-options{gap:6px;}
    #statusBar .bar-right{gap:4px;}
    #missionStatus{top:60px;left:auto;right:14px;transform:none;}
  }
  #statusBar{
    position:absolute;left:12px;right:12px;bottom:10px;z-index:15;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(14,10,24,0.74);border:1px solid rgba(232,141,79,0.38);
    padding:6px 12px;font-size:12px;color:#f3cfa8;backdrop-filter:blur(2px);
  }
  .bar-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .bar-right{display:flex;align-items:center;gap:12px;}
  .key-pill{
    display:inline-block;padding:1px 5px;border:1px solid rgba(244,162,89,0.55);
    color:#ffd699;font-size:11px;margin-right:3px;background:rgba(42,26,56,0.65);
  }
  .missile-pips{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;margin-left:4px;}
  .pip{width:7px;height:12px;background:#f4a259;border:1px solid #ffd699;display:inline-block;}
  .pip.empty{background:rgba(255,255,255,0.08);border-color:rgba(244,162,89,0.3);}
  #audioBtn{
    background:rgba(36,22,48,0.9);border:1px solid #e88d4f;color:#ffd699;
    font-family:'Share Tech Mono',monospace;font-size:12px;padding:4px 10px;cursor:pointer;
    letter-spacing:1px;
  }
  #audioBtn:hover{background:#e88d4f;color:#140e22;}
  #loadOverlay{
    position:absolute;inset:0;z-index:30;background:#110c1d;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  }
  #loadOverlay.done{display:none;}
  .load-label{font-family:'Press Start 2P',monospace;font-size:12px;color:#f4a259;letter-spacing:2px;}
  .load-bar-outer{width:280px;max-width:80vw;height:16px;border:2px solid #e88d4f;padding:2px;background:#1b132b;}
  .load-bar-inner{height:100%;width:0%;background:#f4a259;transition:width 0.08s linear;}
  #touchControls{
    position:absolute;inset:0;pointer-events:none;z-index:14;display:none;
  }
  @media (pointer:coarse),(max-width:820px){
    #touchControls{display:block;}
    .desktop-only{display:none;}
  }
  .touch-btn{
    position:absolute;pointer-events:auto;background:rgba(20,14,34,0.65);
    border:2px solid rgba(244,162,89,0.6);color:#ffd699;font-family:'Press Start 2P',monospace;
    font-size:10px;display:flex;align-items:center;justify-content:center;border-radius:6px;
    touch-action:none;
  }
  .touch-btn:active,.touch-btn.active{background:rgba(244,162,89,0.45);color:#fff;}
  #btnCam{top:14px;right:14px;width:76px;height:38px;}
  #btnRoll{bottom:54px;right:16px;width:68px;height:44px;}
  #btnBoost{bottom:54px;right:92px;width:74px;height:44px;}
  #btnFire{bottom:106px;right:16px;width:74px;height:44px;}
  #btnCannon{bottom:106px;right:98px;width:72px;height:44px;}
  #btnGear{bottom:158px;right:16px;width:74px;height:44px;}
  #btnBrake{bottom:158px;right:98px;width:72px;height:44px;}
  .runway-choice{display:block;margin-bottom:10px;font-size:13px;color:#f5d5b8;}
  .runway-choice input{margin-right:6px;accent-color:#f4a259;}
  #joyZone{
    position:absolute;left:16px;bottom:54px;width:112px;height:112px;border-radius:50%;
    border:2px dashed rgba(244,162,89,0.45);background:rgba(20,14,34,0.35);pointer-events:auto;touch-action:none;
  }
  #joyKnob{
    position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;
    border-radius:50%;background:rgba(244,162,89,0.55);border:2px solid #ffd699;pointer-events:none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="glCanvas" tabindex="-1"></canvas>
  <canvas id="hudCanvas"></canvas>
  <section id="flightMap" aria-label="Flight map" hidden>
    <button id="mapToggle" type="button" aria-expanded="false" aria-controls="flightMapCanvas">ENLARGE MAP [M]</button>
    <canvas id="flightMapCanvas" width="448" height="448" aria-label="Map with aircraft position and flight boundary"></canvas>
    <output id="boundaryStatus" aria-live="off"></output>
  </section>

  <div id="loadOverlay" class="done">
    <div class="load-label">Generating terrain</div>
    <div class="load-bar-outer"><div class="load-bar-inner" id="loadBar"></div></div>
    <div id="loadStep" style="font-size:12px;color:#c98a70;">SEEDING HEIGHTFIELD...</div>
  </div>

  <section id="titleOverlay" aria-labelledby="gameTitle">

      landmarks: [
        { name: 'Glacier Head', x: -40, z: 558, width: 195, depth: 220, elevation: 0.61 },
        { name: 'West Ridge', x: -435, z: -90, width: 245, depth: 422, elevation: 0.74 },
        { name: 'Mount Alder', x: 388, z: 144, width: 260, depth: 383, elevation: 0.76 },
        { name: 'South Meadow', x: -125, z: -450, width: 120, depth: 180, elevation: 0.13 }
      ],
      checkpoints: [[-19,-574],[-54,-410],[-45,-230],[-17,-45],[24,168]]
    }
  };
  let selectedMap = FLIGHT_MAPS.coast;
  const AIRCRAFT = {
    fighter: { name: 'Viper Jet', cruise: 23.5, boost: 42, turn: 1.45, pitchResponse: 3.4, maxPitch: 0.78 },
    saucer: { name: 'UFO', cruise: 20, boost: 34, turn: 2.3, pitchResponse: 4.0, maxPitch: 0.55 },
    jetpack: { name: 'Jetpack', cruise: 14, boost: 24, turn: 1.9, pitchResponse: 5.2, maxPitch: 1.02 }
  };
  let selectedAircraft = 'fighter';

  // Generate the selected height field in a worker.
  const workerSrc = `
    self.onmessage = function(e) {
      const N = e.data.size || 512;
      const { span, landmarks, scale, water, islands, airfield, city, alaska } = e.data;
      const last = N - 1;
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      function oval(x, z, cx, cz, width, depth) {
        return Math.exp(-(((x - cx) / width) ** 2 + ((z - cz) / depth) ** 2));
      }
      function hash(ix, iy, seed) {
        let n = (ix * 374761393 + iy * 668265263 + seed * 1442695041) | 0;
        n = (n ^ (n >>> 13)) * 1274126177;
        return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
      }
      function valueNoise(x, y, period, seed) {
        const ix = Math.floor(x), iy = Math.floor(y);
        const fx = x - ix, fy = y - iy;
        const ux = fx * fx * (3 - 2 * fx);
        const uy = fy * fy * (3 - 2 * fy);
        const x0 = ((ix % period) + period) % period;
        const x1 = (x0 + 1) % period;
        const y0 = ((iy % period) + period) % period;
        const y1 = (y0 + 1) % period;
        const a = hash(x0, y0, seed);
        const b = hash(x1, y0, seed);
        const c = hash(x0, y1, seed);
        const d = hash(x1, y1, seed);
        return (a * (1 - ux) + b * ux) * (1 - uy) + (c * (1 - ux) + d * ux) * uy;
      }
      function fbm(u, v, baseFreq, octaves, seed) {
        let sum = 0, amp = 0.5, freq = baseFreq, norm = 0;
        for (let o = 0; o < octaves; o++) {
          sum += amp * valueNoise(u * freq, v * freq, freq, seed + o * 31);
          norm += amp;
          amp *= 0.5;
          freq *= 2;
        }
        return sum / norm;
      }
      function ridged(u, v, baseFreq, octaves, seed) {
        let sum = 0, amp = 0.5, freq = baseFreq, norm = 0;
        for (let o = 0; o < octaves; o++) {
          let n = valueNoise(u * freq, v * freq, freq, seed + o * 53);
          n = 1.0 - Math.abs(n * 2.0 - 1.0);
          n = n * n;
          sum += amp * n;
          norm += amp;
          amp *= 0.52;
          freq *= 2;
        }
        return sum / norm;
      }

      function cityHeight(east, north, includeBuildings = false) {
        const localX = east - (city.tilt * north + city.offset);
        const islandWidth = 118 - 77 * clamp((-north - 295) / 235, 0, 1)
          - 68 * clamp((north - 400) / 260, 0, 1);
        const waterfront = islandWidth + 8 * Math.sin(north / 42) + 4 * Math.cos(north / 19);
        const island = north > -525 && north < 665 && Math.abs(localX) < waterfront;
        const jersey = localX < -265 + 17 * Math.sin(north / 76) && north > -705;
        const outerBoroughs = localX > 187 + 26 * Math.sin(north / 93) && north > -415;
        const elevation = water + 2.4;
        for (const mark of city.landmarks) {
          const dx = Math.abs(east - mark.x);
          const dz = Math.abs(north - mark.z);
          if (mark.kind === 'liberty' && Math.hypot(dx / 22, dz / 17) < 1) return elevation / scale;
          if (mark.kind !== 'liberty' && dx < mark.w + 12 && dz < mark.d + 15) return elevation / scale;
        }
        if (!island && !jersey && !outerBoroughs) return (water - 4.4) / scale;
        if (island && Math.abs(localX) < city.parkHalfWidth &&
            Math.abs(north - city.parkCenter) < city.parkHalfLength) {
          return (elevation + 1.0 + 0.6 * Math.sin(north / 22) * Math.cos(localX / 14)) / scale;
        }
        if (!includeBuildings) return elevation / scale;
        const gx = localX / city.blockWidth;
        const gz = north / city.blockLength;
        const ix = Math.floor(gx), iz = Math.floor(gz);
        if (Math.abs(gx - ix - 0.5) > 0.35 || Math.abs(gz - iz - 0.5) > 0.37) return elevation / scale;
        if (island && Math.abs(localX) >= waterfront - 11) return elevation / scale;
        const signature = hash(ix, iz, 946);
        if (signature < 0.14) return elevation / scale;

        const midtown = Math.exp(-(((north + 80) / 125) ** 2));
        const downtown = Math.exp(-(((north + 399) / 69) ** 2));
        const towers = Math.max(midtown, downtown * 0.88);
        const building = island ? 4.5 + signature * 7 + towers * signature ** 2 * 28 : 3.5 + signature * 9;
        return Math.min(0.99, (elevation + building) / scale);
      }

      const cityParcels = new Map();
      if (city) {
        const gridX = Math.ceil(span / city.blockWidth * 0.65);
        const gridZ = Math.ceil(span / city.blockLength * 0.5);
        for (let iz=-gridZ;iz<gridZ;iz++) for (let ix=-gridX;ix<gridX;ix++) {
          const z=(iz+0.5+(hash(ix,iz,811)-0.5)*0.18)*city.blockLength;
          const x=(ix+0.5+(hash(ix,iz,813)-0.5)*0.18)*city.blockWidth+city.tilt*z+city.offset;
          if (Math.abs(x)>span/2 || Math.abs(z)>span/2) continue;
          const base = cityHeight(x,z)*scale;
          const top = cityHeight(x,z,true)*scale;
          if (top-base<2.9) continue;
          const tone = hash(ix,iz,312);
          const width=city.blockWidth*(0.36+tone*0.28);
          const length=city.blockLength*(0.41+hash(ix,iz,531)*0.26);
          const corners = [[-1,-1],[-1,1],[1,-1],[1,1]];
          if (!corners.every(([i,j])=>Math.abs(cityHeight(x+i*width/2,z+j*length/2)*scale-base)<0.4)) continue;
          // Leave room for the authored road corridors before placing city parcels.
          const streetClearance=6.4+Math.hypot(width,length)*0.5;
          const inStreet=city.streets.some(street=>street.some(([sx,sz],i)=>{
            if (!i) return false;
            const [ax,az]=street[i-1], dx=sx-ax,dz=sz-az;
            const t=clamp(((x-ax)*dx+(z-az)*dz)/(dx*dx+dz*dz),0,1);
            return Math.hypot(x-(ax+t*dx),z-(az+t*dz))<streetClearance;
          }));
          const track=city.railway;
          const trackDistance=Math.hypot(x-clamp(x,track.west,track.east),z-track.z);
          if(Math.abs(trackDistance-track.radius)<4+Math.hypot(width,length)*0.43) continue;
          const runway=city.runway;
          if(inStreet || (Math.abs(x-runway.x)<runway.halfLength+width/2+5 &&
            Math.abs(z-runway.z)<runway.halfWidth+length/2+5)) continue;
          cityParcels.set(iz*256+ix,[x,z,width,length,top-base,tone]);
        }
      }

      const ground = city ? new Float32Array(N * N) : null;
      const height = new Float32Array(N * N);
      const biome = new Float32Array(N * N);
      const conifer = new Float32Array(N * N);
      const shade = new Float32Array(N * N);

      self.postMessage({ type: 'progress', pct: 18, label: 'CARVING GLACIAL BASINS...' });

      for (let y = 0; y < N; y++) {
        const v = (y + 0.5) / N;
        for (let x = 0; x < N; x++) {
          const u = (x + 0.5) / N;
          const idx = y * N + x;
          const east = (u - 0.5) * span;
          const north = (v - 0.5) * span;
          if (city) {
            const base = cityHeight(east,north);
            const ix = Math.floor((east-city.tilt*north-city.offset)/city.blockWidth);
            const iz = Math.floor(north/city.blockLength);
            const parcel = cityParcels.get(iz*256+ix);
            ground[idx] = base;
            height[idx] = parcel && Math.abs(east-parcel[0])<parcel[2]/2 &&
              Math.abs(north-parcel[1])<parcel[3]/2 ? base+parcel[4]/scale : base;
            biome[idx] = hash(Math.floor(east / 8), Math.floor(north / 8), 842);
            continue;
          }
          const ridge = ridged(u, v, 9, 5, 202);
          const detail = fbm(u, v, 25, 4, 303);
          const land = oval(east, north, -105, 15, 670, 650);
          const headland = oval(east, north, 334, -340, 350, 200);
          const lake = oval(east, north, -95, 25, 190, 206);
          const bay = oval(east, north, 410, -100, 275, 142);
          let peaks = 0;
          for (const mark of landmarks) {
            peaks += mark.elevation * oval(east, north, mark.x, mark.z, mark.width, mark.depth);
          }
          const coast = clamp(0.045 + land * (0.25 + (detail - 0.5) * 0.29)
            + headland * 0.24 + peaks * (0.59 + 0.48 * ridge) - lake * 0.30 - bay * 0.23,
            0.02, 0.98);
          if (alaska) {
            const center = 38*Math.sin((north + 55)/176) + 22*Math.sin(north/380);
            const halfWidth = 74 + 22*Math.cos(north/250) + 39*clamp((-north-360)/300,0,1);
            const shore = Math.max(Math.abs(east-center)-halfWidth, north-446 + 17*Math.cos(east/90));
            const banks = clamp(shore/69,0,1);
            const ground = 0.29 + peaks*(0.61 + ridge*0.65) + (detail-0.5)*0.12;
            const sea = (water-4.5)/scale;
            height[idx] = clamp(sea + (ground-sea)*banks*banks*(3-2*banks),0.02,0.98);
          } else if (airfield) {
            const center = 83 * Math.sin(north / 178) + 36 * Math.sin(north / 69);
            const riverDist = Math.abs(east - center);
            const channelWidth = 15 + 5 * Math.sin(north / 85);
            const banks = clamp((riverDist - channelWidth) / 35, 0, 1);
            const ground = 0.305 + peaks * (0.68 + ridge * 0.51) + (detail - 0.5) * 0.065;
            const channel = (water - 2.5) / scale;
            const valley = channel + (ground - channel) * banks * banks * (3 - 2 * banks);
            const runwayDist = Math.max(Math.abs(east - airfield.x) - airfield.halfWidth,
              Math.abs(north - airfield.z) - airfield.halfLength);
            const blend = clamp(runwayDist / 28, 0, 1);
            height[idx] = clamp(airfield.elevation / scale * (1 - blend) + valley * blend, 0.02, 0.98);
          } else {
            height[idx] = islands ? clamp(0.04 + peaks * (0.69 + detail * 0.38), 0.02, 0.98) : coast;
          }

          const bPatch = fbm(u, v, 8, 3, 505);
          const bFine = valueNoise(u * 64, v * 64, 64, 606);
          biome[idx] = Math.max(0, Math.min(1, bPatch * 0.82 + bFine * 0.18));

          const cPatch = fbm(u, v, 16, 3, 707);
          const cDot = valueNoise(u * 128, v * 128, 128, 808);
          conifer[idx] = (cPatch > 0.54 && cDot > 0.58) ? 1.0 : 0.0;
        }
      }

      if (e.data.preview) {
        self.postMessage({ type: 'preview', key: e.data.key, height }, [height.buffer]);
        return;
      }

      self.postMessage({ type: 'progress', pct: 64, label: 'BAKING SUNSET SHADOWS...' });

      // Long sunset shadow raycast toward sun direction (+X, -Z)
      const waterLevel = water / scale;
      const sunStepX = 1.0;
      const sunStepY = -0.36;
      const sunSlope = (span / N) * (city || alaska ? 0.65 : 0.10) / scale;

      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          const idx = y * N + x;
          const h0 = Math.max(height[idx], waterLevel);
          let shadow = 1.0;
          let rx = x + 0.5, ry = y + 0.5;
          for (let s = 1; s <= 76; s++) {
            rx += sunStepX;
            ry += sunStepY;
            const sx = (clamp(Math.floor(rx), 0, last));
            const sy = (clamp(Math.floor(ry), 0, last));
            const sh = height[sy * N + sx];
            const rayH = h0 + s * sunSlope;
            if (sh > rayH) {
              shadow = 0.0;
              break;
            }
          }
          // Subtle cavity ambient occlusion
          const hl = height[y * N + Math.max(0, x - 1)];
          const hr = height[y * N + Math.min(last, x + 1)];
          const hu = height[Math.max(0, y - 1) * N + x];
          const hd = height[Math.min(last, y + 1) * N + x];
          const avg = (hl + hr + hu + hd) * 0.25;
          const ao = Math.max(0.65, Math.min(1.08, 1.0 + (height[idx] - avg) * 6.0));
          shade[idx] = shadow * ao;
        }
      }

      self.postMessage({ type: 'progress', pct: 95, label: 'PACKING TEXTURE ATLAS...' });
      const packed = new Uint8Array(N * N * 4);
      for (let i = 0; i < N * N; i++) {
        packed[i * 4 + 0] = Math.round((ground ? ground[i] : height[i]) * 255);
        height[i] = Math.round(height[i] * 255) / 255;
        packed[i * 4 + 1] = Math.round(biome[i] * 255);
        packed[i * 4 + 2] = Math.round(conifer[i] * 255);
        packed[i * 4 + 3] = Math.round(Math.max(0, Math.min(1, shade[i] * 0.85)) * 255);
      }
      const transfer = [packed.buffer,height.buffer];
      if (ground) transfer.push(ground.buffer);
      self.postMessage({ type: 'done', packed, height, ground, parcels: [...cityParcels.values()] }, transfer);
    };
  `;

  const MAP_SIZE = 1024;
  let heightField = null;
  let terrainTex = null;

  // WebGL2 Setup
  const gl = glCanvas.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true });
  if (!gl) {
    menuError.hidden = false;
    menuError.textContent = 'WebGL 2 could not start. Enable graphics acceleration and reload.';
    startFlight.disabled = true;
    return;
  }

  function compileShader(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(sh));
      throw new Error('Shader compile failed');
    }
    return sh;
  }

  function createProgram(vsSrc, fsSrc) {
    const p = gl.createProgram();
    gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      console.error(gl.getProgramInfoLog(p));
      throw new Error('Program link failed');
    }
    return p;
  }

  const QUAD_VS = `#version 300 es
    layout(location=0) in vec2 aPos;
    out vec2 vUv;
    void main() {
      vUv = aPos * 0.5 + 0.5;
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
  `;

  // World Raymarching + Clouds + Water + Impact Scorch/Ripples Fragment Shader
  const WORLD_FS = `#version 300 es
    precision highp float;
    in vec2 vUv;
    out vec4 fragColor;

    uniform sampler2D uTerrain;
    uniform bool uAlderValley;
    uniform bool uAlaska;
    uniform bool uManhattan;
    uniform mat4 uWorldViewProj;
    uniform vec3 uCamPos;
    uniform vec3 uCamFwd;
    uniform vec3 uCamRight;
    uniform vec3 uCamUp;
    uniform float uFovTan;
    uniform float uAspect;
    uniform float uTime;
    uniform vec3 uPlanePos;
    uniform float uPlaneAlt;
    uniform vec4 uImpacts[8]; // xyz = world pos, w = age (or -1)
    uniform vec4 uImpactType[8]; // x = 1 water / 0 land
    uniform vec4 uBoatWakes[4]; // stern x/z, heading angle, half-width; zero width if unused

    bool naturalLight() { return uManhattan || uAlaska; }
    vec3 sunDirection() {
      return naturalLight() ? normalize(vec3(0.56, 0.64, -0.43)) : normalize(vec3(0.84, 0.165, -0.30));
    }
    const float WATER_H = 12.2;
    uniform float uTerrainScale;
    const float MAP_SPAN = ${MAP_SPAN.toFixed(1)};
    float cloudBase() { return naturalLight() ? 145.0 : 56.0; }
    float cloudTop() { return naturalLight() ? 172.0 : 63.0; }

    float hash12(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x),
        mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x),
        u.y
      );
    }

    float cloudDensity(vec2 xz) {
      vec2 p = xz * 0.013 + vec2(uTime * 0.0045, uTime * 0.0018);
      float n = vnoise(p) * 0.55 + vnoise(p * 2.13 + 7.1) * 0.30 + vnoise(p * 4.4 - 3.4) * 0.15;
      return smoothstep(0.54, 0.78, n);
    }

    vec4 sampleMap(vec2 xz) {
      vec2 uv = xz / MAP_SPAN + 0.5;
      return texture(uTerrain, uv);
    }

    float terrainHeight(vec2 xz) {
      return sampleMap(xz).r * uTerrainScale;
    }

    vec3 getSky(vec3 rd) {
      float up = clamp(rd.y, 0.0, 1.0);
      float sunAmt = max(dot(rd, sunDirection()), 0.0);
      if (naturalLight()) {
        vec3 horizon = uAlaska ? vec3(0.69,0.78,0.84) : vec3(0.76,0.85,0.91);
        vec3 blue = uAlaska ? vec3(0.25,0.43,0.60) : vec3(0.20,0.45,0.70);
        vec3 sky = mix(horizon,blue,pow(up,0.54));
        float veil = vnoise(rd.xz/(up+0.24)*3.2+vec2(uTime*0.003,0.0));
        veil = smoothstep(0.52,0.80,veil) * smoothstep(0.04,0.23,up);
        sky = mix(sky,vec3(0.94,0.96,0.98),veil*0.30);
        return sky + vec3(0.46,0.37,0.25)*pow(sunAmt,24.0) + vec3(0.95)*smoothstep(0.9992,0.99975,sunAmt);
      }
      vec3 zenith = vec3(0.15, 0.13, 0.28);
      vec3 midSky = vec3(0.46, 0.25, 0.42);
      vec3 horCool = vec3(0.75, 0.56, 0.72);
      vec3 horWarm = vec3(0.98, 0.62, 0.32);

      float towardSun = smoothstep(-0.3, 0.95, dot(normalize(vec3(rd.x, 0.0, rd.z) + 1e-5), normalize(vec3(sunDirection().x, 0.0, sunDirection().z))));
      vec3 horizon = mix(horCool, horWarm, towardSun);
      vec3 sky = mix(horizon, midSky, pow(up, 0.48));
      sky = mix(sky, zenith, pow(up, 1.15));

      // Cirrus streaks
      if (rd.y > 0.03) {
        vec2 cuv = rd.xz / (rd.y + 0.18) * 1.4 + vec2(uTime * 0.008, 0.0);
        float streak = vnoise(vec2(cuv.x * 1.2, cuv.y * 5.5));
        streak *= vnoise(vec2(cuv.x * 0.6 + 4.0, cuv.y * 3.2));
        float wisps = smoothstep(0.36, 0.68, streak) * smoothstep(0.03, 0.25, rd.y) * (1.0 - smoothstep(0.45, 0.9, rd.y));
        vec3 wispCol = mix(vec3(0.88, 0.64, 0.72), vec3(1.0, 0.80, 0.52), towardSun);
        sky = mix(sky, wispCol, wisps * 0.55);
      }

      // Sunset glow & large sun disc
      sky += vec3(1.0, 0.55, 0.22) * pow(sunAmt, 7.0) * 0.55;
      sky += vec3(1.0, 0.82, 0.48) * pow(sunAmt, 42.0) * 0.7;
      float disc = smoothstep(0.9985, 0.9992, sunAmt);
      sky = mix(sky, vec3(1.0, 0.94, 0.78), disc);
      return sky;
    }

    vec3 applyFog(vec3 col, vec3 rd, float dist) {
      if (naturalLight()) {
        vec3 haze = uAlaska ? vec3(0.66,0.75,0.80) : vec3(0.72,0.80,0.85);
        return mix(col,haze,1.0-exp(-dist*(uAlaska ? 0.0010 : 0.0013)));
      }
      float fogAmt = 1.0 - exp(-dist * 0.00165);
      float towardSun = smoothstep(-0.35, 0.95, dot(normalize(vec3(rd.x, 0.0, rd.z) + 1e-5), normalize(vec3(sunDirection().x, 0.0, sunDirection().z))));
      vec3 fogCol = mix(vec3(0.74, 0.58, 0.75), vec3(0.98, 0.68, 0.38), towardSun);
      return mix(col, fogCol, clamp(fogAmt, 0.0, 0.96));
    }

    void main() {
      vec2 ndc = vUv * 2.0 - 1.0;
      vec3 rd = normalize(uCamFwd + ndc.x * uAspect * uFovTan * uCamRight + ndc.y * uFovTan * uCamUp);
      vec3 ro = uCamPos;

      vec3 col = getSky(rd);
      float hitDist = 860.0;
      bool hitSurface = false;

      // Raymarch terrain & water
      if (rd.y < 0.18) {
        float t = 1.0;
        float maxT = 820.0;
        if (ro.y > uTerrainScale + 2.0 && rd.y < -0.005) {
          t = max(1.0, (ro.y - (uTerrainScale + 1.5)) / (-rd.y));
        }
        float prevT = t;
        for (int i = 0; i < 118; i++) {
          vec3 p = ro + rd * t;
          float th = terrainHeight(p.xz);
          float surfH = max(th, WATER_H);
          if (p.y <= surfH) {
            // Binary refinement
            float a = prevT, b = t;
            for (int j = 0; j < 5; j++) {
              float m = 0.5 * (a + b);
              vec3 mp = ro + rd * m;
              float mh = max(terrainHeight(mp.xz), WATER_H);
              if (mp.y <= mh) b = m; else a = m;
            }
            hitDist = 0.5 * (a + b);
            hitSurface = true;
            break;
          }
          prevT = t;
          float hDiff = p.y - surfH;
          float stride = max(0.65, hDiff * 0.42 + t * 0.011);
          if (naturalLight() && p.y < uTerrainScale + 1.0) stride = min(stride, 10.0);
          t += stride;
          if (t > maxT) break;
        }
      }

      if (hitSurface) {
        vec3 p = ro + rd * hitDist;
        vec4 mData = sampleMap(p.xz);
        float th = mData.r * uTerrainScale;
        float biome = mData.g;
        float conifer = mData.b;
        float bakedShade = mData.a / 0.85;

        // Cloud shadow on ground/water
        vec2 cloudProj = p.xz + sunDirection().xz * ((cloudBase() - p.y) / max(sunDirection().y, 0.1));
        float cShad = 1.0 - cloudDensity(cloudProj) * 0.52;

        // Plane shadow on ground/water
        vec2 planeProj = uPlanePos.xz - sunDirection().xz * ((uPlanePos.y - p.y) / max(sunDirection().y, 0.1));
        float pDist = length(p.xz - planeProj);
        float pShad = smoothstep(1.3, 3.0, pDist);

        float litFactor = clamp(bakedShade * cShad * (0.45 + 0.55 * pShad), 0.0, 1.15);

        if (th <= WATER_H + 0.04) {
          // WATER RENDERING
          float depth = clamp((WATER_H - th) / 7.5, 0.0, 1.0);
          vec3 shallowCol = vec3(0.24, 0.63, 0.65);
          vec3 midCol = vec3(0.12, 0.34, 0.46);
          vec3 deepCol = vec3(0.08, 0.15, 0.24);
          vec3 waterCol = depth < 0.38
            ? mix(shallowCol, midCol, depth / 0.38)
            : mix(midCol, deepCol, (depth - 0.38) / 0.62);

          // Low-angle sky reflection
          vec3 reflDir = reflect(rd, vec3(0.0, 1.0, 0.0));
          vec3 skyRefl = getSky(reflDir);
          if (naturalLight()) {
            vec2 wav = vec2(vnoise(p.xz*0.22+uTime*0.13),vnoise(p.zx*0.27-uTime*0.11))-0.5;
            vec3 waterNormal = normalize(vec3(wav.x*0.12,1.0,wav.y*0.12));
            skyRefl = getSky(reflect(rd,waterNormal));
            vec3 deep = uAlaska ? vec3(0.08,0.22,0.28) : vec3(0.12,0.24,0.26);
            waterCol = mix(vec3(0.25,0.42,0.39),deep,depth*0.67+0.31);
            waterCol *= 0.95 - wav.x*0.14;
          }
          float fresnel = pow(1.0 - max(dot(-rd, vec3(0.0, 1.0, 0.0)), 0.0), 3.2);
          waterCol = mix(waterCol, skyRefl, clamp(0.18 + fresnel * 0.62, 0.0, 0.82));

          // Water wave normal for sun glitter path & transient glints
          float w1 = vnoise(p.xz * 1.9 + vec2(uTime * 1.3, -uTime * 0.8));
          float w2 = vnoise(p.xz * 4.3 - vec2(uTime * 1.7, uTime * 1.1));
          vec3 wn = normalize(vec3((w1 - 0.5) * 0.16, 1.0, (w2 - 0.5) * 0.16));
          vec3 hVec = normalize(sunDirection() - rd);
          float spec = pow(max(dot(wn, hVec), 0.0), 95.0);
          float glint = step(0.84, fract(sin(dot(floor(p.xz * 2.5), vec2(12.9898, 78.233)) + floor(uTime * 5.0)) * 43758.5453));
          waterCol += naturalLight() ? vec3(0.91,0.94,0.95)*spec*0.56
            : vec3(1.0, 0.86, 0.56) * (spec * 1.35 + glint * spec * 0.9) * litFactor;

          // Animated shoreline foam
          float shoreDist = WATER_H - th;
          if (shoreDist < 0.55) {
            float wave = sin(shoreDist * 26.0 - uTime * 3.4 + w1 * 4.0);
            float foam = smoothstep(0.45, 0.88, wave) * (1.0 - shoreDist / 0.55);
            waterCol = mix(waterCol, vec3(0.95, 0.88, 0.86), foam * 0.72);
          }

          // Aerated prop wash and the widening V left by each ship.
          for (int i = 0; i < 4; i++) {
            vec4 wake = uBoatWakes[i];
            if (wake.w <= 0.0) continue;
            vec2 delta = p.xz - wake.xy;
            vec2 forward = vec2(sin(wake.z),cos(wake.z));
            float aft = -dot(delta,forward);
            float lengthLimit = 58.0 + wake.w*6.0;
            if (aft < 0.0 || aft > lengthLimit) continue;
            float lateral = abs(dot(delta,vec2(forward.y,-forward.x)));
            float arm = wake.w*0.70 + aft*0.23;
            if (lateral > arm + 5.0) continue;
            float brokenFoam = smoothstep(0.24,0.81,vnoise(p.xz*0.66+forward*uTime*0.65));
            float crest = 1.0-smoothstep(0.35,1.7,abs(lateral-arm));
            float wash = exp(-lateral*lateral / (1.6+aft*0.18)) * (1.0-smoothstep(13.0,42.0,aft));
            float fade = 1.0-smoothstep(15.0,lengthLimit,aft);
            float foam = max(crest*0.79,wash*0.91)*fade*brokenFoam;
            waterCol = mix(waterCol,vec3(0.91,0.97,0.96),foam);
          }

          // Low-altitude jet wake & spray
          if (uPlaneAlt < 5.5) {
            float wakeStrength = 1.0 - uPlaneAlt / 5.5;
            vec2 rel = p.xz - uPlanePos.xz;
            float dWake = length(rel);
            float ring = sin(dWake * 3.2 - uTime * 9.0) * exp(-dWake * 0.22);
            float wakeFoam = smoothstep(0.25, 0.75, ring) * wakeStrength;
            waterCol = mix(waterCol, vec3(0.98, 0.94, 0.90), wakeFoam * 0.75);
          }

          // Missile water impact ripples & foam
          for (int k = 0; k < 8; k++) {
            float age = uImpacts[k].w;
            if (age >= 0.0 && uImpactType[k].x > 0.5) {
              float d = length(p.xz - uImpacts[k].xz);
              float rad = age * 9.5;
              float ring = exp(-abs(d - rad) * 1.4) * exp(-age * 0.45);
              float centerFoam = exp(-d * 0.65) * exp(-age * 0.22);
              waterCol = mix(waterCol, vec3(0.98, 0.93, 0.88), clamp(ring * 0.85 + centerFoam * 0.75, 0.0, 0.9));
            }
          }

          // Apply shadow tint (violet shadows)
          vec3 shadowTint = mix(vec3(0.28, 0.22, 0.42), vec3(1.04, 0.96, 0.88), clamp(litFactor, 0.0, 1.0));
          if (uAlderValley) waterCol = mix(waterCol, vec3(0.12, 0.29, 0.29), 0.35);
          col = waterCol * (naturalLight() ? mix(vec3(0.71,0.80,0.89),vec3(1.0),litFactor) : shadowTint);
        } else {
          // LAND RENDERING
          float eps = 0.85;
          float hL = terrainHeight(p.xz - vec2(eps, 0.0));
          float hR = terrainHeight(p.xz + vec2(eps, 0.0));
          float hD = terrainHeight(p.xz - vec2(0.0, eps));
          float hU = terrainHeight(p.xz + vec2(0.0, eps));
          vec3 n = normalize(vec3(hL - hR, 2.0 * eps, hD - hU));

          float alt = th - WATER_H;
          float slope = 1.0 - n.y;

          // Base terrain palette bands
          vec3 sandCol = vec3(0.85, 0.73, 0.54);
          vec3 grassCol = vec3(0.60, 0.66, 0.30);
          vec3 goldTree = vec3(0.93, 0.66, 0.24);
          vec3 orangeTree = vec3(0.87, 0.43, 0.18);
          vec3 crimsonTree = vec3(0.68, 0.20, 0.22);
          vec3 coniferCol = vec3(0.14, 0.23, 0.17);
          vec3 rockCol = vec3(0.42, 0.36, 0.48);
          vec3 snowCol = vec3(0.97, 0.93, 0.95);

          vec3 forestCol = biome < 0.42
            ? mix(goldTree, orangeTree, biome / 0.42)
            : mix(orangeTree, crimsonTree, (biome - 0.42) / 0.58);
          if (conifer > 0.5 && alt > 1.8 && alt < 13.5) {
            forestCol = coniferCol;
          }

          vec3 albedo = grassCol;
          albedo = mix(sandCol, grassCol, smoothstep(0.25, 1.15, alt));
          albedo = mix(albedo, forestCol, smoothstep(1.3, 3.0, alt) * (1.0 - smoothstep(11.5, 14.5, alt)));
          // Steep crags & high elevation rock
          float rockMask = clamp(smoothstep(0.24, 0.44, slope) + smoothstep(12.5, 15.5, alt), 0.0, 1.0);
          albedo = mix(albedo, rockCol, rockMask);
          // Snow on highest peaks
          float snowMask = smoothstep(16.8, 19.2, alt) * (1.0 - smoothstep(0.36, 0.55, slope));
          albedo = mix(albedo, snowCol, snowMask);

          if (uAlderValley) {
            float grain = vnoise(p.xz * 0.34);
            vec3 woodland = mix(vec3(0.16, 0.29, 0.16), vec3(0.32, 0.47, 0.25), grain * 0.6 + biome * 0.4);
            vec2 fieldUV = vec2(p.x + p.z * 0.23, p.z - p.x * 0.13) / vec2(37.0, 57.0);
            float crop = hash12(floor(fieldUV));
            vec2 cell = abs(fract(fieldUV) - 0.5);
            float hedges = smoothstep(0.455, 0.49, max(cell.x, cell.y));
            vec3 field = mix(vec3(0.46, 0.58, 0.25), vec3(0.67, 0.54, 0.30), crop);
            field *= 0.94 + 0.06 * sin(fieldUV.x * 52.0);
            field = mix(field, woodland, hedges);
            float farmland = (1.0 - smoothstep(7.0, 12.0, alt)) * smoothstep(0.15, 1.5, alt);
            albedo = mix(woodland, field, farmland);
            albedo = mix(albedo, vec3(0.44, 0.45, 0.47),
              max(smoothstep(17.0, 27.0, alt), smoothstep(0.17, 0.39, slope)));
            albedo = mix(albedo, snowCol, smoothstep(29.0, 36.0, alt) * (1.0 - smoothstep(0.3, 0.58, slope)));

            vec2 runway = p.xz - vec2(${ALDER_AIRFIELD.x.toFixed(1)}, ${ALDER_AIRFIELD.z.toFixed(1)});
            vec2 runwaySize = vec2(${ALDER_AIRFIELD.halfWidth.toFixed(1)}, ${ALDER_AIRFIELD.halfLength.toFixed(1)});
            if (all(lessThan(abs(runway), runwaySize))) {
              float stripe = (1.0 - smoothstep(0.26, 0.58, abs(runway.x))) * step(0.55, fract(runway.y / 13.0));
              float edge = smoothstep(runwaySize.x - 0.8, runwaySize.x - 0.45, abs(runway.x));
              float threshold = step(runwaySize.y - 13.0, abs(runway.y)) *
                step(0.55, fract((runway.x + runwaySize.x) / 2.0));
              albedo = mix(vec3(0.24, 0.25, 0.28), vec3(0.91, 0.92, 0.86), max(stripe, max(edge, threshold)));
            }
          }

          if (uAlaska) {
            float grain = vnoise(p.xz * 0.19);
            vec3 spruce = mix(vec3(0.12,0.24,0.20),vec3(0.33,0.46,0.32),grain);
            vec3 rock = mix(vec3(0.32,0.38,0.43),vec3(0.53,0.58,0.61),grain);
            vec3 snow = mix(vec3(0.64,0.78,0.84),vec3(0.94,0.96,0.98),grain);
            float frost = smoothstep(24.0,39.0,alt + 5.0*(grain - 0.5));
            albedo = mix(spruce,rock,max(smoothstep(9.0,17.0,alt),smoothstep(0.18,0.4,slope)));
            albedo = mix(albedo,snow,frost * (1.0-smoothstep(0.46,0.79,slope)));
          }
          if (uManhattan) {
            float crossIsland = p.x - (${MANHATTAN_GRID.tilt} * p.z + ${MANHATTAN_GRID.offset.toFixed(1)});
            vec2 blocks = vec2(crossIsland, p.z) / vec2(${MANHATTAN_GRID.blockWidth.toFixed(1)}, ${MANHATTAN_GRID.blockLength.toFixed(1)});
            float block = hash12(floor(blocks));
            bool park = abs(crossIsland) < ${MANHATTAN_GRID.parkHalfWidth.toFixed(1)}
              && abs(p.z - ${MANHATTAN_GRID.parkCenter.toFixed(1)}) < ${MANHATTAN_GRID.parkHalfLength.toFixed(1)};
            vec3 pavement = mix(vec3(0.25,0.26,0.29), vec3(0.41,0.42,0.43), smoothstep(2.1, 3.4, alt));
            vec3 masonry = mix(vec3(0.42,0.46,0.52), vec3(0.73,0.68,0.61), block);
            albedo = mix(pavement, masonry, smoothstep(4.0, 8.0, alt));
            if (slope > 0.32 && alt > 4.0) {
              float rows = step(0.40, fract(p.y * 0.68));
              float panes = step(0.38, fract((p.x + p.z) * 0.46));
              vec3 glass = mix(vec3(0.20,0.29,0.42), vec3(0.85,0.73,0.48), biome * biome);
              albedo = mix(albedo, glass, rows * panes * 0.65);
            }
            if (park) {
              albedo = mix(vec3(0.16,0.30,0.18), vec3(0.36,0.49,0.27), vnoise(p.xz * 0.22));
            }
          }

          // Scorch marks & glowing embers from land missile impacts
          for (int k = 0; k < 8; k++) {
            float age = uImpacts[k].w;
            if (age >= 0.0 && uImpactType[k].x < 0.5) {
              float d = length(p.xz - uImpacts[k].xz);
              float scorch = exp(-d * 0.55) * exp(-age * 0.04);
              albedo = mix(albedo, vec3(0.10, 0.07, 0.11), clamp(scorch * 0.92, 0.0, 0.92));
              float ember = exp(-d * 1.1) * exp(-age * 0.25) * (0.6 + 0.4 * sin(uTime * 11.0 + d * 5.0));
              albedo += vec3(1.0, 0.42, 0.12) * ember * 1.4;
            }
          }

          // Stepped sunset lighting + violet shadows
          float ndotl = max(dot(n, sunDirection()), 0.0);
          float steppedLight = floor(ndotl * 3.2 + 0.35) / 3.0;
          float direct = ((uManhattan || uAlaska) ? ndotl : steppedLight) * litFactor;

          vec3 warmSun = vec3(1.08, 0.84, 0.62);
          vec3 violetAmbient = vec3(0.34, 0.26, 0.48);
          if (uAlderValley || uManhattan || uAlaska) {
            warmSun = vec3(0.96, 0.93, 0.82);
            violetAmbient = vec3(0.43, 0.47, 0.53);
          }
          col = albedo * (violetAmbient + warmSun * direct * 0.92);
        }

        col = applyFog(col, rd, hitDist);
      }

      // Cumulus cloud layer below cruise altitude
      if (abs(rd.y) > 0.002) {
        float t0 = (cloudBase() - ro.y) / rd.y;
        float t1 = (cloudTop() - ro.y) / rd.y;
        float tEnter = min(t0, t1);
        float tExit = max(t0, t1);
        if (tExit > 0.0 && tEnter < hitDist) {
          tEnter = max(0.5, tEnter);
          tExit = min(hitDist, min(tExit, 440.0));
          if (tExit > tEnter) {
            float steps = 7.0;
            float dt = (tExit - tEnter) / steps;
            float accum = 0.0;
            vec3 cloudColAccum = vec3(0.0);
            for (int c = 0; c < 7; c++) {
              float tc = tEnter + (float(c) + 0.5) * dt;
              vec3 cp = ro + rd * tc;
              float d = cloudDensity(cp.xz);
              if (d > 0.01) {
                float hFrac = clamp((cp.y - cloudBase()) / (cloudTop() - cloudBase()), 0.0, 1.0);
                // Stepped peach/violet cloud shading
                float shadeBand = floor((hFrac * 0.75 + (1.0 - d) * 0.35) * 3.0) / 2.0;
                vec3 cShadow = vec3(0.52, 0.36, 0.56);
                vec3 cMid = vec3(0.92, 0.58, 0.54);
                vec3 cLight = vec3(1.0, 0.82, 0.66);
                vec3 cCol = shadeBand < 0.5 ? mix(cShadow, cMid, shadeBand * 2.0) : mix(cMid, cLight, (shadeBand - 0.5) * 2.0);

                if (naturalLight()) cCol = mix(vec3(0.64,0.71,0.77),vec3(0.96,0.98,0.99),hFrac*0.7+(1.0-d)*0.3);

                // Plane shadow cast onto clouds
                vec2 pCloudProj = uPlanePos.xz - sunDirection().xz * ((uPlanePos.y - cp.y) / max(sunDirection().y, 0.1));
                float pCloudDist = length(cp.xz - pCloudProj);
                if (uPlanePos.y > cp.y && pCloudDist < 2.2) {
                  cCol *= 0.62;
                }

                cCol = applyFog(cCol, rd, tc);
                float alpha = d * 0.42 * (1.0 - accum);
                cloudColAccum += cCol * alpha;
                accum += alpha;
                if (accum > 0.94) break;
              }
            }
            col = col * (1.0 - accum) + cloudColAccum;
          }
        }
      }

      gl_FragDepth = 1.0;
      if (hitSurface) {
        vec4 clip = uWorldViewProj * vec4(ro + rd * hitDist, 1.0);
        gl_FragDepth = clamp(0.5 + 0.5 * clip.z / clip.w, 0.0, 1.0);
      }
      fragColor = vec4(col, 1.0);
    }
  `;

  // 3D Low-Poly Fighter Jet & Missiles Shader (3-tone flat shading + 1px dark outline pass)
  const MESH_VS = `#version 300 es
    layout(location=0) in vec3 aPos;
    layout(location=1) in vec3 aNorm;
    layout(location=2) in vec3 aColor;

    uniform mat4 uViewProj;
    uniform mat4 uModel;
    uniform float uOutline;

    out vec3 vNorm;
    out vec3 vColor;
    out vec3 vWorld;

    void main() {
      vec3 pos = aPos + aNorm * uOutline;
      vec4 worldPos = uModel * vec4(pos, 1.0);
      vNorm = mat3(uModel) * aNorm;
      vColor = aColor;
      vWorld = worldPos.xyz;
      gl_Position = uViewProj * worldPos;
    }
  `;

  const MESH_FS = `#version 300 es
    precision highp float;
    in vec3 vNorm;
    in vec3 vColor;
    in vec3 vWorld;
    out vec4 fragColor;
    uniform bool uSmooth;
    uniform vec3 uEye;
    uniform bool uCityFacade;

    uniform float uIsOutline;
    uniform float uEmissive;

    const vec3 SUN_DIR = normalize(vec3(0.84, 0.165, -0.30));

    void main() {
      if (uIsOutline > 0.5) {
        fragColor = vec4(0.07, 0.05, 0.11, 1.0);
        return;
      }
      if (uEmissive > 0.5) {
        fragColor = vec4(vColor, 1.0);
        return;
      }
      vec3 n = normalize(vNorm);
      float ndotl = dot(n, SUN_DIR);
      if (uSmooth) {
        vec3 sunlight = normalize(vec3(0.56,0.64,-0.43));
        float direct = max(dot(n,sunlight),0.0);
        float light = 0.61 + 0.40*direct + 0.13*max(n.y,0.0);
        vec3 material = vColor;
        vec3 toEye = uEye - vWorld;
        float distanceToEye = length(toEye);
        if (uCityFacade && abs(n.y)<0.15) {
          vec2 tile = vec2((abs(n.x)>0.5 ? vWorld.z : vWorld.x)/2.45,vWorld.y/2.70);
          vec2 panel = abs(fract(tile)-0.5);
          vec2 softness = max(fwidth(tile),vec2(0.003));
          vec2 bands = 1.0 - smoothstep(vec2(0.32,0.27)-softness,vec2(0.32,0.27)+softness,panel);
          float glazing = bands.x * bands.y * (1.0-smoothstep(185.0,460.0,distanceToEye));
          float skyFacing = clamp(reflect(-normalize(toEye),n).y*0.8+0.45,0.0,1.0);
          vec3 reflected = mix(vec3(0.20,0.28,0.32),vec3(0.55,0.71,0.82),skyFacing);
          material = mix(material,reflected,glazing*0.88);
        }
        float haze = 1.0 - exp(-distanceToEye * 0.00119);
        fragColor = vec4(mix(material * light, vec3(0.70,0.78,0.83), haze), 1.0);
        return;
      }
      // 3-tone flat shading
      float tone = ndotl > 0.25 ? 1.15 : (ndotl > -0.25 ? 0.82 : 0.54);
      vec3 tint = ndotl > -0.25 ? vec3(1.04, 0.94, 0.86) : vec3(0.76, 0.68, 0.92);
      fragColor = vec4(vColor * tone * tint, 1.0);
    }
  `;

  // Post-Process Ordered 4x4 Bayer Dithering + Palette Quantization Shader
  const DITHER_FS = `#version 300 es
    precision highp float;
    in vec2 vUv;
    out vec4 fragColor;

    uniform sampler2D uScene;
    uniform bool uSmooth;
    uniform vec3 uPalette[36];
    uniform vec2 uRes;

    const float BAYER4[16] = float[16](
       0.0/16.0,  8.0/16.0,  2.0/16.0, 10.0/16.0,
      12.0/16.0,  4.0/16.0, 14.0/16.0,  6.0/16.0,
       3.0/16.0, 11.0/16.0,  1.0/16.0,  9.0/16.0,
      15.0/16.0,  7.0/16.0, 13.0/16.0,  5.0/16.0
    );

    void main() {
      vec3 col = texture(uScene, vUv).rgb;
      if (uSmooth) {
        vec2 texel = 1.0 / uRes;
        vec3 north = texture(uScene,vUv+vec2(0.0,texel.y)).rgb;
        vec3 south = texture(uScene,vUv-vec2(0.0,texel.y)).rgb;
        vec3 east = texture(uScene,vUv+vec2(texel.x,0.0)).rgb;
        vec3 west = texture(uScene,vUv-vec2(texel.x,0.0)).rgb;
        const vec3 luma = vec3(0.2126,0.7152,0.0722);
        float edgeX = abs(dot(east-west,luma));
        float edgeY = abs(dot(north-south,luma));
        vec3 edgeNeighbors = edgeY > edgeX ? (north+south)*0.5 : (east+west)*0.5;
        vec3 smoothColor = mix(col,edgeNeighbors,smoothstep(0.05,0.20,max(edgeX,edgeY))*0.30);
        fragColor = vec4(smoothColor, 1.0);
        return;
      }
      ivec2 pix = ivec2(mod(floor(vUv * uRes), 4.0));
      float b = BAYER4[pix.y * 4 + pix.x] - 0.5;
      col = clamp(col + b * 0.095, 0.0, 1.0);

      // Find nearest palette entry
      float bestDist = 1e9;
      vec3 bestCol = uPalette[0];
      for (int i = 0; i < 36; i++) {
        vec3 d = col - uPalette[i];
        float dist = dot(d, d);
        if (dist < bestDist) {
          bestDist = dist;
          bestCol = uPalette[i];
        }
      }
      fragColor = vec4(bestCol, 1.0);
    }
  `;

  const worldProg = createProgram(QUAD_VS, WORLD_FS);
  const meshProg = createProgram(MESH_VS, MESH_FS);
  const ditherProg = createProgram(QUAD_VS, DITHER_FS);

  // Fullscreen quad VAO
  const quadVao = gl.createVertexArray();
  gl.bindVertexArray(quadVao);
  const quadVbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadVbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  function createTriangleMesh() {
    const pos = [], norm = [], col = [];
    function addTri(a, b, c, rgb) {
      const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
      const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
      let nx = uy * vz - uz * vy;
      let ny = uz * vx - ux * vz;
      let nz = ux * vy - uy * vx;
      const len = Math.hypot(nx, ny, nz) || 1;
      nx /= len; ny /= len; nz /= len;
      pos.push(...a, ...b, ...c);
      norm.push(nx, ny, nz, nx, ny, nz, nx, ny, nz);
      col.push(...rgb, ...rgb, ...rgb);
    }
    function addQuad(a, b, c, d, rgb) {
      addTri(a, b, c, rgb);
      addTri(a, c, d, rgb);
    }

    function upload() {
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      const buffers = [];
      function makeBuf(arr, loc) {
        const b = gl.createBuffer();
        buffers.push(b);
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
      }
      makeBuf(pos, 0);
      makeBuf(norm, 1);
      makeBuf(col, 2);
      return { vao, buffers, count: pos.length / 3 };
    }
    return { addTri, addQuad, upload };
  }

  function buildFighterMesh() {
    const { addTri, addQuad, upload } = createTriangleMesh();
    const radome = [0.14, 0.13, 0.22];
    const slate = [0.34, 0.39, 0.48];
    const grey = [0.54, 0.59, 0.67];
    const lightGrey = [0.70, 0.74, 0.80];
    const canopyGold = [0.96, 0.72, 0.26];
    const redCap = [0.85, 0.22, 0.22];
    const nozzleDark = [0.16, 0.14, 0.20];

    // Forward nose cone (+Z is forward)
    const noseTip = [0, 0.0, 2.55];
    const nTop = [0, 0.24, 1.35];
    const nBot = [0, -0.18, 1.35];
    const nLeft = [-0.28, 0.02, 1.35];
    const nRight = [0.28, 0.02, 1.35];
    addTri(noseTip, nRight, nTop, radome);
    addTri(noseTip, nTop, nLeft, radome);
    addTri(noseTip, nLeft, nBot, radome);
    addTri(noseTip, nBot, nRight, radome);

    // Fuselage mid-body (splinter grey/slate)
    const fTopF = [0, 0.30, 0.45], fTopR = [0, 0.28, -1.55];
    const fBotF = [0, -0.22, 0.45], fBotR = [0, -0.20, -1.55];
    const fLF = [-0.46, 0.04, 0.45], fLR = [-0.48, 0.04, -1.55];
    const fRF = [0.46, 0.04, 0.45], fRR = [0.48, 0.04, -1.55];

    addQuad(nTop, nRight, fRF, fTopF, grey);
    addQuad(nLeft, nTop, fTopF, fLF, slate);
    addQuad(nBot, nLeft, fLF, fBotF, grey);
    addQuad(nRight, nBot, fBotF, fRF, slate);

    addQuad(fTopF, fRF, fRR, fTopR, slate);
    addQuad(fLF, fTopF, fTopR, fLR, grey);
    addQuad(fBotF, fLF, fLR, fBotR, slate);
    addQuad(fRF, fBotF, fBotR, fRR, grey);

    // Gold-tinted bubble canopy
    const cFront = [0, 0.27, 1.15];
    const cPeak = [0, 0.56, 0.55];
    const cRear = [0, 0.30, -0.15];
    const cL = [-0.20, 0.28, 0.52];
    const cR = [0.20, 0.28, 0.52];
    addTri(cFront, cR, cPeak, canopyGold);
    addTri(cFront, cPeak, cL, canopyGold);
    addTri(cPeak, cR, cRear, canopyGold);
    addTri(cPeak, cRear, cL, canopyGold);

    // Cropped delta wings (left & right)
    for (const s of [-1, 1]) {
      const rootF = [s * 0.44, 0.05, 0.35];
      const rootR = [s * 0.46, 0.04, -1.35];
      const tipF = [s * 2.15, -0.02, -0.68];
      const tipR = [s * 2.15, -0.02, -1.25];
      const rootFB = [s * 0.44, -0.03, 0.35];
      const rootRB = [s * 0.46, -0.03, -1.35];
      if (s > 0) {
        addQuad(rootF, tipF, tipR, rootR, lightGrey);
        addQuad(rootFB, rootRB, tipR, tipF, slate);
      } else {
        addQuad(rootF, rootR, tipR, tipF, lightGrey);
        addQuad(rootFB, tipF, tipR, rootRB, slate);
      }
      // Horizontal stabilizers
      const hRootF = [s * 0.44, 0.04, -1.45];
      const hRootR = [s * 0.40, 0.04, -2.05];
      const hTipF = [s * 1.15, 0.02, -1.78];
      const hTipR = [s * 1.15, 0.02, -2.05];
      if (s > 0) {
        addQuad(hRootF, hTipF, hTipR, hRootR, grey);
        addQuad(hRootF, hRootR, hTipR, hTipF, slate);
      } else {
        addQuad(hRootF, hRootR, hTipR, hTipF, grey);
        addQuad(hRootF, hTipF, hTipR, hRootR, slate);
      }

      // Canted twin vertical tails with red caps
      const vBaseF = [s * 0.34, 0.22, -1.05];
      const vBaseR = [s * 0.34, 0.20, -1.85];
      const vMidF = [s * 0.56, 0.78, -1.45];
      const vMidR = [s * 0.56, 0.78, -1.88];
      const vTopF = [s * 0.62, 0.94, -1.55];
      const vTopR = [s * 0.62, 0.94, -1.90];
      if (s > 0) {
        addQuad(vBaseF, vMidF, vMidR, vBaseR, grey);
        addQuad(vBaseF, vBaseR, vMidR, vMidF, slate);
        addQuad(vMidF, vTopF, vTopR, vMidR, redCap);
        addQuad(vMidF, vMidR, vTopR, vTopF, redCap);
      } else {
        addQuad(vBaseF, vBaseR, vMidR, vMidF, grey);
        addQuad(vBaseF, vMidF, vMidR, vBaseR, slate);
        addQuad(vMidF, vMidR, vTopR, vTopF, redCap);
        addQuad(vMidF, vTopF, vTopR, vMidR, redCap);
      }

      // Twin engine nozzles
      const nx = s * 0.22;
      const nz0 = -1.55, nz1 = -1.92;
      const r = 0.14;
      const ptsF = [[nx, r, nz0], [nx + r, 0, nz0], [nx, -r, nz0], [nx - r, 0, nz0]];
      const ptsR = [[nx, r * 0.85, nz1], [nx + r * 0.85, 0, nz1], [nx, -r * 0.85, nz1], [nx - r * 0.85, 0, nz1]];
      for (let k = 0; k < 4; k++) {
        const kn = (k + 1) % 4;
        addQuad(ptsF[k], ptsF[kn], ptsR[kn], ptsR[k], nozzleDark);
      }
      addQuad(ptsR[0], ptsR[1], ptsR[2], ptsR[3], [0.98, 0.45, 0.16]);
    }

    return upload();
  }

  // Build simple diamond/box mesh for Missiles & Afterburner plumes
  function buildConeMesh(len, rad, tipCol, baseCol) {
    const pos = [], norm = [], col = [];
    function addTri(a, b, c, rgb) {
      const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
      const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const l = Math.hypot(nx, ny, nz) || 1;
      pos.push(...a, ...b, ...c);
      norm.push(nx / l, ny / l, nz / l, nx / l, ny / l, nz / l, nx / l, ny / l, nz / l);
      col.push(...rgb, ...rgb, ...rgb);
    }
    const tip = [0, 0, len];
    const base = [0, 0, -len * 0.3];
    const ring = [[0, rad, 0], [rad, 0, 0], [0, -rad, 0], [-rad, 0, 0]];
    for (let i = 0; i < 4; i++) {
      const j = (i + 1) % 4;
      addTri(tip, ring[j], ring[i], tipCol);
      addTri(base, ring[i], ring[j], baseCol);
    }
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    for (const [arr, loc] of [[pos, 0], [norm, 1], [col, 2]]) {
      const b = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
    }
    return { vao, count: pos.length / 3 };
  }

  function buildSaucerMesh() {
    const { addQuad, upload } = createTriangleMesh();
    // Stacked rings form the dome, rim and underside.
    const rings = [[0.01,0.93],[0.65,0.82],[1.02,0.30],[2.23,0.12],[2.35,-0.08],[1.36,-0.36],[0.01,-0.44]];
    const colors = [[0.26,0.90,0.77],[0.22,0.64,0.77],[0.57,0.66,0.75],[0.83,0.90,0.33],[0.28,0.39,0.52],[0.31,0.68,0.55]];
    const sectors = 16;
    const point = ([radius, height], i) => {
      const angle = i * 2 * Math.PI / sectors;
      return [Math.sin(angle) * radius, height, Math.cos(angle) * radius];
    };
    for (let j = 0; j < rings.length - 1; j++) {
      for (let i = 0; i < sectors; i++) {
        const color = j === 3 && i % 2 ? [0.25,0.40,0.50] : colors[j];
        addQuad(point(rings[j],i),point(rings[j+1],i),
          point(rings[j+1],i+1),point(rings[j],i+1),color);
      }
    }
    return upload();
  }

  function buildJetpackMesh() {
    const { addQuad, upload } = createTriangleMesh();
    function box(x,y,z,w,h,d,color) {
      const l=x-w/2,r=x+w/2,b=y-h/2,t=y+h/2,f=z+d/2,k=z-d/2;
      const a=[l,b,f],c=[r,b,f],e=[r,t,f],g=[l,t,f];
      const i=[l,b,k],j=[r,b,k],m=[r,t,k],n=[l,t,k];
      for (const face of [[a,c,e,g],[j,i,n,m],[i,a,g,n],[c,j,m,e],[g,e,m,n],[i,j,c,a]]) {
        addQuad(...face,color);
      }
    }
    const orange = [0.95,0.45,0.18], dark = [0.24,0.24,0.39], steel = [0.62,0.68,0.76];
    box(0,0.18,0,0.69,1.08,0.52,orange);
    box(0,0.92,0.06,0.55,0.53,0.54,steel);
    box(0,0.95,0.36,0.45,0.21,0.1,[0.22,0.72,0.82]);
    box(0,0.22,-0.48,0.75,0.91,0.58,dark);
    for (const side of [-1,1]) {
      box(side*0.53,0.07,-0.5,0.34,1.1,0.41,steel);
      box(side*0.53,-0.55,-0.5,0.26,0.16,0.29,[0.99,0.78,0.27]);
      box(side*0.47,0.12,0.13,0.21,0.67,0.23,orange);
      box(side*0.19,-0.68,0.12,0.28,0.71,0.30,dark);
    }
    return upload();
  }

  const aircraftMeshes = {
    fighter: buildFighterMesh(),
    saucer: buildSaucerMesh(),
    jetpack: buildJetpackMesh()
  };

  function buildNewYorkLandmark(kind) {
    const { addTri, addQuad, upload } = createTriangleMesh();
    const limestone = [0.68, 0.64, 0.56];
    const steel = [0.70, 0.74, 0.78];
    const glass = [0.30, 0.45, 0.55];

    function stack(levels, color, sides = 4) {
      function ring([y, radiusX, radiusZ, x = 0, z = 0], i) {
        const angle = (i + 0.5) * 2 * Math.PI / sides;
        const correction = sides === 4 ? Math.SQRT2 : 1;
        return [x + Math.sin(angle) * radiusX * correction, y, z + Math.cos(angle) * radiusZ * correction];
      }
      for (let j = 0; j < levels.length - 1; j++) {
        for (let i = 0; i < sides; i++) {
          addQuad(ring(levels[j], i), ring(levels[j], i + 1),
            ring(levels[j + 1], i + 1), ring(levels[j + 1], i), color);
        }
      }
      for (const [level, top] of [[levels[0], false], [levels.at(-1), true]]) {
        const center = [level[3] || 0, level[0], level[4] || 0];
        for (let i = 0; i < sides; i++) {
          const a = ring(level, i), b = ring(level, i + 1);
          addTri(center, top ? a : b, top ? b : a, color);
        }
      }
    }

    function box(x, base, z, width, height, length, color) {
      stack([[base,width/2,length/2,x,z],[base+height,width/2,length/2,x,z]],color);
    }

    function mast(base, tip, width, color) {
      stack([[base,width,width],[tip,width*0.38,width*0.38]], color, 8);
    }

    function facade(width, length, base, top, color) {
      for (let y = base + 1.3; y < top - 0.6; y += 2.4) {
        for (let x = -width / 2 + 1.1; x < width / 2 - 0.7; x += 2.5) {
          for (const side of [-1,1]) box(x,y,side*(length/2+0.04),0.90,1.02,0.13,color);

    const a=[l,b,f],c=[r,b,f],e=[r,t,f],g=[l,t,f];
    const i=[l,b,k],j=[r,b,k],m=[r,t,k],n=[l,t,k];
    for (const face of [[a,c,e,g],[j,i,n,m],[i,a,g,n],[c,j,m,e],[g,e,m,n],[i,j,c,a]]) {
      addQuad(...face,color);

  }

  function bridgeRoadHeight(x) {
    const bridge = EAST_RIVER_BRIDGE;
    const approach = clamp((Math.abs(x-bridge.x)-bridge.halfLength)/bridge.ramp,0,1);
    return lerp(bridge.deck+0.60, STREET_Y, approach);
  }

  function pushRoadStrip(addQuad, a, b, width, color, lift=0) {
    const [dx,dz] = [b[0]-a[0],b[2]-a[2]];
    const length = Math.hypot(dx,dz);
    if (!length) return;
    const x = dz/length*width/2, z = -dx/length*width/2;
    addQuad([a[0]+x,a[1]+lift,a[2]+z],[a[0]-x,a[1]+lift,a[2]-z],
      [b[0]-x,b[1]+lift,b[2]-z],[b[0]+x,b[1]+lift,b[2]+z],color);
  }

  function railwayPoints(track) {
    const points=[[track.west,track.z-track.radius],[track.east,track.z-track.radius]];
    for(let i=1;i<=16;i++){
      const a=i*Math.PI/16;
      points.push([track.east+Math.sin(a)*track.radius,track.z-Math.cos(a)*track.radius]);
    }
    points.push([track.west,track.z+track.radius]);
    for(let i=1;i<=16;i++){
      const a=i*Math.PI/16;
      points.push([track.west-Math.sin(a)*track.radius,track.z+Math.cos(a)*track.radius]);
    }
    return points;
  }

  function buildStreetScene(addQuad, box) {
    const pavement = [0.25,0.28,0.30], sidewalk = [0.53,0.54,0.51], paint = [0.84,0.78,0.52];
    for (const street of CITY_STREETS.slice(1)) {
      for (let i=1;i<street.length;i++) {
        const a=street[i-1], b=street[i];
        const start=[a[0],STREET_Y,a[1]], end=[b[0],STREET_Y,b[1]];
        pushRoadStrip(addQuad,start,end,11.6,sidewalk);
        pushRoadStrip(addQuad,start,end,8.0,pavement,0.035);
        const distance=Math.hypot(b[0]-a[0],b[1]-a[1]);
        for (let j=4;j+2<distance-2;j+=8) {
          const point=t=>[lerp(a[0],b[0],t),STREET_Y,lerp(a[1],b[1],t)];
          pushRoadStrip(addQuad,point(j/distance),point((j+2)/distance),0.15,paint,0.055);
        }
      }
    }
    const bridge=EAST_RIVER_BRIDGE;
    const left=bridge.x-bridge.halfLength, right=bridge.x+bridge.halfLength;
    for (const [a,b] of [[left-bridge.ramp,left],[right,right+bridge.ramp]]) {
      const p=[a,bridgeRoadHeight(a),bridge.z], q=[b,bridgeRoadHeight(b),bridge.z];
      pushRoadStrip(addQuad,p,q,bridge.halfWidth*2,pavement,0.04);
      for (let x=a+1;x<b;x+=6) {
        const h=bridgeRoadHeight(x)-STREET_Y;
        if(h>0.15)box(x,STREET_Y+h/2,bridge.z,1.65,h,4.4,[0.47,0.47,0.45]);

    for (let x=left+3;x+3<right;x+=8) {
      pushRoadStrip(addQuad,[x,bridge.deck,bridge.z],[x+3,bridge.deck,bridge.z],0.18,paint,0.64);
    }
    for (const x of [left-bridge.ramp-1,right+bridge.ramp+1]) {
      for (let stripe=-3;stripe<=3;stripe++) {
        box(x,STREET_Y+0.067,bridge.z+stripe*0.91,0.65,0.025,0.46,[0.82,0.83,0.77]);

        box(x,STREET_Y+3.53,z-side*0.15,0.17,0.15,0.06,[0.30,0.66,0.39]);

    // An elevated train line on the Brooklyn side.

    const route=makeTrafficRoute(railwayPoints(track));
    const n=route.points.length-1;
    for(let i=0;i<n;i++){
      const [ax,az]=route.points[i], [bx,bz]=route.points[i+1];

      pushRoadStrip(addQuad,a,b,3.18,metal);
      const length=Math.hypot(bx-ax,bz-az), nx=(bz-az)/length,nz=(ax-bx)/length;
      for(const offset of [-0.63,0.63]){
        pushRoadStrip(addQuad,[ax+nx*offset,track.height-0.07,az+nz*offset],
          [bx+nx*offset,track.height-0.07,bz+nz*offset],0.14,rail);

    }
    for(let at=0;at<route.total;at+=16){
      const {x,z,yaw}=railPose({route},at);
      box(x,17.15,z,1.65,5,1.65,metal);
      box(x,19.31,z,2.32+Math.abs(Math.sin(yaw))*0.38,0.3,2.43,metal);
    }
    box(336,19.7,-288,33,0.72,1.8,sidewalk);

  function updateBridgeRails() {
    if (bridgeRails) {
      gl.deleteVertexArray(bridgeRails.vao);
      for (const buffer of bridgeRails.buffers) gl.deleteBuffer(buffer);
      bridgeRails = null;
    }
    if (!selectedMap.city) return;
    const {addQuad,upload}=createTriangleMesh();
    const bridge=EAST_RIVER_BRIDGE;
    for (const section of railSections) {
      if (section.broken) continue;
      const z=bridge.z+section.side*(bridge.halfWidth-0.16);
      const a=section.start,b=section.end;
      const metal=[0.39,0.43,0.44];
      for(const height of [0.65,1.28]) {
        const p=[a,bridgeRoadHeight(a)+height,z], q=[b,bridgeRoadHeight(b)+height,z];
        pushRoadStrip(addQuad,p,q,0.16,metal);
        addQuad(p,q,[q[0],q[1]+0.19,z],[p[0],p[1]+0.19,z],metal);
      }
      for (let x=a+0.3;x<b;x+=1.4) {
        addModelBox(addQuad,x,bridgeRoadHeight(x)+0.79,z,0.12,1.17,0.18,metal);
      }
    }
    bridgeRails=upload();
  }

  function makeTrafficRoute(points) {
    const lengths=[0];
    for(let i=1;i<points.length;i++) {
      lengths.push(lengths[i-1]+Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]));
    }
    return { points, lengths, total:lengths.at(-1) };
  }

  function railPose(actor,distance) {
    const {route}=actor;
    const offset=((distance%route.total)+route.total)%route.total;
    const i=route.lengths.findIndex((length,index)=>index>0&&length>=offset);
    const a=route.points[i-1],b=route.points[i];
    const t=(offset-route.lengths[i-1])/(route.lengths[i]-route.lengths[i-1]);
    return {x:lerp(a[0],b[0],t),z:lerp(a[1],b[1],t),y:BROOKLYN_RAIL.height,
      yaw:Math.atan2(b[0]-a[0],b[1]-a[1])};
  }

  function trafficPose(actor,time) {
    const {route,pace,offset,kind}=actor;
    const cycle=(time*pace+offset)% (2*route.total);
    const direction=cycle<route.total?1:-1;
    const distance=direction===1?cycle:2*route.total-cycle;
    const i=route.lengths.findIndex((at,index)=>index>0 && at>=distance);
    const a=route.points[i-1],b=route.points[i];
    const fraction=(distance-route.lengths[i-1])/(route.lengths[i]-route.lengths[i-1]);
    const yaw=Math.atan2((b[0]-a[0])*direction,(b[1]-a[1])*direction);
    const lateral=kind==='taxi'?(actor.bridge?1.07:1.76):kind==='walker'?4.60:0;
    const x=lerp(a[0],b[0],fraction)+Math.cos(yaw)*lateral;
    const z=lerp(a[1],b[1],fraction)-Math.sin(yaw)*lateral;
    const y=actor.bridge?bridgeRoadHeight(x)+0.055:STREET_Y+0.07;
    return {x,y,z,yaw};
  }

  function prepareCityTraffic() {
    railSections=[];
    cityTraffic=[];
    if (selectedMap.city) {
      const bridge=EAST_RIVER_BRIDGE;
      const reach=bridge.halfLength+bridge.ramp;
      for(const side of [-1,1]) for(let x=bridge.x-reach;x<bridge.x+reach;x+=12) {
        railSections.push({start:x,end:Math.min(x+12,bridge.x+reach),side,broken:false});
      }
      for (const [i,street] of CITY_STREETS.slice(0,3).entries()) {
        const route=makeTrafficRoute(street);
        for(let j=0;j<(i===0?7:5);j++) {
          cityTraffic.push({kind:'taxi',route,offset:17+j*route.total*0.25+i*9,pace:6.5+j%3,bridge:i===0});
        }
        if (i>0) for(let j=0;j<7;j++) {
          cityTraffic.push({kind:'walker',route,offset:10+j*route.total*0.22,pace:1.0+(j%3)*0.2});
        }
      }
      cityTraffic.push({kind:'train',route:makeTrafficRoute(railwayPoints(BROOKLYN_RAIL)),offset:74,pace:8.2});
    }
    updateBridgeRails();
  }

  function drawCityTraffic(drawMesh) {
    if (!selectedMap.city) return;
    const origin = mat4FromBasis([0,0,0],[1,0,0],[0,1,0],[0,0,1],1);
    if (bridgeRails) drawMesh(bridgeRails,origin);
    for (const actor of cityTraffic) {
      if(actor.kind==='train'){
        for(let car=0;car<4;car++){
          const {x,y,z,yaw}=railPose(actor,sceneryTime*actor.pace+actor.offset-car*13.35);
          if(Math.hypot(x-camPos[0],z-camPos[2])>455)continue;
          const forward=[Math.sin(yaw),0,Math.cos(yaw)];
          drawMesh(streetMeshes.train,mat4FromBasis([x,y,z],[forward[2],0,-forward[0]],worldUp,forward,1));
        }
        continue;
      }
      const {x,y,z,yaw}=actor.wreck || trafficPose(actor,sceneryTime);
      if (Math.hypot(x-camPos[0],z-camPos[2])>455) continue;
      const front=[Math.sin(yaw),0,Math.cos(yaw)], right=[front[2],0,-front[0]];
      const pos=[x,y,z];
      drawMesh(actor.wreck?wreckedTaxiMesh:streetMeshes[actor.kind],mat4FromBasis(pos,right,worldUp,front,1));
      if(actor.kind!=='walker')continue;
      for(const side of [-1,1]) {
        const angle=side*Math.sin(sceneryTime*7.2+actor.offset)*0.45;
        const up=worldUp.map((v,i)=>v*Math.cos(angle)+front[i]*Math.sin(angle));
        const fwd=front.map((v,i)=>v*Math.cos(angle)-worldUp[i]*Math.sin(angle));
        const hip=[x+side*right[0]*0.12,y+0.83,z+side*right[2]*0.12];
        drawMesh(walkerLeg,mat4FromBasis(hip,right,up,fwd,1));
      }
    }
  }

  let backgroundBuildings = null;

  function lotKey(x,z) {
    return Math.floor(z/MANHATTAN_GRID.blockLength)*256 +
      Math.floor((x-MANHATTAN_GRID.tilt*z-MANHATTAN_GRID.offset)/MANHATTAN_GRID.blockWidth);
  }

  function cityLotAt(x,z) {
    if (!selectedMap.city) return null;
    const key=lotKey(x,z);
    for (let row=-1;row<=1;row++) for (let column=-1;column<=1;column++) {
      const lot=lotIndex.get(key+row*256+column);
      if (lot && Math.abs(x-lot[0])<=lot[2]/2 && Math.abs(z-lot[1])<=lot[3]/2) return lot;
    }
    return null;
  }

  function setupCityLots(parcels,ground) {
    cityGroundField=ground;
    cityLots=parcels;
    lotIndex.clear();
    for (const lot of parcels) lotIndex.set(lotKey(lot[0],lot[1]),lot);
    for (const entry of fallingBuildings) disposeSceneMesh(entry.mesh);
    fallingBuildings=[];
    rebuildCity=false;
  }

  function disposeSceneMesh(mesh) {
    if (!mesh) return;
    gl.deleteVertexArray(mesh.vao);
    for (const buffer of mesh.buffers) gl.deleteBuffer(buffer);
  }

  function collapseBuilding(lot,impact) {
    if (lot[6]) return;
    const falling=buildCityBuildings([lot]);
    lot[6]=true;
    rebuildCity=true;
    fallingBuildings.push({mesh:falling, started:sceneryTime, height:lot[4]});
    spawnWreckFragments(impact,['masonry','masonry','glass','steel'],34,16,1.2);
    for(let i=0;i<28;i++){
      const angle=i*2.39996;
      const speed=2.2+(i%7)*1.15;
      trails.push({pos:[...impact],type:'smoke',dust:i%6!==0,ember:i%6===0,alpha:0.83,
        vx:Math.sin(angle)*speed,vz:Math.cos(angle)*speed,vy:1.1+(i%5)*0.82});
    }
  }

  function refreshDestroyedCity() {
    if (rebuildCity) {
      disposeSceneMesh(backgroundBuildings);
      backgroundBuildings=buildCityBuildings(cityLots);
      rebuildCity=false;
    }
    for (let i=fallingBuildings.length-1;i>=0;i--) {
      if (sceneryTime-fallingBuildings[i].started<1.22) continue;
      disposeSceneMesh(fallingBuildings[i].mesh);
      fallingBuildings.splice(i,1);

  function buildCityBuildings(parcels) {
    const { addQuad, upload } = createTriangleMesh();
    for (const [x,z,width,length,height,tone,destroyed] of parcels) {
      const material = tone < 0.38 ? [0.46,0.52,0.55]
        : tone < 0.70 ? [0.62,0.64,0.62] : [0.66,0.58,0.48];
      const y = WATER_H + 2.38;
      if (destroyed) {
        addModelBox(addQuad,x,y+0.48,z,width*0.86,0.96,length*0.81,[0.35,0.33,0.29]);
        addModelBox(addQuad,x+width*0.11,y+1.08,z-length*0.09,width*0.37,1.35,length*0.26,material);
        continue;
      }
      addModelBox(addQuad,x,y+height/2,z,width,height,length,material);
      if (height > 13 && tone > 0.3) {
        addModelBox(addQuad,x,y+height+0.58,z,width*0.36,1.15,length*0.42,[0.38,0.43,0.44]);
      }
    }
    return upload();
  }

  function createLandscapeDetails() {
    const { addTri, addQuad, upload } = createTriangleMesh();
    const box = (...args) => addModelBox(addQuad,...args);
    function tapered(x,y,z,sections,color,phase=0) {
      const ring = (section,i) => {
        const [height,radiusX,radiusZ] = section;
        const angle = phase + i * Math.PI / 5;
        const irregular = 1 + 0.10*Math.sin(i*3.6+phase);
        return [x+Math.sin(angle)*radiusX*irregular,y+height,z+Math.cos(angle)*radiusZ*irregular];
      };
      for (let j=0;j<sections.length-1;j++) for (let i=0;i<10;i++) {
        addQuad(ring(sections[j],i),ring(sections[j],i+1),ring(sections[j+1],i+1),ring(sections[j+1],i),color);
      }
      for (let i=0;i<10;i++) {
        const top = sections.at(-1);
        addTri([x,y+top[0],z],ring(top,i),ring(top,i+1),color);
      }
    }

    if (selectedMap.city) {
      const {x,z,halfLength,deck,halfWidth} = EAST_RIVER_BRIDGE;
      const stone = [0.65,0.61,0.54], metal = [0.28,0.33,0.36];
      const suspender = [0.41,0.46,0.48];
      box(x,deck,z,halfLength*2,1.2,halfWidth*2,[0.31,0.34,0.35]);
      buildStreetScene(addQuad,box);
      const strip=HARBOR_RUNWAY;
      const left=strip.x-strip.halfLength, right=strip.x+strip.halfLength;
      const surface=sampleTerrainHeight(strip.x,strip.z)+0.05;
      pushRoadStrip(addQuad,[left,surface,strip.z],[right,surface,strip.z],strip.halfWidth*2,[0.23,0.27,0.29]);
      for(let x=left+6;x<right-6;x+=11) {
        pushRoadStrip(addQuad,[x,surface,strip.z],[x+4,surface,strip.z],0.26,[0.94,0.94,0.89],0.032);
      }
      for(const x of [left+2,right-4]) for(let stripe=-3;stripe<=3;stripe++) {
        box(x,surface+0.038,strip.z+stripe*1.7,2.7,0.012,0.46,[0.94,0.94,0.89]);
      }
      const towerSpacing = 52;
      for (const center of [x-towerSpacing,x+towerSpacing]) {
        for (const side of [-1,1]) {
          box(center,28,z+side*3.35,5.3,34,2.6,stone);
          box(center,45.6,z+side*3.35,5.95,1.2,3.2,stone);
        }
        box(center,42.8,z,5.5,3.5,8.5,stone);
      }
      function cableHeight(dx) {
        const d = Math.abs(dx);
        return d < towerSpacing ? 29+16*(d/towerSpacing)**2
          : 28+17*((halfLength-d)/(halfLength-towerSpacing));
      }
      for (const side of [-1,1]) {
        const rail = z + side*3.85;
        for (let i=-halfLength;i<halfLength;i+=4) {
          const j = Math.min(i+4,halfLength);
          const left = cableHeight(i), right = cableHeight(j);
          addQuad([x+i,left,rail],[x+j,right,rail],[x+j,right+0.28,rail],[x+i,left+0.28,rail],metal);
          if (i>-halfLength) box(x+i,(left+deck)/2,rail,0.13,left-deck,0.13,suspender);
        }
      }
    }

    // Trees are batched into one mesh, with clearance around the moose meadows.
    const alaska = selectedMap.alaska;
    const patches = alaska ? [[-176,-430],[160,-330],[-185,-160],[166,12],[-142,205],[169,255]]
      : [[79,160],[90,255]];
    for (const [cx,cz] of patches) for (let i=0;i<28;i++) {
      const x = cx+Math.sin(i*4.32+cz)*30;
      const z = cz+Math.cos(i*3.82+cx)*(alaska?53:48);
      const y = sampleGroundHeight(x,z);
      if (y<WATER_H+1.8 || y>34) continue;
      const h = 3.3+(i%7)*0.62;
      box(x,y+h*0.31,z,0.25,h*0.62,0.25,[0.31,0.23,0.17]);
      for (let tier=0;tier<3;tier++) {
        const base = h*(0.21+tier*0.21), radius = h*(0.24-tier*0.048);
        const foliage = tier === 0 ? [0.16,0.27,0.20] : [0.24,0.38,0.27];
        tapered(x,y,z,[[base,radius,radius],[base+h*0.44,0.06,0.06]],foliage,i);
      }
    }

    if (alaska) {
      // Continuous glacial tongue with a blue calving face and dark crevasses.
      const columns = 20, rows = 17;
      function glacierPoint(col,row) {
        const across = 2*col/columns - 1;
        const t = row/rows;
        const x = -34 + across*(78-28*t) + Math.sin(t*3.9)*21;
        const z = 449 + t*148 - (1-across*across)*17 + Math.sin(col*1.8)*2.3;
        const edge = 1 - Math.abs(across)**8;
        const ice = (4.6 + 5.8*edge)*Math.min(1,(1-t)*5.8);
        const roughness = Math.sin(col*2.8+row*1.6)*0.56 + Math.sin(row*3.7+col)*0.45;
        return [x,sampleGroundHeight(x,z)+ice+roughness,z];
      }
      for (let col=0;col<columns;col++) {
        const a=glacierPoint(col,0), b=glacierPoint(col+1,0);
        addQuad([a[0],sampleGroundHeight(a[0],a[2])-0.18,a[2]],
          [b[0],sampleGroundHeight(b[0],b[2])-0.18,b[2]],b,a,
          col%3===0 ? [0.34,0.65,0.76] : [0.61,0.80,0.85]);
        for (let row=0;row<rows;row++) {
          const streak = 0.5 + 0.5*Math.sin(row*0.86+Math.sin(col*0.62)*1.5);
          const ice = [0.69+0.15*streak,0.83+0.08*streak,0.88+0.05*streak];
          addQuad(glacierPoint(col,row),glacierPoint(col,row+1),
            glacierPoint(col+1,row+1),glacierPoint(col+1,row),ice);
        }
      }
      for (let i=0;i<25;i++) {
        const x = -66 + (i*37)%102;
        const z = 332 + (i*29)%113;
        if (sampleGroundHeight(x,z)>WATER_H) continue;
        const size = 1.8+(i%5)*0.86;
        const tint = i%2 ? [0.70,0.86,0.92] : [0.85,0.93,0.94];
        tapered(x,WATER_H-0.22,z,[[0,size,size*0.8],[0.52,size*0.96,size*0.74],[0.74,size*0.71,size*0.61]],tint,i);
      }
    }
    return upload();
  }

  function breakBridgeRail(x,y,z,radius) {
    const bridge=EAST_RIVER_BRIDGE;
    const relative=z-bridge.z;
    if (Math.abs(Math.abs(relative)-(bridge.halfWidth-0.16))>radius+0.22) return false;
    const height=y-bridgeRoadHeight(x);
    if (height<-radius || height>1.5+radius) return false;
    const section=railSections.find(s=>!s.broken && s.side===Math.sign(relative) &&
      x>=s.start-radius && x<=s.end+radius);
    if (!section) return false;
    section.broken=true;
    updateBridgeRails();
    return true;
  }

  function isBridgeCollision(x,y,z,radius=0) {
    const bridge = EAST_RIVER_BRIDGE;
    const dx = Math.abs(x-bridge.x);
    const dz = Math.abs(z-bridge.z);
    const deck = bridgeRoadHeight(x);
    return (dx <= bridge.halfLength+bridge.ramp && dz <= bridge.halfWidth+radius &&
      y>=deck-1.3-radius && y<=deck+radius) ||
      (Math.abs(dx-52)<3.0+radius && Math.abs(dz-3.35)<1.30+radius && y>=WATER_H && y<46.2+radius) ||
      (Math.abs(dx-52)<3.1+radius && dz<4.25+radius && Math.abs(y-42.8)<1.75+radius);
  }

    addBodyRing(0.45,0.22,0.02,0.64,0.15,0.14,white);
    addBodyRing(0.64,0.15,0.14,0.83,0.12,0.14,white);

  let wreckFragments=[];
